<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ENG0119 Flight Instruments — VBT (PDF) — T-45 Quiz</title>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">Home</a> · <a href="section-eng.html">ENG</a> · Flight Instruments</div>
    <h1>ENG0119 Flight Instruments — VBT (PDF)</h1>
    <div class="meta">24 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 24</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Flight Instruments</div>
    <h2 style="margin:0.2rem 0">ENG0119 Flight Instruments — VBT (PDF)</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-eng.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to ENG</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="section-eng.html">← ENG</a> · <a href="index.html">Home</a></div>
</div>
<script>
const QUESTIONS = [{"q": "HYBD auto-boxes when:", "opts": ["MONO is selected", "Full INS alignment is attained", "Gear is raised", "SEQ is boxed"], "ans": 1, "expl": "INS and HYBD appear; HYBD auto-boxes on full alignment."}, {"q": "Barometric altitude on the ADI is shown:", "opts": ["Digital only, lower left", "Linear and digital, upper right", "Magenta needle only", "On the standby ASI only"], "ans": 1, "expl": "Upper right, linear + digital (IAS is upper left)."}, {"q": "If RADALT limits (AOB/pitch/altitude) are exceeded, the ADI shows:", "opts": ["Blank", "Last valid altitude flashing", "The letter “R” only", "“FAIL”"], "ans": 2, "expl": "“R” only; system still functioning but out of limits."}, {"q": "Assigned FL230 is entered in CALT as:", "opts": ["23000", "2300", "230", "23"], "ans": 2, "expl": "Flight Level protocol: FL230 → 230."}, {"q": "CRS and HDG on the HSI:", "opts": ["Must both be boxed for CDI", "Cannot be boxed simultaneously", "Are the same pushtile", "Only work with VOR"], "ans": 1, "expl": "CDI needs CRS + CDI + nav source; not CRS+HDG together."}, {"q": "VOR information on the HSI is:", "opts": ["Magenta", "Green", "Cyan", "White"], "ans": 1, "expl": "VOR green; TACAN magenta."}, {"q": "On the 20 nm scale, each wing of the HSI aircraft symbol represents:", "opts": ["1.0 nm", "2.5 nm", "3.0 nm", "6.0 nm"], "ans": 2, "expl": "Wingspan 6.0 nm total → 3.0 nm per wing; nose 2.5 nm."}, {"q": "SEQ3 is presented as a:", "opts": ["Solid line", "Dashed line", "Dotted line", "Magenta arc"], "ans": 2, "expl": "SEQ1 solid, SEQ2 dashed, SEQ3 dotted."}, {"q": "MONO display selection requires:", "opts": ["Weight off wheels", "Weight on wheels", "DEU reset", "HYBD unboxed"], "ans": 1, "expl": "WOW only; locked airborne."}, {"q": "One needle-width turn-needle deflection equals:", "opts": ["Full standard-rate turn", "Half standard-rate turn", "30°/sec", "3°/sec always"], "ans": 1, "expl": "Half standard-rate turn per needle-width."}, {"q": "Major GINA components and locations?", "opts": ["GPS antenna on top of fuselage just aft of the rear cockpit; GPS/Inertial Navigation Assembly in the avionics bay.", "RADALT limits exceeded (AOB, pitch, or altitude) — no numeric altitude; “R” shows the system is still functioning.", "CRS, CDI, and a nav source (TCN, VOR, WYPT, ILS, or offset). CRS and HDG cannot be boxed at the same time.", "When ILS or “no steering” is selected — then it uses the heading value set on the HSI HDG option."], "ans": 0, "expl": "GPS antenna on top of fuselage just aft of the rear cockpit; GPS/Inertial Navigation Assembly in the avionics bay."}, {"q": "What appears on the ADI after a full INS alignment?", "opts": ["One needle-width = one-half standard-rate turn; slip ball directly below.", "TACAN magenta (needle, station, range/bearing/TTG); VOR green (needle, bearing).", "FL230 → enter 230; 7000 ft → 70; 2100 ft → 21. Box CALT → DEP scratchpad → ENTER.", "INS and HYBD pushtiles at top-center; HYBD auto-boxes (continual GPS updates)."], "ans": 3, "expl": "INS and HYBD pushtiles at top-center; HYBD auto-boxes (continual GPS updates)."}, {"q": "How is IAS presented on the ADI?", "opts": ["Weight-on-wheels only; once airborne, MONO↔COLOR not available (pushtile unlabeled in flight).", "SEQ1 solid, SEQ2 dashed, SEQ3 dotted. Box SEQ to show assigned lines; unbox to clean up.", "Digital IAS readout plus a Trend Scale Wiper that presents IAS in a linear format (upper left).", "When ILS or “no steering” is selected — then it uses the heading value set on the HSI HDG option."], "ans": 2, "expl": "Digital IAS readout plus a Trend Scale Wiper that presents IAS in a linear format (upper left)."}, {"q": "When does the Command Heading Marker ignore HSI steering mode?", "opts": ["CRS, CDI, and a nav source (TCN, VOR, WYPT, ILS, or offset). CRS and HDG cannot be boxed at the same time.", "Digital IAS readout plus a Trend Scale Wiper that presents IAS in a linear format (upper left).", "Weight-on-wheels only; once airborne, MONO↔COLOR not available (pushtile unlabeled in flight).", "When ILS or “no steering” is selected — then it uses the heading value set on the HSI HDG option."], "ans": 3, "expl": "When ILS or “no steering” is selected — then it uses the heading value set on the HSI HDG option."}, {"q": "RADALT “R”-only display meaning?", "opts": ["GPS antenna on top of fuselage just aft of the rear cockpit; GPS/Inertial Navigation Assembly in the avionics bay.", "CRS, CDI, and a nav source (TCN, VOR, WYPT, ILS, or offset). CRS and HDG cannot be boxed at the same time.", "When ILS or “no steering” is selected — then it uses the heading value set on the HSI HDG option.", "RADALT limits exceeded (AOB, pitch, or altitude) — no numeric altitude; “R” shows the system is still functioning."], "ans": 3, "expl": "RADALT limits exceeded (AOB, pitch, or altitude) — no numeric altitude; “R” shows the system is still functioning."}, {"q": "VVI linear vs digital limits (PDF)?", "opts": ["Linear pointer −2000 to +1600 fpm; digital ±9990 fpm.", "Linear pointer −4000 to +1600 fpm; digital ±9990 fpm.", "Linear pointer −2010 to +1600 fpm; digital ±9990 fpm.", "Linear pointer −1000 to +1600 fpm; digital ±9990 fpm."], "ans": 0, "expl": "Linear pointer −2000 to +1600 fpm; digital ±9990 fpm."}, {"q": "CALT entry examples (Flight Level protocol)?", "opts": ["CALT function is masked by the increment-up button, but CALT data remains unchanged.", "INS and HYBD pushtiles at top-center; HYBD auto-boxes (continual GPS updates).", "FL230 → enter 230; 7000 ft → 70; 2100 ft → 21. Box CALT → DEP scratchpad → ENTER.", "TACAN magenta (needle, station, range/bearing/TTG); VOR green (needle, bearing)."], "ans": 2, "expl": "FL230 → enter 230; 7000 ft → 70; 2100 ft → 21. Box CALT → DEP scratchpad → ENTER."}, {"q": "What happens to CALT if PT, BNGO, or LAW is boxed?", "opts": ["TACAN magenta (needle, station, range/bearing/TTG); VOR green (needle, bearing).", "Each press halves the compass-rose scale; example cycle 40→20→10→5→320→160→80→40 nm…", "FL230 → enter 230; 7000 ft → 70; 2100 ft → 21. Box CALT → DEP scratchpad → ENTER.", "CALT function is masked by the increment-up button, but CALT data remains unchanged."], "ans": 3, "expl": "CALT function is masked by the increment-up button, but CALT data remains unchanged."}, {"q": "Preferred way to make a large BINGO or LAW change?", "opts": ["RADALT limits exceeded (AOB, pitch, or altitude) — no numeric altitude; “R” shows the system is still functioning.", "Use the DEP (boxing the pushtile is not required when using DEP). Boxing gives up/down increment buttons for small changes.", "GPS antenna on top of fuselage just aft of the rear cockpit; GPS/Inertial Navigation Assembly in the avionics bay.", "CRS, CDI, and a nav source (TCN, VOR, WYPT, ILS, or offset). CRS and HDG cannot be boxed at the same time."], "ans": 1, "expl": "Use the DEP (boxing the pushtile is not required when using DEP). Boxing gives up/down increment buttons for small changes."}, {"q": "Recommended PT setting?", "opts": ["1 (default) at all times — moves the watermark on the ADI if adjusted.", "10 (default) at all times — moves the watermark on the ADI if adjusted.", "100 (default) at all times — moves the watermark on the ADI if adjusted.", "0 (default) at all times — moves the watermark on the ADI if adjusted."], "ans": 3, "expl": "0 (default) at all times — moves the watermark on the ADI if adjusted."}, {"q": "Spin Direction Indicator (turn needle) scale?", "opts": ["Only available through the ADI display (quick ADI→HSI/HUD without MENU).", "INS and HYBD pushtiles at top-center; HYBD auto-boxes (continual GPS updates).", "One needle-width = one-half standard-rate turn; slip ball directly below.", "TACAN magenta (needle, station, range/bearing/TTG); VOR green (needle, bearing)."], "ans": 2, "expl": "One needle-width = one-half standard-rate turn; slip ball directly below."}, {"q": "Pitch ladder color coding?", "opts": ["Nose-up = blue background; nose-down = orange background (waterline + numbered pitch lines).", "Yes — available in the aft cockpit only.", "Yes — fully available with no limitations.", "Yes — after selecting GAIN ORIDE."], "ans": 0, "expl": "Nose-up = blue background; nose-down = orange background (waterline + numbered pitch lines)."}, {"q": "MONO pushtile availability?", "opts": ["SEQ1 solid, SEQ2 dashed, SEQ3 dotted. Box SEQ to show assigned lines; unbox to clean up.", "Digital IAS readout plus a Trend Scale Wiper that presents IAS in a linear format (upper left).", "When ILS or “no steering” is selected — then it uses the heading value set on the HSI HDG option.", "Weight-on-wheels only; once airborne, MONO↔COLOR not available (pushtile unlabeled in flight)."], "ans": 3, "expl": "Weight-on-wheels only; once airborne, MONO↔COLOR not available (pushtile unlabeled in flight)."}, {"q": "How to get HUD repeater on an MFD?", "opts": ["One needle-width = one-half standard-rate turn; slip ball directly below.", "INS and HYBD pushtiles at top-center; HYBD auto-boxes (continual GPS updates).", "Only available through the ADI display (quick ADI→HSI/HUD without MENU).", "TACAN magenta (needle, station, range/bearing/TTG); VOR green (needle, bearing)."], "ans": 2, "expl": "Only available through the ADI display (quick ADI→HSI/HUD without MENU)."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= QUESTIONS.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
</html>
