<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<script src="auth.js"></script>
<title>AERO 0105 (2) Engine Thrust and Performance Charts — T-45 Quiz</title>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">Home</a> · <a href="section-aero.html">AERO</a> · Aerodynamics</div>
    <h1>AERO 0105 (2) Engine Thrust and Performance Charts</h1>
    <div class="meta">20 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 20</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Aerodynamics</div>
    <h2 style="margin:0.2rem 0">AERO 0105 (2) Engine Thrust and Performance Charts</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-aero.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to AERO</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="section-aero.html">← AERO</a> · <a href="index.html">Home</a></div>
</div>
<script>
const QUESTIONS = [{"q": "Rule of thumb bingo cruise altitude for an 80 NM divert:", "opts": ["FL080", "FL160", "FL240", "FL350"], "ans": 1, "expl": "80×2 → FL160."}, {"q": "Bingo cruise speed to remember:", "opts": ["150 KIAS", "180 KIAS", "220 KIAS", "300 KIAS"], "ans": 2, "expl": "~220 KIAS."}, {"q": "Bingo descent speed / AOA approx:", "opts": ["300 kt / 19.5 units", "220 kt / 17 units", "180 kt / ~14 units", "120 kt / 21.5 units"], "ans": 2, "expl": "180 kt / ~14 units."}, {"q": "Bingo chart reserve fuel at alternate:", "opts": ["100 lb", "300 lb", "1,000 lb", "Zero — land with empty tanks"], "ans": 1, "expl": "300 lb (CQ add more)."}, {"q": "If still out of control through 10,000 ft:", "opts": ["Continue spin recovery only", "Eject", "Lower flaps", "Select max range cruise"], "ans": 1, "expl": "Eject."}, {"q": "Preferred store jettison window:", "opts": ["150–180 kt any G", "290–310 kt at 1G", "450–500 kt at 4G", "Only on deck"], "ans": 1, "expl": "290–310 @ 1G."}, {"q": "Full-flap approach speed example at ~12,000 lb:", "opts": ["~100 KIAS", "~118 KIAS", "~157 KIAS", "~220 KIAS"], "ans": 1, "expl": "~118 full flaps."}, {"q": "Descent lead rule of thumb:", "opts": ["1 NM per 1,000 ft", "2.5 NM per 1,000 ft", "5 NM per 1,000 ft", "10 NM per 1,000 ft"], "ans": 1, "expl": "~2.5 NM / 1,000 ft."}, {"q": "Bingo altitude rule of thumb?", "opts": ["**Distance (NM) × 2 ≈ flight level** (100 NM → FL200; 80 NM → FL160). Climb at **300 KIAS**.", "Chart ≈ **712 lb** including 300 reserve → ~**412 lb** burned. With 100-kt headwind ≈ **921 lb**.", "Chart includes **300 lb** at alternate; CQ evolutions add roughly **+200–250 lb**.", "Dry ~**3,200 ft**; wet \u003e**4,000**; icy ~**7,000**. Avoid icy without arresting gear."], "ans": 0, "expl": "**Distance (NM) × 2 ≈ flight level** (100 NM → FL200; 80 NM → FL160). Climb at **300 KIAS**."}, {"q": "Bingo cruise and descent speeds?", "opts": ["Cruise ≈ **220 KIAS** (~1000–1100 pph). Descent **180 KIAS (~14 units, L/Dmax)**; ~**2.5 NM per 1,000 ft**; ex. start descent ~**55 NM** from 20k no-wind.", "Steer immediately; nearly level accel dirty→clean; approaching **~285 kt** raise nose **17–18°** to intercept **300-kt** climb.", "Above 5k: **+7.33 / −3** (with high-Mach negative-G reductions); below 5k: **+6.5**. Asymmetric limits lower (~5.86/5). Loaded rolls: stay near **1G**.", "\u003c**150 kt** and \u003e**FL350**: careful throttle. \u003c**85 kt** and \u003e**15,000**: idle until recovered. Above **30,000**: keep **≥70% RPM** to avoid sub-idle rollback."], "ans": 0, "expl": "Cruise ≈ **220 KIAS** (~1000–1100 pph). Descent **180 KIAS (~14 units, L/Dmax)**; ~**2.5 NM per 1,000 ft**; ex. start descent ~**55 NM** from 20k no-wind."}, {"q": "Bingo fuel reserve?", "opts": ["Dry ~**3,200 ft**; wet \u003e**4,000**; icy ~**7,000**. Avoid icy without arresting gear.", "**Distance (NM) × 2 ≈ flight level** (100 NM → FL200; 80 NM → FL160). Climb at **300 KIAS**.", "Chart includes **300 lb** at alternate; CQ evolutions add roughly **+200–250 lb**.", "Chart ≈ **712 lb** including 300 reserve → ~**412 lb** burned. With 100-kt headwind ≈ **921 lb**."], "ans": 2, "expl": "Chart includes **300 lb** at alternate; CQ evolutions add roughly **+200–250 lb**."}, {"q": "Bingo climb capture technique?", "opts": ["Cruise ≈ **220 KIAS** (~1000–1100 pph). Descent **180 KIAS (~14 units, L/Dmax)**; ~**2.5 NM per 1,000 ft**; ex. start descent ~**55 NM** from 20k no-wind.", "Near-vertical ~200 kt recovery from 10k can cost ~**4,200 ft** even without terrain/reaction delay — little margin → **eject**.", "Steer immediately; nearly level accel dirty→clean; approaching **~285 kt** raise nose **17–18°** to intercept **300-kt** climb.", "Above 5k: **+7.33 / −3** (with high-Mach negative-G reductions); below 5k: **+6.5**. Asymmetric limits lower (~5.86/5). Loaded rolls: stay near **1G**."], "ans": 2, "expl": "Steer immediately; nearly level accel dirty→clean; approaching **~285 kt** raise nose **17–18°** to intercept **300-kt** climb."}, {"q": "Why not set cruise power early and coast to 220?", "opts": ["Chart ≈ **712 lb** including 300 reserve → ~**412 lb** burned. With 100-kt headwind ≈ **921 lb**.", "Increases fuel burn vs decelerating in idle then setting cruise — ready-room myth called out as error.", "**Distance (NM) × 2 ≈ flight level** (100 NM → FL200; 80 NM → FL160). Climb at **300 KIAS**.", "**290–310 KIAS at 1G**. Carriage limit cited **525 KIAS / 0.8 M**; AOA limit **21.5** or stall warning."], "ans": 1, "expl": "Increases fuel burn vs decelerating in idle then setting cruise — ready-room myth called out as error."}, {"q": "Example approach speeds at ~12,000 lb?", "opts": ["Full flaps ~**128**; half flaps ~**137**; flaps up ~**157** KIAS.", "Full flaps ~**236**; half flaps ~**137**; flaps up ~**157** KIAS.", "Full flaps ~**118**; half flaps ~**137**; flaps up ~**157** KIAS.", "Full flaps ~**59**; half flaps ~**137**; flaps up ~**157** KIAS."], "ans": 2, "expl": "Full flaps ~**118**; half flaps ~**137**; flaps up ~**157** KIAS."}, {"q": "Landing ground-roll ballpark (σ=0.85, 11k example)?", "opts": ["Chart includes **300 lb** at alternate; CQ evolutions add roughly **+200–250 lb**.", "**Distance (NM) × 2 ≈ flight level** (100 NM → FL200; 80 NM → FL160). Climb at **300 KIAS**.", "Chart ≈ **712 lb** including 300 reserve → ~**412 lb** burned. With 100-kt headwind ≈ **921 lb**.", "Dry ~**3,200 ft**; wet \u003e**4,000**; icy ~**7,000**. Avoid icy without arresting gear."], "ans": 3, "expl": "Dry ~**3,200 ft**; wet \u003e**4,000**; icy ~**7,000**. Avoid icy without arresting gear."}, {"q": "OCF through 10,000 ft — why eject?", "opts": ["Cruise ≈ **220 KIAS** (~1000–1100 pph). Descent **180 KIAS (~14 units, L/Dmax)**; ~**2.5 NM per 1,000 ft**; ex. start descent ~**55 NM** from 20k no-wind.", "Near-vertical ~200 kt recovery from 10k can cost ~**4,200 ft** even without terrain/reaction delay — little margin → **eject**.", "Steer immediately; nearly level accel dirty→clean; approaching **~285 kt** raise nose **17–18°** to intercept **300-kt** climb.", "Above 5k: **+7.33 / −3** (with high-Mach negative-G reductions); below 5k: **+6.5**. Asymmetric limits lower (~5.86/5). Loaded rolls: stay near **1G**."], "ans": 1, "expl": "Near-vertical ~200 kt recovery from 10k can cost ~**4,200 ft** even without terrain/reaction delay — little margin → **eject**."}, {"q": "Jettison airspeed/G for stores?", "opts": ["Chart ≈ **712 lb** including 300 reserve → ~**412 lb** burned. With 100-kt headwind ≈ **921 lb**.", "**290–310 KIAS at 1G**. Carriage limit cited **525 KIAS / 0.8 M**; AOA limit **21.5** or stall warning.", "**Distance (NM) × 2 ≈ flight level** (100 NM → FL200; 80 NM → FL160). Climb at **300 KIAS**.", "Increases fuel burn vs decelerating in idle then setting cruise — ready-room myth called out as error."], "ans": 1, "expl": "**290–310 KIAS at 1G**. Carriage limit cited **525 KIAS / 0.8 M**; AOA limit **21.5** or stall warning."}, {"q": "Symmetrical G limits (memory)?", "opts": ["Above 5k: **+7.33 / −3** (with high-Mach negative-G reductions); below 5k: **+6.5**. Asymmetric limits lower (~5.86/5). Loaded rolls: stay near **1G**.", "Cruise ≈ **220 KIAS** (~1000–1100 pph). Descent **180 KIAS (~14 units, L/Dmax)**; ~**2.5 NM per 1,000 ft**; ex. start descent ~**55 NM** from 20k no-wind.", "\u003c**150 kt** and \u003e**FL350**: careful throttle. \u003c**85 kt** and \u003e**15,000**: idle until recovered. Above **30,000**: keep **≥70% RPM** to avoid sub-idle rollback.", "Steer immediately; nearly level accel dirty→clean; approaching **~285 kt** raise nose **17–18°** to intercept **300-kt** climb."], "ans": 0, "expl": "Above 5k: **+7.33 / −3** (with high-Mach negative-G reductions); below 5k: **+6.5**. Asymmetric limits lower (~5.86/5). Loaded rolls: stay near **1G**."}, {"q": "High-altitude/low-speed throttle cautions?", "opts": ["Above 5k: **+7.33 / −3** (with high-Mach negative-G reductions); below 5k: **+6.5**. Asymmetric limits lower (~5.86/5). Loaded rolls: stay near **1G**.", "Steer immediately; nearly level accel dirty→clean; approaching **~285 kt** raise nose **17–18°** to intercept **300-kt** climb.", "Cruise ≈ **220 KIAS** (~1000–1100 pph). Descent **180 KIAS (~14 units, L/Dmax)**; ~**2.5 NM per 1,000 ft**; ex. start descent ~**55 NM** from 20k no-wind.", "\u003c**150 kt** and \u003e**FL350**: careful throttle. \u003c**85 kt** and \u003e**15,000**: idle until recovered. Above **30,000**: keep **≥70% RPM** to avoid sub-idle rollback."], "ans": 3, "expl": "\u003c**150 kt** and \u003e**FL350**: careful throttle. \u003c**85 kt** and \u003e**15,000**: idle until recovered. Above **30,000**: keep **≥70% RPM** to avoid sub-idle rollback."}, {"q": "100 NM bingo fuel example (no wind)?", "opts": ["**Distance (NM) × 2 ≈ flight level** (100 NM → FL200; 80 NM → FL160). Climb at **300 KIAS**.", "Chart ≈ **712 lb** including 300 reserve → ~**412 lb** burned. With 100-kt headwind ≈ **921 lb**.", "Increases fuel burn vs decelerating in idle then setting cruise — ready-room myth called out as error.", "**290–310 KIAS at 1G**. Carriage limit cited **525 KIAS / 0.8 M**; AOA limit **21.5** or stall warning."], "ans": 1, "expl": "Chart ≈ **712 lb** including 300 reserve → ~**412 lb** burned. With 100-kt headwind ≈ **921 lb**."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= QUESTIONS.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
