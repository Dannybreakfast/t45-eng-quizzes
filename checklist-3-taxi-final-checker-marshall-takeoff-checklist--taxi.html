<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Checklist 3. Taxi, Final Checker, Marshall &amp; Takeoff Checklist — T-45 Quiz</title>
<script src="auth.js"></script>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt span + span, #q-text { white-space: pre-line; }
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">Home</a> · <a href="section-cl.html">CL</a> · Checklist / Comm Flow</div>
    <h1>Checklist 3. Taxi, Final Checker, Marshall &amp; Takeoff Checklist</h1>
    <div class="meta">25 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 25</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Checklist / Comm Flow</div>
    <h2 style="margin:0.2rem 0">Checklist 3. Taxi, Final Checker, Marshall &amp; Takeoff Checklist</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-cl.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to CL</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="section-cl.html">← CL</a> · <a href="index.html">Home</a></div>
</div>
<script>
const QUESTIONS = [{"q": "Taxi speed limits (doc):", "opts": ["15 knots in the line and 25 on taxiways", "20 knots in the line and 10 on taxiways", "7 knots in the line and 15 on taxiways", "10 knots GS in the line and 20 knots GS on the taxiways"], "ans": 3, "expl": "Doc (Checklist walkthrough): No more than 10 knots GS in the line and 20 knots GS on the taxiways."}, {"q": "Power limits in the line:", "opts": ["Do not use more than 75% power in the line and idle power in turns", "70% in the line, 80% in turns", "80% in the line and idle in turns", "no limit"], "ans": 0, "expl": "Doc (Checklist walkthrough): Note: Do not use more than 75% power in the line and idle power in turns."}, {"q": "Do not use hi-gain NWS above:", "opts": ["10 knots", "5 knots", "20 knots", "15 knots"], "ans": 0, "expl": "Doc (Checklist walkthrough): Do not use hi-gain NWS above 10 knots."}, {"q": "STBY VSI on taxi checks:", "opts": ["Zero", "Zero +/- 100", "Zero +/- 75", "Zero +/- 200"], "ans": 1, "expl": "Doc (Checklist walkthrough): 2. STBY VSI - Zero +/- 100"}, {"q": "STBY Altimeter tolerance:", "opts": ["FE +/- 100’", "FE +/- 75’", "FE +/- 10’", "FE +/- 50’"], "ans": 1, "expl": "Doc (Checklist walkthrough): 4. STBY Altimeter - FE +/- 75’"}, {"q": "HUD/MFD Altimeter tolerance:", "opts": ["FE +/- 10’", "FE +/- 75’", "FE +/- 20’", "FE +/- 50’"], "ans": 0, "expl": "Doc (Checklist walkthrough): 8. HUD/MFD Altimeter - FE +/- 10’"}, {"q": "GINA on taxi checks:", "opts": ["ALIGN Boxed", "HYBD Boxed", "GPS Boxed", "INS Boxed"], "ans": 1, "expl": "Doc (Checklist walkthrough): 4. GINA - HYBD Boxed"}, {"q": "Taxi checks complete call format:", "opts": ["“Altimeter Set __.__, indicating ___ on standby, ___ on glass. VOR Set ___.__, TACAN Set ___, IFF Set XXXX in Standby, Taxi Checks Complete”", "“IFF XXXX Norm, VOR set, Taxi Checks Complete”", "“Good headings, no off flags, Taxi Checks Complete”", "“Altimeter set, VOR set, TACAN set, Taxi Checks Complete”"], "ans": 0, "expl": "Doc (Checklist walkthrough): 5. “Altimeter Set __.__, indicating ___ on standby, ___ on glass. VOR Set ___.__, TACAN Set ___, IFF Set XXXX in Standby, Taxi Checks Complete”"}, {"q": "At final checker, the parking brake is:", "opts": ["Released", "Set only if told", "Set (anytime you are stopped anywhere other than the runway)", "Not used"], "ans": 2, "expl": "Doc (Checklist walkthrough): Set your parking brake. Do this anytime you are stopped anywhere other than the runway."}, {"q": "Takeoff Checklist item 1:", "opts": ["Flaps/Slats - Set Half", "Control Aug - All, light extinguished", "Anti-Skid Switch - On, Light On", "Canopy - Closed"], "ans": 1, "expl": "Doc (Checklist walkthrough): 1. Control Aug - All, light extinguished 2. Anti-Skid Switch - On, Light On 3. Flaps/Slats - Set Half, Indicating Half, Slats Visually Down"}, {"q": "Takeoff Checklist: Flaps/Slats:", "opts": ["Up, no lights", "Set Full, Indicating Full", "Set Half, Indicating Half, Slats Visually Down", "Set Half, Indicating Half, Slats Up"], "ans": 2, "expl": "Doc (Checklist walkthrough): 3. Flaps/Slats - Set Half, Indicating Half, Slats Visually Down"}, {"q": "Takeoff Checklist: Trim:", "opts": ["Zero, Zero, 5 deg Nose Up", "Zero, Zero, Zero", "2-3 deg Nose Up, Zero, Zero", "Zero, Zero, 2-3 deg Nose Up"], "ans": 3, "expl": "Doc (Checklist walkthrough): 4. Trim - Zero, Zero, 2-3 deg Nose Up"}, {"q": "Takeoff Checklist: Canopy:", "opts": ["Closed, Locked, Light Out, Seal Inflated", "Locked, Seal Deflated", "Closed, Light Out", "Closed, Locked, Light On"], "ans": 0, "expl": "Doc (Checklist walkthrough): 5. Canopy - Closed, Locked, Light Out, Seal Inflated"}, {"q": "Harness – front cockpit first call:", "opts": ["“Armed in Front, Takeoff Checks Complete”", "“Attached 8 Points, Pins Removed, Ready to Arm in Front”", "“Harness locked, Armed in Front”", "“Attached 8 Points, Pins Removed, Armed in Back”"], "ans": 1, "expl": "Doc (Checklist walkthrough): “Attached 8 Points, Pins Removed, Ready to Arm in Front” R/C: “Attached 8 Points, Pins Removed, Armed in Back” “Armed in Front, Takeoff Checks Complete”"}, {"q": "Harness – rear cockpit response:", "opts": ["“Ready in Back”", "“Attached 8 Points, Pins Removed, Armed in Back”", "“Armed in Front, Takeoff Checks Complete”", "“Safe in Back”"], "ans": 1, "expl": "Doc (Checklist walkthrough): R/C: “Attached 8 Points, Pins Removed, Armed in Back”"}, {"q": "Final harness call that completes the Takeoff Checklist:", "opts": ["“Ready in Front”", "“Attached 8 Points, Ready to Arm in Front”", "“Armed in Front, Takeoff Checks Complete”", "“Takeoff Checks Complete, Armed in Back”"], "ans": 2, "expl": "Doc (Checklist walkthrough): “Armed in Front, Takeoff Checks Complete”"}, {"q": "Order of the three harness calls:", "opts": ["Front: Ready to Arm in Front → Rear: Armed in Back → Front: Armed in Front, Takeoff Checks Complete", "Rear: Armed in Back → Front: Ready to Arm → Front: Complete", "Front: Armed in Front → Rear: Armed in Back", "Rear first → Front → Rear"], "ans": 0, "expl": "Doc (Checklist walkthrough): Harness sequence per doc."}, {"q": "Before leaving Marshall, call Base on:", "opts": ["Ch 2 Aux", "Ch 1 Aux", "Ch 1 Pri", "Ch 5 Aux"], "ans": 1, "expl": "Doc (Checklist walkthrough): Contact Base (Ch1) on Aux and Ground (Ch 2) on Pri prior to leaving the Marshall Area"}, {"q": "Doc Base call from Marshall:", "opts": ["“Base, 201 ready to taxi”", "“Base, Blazer 201 out of chocks”", "“Base, 01 Taxi”", "“Base, 01 on deck”"], "ans": 2, "expl": "Doc (Checklist walkthrough): Ch 1 Aux: “Base, 01 Taxi” You just say the last two numbers / “201 have a good flight”"}, {"q": "Comm Script check-out call (CH-1):", "opts": ["“STRIKE, 2XX taxi.”", "“STRIKE, 2XX out of chocks.”", "“Base, 2XX ready.”", "“STRIKE, 2XX on deck.”"], "ans": 1, "expl": "Kingsville Comm Script PDF: CHECK OUT ON STRIKE (CH-1) STRIKE, 2XX out of chocks. / 2XX have a good flight."}, {"q": "Base/Strike response to the check-out call:", "opts": ["“201 have a good flight” / “2XX have a good flight.”", "“radio check loud and clear”", "“taxi approved”", "“welcome back”"], "ans": 0, "expl": "Doc (Checklist walkthrough): “201 have a good flight”"}, {"q": "Ground call (Ch 2 Pri):", "opts": ["“Kingsville Ground, Blazer 201, request taxi with clearance”", "“Kingsville Ground, Blazer 201, taxi to 13R”", "“Kingsville Ground, Blazer 201, ready to taxi”", "“Kingsville Ground, Blazer 201, taxi with alpha”"], "ans": 3, "expl": "Doc (Checklist walkthrough): Ch 2 Pri: “Kingsville Ground, Blazer 201, taxi with alpha”"}, {"q": "Ground’s taxi instruction:", "opts": ["“Blazer 201 taxi to 13R via Bravo Alpha”", "“taxi to 13R via Alpha Bravo”", "“taxi to 35L via Bravo”", "“taxi to 13L via Hotel Delta”"], "ans": 0, "expl": "Doc (Checklist walkthrough): “Blazer 201 taxi to 13R via Bravo Alpha” / “Taxi to 13R via Bravo Alpha, Blazer 201”"}, {"q": "Where does the radio auto-switch to Tower (Ch 3 Pri)?", "opts": ["at the hold short line", "500 ft prior to hold short", "1500 ft prior to hold short (Abeam the arresting gear)", "when cleared by Ground"], "ans": 2, "expl": "Doc (Checklist walkthrough): 1500 ft prior to hold short (Abeam the arresting gear), auto switch to tower on channel 3 on PRI."}, {"q": "Hold short position (13R): nose pointed at:", "opts": ["the tower", "the arresting gear", "the windsock (about a 45 deg cut)", "the runway centerline"], "ans": 2, "expl": "Doc (Checklist walkthrough): Position yourself at the hold short on the far left of the taxiway with your nose pointed at the windsock ... (Maybe like a 45 deg cut or slightly less)."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= queue.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
</html>
