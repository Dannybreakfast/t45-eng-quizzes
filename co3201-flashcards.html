de TACAN/VOR DME approach, the procedures are essentially the same as those used for a high altitude penetration.\"", "ics": false}, {"f": "TERPS speed criteria used when designing low altitude approaches:", "c": "200 knot", "r": "—", "k": "TACAN/VOR DME Approach", "s": "Source: \"When designing low altitude approaches, a 200 knot Terminal Instrument Procedures (TERPS) speed criteria is used.\"", "ics": false}, {"f": "Approaches involving a procedure turn should be flown at a maximum of:", "c": "200 KIAS", "r": "—", "k": "TACAN/VOR DME Approach", "s": "Source: \"As discussed earlier, approaches involving a procedure turn should be flown at a maximum airspeed of 200 KIAS.\"", "ics": false}, {"f": "A long No PT track or arc:", "c": "May be flown at a higher airspeed if traffic permits", "r": "—", "k": "TACAN/VOR DME Approach", "s": "Source: \"A long No PT track or arc may be flown at a higher airspeed if traffic permits.\"", "ics": false}, {"f": "At the higher speed on a No PT track or arc, consider:", "c": "The larger turn radius required", "r": "—", "k": "TACAN/VOR DME Approach", "s": "Source: \"Consideration should be given to the larger turn radius required at the higher speed.\"", "ics": false}, {"f": "Speed brakes may be unnecessary prior to the FAF if:", "c": "Slowing from 250 KIAS is not required prior to transitioning to the landing configuration", "r": "—", "k": "TACAN/VOR DME Approach", "s": "Source: \"Speed brakes may be unnecessary prior to the FAF if slowing from 250 KIAS is not required prior to transitioning to the landing configuration.\"", "ics": false}, {"f": "At the FAF (TACAN) you:", "c": "Start the clock, extend speed brakes, report landing checklist complete on the ICS, make gear down call to ATC", "r": "—", "k": "TACAN/VOR DME Approach", "s": "Source: \"At the FAF, start the clock, extend speed brakes, report landing checklist complete on the ICS and make gear down call to ATC.\"", "ics": false}, {"f": "At the FAF, the landing checklist complete report is made on ___ and the gear down call to ___.", "c": "ICS; ATC", "r": "—", "k": "TACAN/VOR DME Approach", "s": "Source: \"At the FAF, start the clock, extend speed brakes, report landing checklist complete on the ICS and make gear down call to ATC.\"", "ics": false}, {"f": "Speed brake extension at the FAF requires:", "c": "Forward stick pressure to counter the pitch up", "r": "—", "k": "TACAN/VOR DME Approach", "s": "Source: \"Forward stick pressure will be required to counter the pitch up due to speed brake extension.\"", "ics": false}, {"f": "After the FAF, descend to the MDA while monitoring ___ for the MAP.", "c": "Your DME", "r": "—", "k": "TACAN/VOR DME Approach", "s": "Source: \"Descend to the MDA and start looking for the runway while monitoring your DME for the MAP.\"", "ics": false}, {"f": "Plan your descent to be in level flight at the MDA:", "c": "Prior to reaching the MAP", "r": "—", "k": "TACAN/VOR DME Approach", "s": "Source: \"Plan your descent to be in level flight at the MDA prior to reaching the MAP.\"", "ics": false}, {"f": "Maximum descent rate from the FAF (TACAN):", "c": "1,000 fpm", "r": "—", "k": "TACAN/VOR DME Approach", "s": "Source: \"Do not exceed 1,000 fpm.\"", "ics": false}, {"f": "Keep heading changes small so you don't chase:", "c": "The final approach course on the HSI or the course situation steering arrow on the HUD", "r": "—", "k": "TACAN/VOR DME Approach", "s": "Source: \"Keep heading changes small so you don't chase the final approach course on the HSI display or the course situation steering arrow on the HUD.\"", "ics": false}, {"f": "Approximately 100 feet prior to the MDA you:", "c": "Add about 300 pph fuel flow and apply slight backstick pressure", "r": "—", "k": "TACAN/VOR DME Approach", "s": "Source: \"Approximately 100 feet prior to the MDA, add about 300 pph fuel flow and apply slight backstick pressure to level off at MDA.\"", "ics": false}, {"f": "How much fuel flow is added to level off at MDA?", "c": "About 300 pph", "r": "—", "k": "TACAN/VOR DME Approach", "s": "Source: \"Approximately 100 feet prior to the MDA, add about 300 pph fuel flow and apply slight backstick pressure to level off at MDA.\"", "ics": false}, {"f": "At the MAP without the runway environment in sight or unable to land safely:", "c": "Execute a missed approach", "r": "—", "k": "TACAN/VOR DME Approach", "s": "Source: \"When you reach the MAP, if you don't have the runway environment in sight or determine that a safe landing is not possible, execute a missed approach.\"", "ics": false}, {"f": "The two basic types of ground-controlled approaches are:", "c": "PAR and ASR", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"There are two basic types of ground-controlled approaches—the precision radar approach (PAR) and the surveillance radar approach (ASR).\"", "ics": false}, {"f": "A PAR provides:", "c": "Precise course, glidepath, and range information (precision approach)", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"A PAR provides you with precise course, glidepath, and range information and is classified as a precision approach.\"", "ics": false}, {"f": "An ASR provides:", "c": "Lower resolution course and range information only (no glideslope); non-precision", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"An ASR (commonly referred to as a surveillance approach) provides lower resolution course and range information only (no glideslope) and is classified as a non-precision approach.\"", "ics": false}, {"f": "Glideslope is defined as:", "c": "The descent angle assigned to an approach to a given runway for obstacle clearance and/or signal reception", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"Glideslope is defined as the descent angle assigned to an approach to a given runway for obstacle clearance and/or signal reception.\"", "ics": false}, {"f": "Glidepath is defined as:", "c": "The portion of a precision approach that intercepts the azimuth of an ILS approach or the FAC of a PAR approach", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"Glidepath is defined as the portion of a precision approach that intercepts the azimuth of an ILS approach or the FAC of a PAR approach.\"", "ics": false}, {"f": "PAR and ASR approaches are divided into which two segments?", "c": "Initial pattern and final approach", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"Both the PAR and ASR approaches are divided into two segments, initial pattern and final approach.\"", "ics": false}, {"f": "During the initial pattern of an ASR or PAR you are guided by:", "c": "Surveillance radar", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"During the initial pattern of an ASR or PAR approach, you will be guided by surveillance radar.\"", "ics": false}, {"f": "The initial pattern segment ends when the aircraft is inbound on the FAC at approximately:", "c": "8 nm from touchdown", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"This segment includes all maneuvering up to the point at which your aircraft is inbound on the final approach course and at approximately 8 nm from touchdown.\"", "ics": false}, {"f": "During the transition to final, the GCA controller directs:", "c": "Your headings and altitudes", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"During the transition to final, the GCA controller will direct your headings and altitudes.\"", "ics": false}, {"f": "Controller instructions to initiate turns and descents should be complied with:", "c": "Immediately", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"All controller instructions to initiate turns and descents should be complied with immediately.\"", "ics": false}, {"f": "In the GCA pattern, turns are:", "c": "Standard rate, not to exceed 30 degrees AOB", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"In the pattern, maintain standard rate turns not to exceed 30 degrees AOB.\"", "ics": false}, {"f": "On final, AOB should approximate the degrees to be turned, not to exceed:", "c": "Half standard rate (approximately 10 degrees AOB)", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"On final, your AOB should approximate the number of degrees to be turned not to exceed half standard rate (approximately 10 degrees AOB).\"", "ics": false}, {"f": "Good technique for AOB turning base to final:", "c": "20 degrees", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"A good technique is 30 degrees AOB in pattern, 20 degrees AOB turning base to final.\"", "ics": false}, {"f": "Good technique for AOB in the GCA pattern:", "c": "30 degrees", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"A good technique is 30 degrees AOB in pattern, 20 degrees AOB turning base to final.\"", "ics": false}, {"f": "Once on final, max AOB for heading corrections to course:", "c": "10 degrees", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"Once on final, do not exceed 10 degrees AOB for heading corrections to course.\"", "ics": false}, {"f": "Radar approach minimums can be found:", "c": "In FLIP instrument approach procedure publications — on the approach plates and in the radar approach minimums section", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"Radar approach minimums can be found in the FLIP instrument approach procedure publications, both on the approach plates and in the radar approach minimums section (Figure 6-29).\"", "ics": false}, {"f": "Absolute minimums when single-piloted:", "c": "200-1/2", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"Although some published approach minimums are lower than 200-1/2, you are limited to absolute minimums of 200-1/2 when single-piloted.\"", "ics": false}, {"f": "During a GCA, the controller continuously feeds you:", "c": "Course and heading information, and on a PAR, glidepath information on final", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"During a GCA, your position in the pattern and on final will be directed by a controller who will continuously feed you course and heading information and, in the case of a PAR approach, glidepath information on final.\"", "ics": false}, {"f": "In the GCA pattern you must acknowledge all radio calls and read back:", "c": "All headings, altitudes, and altimeter settings", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"In the pattern, you are required to acknowledge all radio calls and read back all headings, altitudes, and altimeter settings.\"", "ics": false}, {"f": "Per FAR 7110.65 the controller is required to give:", "c": "Missed approach instructions, weather (if less than VFR), altimeter, and lost comm instructions (if likely to encounter IMC)", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"According to FAR 7110.65, the controller is required to give missed approach instructions, weather conditions (if less than VFR), altimeter, and lost comm instructions (if likely to encounter IMC).\"", "ics": false}, {"f": "Per FAR 7110.65, weather conditions are given when:", "c": "Less than VFR", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"...weather conditions (if less than VFR)...\"", "ics": false}, {"f": "Per FAR 7110.65, lost comm instructions are given when:", "c": "Likely to encounter IMC", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"...lost comm instructions (if likely to encounter IMC).\"", "ics": false}, {"f": "In the pattern, the controller must communicate with you at least:", "c": "Once a minute", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"In the pattern, the controller must communicate with you at least once a minute and you are required to acknowledge the controller's calls.\"", "ics": false}, {"f": "In the pattern, if you hear no transmissions for more than ___ seconds, attempt to contact the controller.", "c": "60", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"If you hear no transmissions for more than 60 seconds, attempt to contact the controller.\"", "ics": false}, {"f": "In the pattern, if unable to reestablish contact you:", "c": "Comply with the lost communication instructions", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"If you are unable to reestablish contact, then comply with the lost communication instructions.\"", "ics": false}, {"f": "Controller info furnished in the pattern — item 1:", "c": "Type of approach to expect (precision or surveillance)", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"1. Type of approach to expect (precision or surveillance)\"", "ics": false}, {"f": "Controller info furnished in the pattern — item 2:", "c": "Duty runway", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"2. Duty runway\"", "ics": false}, {"f": "Controller info furnished in the pattern — item 3:", "c": "Location of the missed approach point (MAP) (surveillance only)", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"3. Location of the missed approach point (MAP) (surveillance only)\"", "ics": false}, {"f": "Controller info furnished in the pattern — item 4:", "c": "Advisory to perform landing check (USN/USMC controllers only)", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"4. Advisory to perform landing check (USN/USMC controllers only)\"", "ics": false}, {"f": "Controller info furnished in the pattern — item 5:", "c": "Missed approach and lost communication instructions", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"5. Missed approach and lost communication instructions\"", "ics": false}, {"f": "Which is NOT on the list of information the controller furnishes in the pattern?", "c": "Recommended altitudes each mile", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"1. Type of approach to expect (precision or surveillance) 2. Duty runway 3. Location of the missed approach point (MAP) (surveillance only) 4. Advisory to perform landing check (USN/USMC controllers only) 5. Missed approach and lost communication instructions\"", "ics": false}, {"f": "The location of the MAP is furnished in the pattern for:", "c": "Surveillance approaches only", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"3. Location of the missed approach point (MAP) (surveillance only)\"", "ics": false}, {"f": "The advisory to perform landing check is given by:", "c": "USN/USMC controllers only", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"4. Advisory to perform landing check (USN/USMC controllers only)\"", "ics": false}, {"f": "Besides the listed items, the controller also gives:", "c": "Position information and heading changes as necessary to keep you on course", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"Additionally, the controller will give you position information and heading changes as necessary to keep you on course.\"", "ics": false}, {"f": "Final controller radio check as you commence final:", "c": "\"THIS IS MCCAIN FINAL CONTROLLER. HOW DO YOU HEAR?\"", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"As you commence your final approach, the final controller will perform a radio check; \"THIS IS MCCAIN FINAL CONTROLLER. HOW DO YOU HEAR?\"\"", "ics": false}, {"f": "Your response to the final controller's radio check:", "c": "\"LOUD AND CLEAR, THREE DOWN AND LOCKED\" (or position of gear)", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"You should respond with \"LOUD AND CLEAR, THREE DOWN AND LOCKED\" (or position of gear).\"", "ics": false}, {"f": "After the radio check, the controller may also tell you:", "c": "That you need not acknowledge further transmissions", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"The controller may also tell you that you need not acknowledge further transmissions.\"", "ics": false}, {"f": "On final, the controller must contact you at least every ___ on a PAR.", "c": "5 seconds", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"On final approach, the controller is required to make contact with you at least every 5 seconds on a PAR or 15 seconds on an ASR.\"", "ics": false}, {"f": "On final, the controller must contact you at least every ___ on an ASR.", "c": "15 seconds", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"On final approach, the controller is required to make contact with you at least every 5 seconds on a PAR or 15 seconds on an ASR.\"", "ics": false}, {"f": "Comm intervals — pattern / PAR final / ASR final:", "c": "Once a minute / 5 seconds / 15 seconds", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"In the pattern, the controller must communicate with you at least once a minute … at least every 5 seconds on a PAR or 15 seconds on an ASR.\"", "ics": false}, {"f": "If you lose contact on final for the respective time for the approach being flown:", "c": "Attempt to recontact; if not successful, execute the lost communication instructions", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"If you lose contact with the controller for the respective amount of time for the approach being flown, attempt to recontact and if not successful, execute the lost communication instructions.\"", "ics": false}, {"f": "GCA pattern entry configuration — Airspeed:", "c": "200 KIAS", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"Airspeed: 200 KIAS\"", "ics": false}, {"f": "GCA pattern entry configuration — Gear:", "c": "Up", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"Gear: Up\"", "ics": false}, {"f": "GCA pattern entry configuration — Speed brakes:", "c": "In", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"Speed brakes: In\"", "ics": false}, {"f": "GCA pattern entry configuration — Flaps/slats:", "c": "Up", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"Flaps/slats: Up\"", "ics": false}, {"f": "GCA pattern entry configuration — Available NAVAIDS:", "c": "Tuned", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"Available NAVAIDS: Tuned\"", "ics": false}, {"f": "The downwind leg is normally flown:", "c": "Straight and level at 200 KIAS and pattern altitude", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"Normally, you fly the first leg of the pattern (the downwind leg) straight and level at 200 KIAS and pattern altitude.\"", "ics": false}, {"f": "At the end of the downwind leg, the controller directs a turn to:", "c": "Base leg", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"At the end of the downwind leg, the controller will direct a turn to base leg.\"", "ics": false}, {"f": "At the end of the base leg, the controller directs a turn to:", "c": "Either a dogleg or the final approach course", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"At the end of the base leg, the controller will direct a turn to either a dogleg or the final approach course.\"", "ics": false}, {"f": "On base or a dogleg, unless directed by ATC, stay clean at 200 KIAS until within:", "c": "10 nm of the field and 30 radials of the FAC", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"Once established on base leg or on a dogleg to the FAC, unless directed by ATC, stay clean and at 200 KIAS until you are within 10 nm of the field and 30 radials of the final approach course.\"", "ics": false}, {"f": "When within those parameters, you transition to landing configuration and slow to:", "c": "150 KIAS (speed brakes retracted, complete landing checklist)", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"When within those parameters, transition to landing configuration, speed brakes retracted, slow to 150 KIAS, and complete the landing checklist (speed brakes retracted).\"", "ics": false}, {"f": "After configuring in the GCA pattern you will have to:", "c": "Retrim the nose to maintain level flight", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"You will have to retrim the nose to maintain level flight.\"", "ics": false}, {"f": "Slow to on-speed when:", "c": "Within 10 nm and on an intercept heading within 30 degrees of the FAC", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"When within 10 nm and on an intercept heading that is within 30 degrees of the final approach course, slow to on-speed.\"", "ics": false}, {"f": "USN/USMC controllers' \"PERFORM LANDING CHECKS\" on the base leg is:", "c": "Only a reminder; it does not direct the pilot to dirty up", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"USN/USMC controllers will state \"PERFORM LANDING CHECKS\" on the base leg; this is only a reminder and does not direct the pilot to dirty up.\"", "ics": false}, {"f": "If the controller says \"SLOW TO APPROACH SPEED\":", "c": "It is directed for sequencing; comply or state that you are unable", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"If the controller says, \"SLOW TO APPROACH SPEED,\" the controller is directing this for sequencing and the aircrew must comply or state that they are unable.\"", "ics": false}, {"f": "GCAs can be flown in which flap configurations?", "c": "Full, one-half, and no-flap", "r": "—", "k": "PAR Approach — GCA Basics, Comms & Pattern", "s": "Source: \"GCAs can be flown at full, one-half, and no-flap configurations.\"", "ics": false}, {"f": "At the beginning of a PAR final you are:", "c": "Straight and level, on-speed, normally at approximately 1,500 ft AGL", "r": "—", "k": "PAR & ASR Final Approach", "s": "Source: \"At the beginning of a PAR final approach, you will be straight and level, on-speed, and normally at approximately 1,500 ft AGL.\"", "ics": false}, {"f": "Normal altitude at the beginning of a PAR final:", "c": "Approximately 1,500 ft AGL", "r": "—", "k": "PAR & ASR Final Approach", "s": "Source: \"...normally at approximately 1,500 ft AGL.\"", "ics": false}, {"f": "PAR final — restrict AOB to:", "c": "Approximate degrees to be turned, not to exceed 1/2 SRT (approximately 10 degrees)", "r": "—", "k": "PAR & ASR Final Approach", "s": "Source: \"Restrict AOB to the approximate number of degrees to be turned, not to exceed 1/2 SRT (approximately 10 degrees).\"", "ics": false}, {"f": "PAR final — verify:", "c": "Gear down, flaps at half or full", "r": "—", "k": "PAR & ASR Final Approach", "s": "Source: \"Verify gear down, flaps at half or full.\"", "ics": false}, {"f": "PAR final — trim the aircraft for:", "c": "Hands off level flight", "r": "—", "k": "PAR & ASR Final Approach", "s": "Source: \"Trim aircraft for hands off level flight.\"", "ics": false}, {"f": "On a PAR, when told \"ON GLIDEPATH\" you:", "c": "Extend the speed brakes and adjust power as required to establish a descent", "r": "—", "k": "PAR & ASR Final Approach", "s": "Source: \"When the controller informs you that you are \"ON GLIDEPATH,\" extend the speed brakes and adjust power as required to establish a descent.\"", "ics": false}, {"f": "Initially after speed brake extension on the PAR you need:", "c": "Forward stick pressure to counter the pitch up", "r": "—", "k": "PAR & ASR Final Approach", "s": "Source: \"Forward stick pressure will initially be required to counter the pitch up caused by speed brake extension.\"", "ics": false}, {"f": "PAR ICS report after establishing the descent:", "c": "\"SPEED BRAKES FULL, LANDING CHECKLIST COMPLETE\"", "r": "—", "k": "PAR & ASR Final Approach", "s": "Source: \"Report, \"SPEED BRAKES FULL, LANDING CHECKLIST COMPLETE,\" on the ICS.\"", "ics": false}, {"f": "PAR rate of descent varies with:", "c": "Glideslope angle and groundspeed", "r": "—", "k": "PAR & ASR Final Approach", "s": "Source: \"The rate of descent will vary for different glideslope angles and groundspeeds.\"", "ics": false}, {"f": "Where is the rate of descent chart for a given glideslope and groundspeed?", "c": "Inside back cover of the approach plates", "r": "—", "k": "PAR & ASR Final Approach", "s": "Source: \"The inside back cover of the approach plates contains a chart that will provide you rate of descent for a given glideslope and groundspeed.\"", "ics": false}, {"f": "On PAR final, adjust power to:", "c": "Maintain your rate of descent and keep the aircraft on-speed", "r": "—", "k": "PAR & ASR Final Approach", "s": "Source: \"Adjust power to maintain your rate of descent and keep the aircraft on-speed.\"", "ics": false}, {"f": "PAR heading corrections — bank angle:", "c": "Small (5-10 degrees)", "r": "—", "k": "PAR & ASR Final Approach", "s": "Source: \"When making heading corrections, try to keep the amount of bank angle small (5-10 degrees) so that you don't end up chasing the heading.\"", "ics": false}, {"f": "On the PAR, if you get off heading:", "c": "Don't try to correct to course; return to your last assigned heading with smooth inputs", "r": "—", "k": "PAR & ASR Final Approach", "s": "Source: \"If you get off heading, don't try to correct to course. Use smooth control inputs and return to your last assigned heading.\"", "ics": false}, {"f": "As you near the decision altitude, begin:", "c": "An \"inside/outside\" scan to visually acquire the runway environment", "r": "—", "k": "PAR & ASR Final Approach", "s": "Source: \"As you near the decision altitude, begin an \"inside/outside\" scan to visually acquire the runway environment.\"", "ics": false}, {"f": "PAR — no runway environment in sight at the DA:", "c": "Execute a missed approach (make the mandatory missed approach call)", "r": "—", "k": "PAR & ASR Final Approach", "s": "Source: \"If you do not have the runway environment in sight when you reach the DA, execute a missed approach (make the mandatory missed approach call).\"", "ics": false}, {"f": "On the ASR final, the controller cannot furnish:", "c": "Glideslope information", "r": "—", "k": "PAR & ASR Final Approach", "s": "Source: \"On the ASR final approach, the controller cannot furnish glideslope information.\"", "ics": false}, {"f": "On an ASR, who establishes and maintains the correct rate of descent?", "c": "The pilot", "r": "—", "k": "PAR & ASR Final Approach", "s": "Source: \"It will be up to you to establish and maintain the correct rate of descent.\"", "ics": false}, {"f": "ASR — the controller identifies the MAP:", "c": "In nautical miles from the end of the runway", "r": "—", "k": "PAR & ASR Final Approach", "s": "Source: \"The controller will identify the missed approach point (MAP) in nautical miles from the end of the runway, and will direct the descent by stating, \"BEGIN DESCENT.\"\"", "ics": false}, {"f": "ASR — the controller directs the descent by stating:", "c": "\"BEGIN DESCENT\"", "r": "—", "k": "PAR & ASR Final Approach", "s": "Source: \"...and will direct the descent by stating, \"BEGIN DESCENT.\"\"", "ics": false}, {"f": "ASR recommended altitudes each mile are provided:", "c": "On pilot request", "r": "—", "k": "PAR & ASR Final Approach", "s": "Source: \"On pilot request, the controller will provide recommended altitudes each mile on final.\"", "ics": false}, {"f": "ASR recommended altitudes decrease:", "c": "300 ft per mile
