<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Checklist 4. Tower, Hold Short, Runup &amp; Takeoff — T-45 Quiz</title>
<script src="auth.js"></script>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt span + span, #q-text { white-space: pre-line; }
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">Home</a> · <a href="section-cl.html">CL</a> · Checklist / Comm Flow</div>
    <h1>Checklist 4. Tower, Hold Short, Runup &amp; Takeoff</h1>
    <div class="meta">25 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 25</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Checklist / Comm Flow</div>
    <h2 style="margin:0.2rem 0">Checklist 4. Tower, Hold Short, Runup &amp; Takeoff</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-cl.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to CL</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="section-cl.html">← CL</a> · <a href="index.html">Home</a></div>
</div>
<script>
const QUESTIONS = [{"q": "Tower call (Ch 3 Pri):", "opts": ["“Kingsville Tower, Blazer 201, takeoff”", "“Kingsville Tower, Blazer 201, ready for departure”", "“Kingsville Tower, Blazer 201, holding short 13R”", "“Kingsville Tower, Blazer 201, request takeoff”"], "ans": 0, "expl": "Doc (Checklist walkthrough): Ch 3 Pri: “Kingsville Tower, Blazer 201, takeoff”"}, {"q": "Tower’s takeoff clearance:", "opts": ["“runway 13R cleared for takeoff, contact ground”", "“cleared for takeoff, remain this frequency”", "“Blazer 201, wind 130 at 15, runway 13R cleared for takeoff, change to departure”", "“wind 130 at 15, line up and wait”"], "ans": 2, "expl": "Doc (Checklist walkthrough): “Blazer 201, wind 130 at 15, runway 13R cleared for takeoff, change to departure”"}, {"q": "Your takeoff clearance readback:", "opts": ["“Wind 130 at 15, cleared for takeoff, Blazer 201”", "“Cleared for takeoff runway 13R, switching, Blazer 201”", "“Roger, Blazer 201”", "“Switching departure, Blazer 201”"], "ans": 1, "expl": "Doc (Checklist walkthrough): “Cleared for takeoff runway 13R, switching, Blazer 201” Change to channel 4 on PRI."}, {"q": "After takeoff clearance readback, change PRI to channel:", "opts": ["4", "13", "5", "2"], "ans": 0, "expl": "Doc (Checklist walkthrough): Change to channel 4 on PRI."}, {"q": "Prior to crossing hold short, call:", "opts": ["“Groove is Clear”", "“Runway is Clear”", "“Final is Clear”", "“Clear left, clear right”"], "ans": 0, "expl": "Doc (Checklist walkthrough): Prior to crossing hold short clear runway and short final and state: “Groove is Clear”"}, {"q": "Do not turn on pitot heat until:", "opts": ["airborne", "you are cleared for takeoff", "at the hold short", "lined up on centerline"], "ans": 1, "expl": "Doc (Checklist walkthrough): If you are not given a takeoff clearance, you can begin your hold short checks, but do not turn on pitot heat until you are cleared for takeoff."}, {"q": "Hold Short Checklist order:", "opts": ["Fuel Control, IFF, Pitot Heat, AV BITS, Strobes, Lights", "Pitot Heat, Fuel Control, IFF, Strobes, Lights, AV BITS", "Fuel Control - Normal, Pitot Heat - On, Strobes - On, Landing/Taxi Light - On, IFF - Norm, AV BITS - Checked", "IFF, Strobes, Lights, Pitot, Fuel Control, AV BITS"], "ans": 2, "expl": "Doc (Checklist walkthrough): Hold Short Checklist: 1. Fuel Control - Normal 2. Pitot Heat - On 3. Strobes - On 4. Landing/Taxi Light - On 5. IFF - Norm 6. AV BITS - Checked"}, {"q": "Hold short checks complete call:", "opts": ["“Good headings, no off flags, watch your knees”", "“Fuel Control Normal, Ready in Front”", "“Pitot Heat on, Lights on, IFF Norm, Hold Short Checks Complete”", "“Fuel Control Normal, Pitot Heat on, Lights on, IFF XXXX Norm, No AV BITS, Winds are left to right”"], "ans": 3, "expl": "Doc (Checklist walkthrough): 7. “Fuel Control Normal, Pitot Heat on, Lights on, IFF XXXX Norm, No AV BITS, Winds are left to right” R/C: “Fuel Control Normal”"}, {"q": "Rear cockpit response to the hold short call:", "opts": ["“Clear”", "“Ready in Back”", "“Roger”", "“Fuel Control Normal”"], "ans": 3, "expl": "Doc (Checklist walkthrough): R/C: “Fuel Control Normal”"}, {"q": "Runup call 1 (lined up, stopped):", "opts": ["“Good headings, no off flags, watch your knees”", "“Groove is Clear”", "“Good EGT, RPM, Fuel Flow”", "“Watch your knees, runup”"], "ans": 0, "expl": "Doc (Checklist walkthrough): 1. “Good headings, no off flags, watch your knees” R/C: “Clear”"}, {"q": "Runup order after “watch your knees”:", "opts": ["Throttle - MRT, Brakes - Hold, Wipeout, Volts, EGT", "Wipeout, Brakes, MRT, EGT, Volts", "Brakes, Wipeout, MRT, Volts, EGT", "Brakes - Hold, Throttle - MRT, Flight Controls - Wipeout, EGT/RPM/FF - Verify, Batt Voltage - Verify"], "ans": 3, "expl": "Doc (Checklist walkthrough): 2. Brakes - Hold 3. Throttle - MRT 4. Flight Controls - Wipeout 5. EGT, RPM, FF - Verify within limits 6. Batt Voltage - Verify between 27-29 volts"}, {"q": "Runup limits: EGT and RPM at MRT:", "opts": ["EGT at or below 450, RPM at or below 104%", "EGT at or below 610, RPM at or below 97%", "EGT at or below 550, RPM at or below 100%", "EGT at or below 610 deg C, RPM at or below 104%"], "ans": 3, "expl": "Doc (Checklist walkthrough): EGT at or below 610 deg C, RPM at or below 104%, Minimum RPM within 7 seconds is known before flight ... (usually 97% in Texas"}, {"q": "Minimum RPM must be reached within ___ (usually ___ in Texas):", "opts": ["7 seconds; 97%", "15 seconds; 97%", "7 seconds; 104%", "10 seconds; 95%"], "ans": 0, "expl": "Doc (Checklist walkthrough): Minimum RPM within 7 seconds is known before flight and is based on temperature (usually 97% in Texas and it is found on the IFG checklists)"}, {"q": "Batt voltage at runup:", "opts": ["between 27-29 volts", "28 volts min", "25-28 volts", "24-29 volts"], "ans": 0, "expl": "Doc (Checklist walkthrough): 6. Batt Voltage - Verify between 27-29 volts"}, {"q": "Runup complete call (front):", "opts": ["“Ready in Back”", "“Good EGT, RPM, Fuel Flow, No warnings or cautions, Hyds 3x3, Good Volts, Time is +02, Ready in Front”", "“Good EGT, RPM, Ready in Front”", "“Hyds 3x3, Good Volts, Takeoff Checks Complete”"], "ans": 1, "expl": "Doc (Checklist walkthrough): 7. “Good EGT, RPM, Fuel Flow, No warnings or cautions, Hyds 3x3, Good Volts, Time is +02, Ready in Front” R/C: “Ready in Back”"}, {"q": "Rear cockpit response to “Ready in Front”:", "opts": ["“Armed in Back”", "“Clear”", "“Ready in Back”", "“Roger”"], "ans": 2, "expl": "Doc (Checklist walkthrough): R/C: “Ready in Back”"}, {"q": "First takeoff roll call:", "opts": ["“Good Line”", "“Airspeed Alive”", "“High Speed”", "“Rotate”"], "ans": 1, "expl": "Doc (Checklist walkthrough): Release brakes and begin takeoff. “Airspeed Alive”"}, {"q": "High speed is announced at:", "opts": ["100 knots", "80 knots", "140 knots", "120 knots"], "ans": 0, "expl": "Doc (Checklist walkthrough): At 100 knots announce high speed."}, {"q": "Line speed should generally occur at or before:", "opts": ["1500’ down the runway", "1000’ down the runway", "2000’ down the runway", "the arresting gear always"], "ans": 0, "expl": "Doc (Checklist walkthrough): it should generally occur at or before 1500’ down the runway"}, {"q": "Combined call at high speed and line speed:", "opts": ["“High Speed, Good Line”", "“Line speed, rotate”", "“100, Good Line”", "“Good Line, High Speed”"], "ans": 0, "expl": "Doc (Checklist walkthrough): “High Speed, Good Line”"}, {"q": "Rotate speed and attitude:", "opts": ["100 KIAS to 10 degrees", "120 KIAS to approximately 10 degrees nose high", "120 KIAS to 15-20 degrees", "140 KIAS to 15 degrees"], "ans": 1, "expl": "Doc (Checklist walkthrough): Rotate at 120 KIAS to a takeoff attitude of approximately 10 degrees nose high"}, {"q": "Gear/flaps call and response:", "opts": ["“Positive rate, gear” R/C: “Clear”", "“140, gear, flaps” R/C: “Clear”", "“140, gear up” R/C: “Roger”", "“Gear, flaps” R/C: “Good Handle”"], "ans": 1, "expl": "Doc (Checklist walkthrough): When safely airborne and above 140 KIAS, call to raise the gear and flaps. “140, gear, flaps” R/C: “Clear”"}, {"q": "Clean-up report and response:", "opts": ["“Clean, Good Handle” R/C: “Clear”", "“Gear up, flaps up” R/C: “Clear”", "“Good Handle” R/C: “Clean Below 200”", "“Clean Below 200, Good Handle” R/C: “Good Handle”"], "ans": 3, "expl": "Doc (Checklist walkthrough): “Clean Below 200, Good Handle” R/C: “Good Handle”"}, {"q": "Gear handle check force:", "opts": ["less than 6 lbs directly down (do not pull out)", "less than 6 lbs pulled out", "less than 10 lbs pulled out", "firm pull"], "ans": 0, "expl": "Doc (Checklist walkthrough): verify the gear handle won’t budge by applying light force (less than 6 lbs) directly down (do not pull out)."}, {"q": "Climb speed after takeoff:", "opts": ["200 KIAS", "230 KIAS", "250 KIAS", "300 KIAS"], "ans": 2, "expl": "Doc (Checklist walkthrough): Climb at 250 KIAS. Once safely airborne with gear and flaps raised, contact departure on ch 4 pri."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= queue.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
</html>
