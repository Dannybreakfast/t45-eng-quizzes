<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<script src="auth.js"></script>
<title>ENG0105 Engine Warnings &amp; Cautions and Engine Servicing — T-45 Quiz</title>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">Home</a> · <a href="section-eng.html">ENG</a> · Engine</div>
    <h1>ENG0105 Engine Warnings &amp; Cautions and Engine Servicing</h1>
    <div class="meta">21 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 21</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Engine</div>
    <h2 style="margin:0.2rem 0">ENG0105 Engine Warnings &amp; Cautions and Engine Servicing</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-eng.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to ENG</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="section-eng.html">← ENG</a> · <a href="index.html">Home</a></div>
</div>
<script>
const QUESTIONS = [{"q": "ECA 2 caution means:", "opts": ["Single-lane ECA failure", "Total ECA failure (both lanes)", "Manual fuel engaged", "GTS at idle"], "ans": 1, "expl": "Both lanes failed."}, {"q": "LP PUMP caution pressure threshold:", "opts": ["\u003c 10 psi", "\u003c 35 psi", "\u003c 70 psi", "\u003c 1,660 psi"], "ans": 1, "expl": "LP pump output \u003c 35 psi (or filter clogged)."}, {"q": "Minimum time between individual GTS starts:", "opts": ["30 seconds", "1 minute", "3 minutes", "30 minutes"], "ans": 2, "expl": "At least 3 minutes between each GTS start."}, {"q": "After three GTS starts, wait at least:", "opts": ["3 minutes", "10 minutes", "15 minutes", "30 minutes"], "ans": 3, "expl": "Minimum 30 minutes before the next start."}, {"q": "EGT/RPM warning EGT trip is about:", "opts": ["150 °C", "300 °C", "550 °C", "650 ±8 °C"], "ans": 3, "expl": "EGT exceeds 650 ±8 °C (or N1 \u003e 112.4+1%)."}, {"q": "Oil service lower limit on sight glass:", "opts": ["Full only", "1 L below full", "2 L below full", "Empty"], "ans": 2, "expl": "2 liters below full is max lower limit."}, {"q": "Oil servicing check window after shutdown:", "opts": ["Immediately only", "5–30 minutes (warm)", "After 2 hours cold", "Next calendar day"], "ans": 1, "expl": "Between 5 and 30 minutes after shutdown."}, {"q": "EXCEL in the landing pattern with shot-of-fuel wrong often means:", "opts": ["More thrust available", "Reduced thrust / poorer acceleration (carrier risk)", "GTS fire", "Automatic divert ILS"], "ans": 1, "expl": "Reduced acceleration — abort carrier ops / divert concern."}, {"q": "What accompanies illuminated engine warnings/cautions?", "opts": ["Between 5 and 30 minutes after shutdown while engine still warm; max consumption 0.8 pints/hour.", "Master alert light and warning/caution tone — plus look for secondary indications.", "Minimum 3 minutes between GTS starts; after three starts, minimum 30 minutes before next attempt.", "ECA advisory = single-lane failure. ECA 2 caution = total ECA failure (both lanes)."], "ans": 1, "expl": "Master alert light and warning/caution tone — plus look for secondary indications."}, {"q": "M FUEL advisory meaning?", "opts": ["Manual fuel control system is operating.", "Reduced thrust / poorer acceleration (carrier risk)", "EGT exceeds 650 ±8 °C OR N1 RPM exceeds 112.4 +1%.", "Total ECA failure (both lanes)"], "ans": 0, "expl": "Manual fuel control system is operating."}, {"q": "ECA advisory vs ECA 2 caution?", "opts": ["Minimum 3 minutes between GTS starts; after three starts, minimum 30 minutes before next attempt.", "Between 5 and 30 minutes after shutdown while engine still warm; max consumption 0.8 pints/hour.", "ECA advisory = single-lane failure. ECA 2 caution = total ECA failure (both lanes).", "Master alert light and warning/caution tone — plus look for secondary indications."], "ans": 2, "expl": "ECA advisory = single-lane failure. ECA 2 caution = total ECA failure (both lanes)."}, {"q": "LP PUMP caution causes?", "opts": ["LP pump output pressure low (\u003c 17 psi) or low-pressure fuel filter clogged.", "LP pump output pressure low (\u003c 70 psi) or low-pressure fuel filter clogged.", "LP pump output pressure low (\u003c 45 psi) or low-pressure fuel filter clogged.", "LP pump output pressure low (\u003c 35 psi) or low-pressure fuel filter clogged."], "ans": 3, "expl": "LP pump output pressure low (\u003c 35 psi) or low-pressure fuel filter clogged."}, {"q": "EXCEL caution — three circumstances?", "opts": ["Oil pressure differential low at 10 psi for more than 10 seconds; after 0/−G may take up to ~6 s to recover.", "Prevent internal bearing/gearbox damage from continuing to rotate/crank with little/no oil pressure.", "Minimum 3 minutes between GTS starts; after three starts, minimum 30 minutes before next attempt.", "1) Climbing ~9,500±300 ft stuck in turbocharger/shot-of-fuel mode; 2) Descending ~7,700±500 ft with reduced accel (carrier abort/divert concern); 3) Catapult: launch bar switch RETRACT, bar extended, N2\u003e70%, steam-ing..."], "ans": 3, "expl": "1) Climbing ~9,500±300 ft stuck in turbocharger/shot-of-fuel mode; 2) Descending ~7,700±500 ft with reduced accel (carrier abort/divert concern); 3) Catapult: launch bar switch RETRACT, bar extended, N2\u003e70%, steam-ingest valve not commanded open."}, {"q": "GTS start spacing limits?", "opts": ["Prevent internal bearing/gearbox damage from continuing to rotate/crank with little/no oil pressure.", "Oil pressure differential low at 10 psi for more than 10 seconds; after 0/−G may take up to ~6 s to recover.", "Minimum 3 minutes between GTS starts; after three starts, minimum 30 minutes before next attempt.", "Between 5 and 30 minutes after shutdown while engine still warm; max consumption 0.8 pints/hour."], "ans": 2, "expl": "Minimum 3 minutes between GTS starts; after three starts, minimum 30 minutes before next attempt."}, {"q": "No GTS ready light within 15 seconds?", "opts": ["Master alert light and warning/caution tone — plus look for secondary indications.", "Reduced thrust / poorer acceleration (carrier risk)", "Discontinue the start — risk of damage from overheat.", "ECA advisory = single-lane failure. ECA 2 caution = total ECA failure (both lanes)."], "ans": 2, "expl": "Discontinue the start — risk of damage from overheat."}, {"q": "FIRE / GTS FIRE / TP HOT temperature cues?", "opts": ["FIRE & GTS FIRE: bay \u003e 300 °C. TP HOT: tailpipe bay \u003e 150 °C.", "FIRE & GTS FIRE: bay \u003e 600 °C. TP HOT: tailpipe bay \u003e 150 °C.", "FIRE & GTS FIRE: bay \u003e 310 °C. TP HOT: tailpipe bay \u003e 150 °C.", "FIRE & GTS FIRE: bay \u003e 150 °C. TP HOT: tailpipe bay \u003e 150 °C."], "ans": 0, "expl": "FIRE & GTS FIRE: bay \u003e 300 °C. TP HOT: tailpipe bay \u003e 150 °C."}, {"q": "EGT/RPM warning trip values?", "opts": ["EGT exceeds 650 ±8 °C OR N1 RPM exceeds 112.4 +1%.", "EGT exceeds 660 ±8 °C OR N1 RPM exceeds 112.4 +1%.", "EGT exceeds 325 ±8 °C OR N1 RPM exceeds 112.4 +1%.", "EGT exceeds 1300 ±8 °C OR N1 RPM exceeds 112.4 +1%."], "ans": 0, "expl": "EGT exceeds 650 ±8 °C OR N1 RPM exceeds 112.4 +1%."}, {"q": "Oil pressure warning criteria?", "opts": ["Prevent internal bearing/gearbox damage from continuing to rotate/crank with little/no oil pressure.", "Minimum 3 minutes between GTS starts; after three starts, minimum 30 minutes before next attempt.", "Oil pressure differential low at 10 psi for more than 10 seconds; after 0/−G may take up to ~6 s to recover.", "Between 5 and 30 minutes after shutdown while engine still warm; max consumption 0.8 pints/hour."], "ans": 2, "expl": "Oil pressure differential low at 10 psi for more than 10 seconds; after 0/−G may take up to ~6 s to recover."}, {"q": "Oil sight-glass lower service limit?", "opts": ["4 liters (≈4.2 US pints) below full — anything below requires service.", "12 liters (≈4.2 US pints) below full — anything below requires service.", "2 liters (≈4.2 US pints) below full — anything below requires service.", "1 liters (≈4.2 US pints) below full — anything below requires service."], "ans": 2, "expl": "2 liters (≈4.2 US pints) below full — anything below requires service."}, {"q": "When to check oil after shutdown?", "opts": ["Minimum 3 minutes between GTS starts; after three starts, minimum 30 minutes before next attempt.", "Oil pressure differential low at 10 psi for more than 10 seconds; after 0/−G may take up to ~6 s to recover.", "Prevent internal bearing/gearbox damage from continuing to rotate/crank with little/no oil pressure.", "Between 5 and 30 minutes after shutdown while engine still warm; max consumption 0.8 pints/hour."], "ans": 3, "expl": "Between 5 and 30 minutes after shutdown while engine still warm; max consumption 0.8 pints/hour."}, {"q": "ENGINE OFF during start with oil warning still on — why?", "opts": ["Prevent internal bearing/gearbox damage from continuing to rotate/crank with little/no oil pressure.", "Oil pressure differential low at 10 psi for more than 10 seconds; after 0/−G may take up to ~6 s to recover.", "Between 5 and 30 minutes after shutdown while engine still warm; max consumption 0.8 pints/hour.", "Minimum 3 minutes between GTS starts; after three starts, minimum 30 minutes before next attempt."], "ans": 0, "expl": "Prevent internal bearing/gearbox damage from continuing to rotate/crank with little/no oil pressure."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= QUESTIONS.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
</html>
