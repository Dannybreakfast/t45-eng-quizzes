<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CO3201 (3) Level Speed Change — T-45 Quiz</title>
<script src="auth.js"></script>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt span + span, #q-text { white-space: pre-line; }
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">Home</a> · <a href="section-co3201.html">CO3201</a> · CO3201 Instrument Procedures</div>
    <h1>CO3201 (3) Level Speed Change</h1>
    <div class="meta">13 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 13</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">CO3201 Instrument Procedures</div>
    <h2 style="margin:0.2rem 0">CO3201 (3) Level Speed Change</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-co3201.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to CO3201</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="section-co3201.html">← CO3201</a> · <a href="index.html">Home</a></div>
</div>
<script>
const QUESTIONS = [{"q": "The power setting for increasing airspeed depends on:", "opts": ["The bank angle", "The aircraft gross weight", "The altitude", "The magnitude of the desired change"], "ans": 3, "expl": "Correct: The magnitude of the desired change · Source: \"The power setting you use for increasing airspeed depends on the magnitude of the desired change.\""}, {"q": "For an airspeed increase of less than 20 kts, you:", "opts": ["Advance exactly to the new-airspeed setting and wait", "Advance to MRT, then reduce at a 5-kt lead", "Lower the nose only", "Advance the throttle beyond the setting for the new airspeed, then reduce to the approximate setting to maintain it"], "ans": 3, "expl": "Correct: Advance the throttle beyond the setting for the new airspeed, then reduce to the approximate setting to maintain it · Source: \"For an airspeed increase of less than 20 kts, you should advance the throttle beyond the power setting for the new airspeed, allowing the airspeed to increase, and then reduce the power to the approximate setting to maintain the new airspeed.\""}, {"q": "For airspeed increases greater than 20 kts, advance the power to:", "opts": ["Just beyond the setting for the new airspeed", "Flight IDLE", "MRT", "Approximately 1,500 pph"], "ans": 2, "expl": "Correct: MRT · Source: \"For airspeed increases greater than 20 kts, advance the power to MRT.\""}, {"q": "Speed increase greater than 20 kts: at what lead do you reduce the throttle?", "opts": ["2 kts from the desired airspeed", "20 kts from the desired airspeed", "10 kts from the desired airspeed", "5 kts from the desired airspeed"], "ans": 3, "expl": "Correct: 5 kts from the desired airspeed · Source: \"Then, at a lead of 5 kts from the desired airspeed, reduce the throttle setting to approximately that required for the new speed.\""}, {"q": "The MRT / 5-kt lead method is used when practicing which T-45C speed change?", "opts": ["250 to 200 KIAS", "200 to 250 KIAS", "200 to 220 KIAS", "150 to 200 KIAS"], "ans": 1, "expl": "Correct: 200 to 250 KIAS · Source: \"Use this method when you practice the speed change from 200 to 250 KIAS in the T-45C.\""}, {"q": "For a normal airspeed decrease you:", "opts": ["Reduce power exactly to the new setting", "Reduce power below the requirement for the desired airspeed, then at a 5-kt lead advance power as required", "Raise the nose without changing power", "Reduce to idle and extend speed brakes always"], "ans": 1, "expl": "Correct: Reduce power below the requirement for the desired airspeed, then at a 5-kt lead advance power as required · Source: \"To perform normal airspeed decreases, reduce the power below the power requirement for the desired airspeed, allowing the airspeed to decrease, and then at a lead point of 5 kts, advance power as required for the new airspeed.\""}, {"q": "Lead point for advancing power in a normal airspeed decrease:", "opts": ["20 kts", "2 kts", "5 kts", "10 kts"], "ans": 2, "expl": "Correct: 5 kts · Source: \"...and then at a lead point of 5 kts, advance power as required for the new airspeed.\""}, {"q": "As airspeed decreases, to maintain level flight you need:", "opts": ["Less power", "Speed brakes retracted", "More nose down trim", "More nose up trim"], "ans": 3, "expl": "Correct: More nose up trim · Source: \"As airspeed decreases, more nose up trim will be required to maintain level flight.\""}, {"q": "For large or rapid airspeed decreases you:", "opts": ["Reduce to 700 pph and lower the nose", "Reduce the throttle to idle and fully extend the speed brakes", "Reduce throttle slightly and raise the nose", "Extend gear and flaps"], "ans": 1, "expl": "Correct: Reduce the throttle to idle and fully extend the speed brakes · Source: \"When making large or rapid airspeed decreases, reduce the throttle to idle and fully extend the speed brakes.\""}, {"q": "When you extend the speed brakes, expect:", "opts": ["No pitch change", "A roll to the left", "A pitch up, and retrim to maintain altitude", "A pitch down"], "ans": 2, "expl": "Correct: A pitch up, and retrim to maintain altitude · Source: \"When you extend the speed brakes, expect a pitch up and anticipate the need to retrim the aircraft to maintain altitude.\""}, {"q": "In a rapid speed decrease, at what lead do you retract speed brakes and reset power?", "opts": ["20 kts", "5 kts", "At the desired airspeed", "10 kts"], "ans": 1, "expl": "Correct: 5 kts · Source: \"Because the airspeed will rapidly decrease, you will need to use a 5-kt lead point to retract the speed brakes and reset the power to avoid undershooting your desired airspeed.\""}, {"q": "When you retract the speed brakes, anticipate:", "opts": ["A climb", "A yaw", "A pitch down", "A pitch up"], "ans": 2, "expl": "Correct: A pitch down · Source: \"Anticipate a pitch down when you retract the speed brakes.\""}, {"q": "The idle / full speed brake method is used when practicing which T-45C speed change?", "opts": ["200 to 150 KIAS", "300 to 250 KIAS", "200 to 250 KIAS", "250 to 200 KIAS"], "ans": 3, "expl": "Correct: 250 to 200 KIAS · Source: \"Use this method when you practice the speed change from 250 to 200 KIAS in the T-45C.\""}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= queue.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
</html>
