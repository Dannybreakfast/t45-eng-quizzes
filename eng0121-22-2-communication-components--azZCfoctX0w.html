<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ENG0121/22 (2) Communication Components — T-45 Quiz</title>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">T-45 Local Quizzes</a> · CNI</div>
    <h1>ENG0121/22 (2) Communication Components</h1>
    <div class="meta">19 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 19</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">CNI</div>
    <h2 style="margin:0.2rem 0">ENG0121/22 (2) Communication Components</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="index.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to Index</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="index.html">← All quizzes</a></div>
</div>
<script>
const QUESTIONS = [{"q": "Successful radio BIT display:", "opts": ["000.000", "888.888", "121.500", "FAIL"], "ans": 1, "expl": "888.888 indicates successful BIT."}, {"q": "Throttle mic — AUX transmit:", "opts": ["Thumb up", "Thumb down", "Thumb in", "Both up and in"], "ans": 1, "expl": "Down = AUX; up = PRI; in = ICS."}, {"q": "In ALT audio amplifier mode:", "opts": ["Individual volumes still work", "No volume available individually; your cockpit hot mic", "Both cockpits forced cold mic", "Radios powered off"], "ans": 1, "expl": "Equal fixed volume; your cockpit hot mic only."}, {"q": "Fourth frequency toggle increments:", "opts": ["1", "5", "25", "50"], "ans": 2, "expl": "Last two digits step by 25."}, {"q": "UHF Guard frequency:", "opts": ["121.5", "243.0", "399.975", "108.0"], "ans": 1, "expl": "UHF Guard 243.0; VHF Guard 121.5."}, {"q": "TONE TEST tone order:", "opts": ["Caution, Warning, Stall, LAW", "Warning, Caution, Wheels up, Weapons release", "Wheels up, Warning, Caution, Gun", "LAW, Stall, Caution, Warning"], "ans": 1, "expl": "Warning → Caution → Wheels up → Weapons release."}, {"q": "How many preset channels and which are commonly duplicated?", "opts": ["30 presets (1–30, wraps). Common freqs often duplicated on presets 2–15 and 28–30 (per TW inflight guide Comm plans).", "VHF 108–136 MHz, Guard 121.5. UHF 225–399.975 MHz, Guard 243.0. Prefer AM for clarity.", "Alternate audio amp: no individual volume control (all same level); your cockpit goes hot mic, other cockpit does not.", "Select READ, set correct discrete freq with toggles, turn knob fully clockwise to LOAD; spring returns to READ."], "ans": 0, "expl": "30 presets (1–30, wraps). Common freqs often duplicated on presets 2–15 and 28–30 (per TW inflight guide Comm plans)."}, {"q": "Manual frequency — what do the four toggle switches control?", "opts": ["Thumb up = PRI; thumb down = AUX; thumb in = ICS. Release springs to neutral (no transmit). Above the speed-brake switch.", "(1) Leftmost digits (wraps 39 UHF ↔ 10 VHF); (2) digit left of decimal; (3) digit right of decimal; (4) last two digits in steps of 25 (00/25/50/75).", "LT TEST: all warning/caution/Master Alert/wheels warning/gear handle lights (not AOA indexers; FIRE/GTS FIRE line detect). TONE TEST order: Warning, Caution, Wheels up, Weapons release.", "OFF; T/R; T/R&G (monitors Guard of selected band: 243.0 UHF or 121.5 VHF); DF (non-functioning); TEST (BIT, 888.888 = good)."], "ans": 1, "expl": "(1) Leftmost digits (wraps 39 UHF ↔ 10 VHF); (2) digit left of decimal; (3) digit right of decimal; (4) last two digits in steps of 25 (00/25/50/75)."}, {"q": "Mode knob positions and Guard frequencies?", "opts": ["(1) Leftmost digits (wraps 39 UHF ↔ 10 VHF); (2) digit left of decimal; (3) digit right of decimal; (4) last two digits in steps of 25 (00/25/50/75).", "Thumb up = PRI; thumb down = AUX; thumb in = ICS. Release springs to neutral (no transmit). Above the speed-brake switch.", "LT TEST: all warning/caution/Master Alert/wheels warning/gear handle lights (not AOA indexers; FIRE/GTS FIRE line detect). TONE TEST order: Warning, Caution, Wheels up, Weapons release.", "OFF; T/R; T/R&G (monitors Guard of selected band: 243.0 UHF or 121.5 VHF); DF (non-functioning); TEST (BIT, 888.888 = good)."], "ans": 3, "expl": "OFF; T/R; T/R&G (monitors Guard of selected band: 243.0 UHF or 121.5 VHF); DF (non-functioning); TEST (BIT, 888.888 = good)."}, {"q": "How do you LOAD a corrected preset frequency?", "opts": ["VHF 108–136 MHz, Guard 121.5. UHF 225–399.975 MHz, Guard 243.0. Prefer AM for clarity.", "Select READ, set correct discrete freq with toggles, turn knob fully clockwise to LOAD; spring returns to READ.", "30 presets (1–30, wraps). Common freqs often duplicated on presets 2–15 and 28–30 (per TW inflight guide Comm plans).", "Alternate audio amp: no individual volume control (all same level); your cockpit goes hot mic, other cockpit does not."], "ans": 1, "expl": "Select READ, set correct discrete freq with toggles, turn knob fully clockwise to LOAD; spring returns to READ."}, {"q": "Throttle mic switch directions?", "opts": ["OFF; T/R; T/R&G (monitors Guard of selected band: 243.0 UHF or 121.5 VHF); DF (non-functioning); TEST (BIT, 888.888 = good).", "LT TEST: all warning/caution/Master Alert/wheels warning/gear handle lights (not AOA indexers; FIRE/GTS FIRE line detect). TONE TEST order: Warning, Caution, Wheels up, Weapons release.", "Thumb up = PRI; thumb down = AUX; thumb in = ICS. Release springs to neutral (no transmit). Above the speed-brake switch.", "(1) Leftmost digits (wraps 39 UHF ↔ 10 VHF); (2) digit left of decimal; (3) digit right of decimal; (4) last two digits in steps of 25 (00/25/50/75)."], "ans": 2, "expl": "Thumb up = PRI; thumb down = AUX; thumb in = ICS. Release springs to neutral (no transmit). Above the speed-brake switch."}, {"q": "What happens in ALT on the Comm Control Panel?", "opts": ["VHF 108–136 MHz, Guard 121.5. UHF 225–399.975 MHz, Guard 243.0. Prefer AM for clarity.", "Select READ, set correct discrete freq with toggles, turn knob fully clockwise to LOAD; spring returns to READ.", "Alternate audio amp: no individual volume control (all same level); your cockpit goes hot mic, other cockpit does not.", "30 presets (1–30, wraps). Common freqs often duplicated on presets 2–15 and 28–30 (per TW inflight guide Comm plans)."], "ans": 2, "expl": "Alternate audio amp: no individual volume control (all same level); your cockpit goes hot mic, other cockpit does not."}, {"q": "VHF and UHF ATC bands and Guard?", "opts": ["Alternate audio amp: no individual volume control (all same level); your cockpit goes hot mic, other cockpit does not.", "Select READ, set correct discrete freq with toggles, turn knob fully clockwise to LOAD; spring returns to READ.", "30 presets (1–30, wraps). Common freqs often duplicated on presets 2–15 and 28–30 (per TW inflight guide Comm plans).", "VHF 108–136 MHz, Guard 121.5. UHF 225–399.975 MHz, Guard 243.0. Prefer AM for clarity."], "ans": 3, "expl": "VHF 108–136 MHz, Guard 121.5. UHF 225–399.975 MHz, Guard 243.0. Prefer AM for clarity."}, {"q": "Where is the ground crew ICS receptacle?", "opts": ["On the nose gear strut.", "Thumb down", "Warning, Caution, Wheels up, Weapons release", "Caution → Wheels up → Weapons release."], "ans": 0, "expl": "On the nose gear strut."}, {"q": "LT TEST vs TONE TEST results?", "opts": ["OFF; T/R; T/R&G (monitors Guard of selected band: 243.0 UHF or 121.5 VHF); DF (non-functioning); TEST (BIT, 888.888 = good).", "Thumb up = PRI; thumb down = AUX; thumb in = ICS. Release springs to neutral (no transmit). Above the speed-brake switch.", "LT TEST: all warning/caution/Master Alert/wheels warning/gear handle lights (not AOA indexers; FIRE/GTS FIRE line detect). TONE TEST order: Warning, Caution, Wheels up, Weapons release.", "(1) Leftmost digits (wraps 39 UHF ↔ 10 VHF); (2) digit left of decimal; (3) digit right of decimal; (4) last two digits in steps of 25 (00/25/50/75)."], "ans": 2, "expl": "LT TEST: all warning/caution/Master Alert/wheels warning/gear handle lights (not AOA indexers; FIRE/GTS FIRE line detect). TONE TEST order: Warning, Caution, Wheels up, Weapons release."}, {"q": "Stall warning cue and AOA?", "opts": ["Rudder pedal shaker when AOA ≥ 43 units (T-45C).", "Rudder pedal shaker when AOA ≥ 10.8 units (T-45C).", "Rudder pedal shaker when AOA ≥ 31.5 units (T-45C).", "Rudder pedal shaker when AOA ≥ 21.5 units (T-45C)."], "ans": 3, "expl": "Rudder pedal shaker when AOA ≥ 21.5 units (T-45C)."}, {"q": "When Mode knob: OFF / T/R / T/R&G (guard 243.0 UHF or 121.5 VHF) / DF (non-functioning) / TEST (BIT, what happens?", "opts": ["888.888 success). Leave AM/FM in AM.", "898.9 success). Leave AM/FM in AM.", "1777.8 success). Leave AM/FM in AM.", "444.4 success). Leave AM/FM in AM."], "ans": 0, "expl": "888.888 success). Leave AM/FM in AM."}, {"q": "When CWS audio: Warnings, Cautions, Wheels-Up, Weapon Release, Gun, Stall, LAW. LT TEST lights (not AOA indexers). TONE TEST order: Warning, what happens?", "opts": ["Caution → Wheels up → Weapons release. Pedal shaker stall ≥ 21.5 units AOA.", "Caution → Wheels up → Weapons release. Pedal shaker stall ≥ 43 units AOA.", "Caution → Wheels up → Weapons release. Pedal shaker stall ≥ 10.8 units AOA.", "Caution → Wheels up → Weapons release. Pedal shaker stall ≥ 31.5 units AOA."], "ans": 0, "expl": "Caution → Wheels up → Weapons release. Pedal shaker stall ≥ 21.5 units AOA."}, {"q": "When B — Warning, what happens?", "opts": ["Caution → Wheels up → Weapons release.", "Warning, Caution, Wheels up, Weapons release", "On the nose gear strut.", "Thumb down"], "ans": 0, "expl": "Caution → Wheels up → Weapons release."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= QUESTIONS.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
</html>
