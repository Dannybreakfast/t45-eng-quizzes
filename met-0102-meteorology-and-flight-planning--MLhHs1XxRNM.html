<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MET 0102 Meteorology and Flight Planning — T-45 Quiz</title>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">T-45 Local Quizzes</a> · Meteorology</div>
    <h1>MET 0102 Meteorology and Flight Planning</h1>
    <div class="meta">17 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 17</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Meteorology</div>
    <h2 style="margin:0.2rem 0">MET 0102 Meteorology and Flight Planning</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="index.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to Index</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="index.html">← All quizzes</a></div>
</div>
<script>
const QUESTIONS = [{"q": "DD-175-1 weather brief void time is:", "opts": ["At ETD", "15 minutes past ETD", "30 minutes past ETD", "2 hours past ETD"], "ans": 2, "expl": "Update if you slide past void (+30 past ETD)."}, {"q": "If arrival weather is 0-0 you need an alternate of at least:", "opts": ["1000-1", "2000-2", "3000-3 or better", "Published mins only"], "ans": 2, "expl": "3710 alternate chart."}, {"q": "T-45C flight into known icing is:", "opts": ["Allowed with pitot heat only", "Prohibited by NATOPS (no anti-ice)", "Allowed below 10°C", "Allowed with Metro approval only"], "ans": 1, "expl": "Aircraft has no anti-icing capability."}, {"q": "Dynamic hydroplaning speed approximation for T-45 is about:", "opts": ["90 knots", "119 knots", "160 knots", "200 knots"], "ans": 1, "expl": "9√tire pressure ≈ 119 kt."}, {"q": "When must DD-175-1 be completed?", "opts": ["**Short-field arrest** landing; don’t land fast; weight on wheels / light brakes as applicable.", "**Metro** (local UHF forecaster); see FIH Section C for freqs/locations.", "Initiate **no earlier than 2 hours** before ETD; void **+30 min past ETD**—update if you slide.", "All flights in **instrument conditions** per **OPNAV 3710** (apps OK if 3710-compliant)."], "ans": 3, "expl": "All flights in **instrument conditions** per **OPNAV 3710** (apps OK if 3710-compliant)."}, {"q": "Weather brief timing / void?", "opts": ["**Metro** (local UHF forecaster); see FIH Section C for freqs/locations.", "Initiate **no earlier than 2 hours** before ETD; void **+30 min past ETD**—update if you slide.", "All flights in **instrument conditions** per **OPNAV 3710** (apps OK if 3710-compliant).", "**Short-field arrest** landing; don’t land fast; weight on wheels / light brakes as applicable."], "ans": 1, "expl": "Initiate **no earlier than 2 hours** before ETD; void **+30 min past ETD**—update if you slide."}, {"q": "Arrival 3000-3 or better — alternate legally?", "opts": ["**No anti-ice** → NATOPS **prohibits** flight into known icing.", "**Metro** (local UHF forecaster); see FIH Section C for freqs/locations.", "All flights in **instrument conditions** per **OPNAV 3710** (apps OK if 3710-compliant).", "**No alternate required** (CNATRA still wants a divert)."], "ans": 3, "expl": "**No alternate required** (CNATRA still wants a divert)."}, {"q": "Arrival 0-0 — alternate requirement?", "opts": ["Need a **1500-3 or better** alternate.", "Need a **6000-3 or better** alternate.", "Need a **3010-3 or better** alternate.", "Need a **3000-3 or better** alternate."], "ans": 3, "expl": "Need a **3000-3 or better** alternate."}, {"q": "Mins additive between 3000-3 and published?", "opts": ["Precision **+100 / ½** or non-precision **+300 / 1**.", "Precision **+200 / ½** or non-precision **+300 / 1**.", "Precision **+400 / ½** or non-precision **+300 / 1**.", "Precision **+210 / ½** or non-precision **+300 / 1**."], "ans": 1, "expl": "Precision **+200 / ½** or non-precision **+300 / 1**."}, {"q": "PAR/ASR for alternate planning?", "opts": ["**Not authorized**; T-45 **ILS** is precision.", "**Not authorized**; T-22 **ILS** is precision.", "**Not authorized**; T-90 **ILS** is precision.", "**Not authorized**; T-55 **ILS** is precision."], "ans": 0, "expl": "**Not authorized**; T-45 **ILS** is precision."}, {"q": "DD-175-1 Part 2 covers?", "opts": ["En route **thunderstorms, turbulence, icing, precipitation** (sections 22–25).", "En route **thunderstorms, turbulence, icing, precipitation** (sections 44–25).", "En route **thunderstorms, turbulence, icing, precipitation** (sections 32–25).", "En route **thunderstorms, turbulence, icing, precipitation** (sections 11–25)."], "ans": 0, "expl": "En route **thunderstorms, turbulence, icing, precipitation** (sections 22–25)."}, {"q": "Best en route wx update service?", "opts": ["**Metro** (local UHF forecaster); see FIH Section C for freqs/locations.", "All flights in **instrument conditions** per **OPNAV 3710** (apps OK if 3710-compliant).", "**No anti-ice** → NATOPS **prohibits** flight into known icing.", "**No alternate required** (CNATRA still wants a divert)."], "ans": 0, "expl": "**Metro** (local UHF forecaster); see FIH Section C for freqs/locations."}, {"q": "FSS example freqs?", "opts": ["**127.7** or **122.2**, or Guard.", "**510.8** or **122.2**, or Guard.", "**255.4** or **122.2**, or Guard.", "**265.4** or **122.2**, or Guard."], "ans": 2, "expl": "**255.4** or **122.2**, or Guard."}, {"q": "Microburst size / wind / duration?", "opts": ["~**101–2 NM**, winds **\u003e100 mph**, lasts ~**10 minutes**.", "~**2–2 NM**, winds **\u003e100 mph**, lasts ~**10 minutes**.", "~**1–2 NM**, winds **\u003e100 mph**, lasts ~**10 minutes**.", "~**11–2 NM**, winds **\u003e100 mph**, lasts ~**10 minutes**."], "ans": 2, "expl": "~**1–2 NM**, winds **\u003e100 mph**, lasts ~**10 minutes**."}, {"q": "T-45C icing rule?", "opts": ["All flights in **instrument conditions** per **OPNAV 3710** (apps OK if 3710-compliant).", "**Metro** (local UHF forecaster); see FIH Section C for freqs/locations.", "**No anti-ice** → NATOPS **prohibits** flight into known icing.", "**No alternate required** (CNATRA still wants a divert)."], "ans": 2, "expl": "**No anti-ice** → NATOPS **prohibits** flight into known icing."}, {"q": "Dynamic hydroplane speed rule of thumb?", "opts": ["**19 × √tire pressure** → T-45 ≈ **119 knots**.", "**9 × √tire pressure** → T-45 ≈ **119 knots**.", "**4 × √tire pressure** → T-45 ≈ **119 knots**.", "**18 × √tire pressure** → T-45 ≈ **119 knots**."], "ans": 1, "expl": "**9 × √tire pressure** → T-45 ≈ **119 knots**."}, {"q": "Solution emphasized for hydroplaning risk?", "opts": ["Initiate **no earlier than 2 hours** before ETD; void **+30 min past ETD**—update if you slide.", "**Metro** (local UHF forecaster); see FIH Section C for freqs/locations.", "**Short-field arrest** landing; don’t land fast; weight on wheels / light brakes as applicable.", "All flights in **instrument conditions** per **OPNAV 3710** (apps OK if 3710-compliant)."], "ans": 2, "expl": "**Short-field arrest** landing; don’t land fast; weight on wheels / light brakes as applicable."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= QUESTIONS.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
</html>
