<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>NAV0103 Departure and Terminal Procedures — T-45 Quiz</title>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">Home</a> · <a href="section-nav.html">NAV</a> · Navigation</div>
    <h1>NAV0103 Departure and Terminal Procedures</h1>
    <div class="meta">40 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 40</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Navigation</div>
    <h2 style="margin:0.2rem 0">NAV0103 Departure and Terminal Procedures</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-nav.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to NAV</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="section-nav.html">← NAV</a> · <a href="index.html">Home</a></div>
</div>
<script>
const QUESTIONS = [{"q": "FAR 91 maximum indicated airspeed below 10,000 feet MSL is:", "opts": ["200 KIAS", "230 KIAS", "250 KIAS", "310 KIAS"], "ans": 2, "expl": "250 KIAS below 10,000 ft MSL (FAR 91) to reduce midair collision hazards."}, {"q": "Within 4 nm of the primary airport from the surface to 2500 ft AGL in Class C or D airspace, maximum airspeed is:", "opts": ["250 KIAS", "200 KIAS", "180 KIAS", "265 KIAS"], "ans": 1, "expl": "Class C/D: 200 KIAS within 4 nm, surface–2500 AGL."}, {"q": "Maximum airspeed under the floors of Class B airspace (or in a VFR corridor through Class B) is:", "opts": ["250 KIAS", "310 KIAS", "200 KIAS", "180 KIAS"], "ans": 2, "expl": "200 KIAS under Class B floors and in a VFR corridor transiting Class B."}, {"q": "T-45 holding SOP airspeed is:", "opts": ["Max range / 250 KIAS", "Maximum endurance / 200 KIAS", "230 KIAS always", "310 KIAS"], "ans": 1, "expl": "Hold at max endurance; T-45 SOP 200 KIAS."}, {"q": "Maximum holding airspeed at Navy airfields (unless otherwise depicted) is:", "opts": ["200 KIAS", "230 KIAS", "265 KIAS", "310 KIAS"], "ans": 1, "expl": "Navy: 230 KIAS all altitudes unless depicted; USAF is 310."}, {"q": "Civilian max holding speed above 14,000 ft MSL is:", "opts": ["200 KIAS", "230 KIAS", "265 KIAS", "310 KIAS"], "ans": 2, "expl": "Civilian bands: 200 (0–6000), 230 (above 6000–14,000), 265 (above 14,000)."}, {"q": "T-45 IFR fuel reserve per TW-1/TW-2 joint SOP is:", "opts": ["10% of planned fuel only", "20 minutes at max endurance", "ALWAYS 500 pounds", "300 pounds"], "ans": 2, "expl": "T-45 always 500 lb IFR; CNAF is greater of 10% or 20 min at 10,000 MSL max endurance."}, {"q": "CNAF M-3710.7 reserve is the greater of 10% planned or:", "opts": ["10 minutes at 5,000 ft", "20 minutes max endurance at 10,000 ft MSL", "30 minutes at cruise", "500 pounds for all aircraft"], "ans": 1, "expl": "20 minutes of flight based on maximum endurance at 10,000 feet MSL."}, {"q": "Special Instrument Card qualification requirements include:", "opts": ["2 years / 500 hours / 50 actual IFR", "5 years / 2000 hours / 100 hours actual instrument", "ATP only", "No experience requirements"], "ans": 1, "expl": "5 years flight experience, 2000 hours, 100 hours actual instrument time."}, {"q": "Standard Instrument Card precision-approach takeoff weather may not be less than:", "opts": ["300 - 1", "200 - 1/2", "1000 - 3", "500 - 1"], "ans": 1, "expl": "Precision: published but not less than 200-1/2; non-precision floor is 300-1."}, {"q": "Formation takeoff weather, if circling is not authorized, requires:", "opts": ["200 - 1/2", "300 - 1", "VFR 1000 - 3", "Special Instrument Card only"], "ans": 2, "expl": "≥ circling mins for runway in use, or VFR 1000-3 if circling not authorized/exists."}, {"q": "Diverse departure minimum climb gradient (unless higher published) is:", "opts": ["100 ft/nm", "200 ft/nm", "300 ft/nm", "500 ft/nm"], "ans": 1, "expl": "200 ft/nm until reaching a minimum IFR altitude (MEA/MSA etc.)."}, {"q": "On a diverse departure, fly runway heading until what height above field elevation before turning?", "opts": ["200 ft", "400 ft", "500 ft", "1000 ft"], "ans": 1, "expl": "Runway heading until 400 ft above field elevation."}, {"q": "Diverse departure requires that obstacles do not penetrate which surface?", "opts": ["20:1 glidepath", "34:1 OCS", "40:1 OIS", "50:1 TERPS surface"], "ans": 2, "expl": "No obstacles penetrate the 40:1 Obstacle Identification Surface (OIS)."}, {"q": "Non-standard takeoff weather minimums associated with ODPs:", "opts": ["Always apply to USN/USMC", "Do not apply to USN/USMC aircraft", "Replace CNAF fuel rules", "Are mandatory for all DOD aircraft"], "ans": 1, "expl": "Non-standard ODP wx mins do not apply to USN/USMC; often for see-and-avoid."}, {"q": "If “Cleared as filed” with no further instructions and an ODP exists for the runway, ATC expects:", "opts": ["A diverse departure", "The ODP for the runway used", "A VCOA automatically", "Immediate radar vectors only"], "ans": 1, "expl": "ODP is the default in absence of radar vectors or SID; one ODP per runway."}, {"q": "Primary purpose of a SID is to:", "opts": ["Replace ATIS", "Provide obstacle clearance protection for aircraft in IMC", "Cancel the flight plan", "Assign squawk codes only"], "ans": 1, "expl": "Primary: IMC obstacle clearance; secondary: efficiency/comms."}, {"q": "Filing example for Kingsville Three Departure with Corpus Christi transition is:", "opts": ["CHA7 CHA", "NQI3 CRP", "REQUEST RADAR DEPARTURE only", "LEMIG1 COT"], "ans": 1, "expl": "Pilot NAV SID: NQI3 CRP on DD-1801 route."}, {"q": "If vectored off a SID transition without “expect to resume SID,” the SID is:", "opts": ["Still fully in effect", "Considered cancelled", "Automatically reinstated at the next fix", "Converted to a VCOA"], "ans": 1, "expl": "SID cancelled unless controller says “expect to resume SID.”"}, {"q": "When ATC restates an altitude on a SID without saying restrictions remain in effect, you:", "opts": ["Must hold at the previous altitude", "May climb immediately but must still fly the SID ground track", "May abandon the SID lateral path", "Must request a new clearance to climb"], "ans": 1, "expl": "Climb immediately to restated altitude unless restrictions remain; still follow path-over-the-ground."}, {"q": "To file a radar departure on the DD-1801 you should:", "opts": ["Enter only the destination", "Enter DCT + first NAVAID/intersection and Remarks “REQUEST RADAR DEPARTURE”", "Leave Remarks blank", "File a STAR identifier in Remarks"], "ans": 1, "expl": "DCT + fix in route; Remarks REQUEST RADAR DEPARTURE."}, {"q": "VCOAs:", "opts": ["Have published SID identifiers you must file in the route", "Have no names or identifiers; state VCOA intent in Remarks", "Are cleared by name like “Cleared VCOA 3”", "Require Class A entry"], "ans": 1, "expl": "No identifier; file first route point; Remarks state intent to depart via VCOA."}, {"q": "Remarks string to request VFR Climb on Course is:", "opts": ["REQUEST RADAR DEPARTURE", "NO STAR", "REQUEST VFR CLIMB ON COURSE", "EXPECT TO RESUME SID"], "ans": 2, "expl": "RMK/REQUEST VFR CLIMB ON COURSE (to where you enter IFR enroute)."}, {"q": "A “DESCEND VIA” STAR clearance authorizes the pilot to:", "opts": ["Descend only when handed to Tower", "Navigate laterally and vertically per the procedure to meet published restrictions", "Cancel IFR immediately", "Ignore altitude crossing restrictions"], "ans": 1, "expl": "Descend via = lateral + vertical per published restrictions."}, {"q": "LEMIG ONE Cotulla Transition routes from COT VORTAC via which radial to LEMIG?", "opts": ["SAT R-175", "COT R-037", "COT R-175", "SAT R-037"], "ans": 1, "expl": "From over COT via COT R-037 to LEMIG INT; then SAT R-175 to ELKAY."}, {"q": "Absolute single-piloted fixed-wing approach weather minimums are:", "opts": ["300 ft / 1 SM", "200 ft HAT / 1/2 SM (2400 RVR)", "1000 - 3", "Circling mins only"], "ans": 1, "expl": "200 HAT and 1/2 SM / 2400 RVR absolute; T-45 uses 200-1/2 or published, whichever higher."}, {"q": "KNQI example: published DA 150 / HAT 100. Single-piloted adjusted DA is:", "opts": ["150", "200", "250", "350"], "ans": 2, "expl": "Add (200−100)=100 to DA 150 → single-piloted DA 250."}, {"q": "If destination weather goes below minimums after you have already commenced the approach, you may:", "opts": ["Never continue", "Continue to published minimums at your discretion", "Only continue if Special Instrument Card", "Must divert immediately without completing the approach"], "ans": 1, "expl": "May continue at pilot discretion if mins drop after commence."}, {"q": "Instrument approaches in IMC by formations of more than two aircraft:", "opts": ["Are always authorized", "Are not authorized (with or without intent to land); IMC→VMC penetration is authorized", "Require only 200-1/2", "Cancel the flight plan"], "ans": 1, "expl": "\u003e2 a/c IMC approaches not authorized; penetration of IMC to obtain VMC is OK."}, {"q": "Visual approach weather at the airport of intended landing requires:", "opts": ["1 SM only", "1000 & 3", "200 - 1/2", "Circling mins"], "ans": 1, "expl": "Visual approach requires 1000 & 3; field or preceding traffic in sight."}, {"q": "Who may request a contact approach?", "opts": ["Only ATC", "Only the pilot", "Either pilot or ATC", "Only Base Ops"], "ans": 1, "expl": "Contact approach: only the pilot may request."}, {"q": "Contact approach reported visibility requirement is:", "opts": ["3 SM", "1 mile", "1/2 SM / 2400 RVR", "1000 & 3"], "ans": 1, "expl": "Reported 1 mile visibility; remain clear of clouds; reasonable expectation to continue."}, {"q": "Which statement about visual vs contact approaches is correct?", "opts": ["Both have a published MAP", "Visual has no MAP; contact is an IAP with MAP", "Contact cancels IFR; visual does not", "Only ATC may request either"], "ans": 1, "expl": "Visual: IFR procedure in VMC, no MAP, does not cancel FP. Contact: is an IAP with MAP."}, {"q": "If visual reference is lost while circling, the initial turn should be:", "opts": ["Away from the airport to rejoin the FAC", "Toward the landing runway to remain in the obstruction clearance area", "Straight ahead only until MSA", "To the alternate immediately"], "ans": 1, "expl": "Immediate climb; initial turn toward landing runway; then to published missed approach course."}, {"q": "After radar vectors or DIRECT to an IAF, when may you descend?", "opts": ["Immediately upon approach clearance", "Once established on a segment of the published approach after approach clearance", "Only after FAF inbound", "Only when Tower clears you to land"], "ans": 1, "expl": "Maintain last assigned altitude until cleared for the approach and established on a published segment."}, {"q": "NORDO missed to alternate — squawk and DRAFT meaning:", "opts": ["7700; DRAFT is altitude only", "7600; DRAFT is route clearance but not altitude", "7600; DRAFT cancels IFR", "7500; DRAFT is both route and altitude"], "ans": 1, "expl": "Squawk 7600; DRAFT = route not altitude clearance."}, {"q": "If altimeter is less than 29.92 and you choose the high-altitude NORDO option to alternate, fly:", "opts": ["MSA only", "18,000 ft MSL", "FL 190", "10,000 ft MSL"], "ans": 2, "expl": "18,000 if altimeter ≥29.92; FL 190 if \u003c29.92 (any distance)."}, {"q": "A VDP is:", "opts": ["Mandatory glideslope for all NPAs", "An advisory point on the FAC for normal descent from MDA (~3° / 300 ft per NM)", "The same as DA", "Only used on PAR approaches"], "ans": 1, "expl": "Strictly advisory; normal 3° (~300 ft/NM) from MDA when MAP would preclude a normal descent."}, {"q": "VOR MON is designed to provide conventional navigation backup primarily when:", "opts": ["ATIS fails", "GPS/GNSS service is lost", "You lose UHF", "Holding at a Navy field"], "ans": 1, "expl": "MON backs up lost GPS/GNSS; CONUS coverage ≥5,000 AGL; rarely \u003e100 NM to a MON airport."}, {"q": "Navy closing of a flight plan at a military facility requires:", "opts": ["Silent automatic close only", "Verbal close with Tower or Base Ops", "Closing only with FSS on 122.2", "No close if you landed"], "ans": 1, "expl": "Verbal with Tower/Base Ops at military; FSS by any means at non-military."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= QUESTIONS.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
</html>
