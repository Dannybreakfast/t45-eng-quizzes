<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ENG0101 Introduction to T-45C — T-45 Quiz</title>

<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt span + span, #q-text { white-space: pre-line; }
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>

<div class="wrap">

      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>

  <div class="results" id="results">
    <div class="crumb">Introduction</div>

    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-eng.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to ENG</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="section-eng.html">← ENG</a> · <a href="index.html">Home</a></div>
</div>
<script>
const QUESTIONS = [{"q": "Maximum rated gross takeoff weight for carrier-based T-45 operations is", "opts": ["10,560 lb", "14,200 lb", "14,500 lb", "15,000 lb"], "ans": 1, "expl": "14,200 lb — Land-based max is 14,500 lb; carrier-based max is 14,200 lb. Empty weight is ≈ 10,560 lb."}, {"q": "Primary electrical power on the T-45 comes from", "opts": ["Two 115 VAC generators", "One 28 VDC generator", "Four 24 V batteries only", "A constant-speed drive alternator"], "ans": 1, "expl": "One 28 VDC generator — Backed by two 24 V / 18 Ah batteries; two AC inverters convert DC for AC loads."}, {"q": "Fifth-stage bleed air is used for all of the following EXCEPT", "opts": ["Engine anti-ice (fan spinner)", "OBOGS", "Wing leading-edge de-ice boots", "ECS and fuel-tank pressurization"], "ans": 2, "expl": "Wing leading-edge de-ice boots — Anti-ice from 5th-stage bleed is for the fan spinner only; bleed also feeds OBOGS, ECS, and fuel-tank pressurization."}, {"q": "Which statement about the hydraulic systems is correct?", "opts": ["Only HYD 2 powers flaps, slats, and landing gear", "System operating pressure is 3,000 psi; either system can power primary flight-control actuators", "The RAT is powered by HYD 1 during normal ops", "There is a single hydraulic pump for both systems"], "ans": 1, "expl": "Two identical engine-driven pumps at 3,000 psi; HYD 1 also runs general services; RAT is an emergency source for stabilator/ailerons."}, {"q": "Emergency landing-gear extension is accomplished by", "opts": ["HYD 2 pressure only", "Nitrogen accumulators driving the gear down", "Pulling the emergency gear handle and allowing gravity extension", "Battery power to electric actuators"], "ans": 2, "expl": "Normal gear uses HYD 1; emergency handle lowers gear by gravity."}, {"q": "In NAV master mode, the typical MFD setup is", "opts": ["Left HSI / right ADI", "Left ADI / right HSI", "Both MFDs display the HUD repeater", "Left weapons / right fuel"], "ans": 1, "expl": "Left ADI / right HSI — MFDs operate independently; that NAV-mode layout is the usual arrangement described."}, {"q": "During the strike phase, practice bombs carried are typically", "opts": ["Live Mk 82 500 lb bombs", "Mk 76 25 lb practice bombs simulating Mk 82s, often four per PMBR per side", "AIM-9 training rounds only", "Mk 84 2,000 lb inert bombs"], "ans": 1, "expl": "Mk 76 (25 lb) practice bombs simulate Mk 82s; PMBRs with four Mk 76s per side are the configuration discussed."}, {"q": "You can cancel the master alert light / tone / HUD W or C indicator by pressing the master alert light EXCEPT when the light is for", "opts": ["Generator failure", "HYD caution", "LOW or BINGO", "Any caution light"], "ans": 2, "expl": "LOW or BINGO — Those require selecting the reject option on the MFD; other master-alert indications can be canceled by pressing the master alert light."}, {"q": "What document is your primary reference for T-45 systems, limitations, restrictions, and procedures?", "opts": ["The T-22 NATOPS manual (operating limitations detailed in Chapter 4).", "The T-90 NATOPS manual (operating limitations detailed in Chapter 4).", "The T-45 NATOPS manual (operating limitations detailed in Chapter 4).", "The T-55 NATOPS manual (operating limitations detailed in Chapter 4)."], "ans": 2, "expl": "The T-45 NATOPS manual (operating limitations detailed in Chapter 4)."}, {"q": "What are the T-45 empty weight and max rated gross takeoff weights (land vs. carrier)?", "opts": ["Empty ≈ 21120 lb; max takeoff 14,500 lb land-based / 14,200 lb carrier-based.", "Empty ≈ 10,560 lb; max takeoff 14,500 lb land-based / 14,200 lb carrier-based.", "Empty ≈ 5280 lb; max takeoff 14,500 lb land-based / 14,200 lb carrier-based.", "Empty ≈ 10570 lb; max takeoff 14,500 lb land-based / 14,200 lb carrier-based."], "ans": 1, "expl": "Empty ≈ 10,560 lb; max takeoff 14,500 lb land-based / 14,200 lb carrier-based."}, {"q": "How much usable fuel does the T-45 carry (JP-5 vs. JP-8), and what is max G?", "opts": ["Mart and improve T/O/landing control; aft fuselage speed brakes (throttle-grip 3-position switch) for deceleration/speed control.", "Fuselage bladder + internal wet-wing tank; 438 gal total / 427 gal usable. Center wing section is a collector tank with a negative-G compartment and two electric boost pumps; tanks pressurized by 5th-stage bleed air."], "ans": 1, "expl": "Rolls-Royce medium-bypass turbofan, ≈ 5,527 lb thrust SL. 5th-stage bleed: engine anti-ice (fan spinner only), OBOGS, ECS, and fuel-tank pressurization."}, {"q": "Outline the T-45 fuel tank arrangement and usable capacity?", "opts": ["Removes nitrogen from engine bleed air (needs sufficient 5th-stage bleed + 28 VDC essential services bus or battery). Can generate up to ≈ 94% oxygen (vs. ~21% cabin air); concentration varies with altitude, bleed inl...", "Red warning or amber caution lights + flashing amber master alert light + audio tone; HUD shows “W” (warning) or “C” (caution)—warning takes precedence. Cancel via master alert light except LOW/BINGO (use MFD reject).", "All powered by HYD 1. Double-slotted TE flaps; 3-segment LE slats lower stall speed and improve T/O/landing control; aft fuselage speed brakes (throttle-grip 3-position switch) for deceleration/speed control.", "Fuselage bladder + internal wet-wing tank; 438 gal total / 427 gal usable. Center wing section is a collector tank with a negative-G compartment and two electric boost pumps; tanks pressurized by 5th-stage bleed air."], "ans": 3, "expl": "Fuselage bladder + internal wet-wing tank; 438 gal total / 427 gal usable. Center wing section is a collector tank with a negative-G compartment and two electric boost pumps; tanks pressurized by 5th-stage bleed air."}, {"q": "What does HYD 1 power vs. HYD 2, and what is the system pressure?", "opts": ["Red warning or amber caution lights + flashing amber master alert light + audio tone; HUD shows “W” (warning) or “C” (caution)—warning takes precedence. Cancel via master alert light except LOW/BINGO (use MFD reject).", "All powered by HYD 1. Double-slotted TE flaps; 3-segment LE slats lower stall speed and improve T/O/landing control; aft fuselage speed brakes (throttle-grip 3-position switch) for deceleration/speed control.", "Fuselage bladder + internal wet-wing tank; 438 gal total / 427 gal usable. Center wing section is a collector tank with a negative-G compartment and two electric boost pumps; tanks pressurized by 5th-stage bleed air.", "Both at 3,000 psi. HYD 1: ailerons/stabilator + general services (flaps, slats, speed brakes, gear, NWS, brakes, hook, launch bar). HYD 2: aileron/stabilator and interconnect with the RAT. Either system can power prim..."], "ans": 3, "expl": "Both at 3,000 psi. HYD 1: ailerons/stabilator + general services (flaps, slats, speed brakes, gear, NWS, brakes, hook, launch bar). HYD 2: aileron/stabilator and interconnect with the RAT. Either system can power primary flight-control actuators."}, {"q": "Where is the RAT, and what does it power in an emergency?", "opts": ["Martin-Baker NACES (Navy Aircrew Common Ejection Seat); safe escape from zero airspeed / zero altitude (zero-zero).", "System operating pressure is 3,000 psi; either system can power primary flight-control actuators", "≈ 2,904 lb JP-5 or ≈ 2,861 lb JP-8 usable; max G +7.3 / −3 (altitude and airspeed dependent).", "In a bay on top of the aft fuselage; emergency hydraulic power to the stabilator and ailerons."], "ans": 3, "expl": "In a bay on top of the aft fuselage; emergency hydraulic power to the stabilator and ailerons."}, {"q": "How do flaps, slats, and speed brakes help, and what powers them?", "opts": ["All powered by HYD 1. Double-slotted TE flaps; 3-segment LE slats lower stall speed and improve T/O/landing control; aft fuselage speed brakes (throttle-grip 3-position switch) for deceleration/speed control.", "Removes nitrogen from engine bleed air (needs sufficient 5th-stage bleed + 28 VDC essential services bus or battery). Can generate up to ≈ 94% oxygen (vs. ~21% cabin air); concentration varies with altitude, bleed inl...", "Red warning or amber caution lights + flashing amber master alert light + audio tone; HUD shows “W” (warning) or “C” (caution)—warning takes precedence. Cancel via master alert light except LOW/BINGO (use MFD reject).", "Fuselage bladder + internal wet-wing tank; 438 gal total / 427 gal usable. Center wing section is a collector tank with a negative-G compartment and two electric boost pumps; tanks pressurized by 5th-stage bleed air."], "ans": 0, "expl": "All powered by HYD 1. Double-slotted TE flaps; 3-segment LE slats lower stall speed and improve T/O/landing control; aft fuselage speed brakes (throttle-grip 3-position switch) for deceleration/speed control."}, {"q": "What ejection seat does the T-45 use, and what is its envelope?", "opts": ["System operating pressure is 3,000 psi; either system can power primary flight-control actuators", "Martin-Baker NACES (Navy Aircrew Common Ejection Seat); safe escape from zero airspeed / zero altitude (zero-zero).", "In a bay on top of the aft fuselage; emergency hydraulic power to the stabilator and ailerons.", "≈ 2,904 lb JP-5 or ≈ 2,861 lb JP-8 usable; max G +7.3 / −3 (altitude and airspeed dependent)."], "ans": 1, "expl": "Martin-Baker NACES (Navy Aircrew Common Ejection Seat); safe escape from zero airspeed / zero altitude (zero-zero)."}, {"q": "How does OBOGS work, and what concentration can it produce?", "opts": ["All powered by HYD 1. Double-slotted TE flaps; 3-segment LE slats lower stall speed and improve T/O/landing control; aft fuselage speed brakes (throttle-grip 3-position switch) for deceleration/speed control.", "Removes nitrogen from engine bleed air (needs sufficient 5th-stage bleed + 28 VDC essential services bus or battery). Can generate up to ≈ 94% oxygen (vs. ~21% cabin air); concentration varies with altitude, bleed inl...", "Red warning or amber caution lights + flashing amber master alert light + audio tone; HUD shows “W” (warning) or “C” (caution)—warning takes precedence. Cancel via master alert light except LOW/BINGO (use MFD reject).", "Fuselage bladder + internal wet-wing tank; 438 gal total / 427 gal usable. Center wing section is a collector tank with a negative-G compartment and two electric boost pumps; tanks pressurized by 5th-stage bleed air."], "ans": 1, "expl": "Removes nitrogen from engine bleed air (needs sufficient 5th-stage bleed + 28 VDC essential services bus or battery). Can generate up to ≈ 94% oxygen (vs. ~21% cabin air); concentration varies with altitude, bleed inlet pressure, and demand."}, {"q": "How are aircraft system failures annunciated in the cockpits?", "opts": ["Fuselage bladder + internal wet-wing tank; 438 gal total / 427 gal usable. Center wing section is a collector tank with a negative-G compartment and two electric boost pumps; tanks pressurized by 5th-stage bleed air.", "All powered by HYD 1. Double-slotted TE flaps; 3-segment LE slats lower stall speed and improve T/O/landing control; aft fuselage speed brakes (throttle-grip 3-position switch) for deceleration/speed control.", "Red warning or amber caution lights + flashing amber master alert light + audio tone; HUD shows “W” (warning) or “C” (caution)—warning takes precedence. Cancel via master alert light except LOW/BINGO (use MFD reject).", "Removes nitrogen from engine bleed air (needs sufficient 5th-stage bleed + 28 VDC essential services bus or battery). Can generate up to ≈ 94% oxygen (vs. ~21% cabin air); concentration varies with altitude, bleed inl..."], "ans": 2, "expl": "Red warning or amber caution lights + flashing amber master alert light + audio tone; HUD shows “W” (warning) or “C” (caution)—warning takes precedence. Cancel via master alert light except LOW/BINGO (use MFD reject)."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= queue.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
