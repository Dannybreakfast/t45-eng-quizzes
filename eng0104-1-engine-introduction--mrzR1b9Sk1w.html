<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<script src="auth.js"></script>
<title>ENG0104 (1) Engine Introduction — T-45 Quiz</title>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">Home</a> · <a href="section-eng.html">ENG</a> · Engine</div>
    <h1>ENG0104 (1) Engine Introduction</h1>
    <div class="meta">20 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 20</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Engine</div>
    <h2 style="margin:0.2rem 0">ENG0104 (1) Engine Introduction</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-eng.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to ENG</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="section-eng.html">← ENG</a> · <a href="index.html">Home</a></div>
</div>
<script>
const QUESTIONS = [{"q": "The T-45 is powered by which engine?", "opts": ["F404-GE-400", "F405-RR-401", "JT15D", "T700-GE-401"], "ans": 1, "expl": "Rolls-Royce F405-RR-401 turbofan."}, {"q": "Sea-level thrust rating cited in the lecture?", "opts": ["3,500 lb", "4,200 lb", "5,527 lb", "9,000 lb"], "ans": 2, "expl": "Rated to produce ~5,527 pounds of thrust at sea level."}, {"q": "N2 compressor stages?", "opts": ["2", "3", "5", "7"], "ans": 2, "expl": "Five-stage high-pressure compressor."}, {"q": "After total electrical failure, which RPM indication remains?", "opts": ["Digital N1 only", "Analog N2 tach (engine-driven)", "Neither N1 nor N2", "EPR only"], "ans": 1, "expl": "N2 tach is independent of the electrical system."}, {"q": "Bleed air is tapped from which compressor stage?", "opts": ["N1 1st stage", "N2 3rd stage", "N2 5th stage", "Turbine inlet"], "ans": 2, "expl": "Fifth stage of the high-pressure compressor."}, {"q": "GTS/ATS automatically shuts down near what N2?", "opts": ["20%", "45%", "61%", "70%"], "ans": 1, "expl": "About 45% N2 to protect the ATS clutch."}, {"q": "In manual fuel, what keeps the engine in limits?", "opts": ["ECA auto-trim only", "Throttle position only", "Sub-idle FCU only", "GTS scheduling"], "ans": 1, "expl": "Throttle is the only capability to keep engine within limits."}, {"q": "Oil system cockpit cue for low pressure?", "opts": ["Oil pressure gauge drop", "Oil pressure warning light", "TP HOT only", "EGT RPM warning"], "ans": 1, "expl": "No oil pressure gauge — warning light is first indication."}, {"q": "What engine powers the T-45?", "opts": ["Downstream of boost pumps and upstream of the GTS / engine-driven fuel pumps / FCU.", "N1: 2-stage LP compressor ~13,602 RPM at 100%. N2: 5-stage HP compressor ~15,512 RPM at 100%.", "Rolls-Royce F405-RR-401 medium-bypass turbofan; rated ~5,527 lb thrust at sea level.", "Exhaust mixer section, then through the tailpipe and fixed-geometry converging nozzle."], "ans": 2, "expl": "Rolls-Royce F405-RR-401 medium-bypass turbofan; rated ~5,527 lb thrust at sea level."}, {"q": "N1 vs N2 compressor makeup and ~100% RPM?", "opts": ["HYD pumps 1 & 2, DC generator, LP fuel pump, HP fuel pump, engine oil pumps (1 pressure + 3 scavenge).", "Rolls-Royce F405-RR-401 medium-bypass turbofan; rated ~5,527 lb thrust at sea level.", "N1: 2-stage LP compressor ~13,602 RPM at 100%. N2: 5-stage HP compressor ~15,512 RPM at 100%.", "Exhaust mixer section, then through the tailpipe and fixed-geometry converging nozzle."], "ans": 2, "expl": "N1: 2-stage LP compressor ~13,602 RPM at 100%. N2: 5-stage HP compressor ~15,512 RPM at 100%."}, {"q": "Overall engine compression ratio?", "opts": ["About 21.1:1 (N1 ~2.75:1 × N2 ~3.87:1).", "About 11.1:1 (N1 ~2.75:1 × N2 ~3.87:1).", "About 5.5:1 (N1 ~2.75:1 × N2 ~3.87:1).", "About 22.2:1 (N1 ~2.75:1 × N2 ~3.87:1)."], "ans": 1, "expl": "About 11.1:1 (N1 ~2.75:1 × N2 ~3.87:1)."}, {"q": "Where do the core and bypass streams mix?", "opts": ["Exhaust mixer section, then through the tailpipe and fixed-geometry converging nozzle.", "N1: 2-stage LP compressor ~13,602 RPM at 100%. N2: 5-stage HP compressor ~15,512 RPM at 100%.", "Downstream of boost pumps and upstream of the GTS / engine-driven fuel pumps / FCU.", "Rolls-Royce F405-RR-401 medium-bypass turbofan; rated ~5,527 lb thrust at sea level."], "ans": 0, "expl": "Exhaust mixer section, then through the tailpipe and fixed-geometry converging nozzle."}, {"q": "Does the N2 analog gauge work after total electrical failure?", "opts": ["No — the function is completely lost.", "No — only available on external power.", "Yes — engine-driven tach on N2/internal gearbox is independent of the electrical system.", "No — inhibited above 10,000 ft."], "ans": 2, "expl": "Yes — engine-driven tach on N2/internal gearbox is independent of the electrical system."}, {"q": "Combustion ignition basics?", "opts": ["5th stage of the HP compressor — engine anti-ice (fan spinner), OBOGS, anti-G, ECS, fuel tank pressurization.", "18 spray nozzles; two 12-joule DC igniter units; both operate for ground and air starts; controlled by ECA and start control unit.", "Normal: flow-scheduling with acceleration control. Manual: bypasses FCU — throttle position alone keeps engine within limits.", "GTS supplies compressed air to ATS on accessory gearbox; ATS drives N2 until ~45% N2 then auto shutdown; start valve inhibited above ~20% N2."], "ans": 1, "expl": "18 spray nozzles; two 12-joule DC igniter units; both operate for ground and air starts; controlled by ECA and start control unit."}, {"q": "What does the N2-driven accessory gearbox drive?", "opts": ["HYD pumps 1 & 2, DC generator, LP fuel pump, HP fuel pump, engine oil pumps (1 pressure + 3 scavenge).", "Exhaust mixer section, then through the tailpipe and fixed-geometry converging nozzle.", "N1: 2-stage LP compressor ~13,602 RPM at 100%. N2: 5-stage HP compressor ~15,512 RPM at 100%.", "5th stage of the HP compressor — engine anti-ice (fan spinner), OBOGS, anti-G, ECS, fuel tank pressurization."], "ans": 0, "expl": "HYD pumps 1 & 2, DC generator, LP fuel pump, HP fuel pump, engine oil pumps (1 pressure + 3 scavenge)."}, {"q": "Fuel control: normal vs manual?", "opts": ["Yes — available in the aft cockpit only.", "Yes — after selecting GAIN ORIDE.", "Yes — fully available with no limitations.", "Normal: flow-scheduling with acceleration control. Manual: bypasses FCU — throttle position alone keeps engine within limits."], "ans": 3, "expl": "Normal: flow-scheduling with acceleration control. Manual: bypasses FCU — throttle position alone keeps engine within limits."}, {"q": "First cockpit indication of oil pressure malfunction?", "opts": ["Rolls-Royce F405-RR-401 medium-bypass turbofan; rated ~5,527 lb thrust at sea level.", "Oil pressure warning light (no oil pressure gauge in the cockpit).", "Exhaust mixer section, then through the tailpipe and fixed-geometry converging nozzle.", "Downstream of boost pumps and upstream of the GTS / engine-driven fuel pumps / FCU."], "ans": 1, "expl": "Oil pressure warning light (no oil pressure gauge in the cockpit)."}, {"q": "GTS/ATS start sequence highlight?", "opts": ["GTS supplies compressed air to ATS on accessory gearbox; ATS drives N2 until ~45% N2 then auto shutdown; start valve inhibited above ~20% N2.", "Normal: flow-scheduling with acceleration control. Manual: bypasses FCU — throttle position alone keeps engine within limits.", "5th stage of the HP compressor — engine anti-ice (fan spinner), OBOGS, anti-G, ECS, fuel tank pressurization.", "18 spray nozzles; two 12-joule DC igniter units; both operate for ground and air starts; controlled by ECA and start control unit."], "ans": 0, "expl": "GTS supplies compressed air to ATS on accessory gearbox; ATS drives N2 until ~45% N2 then auto shutdown; start valve inhibited above ~20% N2."}, {"q": "Where is bleed air tapped and what uses it?", "opts": ["Exhaust mixer section, then through the tailpipe and fixed-geometry converging nozzle.", "5th stage of the HP compressor — engine anti-ice (fan spinner), OBOGS, anti-G, ECS, fuel tank pressurization.", "HYD pumps 1 & 2, DC generator, LP fuel pump, HP fuel pump, engine oil pumps (1 pressure + 3 scavenge).", "N1: 2-stage LP compressor ~13,602 RPM at 100%. N2: 5-stage HP compressor ~15,512 RPM at 100%."], "ans": 1, "expl": "5th stage of the HP compressor — engine anti-ice (fan spinner), OBOGS, anti-G, ECS, fuel tank pressurization."}, {"q": "Where is the fuel shutoff handle in the fuel path?", "opts": ["Downstream of boost pumps and upstream of the GTS / engine-driven fuel pumps / FCU.", "Exhaust mixer section, then through the tailpipe and fixed-geometry converging nozzle.", "N1: 2-stage LP compressor ~13,602 RPM at 100%. N2: 5-stage HP compressor ~15,512 RPM at 100%.", "Rolls-Royce F405-RR-401 medium-bypass turbofan; rated ~5,527 lb thrust at sea level."], "ans": 0, "expl": "Downstream of boost pumps and upstream of the GTS / engine-driven fuel pumps / FCU."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= QUESTIONS.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
</html>
