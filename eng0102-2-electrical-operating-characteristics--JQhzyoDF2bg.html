<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ENG0102 (2) Electrical Operating Characteristics — T-45 Quiz</title>

<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt span + span, #q-text { white-space: pre-line; }
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">

  <div id="quiz-ui">

      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>

  </div>

  <div class="results" id="results">
    <div class="crumb">Electrical</div>
    <h2 style="margin:0.2rem 0">ENG0102 (2) Electrical Operating Characteristics</h2>
    <div class="score" id="final-score"></div>

    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-eng.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to ENG</a>
    </div>
    <div class="review" id="review"></div>
  </div>

</div>
<script>
const QUESTIONS = [{"q": "Generator online / offline RPM (approx) on ground:", "opts": ["25% N2", "45% N2", "70% N2", "Idle only"], "ans": 1, "expl": "Online ~45% N2; drops offline at ~45% N2 to reduce loading."}, {"q": "After GEN warning, AC inverter caution:", "opts": ["Always comes on", "Does not illuminate while essential AC still powered", "Means batteries failed", "Means only 5 VAC bus failed"], "ans": 1, "expl": "Non-essential AC shed; essential AC continues from battery-powered inverters."}, {"q": "Best cue for dual (vs single) AC inverter failure:", "opts": ["Loss of ATTK/AZIMUTH", "Loss of ATTK/DME only", "F PRES light only", "Voltmeter reads 29 V"], "ans": 0, "expl": "ATTK/AZIMUTH on 26 VAC essential — lost only if both inverters fail."}, {"q": "If generator stays offline 30 seconds, expect:", "opts": ["Immediate total electrical failure", "Boost pumps shed → F PRES caution", "Inverters drop at 30 s exactly", "Hook retracts"], "ans": 1, "expl": "Boost pumps disconnected to conserve battery; F PRES caution."}, {"q": "Standby gyro after total electrical failure lasts about:", "opts": ["90 seconds", "2 minutes", "9 minutes", "27 minutes"], "ans": 2, "expl": "Lecture: ~9 minutes as gyros spin down (OFF flag in view)."}, {"q": "With total electrical failure and flaps up, plan for:", "opts": ["Normal flap landing", "No-flap landing (flaps/slats electrically actuated)", "Only half flaps", "Flaps free-fall down"], "ans": 1, "expl": "Covered more in ENG0103; operating characteristics stress total-failure equipment limits including electrically actuated surfaces."}, {"q": "Pressure refueling electrical power comes from:", "opts": ["Generator bus only", "Ground services bus via battery 1 when fuel doors open", "115 VAC non-essential only", "External AC cart only"], "ans": 1, "expl": "Fuel doors open → battery 1 powers refueling control panel."}, {"q": "After successful GEN reset following failure, you must still:", "opts": ["Reset CAUG", "Replace both batteries airborne", "Select external power", "Turn both inverters OFF"], "ans": 0, "expl": "Control augmentation must be reset after successful generator reset."}, {"q": "When is the ground services bus energized on deck?", "opts": ["Be careful modulating engine (loss of ECA → overtemp/overspeed risk); without power to igniters you cannot restart after flameout.", "When the fuel doors open, contact is made to battery 1 and battery power goes to the refueling control panel (electrical power required for pressure refueling).", "With AC inverter caution: loss of ATTK and AZIMUTH (26 VAC essential) indicates dual inverter failure. ATTK/DME remains DC-powered from essential services bus.", "Essential AC buses still function from inverters powered by the battery-fed essential services bus; non-essential AC is shed."], "ans": 1, "expl": "When the fuel doors open, contact is made to battery 1 and battery power goes to the refueling control panel (electrical power required for pressure refueling)."}, {"q": "When does the generator come online / drop offline on the ground?", "opts": ["Essential AC buses still function from inverters powered by the battery-fed essential services bus; non-essential AC is shed.", "Comes online around ~45% N2 on ground start; automatically drops offline if N2 decreases to ~45% to reduce engine loading.", "With AC inverter caution: loss of ATTK and AZIMUTH (26 VAC essential) indicates dual inverter failure. ATTK/DME remains DC-powered from essential services bus.", "Be careful modulating engine (loss of ECA → overtemp/overspeed risk); without power to igniters you cannot restart after flameout."], "ans": 1, "expl": "Comes online around ~45% N2 on ground start; automatically drops offline if N2 decreases to ~45% to reduce engine loading."}, {"q": "After a successful air start, what must you do with the generator?", "opts": ["Manually reset it (it is automatically de-energized during air start to reduce engine loads).", "Armament bus is no longer available for normal weapons release or emergency jettison.", "Does not illuminate while essential AC still powered", "Limited to GCA (PAR or ASR) due to loss of both essential and non-essential AC buses."], "ans": 0, "expl": "Manually reset it (it is automatically de-energized during air start to reduce engine loads)."}, {"q": "With a generator warning, what happens to the armament bus?", "opts": ["Armament bus is no longer available for normal weapons release or emergency jettison.", "Does not illuminate while essential AC still powered", "Manually reset it (it is automatically de-energized during air start to reduce engine loads).", "Limited to GCA (PAR or ASR) due to loss of both essential and non-essential AC buses."], "ans": 0, "expl": "Armament bus is no longer available for normal weapons release or emergency jettison."}, {"q": "Why does AC inverter caution NOT illuminate with GEN warning?", "opts": ["Be careful modulating engine (loss of ECA → overtemp/overspeed risk); without power to igniters you cannot restart after flameout.", "With AC inverter caution: loss of ATTK and AZIMUTH (26 VAC essential) indicates dual inverter failure. ATTK/DME remains DC-powered from essential services bus.", "Essential AC buses still function from inverters powered by the battery-fed essential services bus; non-essential AC is shed.", "Comes online around ~45% N2 on ground start; automatically drops offline if N2 decreases to ~45% to reduce engine loading."], "ans": 2, "expl": "Essential AC buses still function from inverters powered by the battery-fed essential services bus; non-essential AC is shed."}, {"q": "Why might CAUG (control augmentation) caution illuminate after GEN failure?", "opts": ["Yaw damper controller is lost with the 13 VAC non-essential bus.", "Yaw damper controller is lost with the 26 VAC non-essential bus.", "Yaw damper controller is lost with the 52 VAC non-essential bus.", "Yaw damper controller is lost with the 36 VAC non-essential bus."], "ans": 1, "expl": "Yaw damper controller is lost with the 26 VAC non-essential bus."}, {"q": "After successful generator reset, what must you still reset?", "opts": ["Reset CAUG", "Loss of ATTK/AZIMUTH", "Boost pumps shed → F PRES caution", "Control augmentation (CAUG)."], "ans": 3, "expl": "Control augmentation (CAUG)."}, {"q": "Fuel boost pumps after GEN not reset for 30 seconds?", "opts": ["Disconnect from essential services bus to save battery → F PRES caution and master alert/tone. After successful GEN reset, boost pump power restores automatically; cycling GEN OFF→RESET may clear a stuck F PRES.", "Standby airspeed/altitude/VSI (pitot-static), N2 tachometer, magnetic compass, standby gyro ~9 min (even with OFF flag), HYD 1/2 flight controls, emergency gear extension, hook extension, normal brakes without anti-skid.", "Aileron/rudder trim & standby stab trim (main stick stab trim still on essential), AUX radio/COM2, yaw damper, VOR/ILS control, HUD, right MFDs, anti-collision/landing/taxi lights, master arm / armament control bus.", "Warning/caution system, ATTK/azimuth (Gina), GTS/engine igniters, landing gear & flap control, fuel boost pumps (30 s rule), OBOGS, pitot heat, main stab trim, speed brake, NWS, left MFDs (2 min / display override), P..."], "ans": 0, "expl": "Disconnect from essential services bus to save battery → F PRES caution and master alert/tone. After successful GEN reset, boost pump power restores automatically; cycling GEN OFF→RESET may clear a stuck F PRES."}, {"q": "How do you tell single vs dual AC inverter failure?", "opts": ["Be careful modulating engine (loss of ECA → overtemp/overspeed risk); without power to igniters you cannot restart after flameout.", "Essential AC buses still function from inverters powered by the battery-fed essential services bus; non-essential AC is shed.", "When the fuel doors open, contact is made to battery 1 and battery power goes to the refueling control panel (electrical power required for pressure refueling).", "With AC inverter caution: loss of ATTK and AZIMUTH (26 VAC essential) indicates dual inverter failure. ATTK/DME remains DC-powered from essential services bus."], "ans": 3, "expl": "With AC inverter caution: loss of ATTK and AZIMUTH (26 VAC essential) indicates dual inverter failure. ATTK/DME remains DC-powered from essential services bus."}, {"q": "What is lost with a single AC inverter failure (examples)?", "opts": ["Yes — fully available with no limitations.", "Yes — available in the aft cockpit only.", "Non-essential AC buses shed: DU cooling fan, radar altimeter, VOR/ILS/marker beacon, formation lights, MIP/console lights, etc.", "Yes — after selecting GAIN ORIDE."], "ans": 2, "expl": "Non-essential AC buses shed: DU cooling fan, radar altimeter, VOR/ILS/marker beacon, formation lights, MIP/console lights, etc."}, {"q": "IMC / approach implication of dual AC inverter failure (per lecture)?", "opts": ["Armament bus is no longer available for normal weapons release or emergency jettison.", "Manually reset it (it is automatically de-energized during air start to reduce engine loads).", "Does not illuminate while essential AC still powered", "Limited to GCA (PAR or ASR) due to loss of both essential and non-essential AC buses."], "ans": 3, "expl": "Limited to GCA (PAR or ASR) due to loss of both essential and non-essential AC buses."}, {"q": "Total electrical failure — examples still available?", "opts": ["Aileron/rudder trim & standby stab trim (main stick stab trim still on essential), AUX radio/COM2, yaw damper, VOR/ILS control, HUD, right MFDs, anti-collision/landing/taxi lights, master arm / armament control bus.", "Standby airspeed/altitude/VSI (pitot-static), N2 tachometer, magnetic compass, standby gyro ~9 min (even with OFF flag), HYD 1/2 flight controls, emergency gear extension, hook extension, normal brakes without anti-skid.", "Warning/caution system, ATTK/azimuth (Gina), GTS/engine igniters, landing gear & flap control, fuel boost pumps (30 s rule), OBOGS, pitot heat, main stab trim, speed brake, NWS, left MFDs (2 min / display override), P...", "Disconnect from essential services bus to save battery → F PRES caution and master alert/tone. After successful GEN reset, boost pump power restores automatically; cycling GEN OFF→RESET may clear a stuck F PRES."], "ans": 1, "expl": "Standby airspeed/altitude/VSI (pitot-static), N2 tachometer, magnetic compass, standby gyro ~9 min (even with OFF flag), HYD 1/2 flight controls, emergency gear extension, hook extension, normal brakes without anti-skid."}, {"q": "Total electrical failure — cautions for engine?", "opts": ["Be careful modulating engine (loss of ECA → overtemp/overspeed risk); without power to igniters you cannot restart after flameout.", "Essential AC buses still function from inverters powered by the battery-fed essential services bus; non-essential AC is shed.", "Comes online around ~45% N2 on ground start; automatically drops offline if N2 decreases to ~45% to reduce engine loading.", "With AC inverter caution: loss of ATTK and AZIMUTH (26 VAC essential) indicates dual inverter failure. ATTK/DME remains DC-powered from essential services bus."], "ans": 0, "expl": "Be careful modulating engine (loss of ECA → overtemp/overspeed risk); without power to igniters you cannot restart after flameout."}, {"q": "Examples on 28 VDC essential services bus?", "opts": ["Standby airspeed/altitude/VSI (pitot-static), N2 tachometer, magnetic compass, standby gyro ~9 min (even with OFF flag), HYD 1/2 flight controls, emergency gear extension, hook extension, normal brakes without anti-skid.", "Disconnect from essential services bus to save battery → F PRES caution and master alert/tone. After successful GEN reset, boost pump power restores automatically; cycling GEN OFF→RESET may clear a stuck F PRES.", "Warning/caution system, ATTK/azimuth (Gina), GTS/engine igniters, landing gear & flap control, fuel boost pumps (30 s rule), OBOGS, pitot heat, main stab trim, speed brake, NWS, left MFDs (2 min / display override), P...", "Aileron/rudder trim & standby stab trim (main stick stab trim still on essential), AUX radio/COM2, yaw damper, VOR/ILS control, HUD, right MFDs, anti-collision/landing/taxi lights, master arm / armament control bus."], "ans": 2, "expl": "Warning/caution system, ATTK/azimuth (Gina), GTS/engine igniters, landing gear & flap control, fuel boost pumps (30 s rule), OBOGS, pitot heat, main stab trim, speed brake, NWS, left MFDs (2 min / display override), PRI/COM1."}, {"q": "Examples lost with loss of 28 VDC generator bus?", "opts": ["Aileron/rudder trim & standby stab trim (main stick stab trim still on essential), AUX radio/COM2, yaw damper, VOR/ILS control, HUD, right MFDs, anti-collision/landing/taxi lights, master arm / armament control bus.", "Standby airspeed/altitude/VSI (pitot-static), N2 tachometer, magnetic compass, standby gyro ~9 min (even with OFF flag), HYD 1/2 flight controls, emergency gear extension, hook extension, normal brakes without anti-skid.", "Warning/caution system, ATTK/azimuth (Gina), GTS/engine igniters, landing gear & flap control, fuel boost pumps (30 s rule), OBOGS, pitot heat, main stab trim, speed brake, NWS, left MFDs (2 min / display override), P...", "Disconnect from essential services bus to save battery → F PRES caution and master alert/tone. After successful GEN reset, boost pump power restores automatically; cycling GEN OFF→RESET may clear a stuck F PRES."], "ans": 0, "expl": "Aileron/rudder trim & standby stab trim (main stick stab trim still on essential), AUX radio/COM2, yaw damper, VOR/ILS control, HUD, right MFDs, anti-collision/landing/taxi lights, master arm / armament control bus."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= queue.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
