<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AERO 0102 High Speed Flight — T-45 Quiz</title>
<script src="auth.js"></script>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt span + span, #q-text { white-space: pre-line; }
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">Home</a> · <a href="section-aero.html">AERO</a> · Aerodynamics</div>
    <h1>AERO 0102 High Speed Flight</h1>
    <div class="meta">20 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 20</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Aerodynamics</div>
    <h2 style="margin:0.2rem 0">AERO 0102 High Speed Flight</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-aero.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to AERO</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="section-aero.html">← AERO</a> · <a href="index.html">Home</a></div>
</div>
<script>
const QUESTIONS = [{"q": "T-45 wing sweep is approximately:", "opts": ["10°", "23.7°", "35°", "45°"], "ans": 1, "expl": "23.7°."}, {"q": "T-45 area ruling:", "opts": ["Full Whitcomb area rule fuselage", "Partial area rule at wing root only", "Not area-ruled", "Area-ruled only above 0.9 M via inlets"], "ans": 2, "expl": "T-45 not area-ruled."}, {"q": "Heavy-wing phenomenon Mach band:", "opts": ["0.67–0.70", "0.80–0.84", "0.92–0.95", "1.2–1.3"], "ans": 2, "expl": "0.92–0.95 M."}, {"q": "Force-divergent Mach (T-45):", "opts": ["0.67", "0.80", "0.85", "1.04"], "ans": 2, "expl": "0.85."}, {"q": "T-45 rudder is:", "opts": ["Irreversible HYD like the stab", "Purely manual", "Fly-by-wire only", "Electric trim tab only"], "ans": 1, "expl": "Manual rudder."}, {"q": "Primary high-speed purpose of wing vortex generators:", "opts": ["Increase max Mach", "Reduce stab sensitivity / improve pitch stability via altered downwash", "Replace the rudder", "Enable afterburner"], "ans": 1, "expl": "Pitch stability / downwash."}, {"q": "Aileron reversal is caused by:", "opts": ["Hydraulic lock only", "Wing torsional flexibility so aileron twists LE down / opposite roll", "Mid-span vortex alone", "Gear-door blisters only"], "ans": 1, "expl": "Wing twist / opposite roll."}, {"q": "With heavy wing, aileron effectiveness is so poor you may need:", "opts": ["Trim only", "~¼ stick", "~¾ stick to pick up the wing", "No lateral stick ever"], "ans": 2, "expl": "~¾ stick."}, {"q": "T-45 wing sweep?", "opts": ["Ailerons/stabilator = **irreversible hydraulic**; rudder = **purely manual** (comparatively ineffective vs HYD rudders).", "Exceeding ~**4G** in the sensitive band / abrupt AC shift near **0.99** can overstress; pitch oscillations possible around **0.95+**.", "Small **triangular strip** on vertical surfaces pins shock attach point so shocks don’t walk → less rudder buzz in the feet and less flutter wear.", "**23.7°**. Sweep delays shocks (thinner effective t/c) but lowers CLmax and increases spanwise-flow / tip-stall tendency."], "ans": 3, "expl": "**23.7°**. Sweep delays shocks (thinner effective t/c) but lowers CLmax and increases spanwise-flow / tip-stall tendency."}, {"q": "Does the T-45 use area ruling?", "opts": ["Wing torsional flexibility so aileron twists LE down / opposite roll", "Reduce stab sensitivity / improve pitch stability via altered downwash", "**No.** Area rule (coke-bottle) reduces transonic interference drag (F-102A / F-105 examples); T-45 is not area-ruled.", "Ailerons/stabilator = **irreversible hydraulic**; rudder = **purely manual** (comparatively ineffective vs HYD rudders)."], "ans": 2, "expl": "**No.** Area rule (coke-bottle) reduces transonic interference drag (F-102A / F-105 examples); T-45 is not area-ruled."}, {"q": "Why stabilator instead of elevator for transonic pitch?", "opts": ["Elevator sits in **separated wake behind shocks** and goes ineffective (X-1 ~0.92 M). All-moving **stabilator** / trim-slab keeps pitch authority through the regime.", "Near-stall capability ~**260°/sec**; heavy-wing regime as low as ~**27°/sec**; typical supersonic reduced ~**120°/sec** (vs old jets that rolled ~720°/sec).", "At high q with flexible wing, aileron deflection **twists** the wing LE down → AOA/lift decrease on that wing → roll **opposite** to commanded aileron.", "**0.92–0.95 M**. Unequal wing shocks → lower CL on one side; ailerons ineffective in separated air — need ~**¾ stick** deflection; roll rate may drop to ~**27°/sec**."], "ans": 0, "expl": "Elevator sits in **separated wake behind shocks** and goes ineffective (X-1 ~0.92 M). All-moving **stabilator** / trim-slab keeps pitch authority through the regime."}, {"q": "T-45 high-speed Mach “cheat sheet”?", "opts": ["**0.92–0.95 M**. Unequal wing shocks → lower CL on one side; ailerons ineffective in separated air — need ~**¾ stick** deflection; roll rate may drop to ~**27°/sec**.", "Critical **0.8**; force divergence **0.85**; max level ~**0.83** (NATOPS 0.85); flight-test max **1.04**; mid-span sensitive **≥0.84**; heavy wing **0.92–0.95**; abrupt AC shift ~**0.99**.", "With irreversible HYD controls, pilot only moves valves/actuators; feel from **springs, viscous dampers, bobweights** (Phantom bellows example of feel system failure → overstress).", "Primary: generate vortex that lowers wing downwash on stab → **less pitch sensitivity / better pitch stability**. Also help keep tip boundary layer attached at high AOA (aileron effectiveness)."], "ans": 1, "expl": "Critical **0.8**; force divergence **0.85**; max level ~**0.83** (NATOPS 0.85); flight-test max **1.04**; mid-span sensitive **≥0.84**; heavy wing **0.92–0.95**; abrupt AC shift ~**0.99**."}, {"q": "Heavy-wing Mach band and handling?", "opts": ["Near-stall capability ~**260°/sec**; heavy-wing regime as low as ~**27°/sec**; typical supersonic reduced ~**120°/sec** (vs old jets that rolled ~720°/sec).", "With irreversible HYD controls, pilot only moves valves/actuators; feel from **springs, viscous dampers, bobweights** (Phantom bellows example of feel system failure → overstress).", "Elevator sits in **separated wake behind shocks** and goes ineffective (X-1 ~0.92 M). All-moving **stabilator** / trim-slab keeps pitch authority through the regime.", "**0.92–0.95 M**. Unequal wing shocks → lower CL on one side; ailerons ineffective in separated air — need ~**¾ stick** deflection; roll rate may drop to ~**27°/sec**."], "ans": 3, "expl": "**0.92–0.95 M**. Unequal wing shocks → lower CL on one side; ailerons ineffective in separated air — need ~**¾ stick** deflection; roll rate may drop to ~**27°/sec**."}, {"q": "Purpose of T-45 vortex generators (high-speed)?", "opts": ["Primary: generate vortex that lowers wing downwash on stab → **less pitch sensitivity / better pitch stability**. Also help keep tip boundary layer attached at high AOA (aileron effectiveness).", "**0.92–0.95 M**. Unequal wing shocks → lower CL on one side; ailerons ineffective in separated air — need ~**¾ stick** deflection; roll rate may drop to ~**27°/sec**.", "Critical **0.8**; force divergence **0.85**; max level ~**0.83** (NATOPS 0.85); flight-test max **1.04**; mid-span sensitive **≥0.84**; heavy wing **0.92–0.95**; abrupt AC shift ~**0.99**.", "With irreversible HYD controls, pilot only moves valves/actuators; feel from **springs, viscous dampers, bobweights** (Phantom bellows example of feel system failure → overstress)."], "ans": 0, "expl": "Primary: generate vortex that lowers wing downwash on stab → **less pitch sensitivity / better pitch stability**. Also help keep tip boundary layer attached at high AOA (aileron effectiveness)."}, {"q": "Rudder “buzz” fix on T-45?", "opts": ["Near-stall capability ~**260°/sec**; heavy-wing regime as low as ~**27°/sec**; typical supersonic reduced ~**120°/sec** (vs old jets that rolled ~720°/sec).", "At high q with flexible wing, aileron deflection **twists** the wing LE down → AOA/lift decrease on that wing → roll **opposite** to commanded aileron.", "Small **triangular strip** on vertical surfaces pins shock attach point so shocks don’t walk → less rudder buzz in the feet and less flutter wear.", "Exceeding ~**4G** in the sensitive band / abrupt AC shift near **0.99** can overstress; pitch oscillations possible around **0.95+**."], "ans": 2, "expl": "Small **triangular strip** on vertical surfaces pins shock attach point so shocks don’t walk → less rudder buzz in the feet and less flutter wear."}, {"q": "T-45 rudder actuation vs aileron/stab?", "opts": ["Exceeding ~**4G** in the sensitive band / abrupt AC shift near **0.99** can overstress; pitch oscillations possible around **0.95+**.", "Ailerons/stabilator = **irreversible hydraulic**; rudder = **purely manual** (comparatively ineffective vs HYD rudders).", "**23.7°**. Sweep delays shocks (thinner effective t/c) but lowers CLmax and increases spanwise-flow / tip-stall tendency.", "Small **triangular strip** on vertical surfaces pins shock attach point so shocks don’t walk → less rudder buzz in the feet and less flutter wear."], "ans": 1, "expl": "Ailerons/stabilator = **irreversible hydraulic**; rudder = **purely manual** (comparatively ineffective vs HYD rudders)."}, {"q": "What is aileron reversal?", "opts": ["Near-stall capability ~**260°/sec**; heavy-wing regime as low as ~**27°/sec**; typical supersonic reduced ~**120°/sec** (vs old jets that rolled ~720°/sec).", "Small **triangular strip** on vertical surfaces pins shock attach point so shocks don’t walk → less rudder buzz in the feet and less flutter wear.", "Elevator sits in **separated wake behind shocks** and goes ineffective (X-1 ~0.92 M). All-moving **stabilator** / trim-slab keeps pitch authority through the regime.", "At high q with flexible wing, aileron deflection **twists** the wing LE down → AOA/lift decrease on that wing → roll **opposite** to commanded aileron."], "ans": 3, "expl": "At high q with flexible wing, aileron deflection **twists** the wing LE down → AOA/lift decrease on that wing → roll **opposite** to commanded aileron."}, {"q": "Artificial feel — why needed?", "opts": ["Critical **0.8**; force divergence **0.85**; max level ~**0.83** (NATOPS 0.85); flight-test max **1.04**; mid-span sensitive **≥0.84**; heavy wing **0.92–0.95**; abrupt AC shift ~**0.99**.", "**0.92–0.95 M**. Unequal wing shocks → lower CL on one side; ailerons ineffective in separated air — need ~**¾ stick** deflection; roll rate may drop to ~**27°/sec**.", "With irreversible HYD controls, pilot only moves valves/actuators; feel from **springs, viscous dampers, bobweights** (Phantom bellows example of feel system failure → overstress).", "Primary: generate vortex that lowers wing downwash on stab → **less pitch sensitivity / better pitch stability**. Also help keep tip boundary layer attached at high AOA (aileron effectiveness)."], "ans": 2, "expl": "With irreversible HYD controls, pilot only moves valves/actuators; feel from **springs, viscous dampers, bobweights** (Phantom bellows example of feel system failure → overstress)."}, {"q": "Roll-rate numbers cited (near-stall vs heavy-wing vs supersonic)?", "opts": ["At high q with flexible wing, aileron deflection **twists** the wing LE down → AOA/lift decrease on that wing → roll **opposite** to commanded aileron.", "Elevator sits in **separated wake behind shocks** and goes ineffective (X-1 ~0.92 M). All-moving **stabilator** / trim-slab keeps pitch authority through the regime.", "**0.92–0.95 M**. Unequal wing shocks → lower CL on one side; ailerons ineffective in separated air — need ~**¾ stick** deflection; roll rate may drop to ~**27°/sec**.", "Near-stall capability ~**260°/sec**; heavy-wing regime as low as ~**27°/sec**; typical supersonic reduced ~**120°/sec** (vs old jets that rolled ~720°/sec)."], "ans": 3, "expl": "Near-stall capability ~**260°/sec**; heavy-wing regime as low as ~**27°/sec**; typical supersonic reduced ~**120°/sec** (vs old jets that rolled ~720°/sec)."}, {"q": "Dive pullout caution near mid-span / ~0.99 M?", "opts": ["Small **triangular strip** on vertical surfaces pins shock attach point so shocks don’t walk → less rudder buzz in the feet and less flutter wear.", "Exceeding ~**4G** in the sensitive band / abrupt AC shift near **0.99** can overstress; pitch oscillations possible around **0.95+**.", "**23.7°**. Sweep delays shocks (thinner effective t/c) but lowers CLmax and increases spanwise-flow / tip-stall tendency.", "Ailerons/stabilator = **irreversible hydraulic**; rudder = **purely manual** (comparatively ineffective vs HYD rudders)."], "ans": 1, "expl": "Exceeding ~**4G** in the sensitive band / abrupt AC shift near **0.99** can overstress; pitch oscillations possible around **0.95+**."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= queue.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
