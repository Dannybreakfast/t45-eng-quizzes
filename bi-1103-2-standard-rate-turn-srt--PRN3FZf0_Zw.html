<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>BI 1103 (2) Standard Rate Turn (SRT) — T-45 Quiz</title>
<script src="auth.js"></script>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt span + span, #q-text { white-space: pre-line; }
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">Home</a> · <a href="section-bi.html">BI</a> · Basic Instruments</div>
    <h1>BI 1103 (2) Standard Rate Turn (SRT)</h1>
    <div class="meta">27 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 27</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Basic Instruments</div>
    <h2 style="margin:0.2rem 0">BI 1103 (2) Standard Rate Turn (SRT)</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-bi.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to BI</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="section-bi.html">← BI</a> · <a href="index.html">Home</a></div>
</div>
<script>
const QUESTIONS = [{"q": "A standard rate turn is:", "opts": ["1.5°/sec", "3°/sec", "6°/sec", "10°/sec"], "ans": 1, "expl": "180° in 1 minute."}, {"q": "For SRT reference primarily:", "opts": ["ADI digital turn needle", "Standby turn needle", "Only GPS track", "Only VSI"], "ans": 1, "expl": "ADI digital not SRT-calibrated."}, {"q": "SRT rate and needle indication?", "opts": ["**1°/sec**; **two** needle-widths on standby turn needle.", "**6°/sec**; **two** needle-widths on standby turn needle.", "**13°/sec**; **two** needle-widths on standby turn needle.", "**3°/sec**; **two** needle-widths on standby turn needle."], "ans": 3, "expl": "**3°/sec**; **two** needle-widths on standby turn needle."}, {"q": "Why not ADI digital turn needle for SRT?", "opts": ["**3°/sec**; **two** needle-widths on standby turn needle.", "**30°** of heading every **10 seconds**; use clock.", "NATOPS treats it as **spin indicator** — not calibrated for SRT/½ SRT.", "About **3 seconds** before the timing mark."], "ans": 2, "expl": "NATOPS treats it as **spin indicator** — not calibrated for SRT/½ SRT."}, {"q": "SRT timing checkpoint?", "opts": ["**40°** of heading every **10 seconds**; use clock.", "**60°** of heading every **10 seconds**; use clock.", "**15°** of heading every **10 seconds**; use clock.", "**30°** of heading every **10 seconds**; use clock."], "ans": 3, "expl": "**30°** of heading every **10 seconds**; use clock."}, {"q": "Approx bank at 200 KT for SRT?", "opts": ["~**80°** AOB (~20% IAS).", "~**50°** AOB (~20% IAS).", "~**20°** AOB (~20% IAS).", "~**40°** AOB (~20% IAS)."], "ans": 3, "expl": "~**40°** AOB (~20% IAS)."}, {"q": "Lead time to start timed turn?", "opts": ["About **13 seconds** before the timing mark.", "About **1 seconds** before the timing mark.", "About **6 seconds** before the timing mark.", "About **3 seconds** before the timing mark."], "ans": 3, "expl": "About **3 seconds** before the timing mark."}, {"q": "Standard rate turn rate is:", "opts": ["2° per second", "3° per second", "6° per second", "1.5° per second"], "ans": 1, "expl": "SRT slide."}, {"q": "A standard rate turn is indicated by how many needle widths on the standby turn needle?", "opts": ["Half a needle width", "One needle width", "Three needle widths", "Two needle-width deflections"], "ans": 3, "expl": "SRT slide."}, {"q": "In a standard rate turn, how long to turn 180°? 360°?", "opts": ["2 minutes; 4 minutes", "1 minute; 2 minutes", "30 seconds; 1 minute", "1.5 minutes; 3 minutes"], "ans": 1, "expl": "SRT slide."}, {"q": "Rule of thumb for SRT bank angle:", "opts": ["About 10% of indicated airspeed", "Always 30°", "About 20% of indicated airspeed", "15% of TAS"], "ans": 2, "expl": "SRT slide."}, {"q": "SRT bank angle at 200 KIAS:", "opts": ["45° AOB", "40° AOB", "20° AOB", "30° AOB"], "ans": 1, "expl": "20% of 200 = 40°."}, {"q": "During a standard rate turn, expect how much heading change every 10 seconds?", "opts": ["15°", "30°", "45°", "60°"], "ans": 1, "expl": "SRT slide."}, {"q": "What lead is used to start the SRT on time?", "opts": ["1-second lead", "3-second lead", "10-second lead", "5-second lead"], "ans": 1, "expl": "Lecture: time is required to establish bank, so use a 3-second lead."}, {"q": "Why reference the standby turn needle rather than the digital turn needle below the ADI?", "opts": ["The digital needle only works with the HUD on", "NATOPS describes the digital needle as a spin indicator for out-of-control flight; it is not calibrated for SRT/½ SRT", "The standby needle reads in G", "The digital needle is inoperative in BI"], "ans": 1, "expl": "Lecture."}, {"q": "Besides the ADI and HSI, which two instruments do you add to the scan for an SRT?", "opts": ["Standby compass and cabin altimeter", "Fuel flow and EGT", "Standby turn needle and clock", "AOA and accelerometer"], "ans": 2, "expl": "Lecture."}, {"q": "SRT demo start conditions:", "opts": ["12,000 ft, level, heading 090, 200 knots", "10,000 ft, heading 270, 250 knots", "15,000 ft, heading 090, 150 knots", "12,000 ft, heading 360, 250 knots"], "ans": 0, "expl": "Lecture demo."}, {"q": "Level flight reference at 200 knots:", "opts": ["~7° nose up, ~900 pph", "~3° nose up, ~1400 pph", "~5° nose up, ~1100 pph", "~0°, ~1300 pph"], "ans": 2, "expl": "Lecture demo."}, {"q": "In the SRT demo (right turn from 090 starting at the 12 o'clock position), the first checkpoint was heading ___ at the ___ o'clock position.", "opts": ["150 at the 2 o'clock", "120 at the 2 o'clock position", "105 at the 1 o'clock", "120 at the 4 o'clock"], "ans": 1, "expl": "30° per 10 seconds; 10 seconds = 2 o'clock on the seconds hand."}, {"q": "SRT demo: heading 180 corresponds to which seconds-hand position?", "opts": ["9 o'clock", "6 o'clock (30 seconds)", "12 o'clock", "3 o'clock"], "ans": 1, "expl": "90° at 3°/sec = 30 sec."}, {"q": "SRT demo: after 180° of turn (090 → 270), the seconds hand should be at:", "opts": ["12 o'clock (1 minute)", "9 o'clock", "6 o'clock", "3 o'clock"], "ans": 0, "expl": "Final checkpoint 270 at the 12 o'clock position."}, {"q": "If you are behind on SRT checkpoints (heading change too slow), you should:", "opts": ["Increase angle of bank slightly", "Use rudder", "Add power only", "Decrease angle of bank"], "ans": 0, "expl": "Demo: not quite at 120 at 10 sec → increase AOB slightly."}, {"q": "If you reach a checkpoint heading early (ahead of the clock), you should:", "opts": ["Increase angle of bank", "Pull more back stick", "Reduce power", "Decrease angle of bank"], "ans": 3, "expl": "Demo: on 180 before the 6 o'clock position → decrease AOB."}, {"q": "A common SRT error noted in the demo was referencing:", "opts": ["The ground track marker, which lags in the turn", "The standby compass", "The lubber line", "The ADI heading bug"], "ans": 0, "expl": "Reference the lubber line (directly below the 40 nm scale on the HSI) or the ADI heading."}, {"q": "In the demo, the student reached the final heading of 270 how early?", "opts": ["3 seconds early", "11 seconds early", "6 seconds early", "On time"], "ans": 1, "expl": "Errors grew: 6 s early at 210, 8 s at 240, 11 s at 270 because AOB was not decreased."}, {"q": "How far is the SRT continued in the demo?", "opts": ["180°", "A full 360° of turn", "270°", "90°"], "ans": 1, "expl": "\"Continue this maneuver for a full 360 degrees of turn.\""}, {"q": "To maintain altitude and airspeed during the SRT you'll see:", "opts": ["A decrease in pitch and power", "A slight increase in pitch attitude and fuel flow", "Speed brakes out", "No change"], "ans": 1, "expl": "Lecture."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= queue.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
</html>
