<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ENG0109-10 Hydraulic System VBT — T-45 Quiz</title>
<script src="auth.js"></script>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt span + span, #q-text { white-space: pre-line; }
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">Home</a> · <a href="section-eng.html">ENG</a> · Hydraulic</div>
    <h1>ENG0109-10 Hydraulic System VBT</h1>
    <div class="meta">16 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 16</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Hydraulic</div>
    <h2 style="margin:0.2rem 0">ENG0109-10 Hydraulic System VBT</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-eng.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to ENG</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="section-eng.html">← ENG</a> · <a href="index.html">Home</a></div>
</div>
<script>
const QUESTIONS = [{"q": "HYD 1 is approximately how many times the size of HYD 2?", "opts": ["Equal", "2×", "3×", "10×"], "ans": 2, "expl": "PDF states HYD 1 is around 3 times the size of HYD 2."}, {"q": "Overpressure relief for both EDPs functions at:", "opts": ["3000 psi", "3300 psi", "3600 psi", "4000 psi"], "ans": 2, "expl": "3600 psi relief."}, {"q": "HYD FAIL requires RAT circuit below:", "opts": ["1500 psi", "1100 psi", "700 psi", "600 ± 50 psi"], "ans": 3, "expl": "RAT \u003c600±50 plus both EDPs low."}, {"q": "Hand pump can charge brake/flap accumulator up to about:", "opts": ["1500 psi", "2000 psi", "2800 psi", "3600 psi"], "ans": 2, "expl": "Up to 2800 psi for MX without engine/GSE."}, {"q": "T-45C hydraulic architecture in one sentence?", "opts": ["Two independent systems: HYD1 (FC fwd + General Services, larger) and HYD2 (FC aft + RAT emergency).", "1300±50 N2; ≥10 brake applications after emerg flap extension.", "3000 psi, 9.6 gpm variable displacement; 3600 psi relief; starboard aft gearbox.", "Both HYD1 and HYD2 EDP \u003c1660±110 and RAT circuit \u003c600±50."], "ans": 0, "expl": "Two independent systems: HYD1 (FC fwd + General Services, larger) and HYD2 (FC aft + RAT emergency)."}, {"q": "HYD 1 EDP specs?", "opts": ["Two independent systems: HYD1 (FC fwd + General Services, larger) and HYD2 (FC aft + RAT emergency).", "3000 psi, 9.6 gpm variable displacement; 3600 psi relief; starboard aft gearbox.", "Both HYD1 and HYD2 EDP \u003c1660±110 and RAT circuit \u003c600±50.", "1300±50 N2; ≥10 brake applications after emerg flap extension."], "ans": 1, "expl": "3000 psi, 9.6 gpm variable displacement; 3600 psi relief; starboard aft gearbox."}, {"q": "HYD 2 EDP specs?", "opts": ["6000 psi, 6 gpm; 3600 relief; port forward gearbox.", "3010 psi, 6 gpm; 3600 relief; port forward gearbox.", "3000 psi, 6 gpm; 3600 relief; port forward gearbox.", "1500 psi, 6 gpm; 3600 relief; port forward gearbox."], "ans": 2, "expl": "3000 psi, 6 gpm; 3600 relief; port forward gearbox."}, {"q": "Priority valve setpoint?", "opts": ["Isolates General Services below 3000 ± 100 psi.", "Isolates General Services below 1500 ± 100 psi.", "Isolates General Services below 1510 ± 100 psi.", "Isolates General Services below 750 ± 100 psi."], "ans": 1, "expl": "Isolates General Services below 1500 ± 100 psi."}, {"q": "HYD caution thresholds?", "opts": ["On below 1660 ± 110 psi; off above 2000 psi.", "On below 3320 ± 110 psi; off above 2000 psi.", "On below 830 ± 110 psi; off above 2000 psi.", "On below 1670 ± 110 psi; off above 2000 psi."], "ans": 0, "expl": "On below 1660 ± 110 psi; off above 2000 psi."}, {"q": "HYD FAIL thresholds?", "opts": ["Both HYD1 and HYD2 EDP \u003c1660±110 and RAT circuit \u003c600±50.", "Both HYD2 and HYD2 EDP \u003c1660±110 and RAT circuit \u003c600±50.", "Both HYD101 and HYD2 EDP \u003c1660±110 and RAT circuit \u003c600±50.", "Both HYD11 and HYD2 EDP \u003c1660±110 and RAT circuit \u003c600±50."], "ans": 0, "expl": "Both HYD1 and HYD2 EDP \u003c1660±110 and RAT circuit \u003c600±50."}, {"q": "Brake/flap accumulator precharge & capability?", "opts": ["1300±50 N2; ≥10 brake applications after emerg flap extension.", "2600±50 N2; ≥10 brake applications after emerg flap extension.", "1310±50 N2; ≥10 brake applications after emerg flap extension.", "650±50 N2; ≥10 brake applications after emerg flap extension."], "ans": 0, "expl": "1300±50 N2; ≥10 brake applications after emerg flap extension."}, {"q": "General Services list mnemonic?", "opts": ["On below 1660 ± 110 psi; off above 2000 psi.", "Rudder + power only; likely unrecoverable.", "HYD1 ~260–300 in³; HYD2 ~240–270 in³.", "How’s Life Been Navy? So Far So Good."], "ans": 3, "expl": "How’s Life Been Navy? So Far So Good."}, {"q": "RAT extend pressure / electrical need?", "opts": ["~1500 psi HYD2 EDP; no electrical power required.", "~3000 psi HYD2 EDP; no electrical power required.", "~750 psi HYD2 EDP; no electrical power required.", "~1510 psi HYD2 EDP; no electrical power required."], "ans": 0, "expl": "~1500 psi HYD2 EDP; no electrical power required."}, {"q": "HYD 2 bypass / reset N2?", "opts": ["Bypass open \u003c84% N2; reset ≥45% (normally 70% check).", "Bypass open \u003c52% N2; reset ≥45% (normally 70% check).", "Bypass open \u003c42% N2; reset ≥45% (normally 70% check).", "Bypass open \u003c21% N2; reset ≥45% (normally 70% check)."], "ans": 2, "expl": "Bypass open \u003c42% N2; reset ≥45% (normally 70% check)."}, {"q": "Typical reservoir quantities?", "opts": ["HYD2 ~260–300 in³; HYD2 ~240–270 in³.", "HYD101 ~260–300 in³; HYD2 ~240–270 in³.", "HYD1 ~260–300 in³; HYD2 ~240–270 in³.", "HYD11 ~260–300 in³; HYD2 ~240–270 in³."], "ans": 2, "expl": "HYD1 ~260–300 in³; HYD2 ~240–270 in³."}, {"q": "Dual hyd failure airborne?", "opts": ["Rudder + power only; likely unrecoverable.", "Isolates General Services below 1500 ± 100 psi.", "How’s Life Been Navy? So Far So Good.", "On below 1660 ± 110 psi; off above 2000 psi."], "ans": 0, "expl": "Rudder + power only; likely unrecoverable."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= queue.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
</html>
