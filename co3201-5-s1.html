<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CO3201 (5) S-1 Pattern — T-45 Quiz</title>

<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt span + span, #q-text { white-space: pre-line; }
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}

.figwrap{display:block}
.figpanel{display:none;background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:.4rem;margin-bottom:1rem}
.figpanel img{display:block;width:100%;height:auto;cursor:zoom-in}
.figpanel .cap{color:#222;font-size:.8rem;text-align:center;padding:.2rem}
body.hasfig .wrap{max-width:1350px}
body.hasfig .figpanel{display:block}
@media (min-width:900px){body.hasfig .figwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem;align-items:start}
body.hasfig .figpanel{position:sticky;top:.5rem;max-height:calc(100vh - 1rem);overflow:auto;order:2}}
@media (max-width:899px){body.hasfig .figpanel{position:sticky;top:0;z-index:5;max-height:42vh;overflow:auto}}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">Home</a> · <a href="section-co3201.html">CO3201</a> · CO3201 Instrument Procedures</div>
    <h1>CO3201 (5) S-1 Pattern</h1>
    <div class="meta">23 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div class="figwrap"><div class="figpanel" id="figpanel"><a id="figlink" target="_blank"><img id="figimg" alt=""/></a><div class="cap" id="figcap"></div></div><div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 23</span>
      <span id="score-live">Score: 0</span>

    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  </div>
  <div class="results" id="results">
    <div class="crumb">CO3201 Instrument Procedures</div>
    <h2 style="margin:0.2rem 0">CO3201 (5) S-1 Pattern</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-co3201.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to CO3201</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="section-co3201.html">← CO3201</a> · <a href="index.html">Home</a></div>
</div>
<script>

function showFig(q){const p=document.getElementById('figpanel');if(q&&q.fig){document.body.classList.add('hasfig');const im=document.getElementById('figimg');if(im.getAttribute('src')!==q.fig[0]){im.src=q.fig[0];im.alt=q.fig[1];}document.getElementById('figcap').textContent=q.fig[1]+' (tap to open full size)';}else{document.body.classList.remove('hasfig');}}
const QUESTIONS = [{"q": "S-1 pattern climb power setting:", "opts": ["MRT", "Approximately 1,000 pph", "Approximately 700 pph", "Approximately 1,500 pph"], "ans": 3, "expl": "Correct: Approximately 1,500 pph · Source: \"Power setting: Climb approximately 1,500 pph; Descent approximately 700 pph\"", "fig": ["img/co3201/s1-pattern.png", "Figure 3-1 S-1 Pattern"]}, {"q": "S-1 pattern descent power setting:", "opts": ["Flight IDLE", "Approximately 700 pph", "Approximately 300 pph", "Approximately 1,500 pph"], "ans": 1, "expl": "Correct: Approximately 700 pph · Source: \"Power setting: Climb approximately 1,500 pph; Descent approximately 700 pph\"", "fig": ["img/co3201/s1-pattern.png", "Figure 3-1 S-1 Pattern"]}, {"q": "S-1 pattern climb pitch:", "opts": ["10 degrees nose up", "1-2 degrees above level flight attitude", "5 degrees above level flight attitude", "2-3 degrees above level flight attitude"], "ans": 3, "expl": "Correct: 2-3 degrees above level flight attitude · Source: \"Pitch: Climb = 2-3 degrees above level flight attitude; Descent = 1-2 degrees below level flight attitude\"", "fig": ["img/co3201/s1-pattern.png", "Figure 3-1 S-1 Pattern"]}, {"q": "S-1 pattern descent pitch:", "opts": ["Approximately 10 degrees nose down", "1-2 degrees below level flight attitude", "2-3 degrees below level flight attitude", "5 degrees below level flight attitude"], "ans": 1, "expl": "Correct: 1-2 degrees below level flight attitude · Source: \"Pitch: Climb = 2-3 degrees above level flight attitude; Descent = 1-2 degrees below level flight attitude\"", "fig": ["img/co3201/s1-pattern.png", "Figure 3-1 S-1 Pattern"]}, {"q": "S-1 pattern clock cross-check:", "opts": ["100 ft every 6 seconds", "1,000 ft every 30 seconds", "500 ft every 30 seconds", "250 ft every 15 seconds"], "ans": 3, "expl": "Correct: 250 ft every 15 seconds · Source: \"Clock: Cross-check with altitude for 250 ft every 15 seconds\"", "fig": ["img/co3201/s1-pattern.png", "Figure 3-1 S-1 Pattern"]}, {"q": "S-1 pattern VSI:", "opts": ["Steady at 500 fpm", "Steady at 2,000 fpm", "Steady at 1,000 fpm", "4,000-6,000 fpm"], "ans": 2, "expl": "Correct: Steady at 1,000 fpm · Source: \"VSI: Steady at 1,000 fpm\"", "fig": ["img/co3201/s1-pattern.png", "Figure 3-1 S-1 Pattern"]}, {"q": "S-1 pattern airspeed and heading:", "opts": ["200 KIAS, 30-degree turns", "200 KIAS, heading held constant", "250 KIAS, heading held constant", "150 KIAS, heading held constant"], "ans": 1, "expl": "Correct: 200 KIAS, heading held constant · Source: \"Airspeed: 200 KIAS Heading: Hold constant\"", "fig": ["img/co3201/s1-pattern.png", "Figure 3-1 S-1 Pattern"]}, {"q": "How is the S-1 pattern initiated?", "opts": ["At 200 KIAS, lower the nose 10 degrees", "At 250 KIAS, reduce to idle and extend speed brakes", "At 200 KIAS, reduce power to ~700 pph and lower the nose ~1-2 degrees", "At 200 KIAS, advance to 1,500 pph and raise the nose 2-3 degrees"], "ans": 2, "expl": "Correct: At 200 KIAS, reduce power to ~700 pph and lower the nose ~1-2 degrees · Source: \"Initiate the maneuver at an airspeed of 200 KIAS by reducing power to approximately 700 pph and lowering the nose approximately 1-2 degrees, 3 seconds before the second hand reaches the 12 o'clock position on the clock.\"", "fig": ["img/co3201/s1-pattern.png", "Figure 3-1 S-1 Pattern"]}, {"q": "S-1 pattern is initiated how long before the second hand reaches 12 o'clock?", "opts": ["5 seconds", "1 second", "10 seconds", "3 seconds"], "ans": 3, "expl": "Correct: 3 seconds · Source: \"...3 seconds before the second hand reaches the 12 o'clock position on the clock.\"", "fig": ["img/co3201/s1-pattern.png", "Figure 3-1 S-1 Pattern"]}, {"q": "S-1 sequence:", "opts": ["Descend 1,000 fpm for 1,000 ft, then climb 1,000 fpm for 1,000 ft", "Descend 1,000 fpm for 500 ft, then climb", "Descend 500 fpm for 1,000 ft, then climb", "Climb first, then descend"], "ans": 0, "expl": "Correct: Descend 1,000 fpm for 1,000 ft, then climb 1,000 fpm for 1,000 ft · Source: \"Descend at 1,000 fpm for 1,000 ft and then climb at 1,000 fpm for 1,000 ft.\"", "fig": ["img/co3201/s1-pattern.png", "Figure 3-1 S-1 Pattern"]}, {"q": "S-1: when do you start the transition from descent to climb (and back)?", "opts": ["At the target altitude", "10% of VSI prior", "100 ft or 3 seconds (whichever occurs first) prior to the end of a climb or descent", "50 ft or 5 seconds, whichever occurs last"], "ans": 2, "expl": "Correct: 100 ft or 3 seconds (whichever occurs first) prior to the end of a climb or descent · Source: \"...start your transition 100 ft or 3 seconds (whichever occurs first) prior to the end of a climb or descent.\"", "fig": ["img/co3201/s1-pattern.png", "Figure 3-1 S-1 Pattern"]}, {"q": "S-1 total altitude change for each descent and each climb:", "opts": ["250 ft", "500 ft", "1,000 ft", "2,000 ft"], "ans": 2, "expl": "Correct: 1,000 ft · Source: \"Descend at 1,000 fpm for 1,000 ft and then climb at 1,000 fpm for 1,000 ft.\"", "fig": ["img/co3201/s1-pattern.png", "Figure 3-1 S-1 Pattern"]}, {"q": "Figure 3-1: how long does each maneuver (the descent, the climb) last?", "opts": ["1 minute", "30 seconds", "15 seconds", "2 minutes"], "ans": 0, "expl": "Correct: 1 minute · Source: \"S-1 Pattern. The S-1 pattern consists of a 1,000-fpm descent for 1,000 ft followed by a 1,000-fpm climb for 1,000 ft (each maneuver lasting 1 minute in duration). This descent/climb sequence is performed a minimum of two times (Figure 3-1). Fly the entire maneuver on a constant heading and at a constant airspeed of 200 KIAS.\"", "fig": ["img/co3201/s1-pattern.png", "Figure 3-1 S-1 Pattern"]}, {"q": "Figure 3-1: the S-1 descent/climb sequence is performed:", "opts": ["A minimum of two times", "A minimum of three times", "A maximum of two times", "Exactly once"], "ans": 0, "expl": "Correct: A minimum of two times · Source: \"S-1 Pattern. The S-1 pattern consists of a 1,000-fpm descent for 1,000 ft followed by a 1,000-fpm climb for 1,000 ft (each maneuver lasting 1 minute in duration). This descent/climb sequence is performed a minimum of two times (Figure 3-1). Fly the entire maneuver on a constant heading and at a constant airspeed of 200 KIAS.\"", "fig": ["img/co3201/s1-pattern.png", "Figure 3-1 S-1 Pattern"]}, {"q": "Figure 3-1: the entire S-1 maneuver is flown on:", "opts": ["A constant heading at 250 KIAS", "A constant heading at optimum AOA", "A constant heading and at a constant airspeed of 200 KIAS", "Alternating headings at 200 KIAS"], "ans": 2, "expl": "Correct: A constant heading and at a constant airspeed of 200 KIAS · Source: \"S-1 Pattern. The S-1 pattern consists of a 1,000-fpm descent for 1,000 ft followed by a 1,000-fpm climb for 1,000 ft (each maneuver lasting 1 minute in duration). This descent/climb sequence is performed a minimum of two times (Figure 3-1). Fly the entire maneuver on a constant heading and at a constant airspeed of 200 KIAS.\"", "fig": ["img/co3201/s1-pattern.png", "Figure 3-1 S-1 Pattern"]}, {"q": "Figure 3-1: the S-1 pattern consists of:", "opts": ["A 500-fpm descent for 1,000 ft followed by a 500-fpm climb", "A 1,000-fpm descent for 1,000 ft followed by a 1,000-fpm climb for 1,000 ft", "A 1,000-fpm climb for 1,000 ft followed by a 1,000-fpm descent", "A 1,000-fpm descent for 500 ft followed by a 1,000-fpm climb for 500 ft"], "ans": 1, "expl": "Correct: A 1,000-fpm descent for 1,000 ft followed by a 1,000-fpm climb for 1,000 ft · Source: \"S-1 Pattern. The S-1 pattern consists of a 1,000-fpm descent for 1,000 ft followed by a 1,000-fpm climb for 1,000 ft (each maneuver lasting 1 minute in duration). This descent/climb sequence is performed a minimum of two times (Figure 3-1). Fly the entire maneuver on a constant heading and at a constant airspeed of 200 KIAS.\"", "fig": ["img/co3201/s1-pattern.png", "Figure 3-1 S-1 Pattern"]}, {"q": "Figure 3-1: transition at the top into each descent (in order):", "opts": ["1. Lower nose 2. Reduce RPM 3. Maintain 200 KIAS", "1. Reduce RPM 2. Lower nose 3. Maintain 200 KIAS", "1. Throttle to climb power 2. Raise nose 3. Maintain 200 KIAS", "1. Reduce RPM to level flight setting 2. Lower nose to level flight"], "ans": 1, "expl": "Correct: 1. Reduce RPM 2. Lower nose 3. Maintain 200 KIAS · Source: \"Figure 3-1 (diagram): Transition — 1. Reduce RPM 2. Lower nose 3. Maintain 200 KIAS\"", "fig": ["img/co3201/s1-pattern.png", "Figure 3-1 S-1 Pattern"]}, {"q": "Figure 3-1: transition at the bottom into each climb (in order):", "opts": ["1. Raise nose 2. Throttle to climb power 3. Maintain 200 KIAS", "1. Throttle to MRT 2. Raise nose 3. Maintain 250 KIAS", "1. Reduce RPM 2. Lower nose 3. Maintain 200 KIAS", "1. Throttle to climb power 2. Raise nose 3. Maintain 200 KIAS"], "ans": 3, "expl": "Correct: 1. Throttle to climb power 2. Raise nose 3. Maintain 200 KIAS · Source: \"Figure 3-1 (diagram): Transition — 1. Throttle to climb power 2. Raise nose 3. Maintain 200 KIAS\"", "fig": ["img/co3201/s1-pattern.png", "Figure 3-1 S-1 Pattern"]}, {"q": "Figure 3-1: the final transition at the top (end of the maneuver):", "opts": ["1. Throttle to climb power 2. Raise nose", "1. Throttle to MRT 2. Raise nose to level flight", "1. Reduce RPM to level flight setting 2. Lower nose to level flight", "1. Reduce RPM 2. Lower nose 3. Maintain 200 KIAS"], "ans": 2, "expl": "Correct: 1. Reduce RPM to level flight setting 2. Lower nose to level flight · Source: \"Figure 3-1 (diagram): Transition — 1. Reduce RPM to level flight setting 2. Lower nose to level flight\"", "fig": ["img/co3201/s1-pattern.png", "Figure 3-1 S-1 Pattern"]}, {"q": "Figure 3-1: first step of the transition into a descent:", "opts": ["Reduce RPM", "Lower nose", "Throttle to climb power", "Maintain 200 KIAS"], "ans": 0, "expl": "Correct: Reduce RPM · Source: \"Figure 3-1 (diagram): Transition — 1. Reduce RPM 2. Lower nose 3. Maintain 200 KIAS\"", "fig": ["img/co3201/s1-pattern.png", "Figure 3-1 S-1 Pattern"]}, {"q": "Figure 3-1: first step of the transition into a climb:", "opts": ["Throttle to climb power", "Maintain 200 KIAS", "Raise nose", "Reduce RPM"], "ans": 0, "expl": "Correct: Throttle to climb power · Source: \"Figure 3-1 (diagram): Transition — 1. Throttle to climb power 2. Raise nose 3. Maintain 200 KIAS\"", "fig": ["img/co3201/s1-pattern.png", "Figure 3-1 S-1 Pattern"]}, {"q": "Figure 3-1: the bottom transitions are started:", "opts": ["50 ft or 5 sec prior to the 12", "200 ft or 6 sec prior to the 12", "100 ft or 3 sec prior to the 12", "At the 12"], "ans": 2, "expl": "Correct: 100 ft or 3 sec prior to the 12 · Source: \"Figure 3-1 (diagram): 100 ft or 3 sec prior to the 12\"", "fig": ["img/co3201/s1-pattern.png", "Figure 3-1 S-1 Pattern"]}, {"q": "Figure 3-1: what altitude mark is shown on the climbs?", "opts": ["100 ft", "500 ft", "1000 ft", "900 ft"], "ans": 3, "expl": "Correct: 900 ft · Source: \"Figure 3-1 (diagram): 900 ft (marked on the climbs)\"", "fig": ["img/co3201/s1-pattern.png", "Figure 3-1 S-1 Pattern"]}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q; showFig(q); if(q.fig) document.getElementById("figlink").href=q.fig[0];
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= queue.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
