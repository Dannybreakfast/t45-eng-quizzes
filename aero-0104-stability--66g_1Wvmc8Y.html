<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AERO 0104 Stability — T-45 Quiz</title>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">Home</a> · <a href="section-aero.html">AERO</a> · Aerodynamics</div>
    <h1>AERO 0104 Stability</h1>
    <div class="meta">20 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 20</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Aerodynamics</div>
    <h2 style="margin:0.2rem 0">AERO 0104 Stability</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-aero.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to AERO</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="section-aero.html">← AERO</a> · <a href="index.html">Home</a></div>
</div>

g directional; **high speed**; needs **asymmetric stores**; slow bank increase (~**25 sec** per doubling); hands-off; simple to correct — rare in training.", "AOA is **gross-weight independent**; sets proper attitude / hook-to-eye for wire; keeps aircraft in **positive-command** region (not backside of power curve).", "Upper fuselage tank near CG → little change; as wing fuel dominates, CG moves **aft** then **forward** with remaining wing fuel (~**3%** total swing, within limits)."], "ans": 3, "expl": "Upper fuselage tank near CG → little change; as wing fuel dominates, CG moves **aft** then **forward** with remaining wing fuel (~**3%** total swing, within limits)."}, {"q": "Speed-brake pitch effects and SBI?", "opts": ["Flaps shift AC slightly **forward** (~1% / 3.5 in); gear extension moves CG **aft** → shorter CG–AC arm — more pleasant in landing pattern, not objectionably unstable.", "T-6 weathervanes into wind; swept T-45 tends to weathervane **away** (upwind wing more “straight,” more lift; downwind more swept, less lift → downwind main-gear drag yaws nose out). NWS/CAUG helps.", "Weak roll vs strong directional; **high speed**; needs **asymmetric stores**; slow bank increase (~**25 sec** per doubling); hands-off; simple to correct — rare in training.", "**0.2–0.7 IMN:** nose wants **up** with SB out. **\u003e0.7:** nose wants **down**. **SBI** moves stab to cancel; lost with generator failure (noticeable in formation if one jet lacks SBI)."], "ans": 3, "expl": "**0.2–0.7 IMN:** nose wants **up** with SB out. **\u003e0.7:** nose wants **down**. **SBI** moves stab to cancel; lost with generator failure (noticeable in formation if one jet lacks SBI)."}, {"q": "Flap / gear effect on static margin (qualitative)?", "opts": ["Weak roll vs strong directional; **high speed**; needs **asymmetric stores**; slow bank increase (~**25 sec** per doubling); hands-off; simple to correct — rare in training.", "Upper fuselage tank near CG → little change; as wing fuel dominates, CG moves **aft** then **forward** with remaining wing fuel (~**3%** total swing, within limits).", "Flaps shift AC slightly **forward** (~1% / 3.5 in); gear extension moves CG **aft** → shorter CG–AC arm — more pleasant in landing pattern, not objectionably unstable.", "AOA is **gross-weight independent**; sets proper attitude / hook-to-eye for wire; keeps aircraft in **positive-command** region (not backside of power curve)."], "ans": 2, "expl": "Flaps shift AC slightly **forward** (~1% / 3.5 in); gear extension moves CG **aft** → shorter CG–AC arm — more pleasant in landing pattern, not objectionably unstable."}, {"q": "Dutch roll — cause, speed, when felt?", "opts": ["**CG forward of aerodynamic center**; stab provides balancing download/upload. Larger CG–AC separation → more stable, less pitch maneuverable.", "AOA is **gross-weight independent**; sets proper attitude / hook-to-eye for wire; keeps aircraft in **positive-command** region (not backside of power curve).", "Weak **directional** vs stronger **roll** stability; **below 217 kt**; with yaw damper / CAUG loss, GEN fail, or total electrical failure.", "Limit **360°** bank-angle change with max aileron — distributed mass above/below flight path creates centrifugal coupling if you keep rolling."], "ans": 2, "expl": "Weak **directional** vs stronger **roll** stability; **below 217 kt**; with yaw damper / CAUG loss, GEN fail, or total electrical failure."}, {"q": "Spiral divergence on T-45?", "opts": ["**0.2–0.7 IMN:** nose wants **up** with SB out. **\u003e0.7:** nose wants **down**. **SBI** moves stab to cancel; lost with generator failure (noticeable in formation if one jet lacks SBI).", "Flaps shift AC slightly **forward** (~1% / 3.5 in); gear extension moves CG **aft** → shorter CG–AC arm — more pleasant in landing pattern, not objectionably unstable.", "Upper fuselage tank near CG → little change; as wing fuel dominates, CG moves **aft** then **forward** with remaining wing fuel (~**3%** total swing, within limits).", "Weak roll vs strong directional; **high speed**; needs **asymmetric stores**; slow bank increase (~**25 sec** per doubling); hands-off; simple to correct — rare in training."], "ans": 3, "expl": "Weak roll vs strong directional; **high speed**; needs **asymmetric stores**; slow bank increase (~**25 sec** per doubling); hands-off; simple to correct — rare in training."}, {"q": "Roll-coupling / bank-change limit?", "opts": ["Limit **360°** bank-angle change with max aileron — distributed mass above/below flight path creates centrifugal coupling if you keep rolling.", "AOA is **gross-weight independent**; sets proper attitude / hook-to-eye for wire; keeps aircraft in **positive-command** region (not backside of power curve).", "**CG forward of aerodynamic center**; stab provides balancing download/upload. Larger CG–AC separation → more stable, less pitch maneuverable.", "Weak **directional** vs stronger **roll** stability; **below 217 kt**; with yaw damper / CAUG loss, GEN fail, or total electrical failure."], "ans": 0, "expl": "Limit **360°** bank-angle change with max aileron — distributed mass above/below flight path creates centrifugal coupling if you keep rolling."}, {"q": "T-45 vs T-6 weathercock on deck?", "opts": ["Emer ext: nose-gear forward doors normally closed by electric motor; **inner main doors stay open** → slight directional-stability hit. Total electrical failure: nose doors won’t close → less directional stability.", "Weak roll vs strong directional; **high speed**; needs **asymmetric stores**; slow bank increase (~**25 sec** per doubling); hands-off; simple to correct — rare in training.", "**0.2–0.7 IMN:** nose wants **up** with SB out. **\u003e0.7:** nose wants **down**. **SBI** moves stab to cancel; lost with generator failure (noticeable in formation if one jet lacks SBI).", "T-6 weathervanes into wind; swept T-45 tends to weathervane **away** (upwind wing more “straight,” more lift; downwind more swept, less lift → downwind main-gear drag yaws nose out). NWS/CAUG helps."], "ans": 3, "expl": "T-6 weathervanes into wind; swept T-45 tends to weathervane **away** (upwind wing more “straight,” more lift; downwind more swept, less lift → downwind main-gear drag yaws nose out). NWS/CAUG helps."}, {"q": "Emergency gear extension / doors and directional stability?", "opts": ["**0.2–0.7 IMN:** nose wants **up** with SB out. **\u003e0.7:** nose wants **down**. **SBI** moves stab to cancel; lost with generator failure (noticeable in formation if one jet lacks SBI).", "T-6 weathervanes into wind; swept T-45 tends to weathervane **away** (upwind wing more “straight,” more lift; downwind more swept, less lift → downwind main-gear drag yaws nose out). NWS/CAUG helps.", "Weak roll vs strong directional; **high speed**; needs **asymmetric stores**; slow bank increase (~**25 sec** per doubling); hands-off; simple to correct — rare in training.", "Emer ext: nose-gear forward doors normally closed by electric motor; **inner main doors stay open** → slight directional-stability hit. Total electrical failure: nose doors won’t close → less directional stability."], "ans": 3, "expl": "Emer ext: nose-gear forward doors normally closed by electric motor; **inner main doors stay open** → slight directional-stability hit. Total electrical failure: nose doors won’t close → less directional stability."}, {"q": "What drives both AOA indexers and approach lights?", "opts": ["Ahead of the aerodynamic center", "Asymmetric stores (high speed)", "Independent of gross weight", "Front-cockpit **AOA indicator**."], "ans": 3, "expl": "Front-cockpit **AOA indicator**."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= QUESTIONS.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
