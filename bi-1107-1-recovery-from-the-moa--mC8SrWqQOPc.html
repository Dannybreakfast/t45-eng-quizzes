<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>BI 1107 (1) Recovery from the MOA — T-45 Quiz</title>
<script src="auth.js"></script>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt span + span, #q-text { white-space: pre-line; }
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">Home</a> · <a href="section-bi.html">BI</a> · Basic Instruments</div>
    <h1>BI 1107 (1) Recovery from the MOA</h1>
    <div class="meta">51 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 51</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Basic Instruments</div>
    <h2 style="margin:0.2rem 0">BI 1107 (1) Recovery from the MOA</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-bi.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to BI</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="section-bi.html">← BI</a> · <a href="index.html">Home</a></div>
</div>
<script>
const QUESTIONS = [{"q": "Before GCA box after in/out descent, slow to:", "opts": ["250 KT", "200 KT", "150 KT", "On-speed"], "ans": 1, "expl": "After leveling at MVA."}, {"q": "Platform is reported at about:", "opts": ["10,000'", "5,000'", "1,000'", "Pattern altitude only"], "ans": 1, "expl": "ICS call; reset RA/SB/pitch."}, {"q": "Lead radials equal:", "opts": ["DME only", "(60/DME)×(0.01×GS)", "Fixed 10", "IAS×2"], "ans": 1, "expl": "Use ground speed."}, {"q": "Two primary MOA recovery methods?", "opts": ["**Fuel efficiency** vs long idle descent, then multiple low approaches in GCA box.", "**5,000 feet** on ICS when radar altimeter goes off / platform.", "Lead distance ≈ **1% GS** (NM); lead radials = **(60/DME)×(0.01×GS)**.", "High **TACAN/VOR penetrating** approach (then often missed into GCA box), or **in/out descent** direct to GCA box."], "ans": 3, "expl": "High **TACAN/VOR penetrating** approach (then often missed into GCA box), or **in/out descent** direct to GCA box."}, {"q": "In/out descent speeds?", "opts": ["**250 KT** to MVA; slow to **200 KT** before GCA box entry.", "**500 KT** to MVA; slow to **200 KT** before GCA box entry.", "**260 KT** to MVA; slow to **200 KT** before GCA box entry.", "**125 KT** to MVA; slow to **200 KT** before GCA box entry."], "ans": 0, "expl": "**250 KT** to MVA; slow to **200 KT** before GCA box entry."}, {"q": "Platform call altitude?", "opts": ["**10000 feet** on ICS when radar altimeter goes off / platform.", "**5010 feet** on ICS when radar altimeter goes off / platform.", "**2500 feet** on ICS when radar altimeter goes off / platform.", "**5,000 feet** on ICS when radar altimeter goes off / platform."], "ans": 3, "expl": "**5,000 feet** on ICS when radar altimeter goes off / platform."}, {"q": "Arc lead / lead-radial formulas?", "opts": ["Lead distance ≈ **1% GS** (NM); lead radials = **(60/DME)×(0.01×GS)**.", "Lead distance ≈ **11% GS** (NM); lead radials = **(60/DME)×(0.01×GS)**.", "Lead distance ≈ **2% GS** (NM); lead radials = **(60/DME)×(0.01×GS)**.", "Lead distance ≈ **101% GS** (NM); lead radials = **(60/DME)×(0.01×GS)**."], "ans": 0, "expl": "Lead distance ≈ **1% GS** (NM); lead radials = **(60/DME)×(0.01×GS)**."}, {"q": "Why penetrating approach often preferred?", "opts": ["High **TACAN/VOR penetrating** approach (then often missed into GCA box), or **in/out descent** direct to GCA box.", "**Fuel efficiency** vs long idle descent, then multiple low approaches in GCA box.", "Lead distance ≈ **1% GS** (NM); lead radials = **(60/DME)×(0.01×GS)**.", "**5,000 feet** on ICS when radar altimeter goes off / platform."], "ans": 1, "expl": "**Fuel efficiency** vs long idle descent, then multiple low approaches in GCA box."}, {"q": "What are the two ways to recover from the working area in BI?", "opts": ["A high TACAN (or similar penetrating) approach, or an en route descent directly to the GCA box pattern", "A spiral descent or a GPS approach", "A visual straight-in or an overhead break", "A no-gyro or a PAR only"], "ans": 0, "expl": "Lecture."}, {"q": "Why is the high TACAN penetrating approach the likely recovery?", "opts": ["It is shorter in distance", "It avoids the GCA box", "Fuel efficiency", "ATC requires it"], "ans": 2, "expl": "\"Based on fuel efficiency, you will likely recover with a high TACAN or similar penetrating approach.\""}, {"q": "Before leaving the MOA when high work is complete, what do you do?", "opts": ["Call tower for landing", "Switch to ground", "Complete the landing checklist", "Get ATIS, complete pre-descent/penetration checks, check out of the MOA, turn toward the IAF, check in with ATC"], "ans": 3, "expl": "Lecture sequence."}, {"q": "Recovering via radar vectors from the MOA or an outlying field, plan for:", "opts": ["A 150-knot descent with gear down", "A 200-knot idle descent, slowing to 200 knots before entering the box pattern", "A 300-knot MRT descent", "A 250-knot descent with speed brakes out to 1000 ft"], "ans": 1, "expl": "Lecture."}, {"q": "An en route descent to the GCA box should be flown at ___, slowing to ___ before entering the box.", "opts": ["250 knots; 150 knots", "200 knots; 150 knots", "300 knots; 250 knots", "250 knots; 200 knots"], "ans": 3, "expl": "Lecture: en route descent at 250 knots, level at MVA, slow to 200 before the box."}, {"q": "Approaches flown in the GCA box pattern in BI:", "opts": ["Visual straight-ins only", "TACAN, VOR, and GPS only", "ILS, PAR and ASR", "NDB and LOC only"], "ans": 2, "expl": "Recovery outline."}, {"q": "Arc intercept lead (inbound or outbound):", "opts": ["10% of ground speed", "1% of ground speed (250 kts GS = 2.5 nm)", "60/DME", "2% of ground speed"], "ans": 1, "expl": "HI TACAN/VOR Approach slide."}, {"q": "The high TACAN is flown at 250 KIAS, but ground speed will realistically be:", "opts": ["30+ knots higher", "Exactly 250", "30 knots lower", "100 knots higher"], "ans": 0, "expl": "Lecture."}, {"q": "Inbound arc intercept compared with the 1% lead:", "opts": ["Double it", "You turn less than 90°, so the lead can be decreased (turning ~2.5 nm early usually works)", "You turn more than 90°, so increase it", "Lead is not needed inbound"], "ans": 1, "expl": "Slide/lecture."}, {"q": "High TACAN example: lead radials for a 20 DME arc at 262 kts GS:", "opts": ["60/20 × 26 = 78 radials", "20/60 × 2.6 ≈ 1 radial", "60/20 × 2.6 = 7.8 → 8 radials", "60/26 × 2 = 4.6 radials"], "ans": 2, "expl": "Lecture math."}, {"q": "Final approach course 321 → final approach radial and calculated lead radial?", "opts": ["141 radial; lead radial 149", "151 radial; lead 159", "141 radial; lead 133", "321 radial; lead 329"], "ans": 0, "expl": "Reciprocal of 321 = 141; 141 + 8 = 149."}, {"q": "What lead radial does the Key Field HI TACAN plate provide (used by the student)?", "opts": ["153", "149", "141", "147 (LR-147)"], "ans": 3, "expl": "Lecture: the calculated 149 is conservative; plate gives 147."}, {"q": "Turning from the arc to the final approach course, when do you start the 30° AOB turn?", "opts": ["When the head of the needle reaches the lubber line", "When the tail of the TACAN needle swings through the heading bug set to the lead radial (or touch-turn on 20 nm scale)", "At 10 DME", "At the FAF"], "ans": 1, "expl": "Lecture."}, {"q": "Touch-turn method requirements:", "opts": ["HUD in A/A mode", "5 nm scale planimetric", "Planimetric HSI in 20 nm scale; turn when the aircraft symbol's nose touches the course line, then switch to CDI", "CDI mode in 80 nm scale"], "ans": 2, "expl": "Lecture."}, {"q": "When are gear and flaps lowered on the HI TACAN?", "opts": ["At the IAF", "10 nm prior to the FAF", "At the FAF", "3–5 nm prior to the final approach fix"], "ans": 3, "expl": "Lecture."}, {"q": "When do you slow to 200 knots on the HI TACAN?", "opts": ["5–7 nm prior to the final approach fix", "On the arc", "At the IAF", "At the FAF"], "ans": 0, "expl": "Lecture."}, {"q": "The Key Field HI TACAN demo: IAF name and altitude?", "opts": ["JAPO at 10,000 ft", "KMEI at 16,000 ft", "JAPO at 16,000 ft", "SOTO at 10,000 ft"], "ans": 2, "expl": "Lecture."}, {"q": "Coming from the north to the HI TACAN, what entry is expected?", "opts": ["Direct entry", "No entry, straight-in", "Teardrop entry", "Parallel entry"], "ans": 2, "expl": "Lecture."}, {"q": "Which TACAN channel is used for Key Field (vs 56X for NAS Meridian/McCain)?", "opts": ["71X", "56X", "117X", "85X"], "ans": 2, "expl": "Lecture."}, {"q": "On the VOR control panel, the lower frequencies are for ___ and higher frequencies for ___.", "opts": ["ILS; VOR", "Marker; ILS", "VOR; ILS", "TACAN; VOR"], "ans": 0, "expl": "Lecture."}, {"q": "When does VOR appear under TACAN on the HSI?", "opts": ["Always", "Only in CDI mode (VOR doesn't work in planimetric)", "Only in planimetric", "Only with the HUD on"], "ans": 1, "expl": "Lecture."}, {"q": "Initial descent from the IAF until the 10,000 ft SOTO restriction is cleared:", "opts": ["MRT and 3° nose up", "Idle, speed brakes out, 10° nose low", "700 pph and level", "Idle and ~2° nose low"], "ans": 3, "expl": "Lecture."}, {"q": "After the 10,000 ft restriction is cleared, the penetration is flown with:", "opts": ["Idle, speed brakes extended, ~10° nose low at 250 knots", "MRT, 10° nose low", "Idle, speed brakes in, 2° nose low", "1400 pph, 3° up"], "ans": 0, "expl": "Lecture."}, {"q": "Radar altimeter usage on departure and penetration:", "opts": ["Set to 500 ft throughout", "Set to MDA from the IAF", "Set to 5000 ft on departure (confirm at 10K checks) until passing platform; then intermediate 1000 ft until the FAF", "Set to 1000 ft on departure"], "ans": 2, "expl": "Lecture critique; the student's error was typing 500 instead of 5000."}, {"q": "Speed brakes on the penetration should remain extended until:", "opts": ["Passing platform at 5000 ft", "6000 ft", "10,000 ft", "The FAF"], "ans": 0, "expl": "Lecture critique: should not retract at 6000."}, {"q": "At the FAF the radar altimeter is set to:", "opts": ["MDA", "1000 ft", "5000 ft", "MDA − 10% (500 ft in the example) per TRAWING ONE SOP"], "ans": 3, "expl": "Lecture."}, {"q": "Level on-speed with gear down and half flaps reference:", "opts": ["~1800 pph and 8° nose up", "~2100 pph and 8° up", "~1400 pph and 3° up", "~1100 pph and 5° up"], "ans": 0, "expl": "Lecture."}, {"q": "At the FAF (10 nm), what is done?", "opts": ["Slow to 120 knots", "Raise flaps", "Extend speed brakes full, report FAF (gear), review landing checklist, descend to MDA", "Retract speed brakes and add MRT"], "ans": 2, "expl": "Lecture."}, {"q": "Key Field HI TACAN demo: FAF altitude, MDA and MAP?", "opts": ["1600 at 7; MDA 1440; MAP 1.0", "2100 at 10; MDA 1140; MAP 4.4", "1600 ft at 10 nm; MDA 1140 ft; MAP 4.4 nm", "1600 at 10; MDA 1000; MAP 2.0"], "ans": 2, "expl": "Lecture."}, {"q": "Level-off at MDA on-speed with speed brakes out:", "opts": ["50 ft prior, MRT", "200 ft prior, −300 pph", "At MDA, retract speed brakes", "Begin 100 ft prior, add ~300 pph"], "ans": 3, "expl": "Lecture."}, {"q": "Climb-out instructions in the demo:", "opts": ["Right 240 to 2100", "Left 140 to 1200", "Runway heading to 3000", "Left 240 to 2100"], "ans": 3, "expl": "Put heading in the HSI heading bug and altitude under CL on the ADI."}, {"q": "Missed approach is executed at:", "opts": ["At 500 ft AGL", "Only at the FAF", "DH/DA (baro alt), MAP, or when directed by ATC", "At 200 ft AGL only"], "ans": 2, "expl": "Missed Approach slide."}, {"q": "Missed approach initial action:", "opts": ["MRT, flaps up, level", "MRT, gear up, nose 20° up", "Simultaneously MRT, speed brakes in, raise nose to 10–12° nose up (don't exceed optimum AOA)", "Idle, speed brakes in"], "ans": 2, "expl": "Missed Approach slide."}, {"q": "Missed approach flap call:", "opts": ["At 120 KIAS", "At 140 KIAS minimum, call for flaps", "At 200 KIAS", "Immediately"], "ans": 1, "expl": "Slide."}, {"q": "Missed approach: check aircraft clean before:", "opts": ["150 KIAS", "250 KIAS", "140 KIAS", "200 KIAS, good handle"], "ans": 3, "expl": "Slide."}, {"q": "Missed approach departing the GCA box:", "opts": ["95%/2500 pph at 200 KIAS", "MRT to 300 KIAS", "Idle at 200 KIAS", "Maintain MRT and 10° nose up until 245 KIAS, then hold 250 KIAS; level at 10% of climb rate"], "ans": 3, "expl": "Slide."}, {"q": "Missed approach remaining in the GCA pattern: once gear and flaps are up, power is reduced to:", "opts": ["89% / 1500 pph", "MRT", "95% / 2500 pph, maintain 200 KIAS", "1050–1100 pph"], "ans": 2, "expl": "Slide."}, {"q": "Turns on the missed approach/climb-out are made at:", "opts": ["Standard rate only", "45° AOB", "20° AOB", "30° AOB"], "ans": 3, "expl": "Slide."}, {"q": "Level-off in the GCA pattern at 200 KIAS:", "opts": ["Idle at 0°", "1800 pph at 8°", "At 10% of VVI/VSI, reduce power to 1050–1100 pph (~5° nose up)", "1300–1400 pph at 3°"], "ans": 2, "expl": "Slide/lecture."}, {"q": "Immediate turn on climb-out:", "opts": ["Turn immediately at 60° AOB", "Wait until 200 KIAS to turn", "Raise flaps first", "Once the gear handle is raised, turn at 30° AOB, hold 10–12° nose up, stay below 200 KIAS, call for flaps on rollout"], "ans": 3, "expl": "Slide."}, {"q": "Follow-on GCA vectors to TACAN/VOR final or procedure-turn portions of low-altitude approaches:", "opts": ["300 KIAS maximum", "150 KIAS minimum", "200 KIAS maximum until gear and flap transition", "250 KIAS maximum"], "ans": 2, "expl": "Slide."}, {"q": "Waypoint used for SA to Key Field in the demo:", "opts": ["Waypoint 22 (KMEI)", "Waypoint 1", "Waypoint 0", "Waypoint 10"], "ans": 0, "expl": "Lecture."}, {"q": "Fly to the HI TACAN IAF at:", "opts": ["250 knots (not 400)", "300 knots", "200 knots", "350 knots"], "ans": 0, "expl": "Lecture: 400 knots is not fuel efficient."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= queue.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
