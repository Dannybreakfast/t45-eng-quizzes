<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>BI 1101 (3) Departure and Course Rules — T-45 Quiz</title>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">Home</a> · <a href="section-bi.html">BI</a> · Basic Instruments</div>
    <h1>BI 1101 (3) Departure and Course Rules</h1>
    <div class="meta">17 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 17</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Basic Instruments</div>
    <h2 style="margin:0.2rem 0">BI 1101 (3) Departure and Course Rules</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-bi.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to BI</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="section-bi.html">← BI</a> · <a href="index.html">Home</a></div>
</div>
<script>
const QUESTIONS = [{"q": "Rotate at approximately:", "opts": ["100 KIAS / 5° NU", "120 KIAS / 10° NU", "140 KIAS / 17° NU", "200 KIAS / 3° NU"], "ans": 1, "expl": "Smooth rotate; don't exceed opt AOA."}, {"q": "Arc lead distance rule:", "opts": ["10% of IAS", "1% of ground speed (NM)", "Fixed 5 NM", "DME×2"], "ans": 1, "expl": "e.g. 292 KT GS → 2.9 NM prior."}, {"q": "Lead radial uses:", "opts": ["IAS only", "(60/DME)×(0.01×GS)", "Fixed 10 radials", "Mag var only"], "ans": 1, "expl": "Common error: using IAS instead of GS."}, {"q": "Prefer angular-bank arcing when:", "opts": ["\u003e30 NM", "Roughly \u003c12 NM from station", "Only in VMC", "Never"], "ans": 1, "expl": "Chord method when farther out."}, {"q": "Rotate airspeed and initial pitch?", "opts": ["**240 KIAS** to about **10° nose up** (don't exceed optimum AOA).", "**130 KIAS** to about **10° nose up** (don't exceed optimum AOA).", "**60 KIAS** to about **10° nose up** (don't exceed optimum AOA).", "**120 KIAS** to about **10° nose up** (don't exceed optimum AOA)."], "ans": 3, "expl": "**120 KIAS** to about **10° nose up** (don't exceed optimum AOA)."}, {"q": "When request flaps up?", "opts": ["Accelerating through **280 KIAS**, after cleared.", "Accelerating through **70 KIAS**, after cleared.", "Accelerating through **140 KIAS**, after cleared.", "Accelerating through **150 KIAS**, after cleared."], "ans": 2, "expl": "Accelerating through **140 KIAS**, after cleared."}, {"q": "Clean configuration callout timing?", "opts": ["Before **200 KIAS** — gear/flaps up, lights/cautions clear, handle seated.", "Before **210 KIAS** — gear/flaps up, lights/cautions clear, handle seated.", "Before **100 KIAS** — gear/flaps up, lights/cautions clear, handle seated.", "Before **400 KIAS** — gear/flaps up, lights/cautions clear, handle seated."], "ans": 0, "expl": "Before **200 KIAS** — gear/flaps up, lights/cautions clear, handle seated."}, {"q": "Level-off lead rule of thumb?", "opts": ["Lead by ~**10% of VSI** (e.g., 4000 fpm → start ~400' prior).", "Lead by ~**5% of VSI** (e.g., 4000 fpm → start ~400' prior).", "Lead by ~**110% of VSI** (e.g., 4000 fpm → start ~400' prior).", "Lead by ~**20% of VSI** (e.g., 4000 fpm → start ~400' prior)."], "ans": 0, "expl": "Lead by ~**10% of VSI** (e.g., 4000 fpm → start ~400' prior)."}, {"q": "Arc intercept lead distance?", "opts": ["**2% of ground speed** in NM (250 KT GS → 2.5 NM prior).", "**101% of ground speed** in NM (250 KT GS → 2.5 NM prior).", "**11% of ground speed** in NM (250 KT GS → 2.5 NM prior).", "**1% of ground speed** in NM (250 KT GS → 2.5 NM prior)."], "ans": 3, "expl": "**1% of ground speed** in NM (250 KT GS → 2.5 NM prior)."}, {"q": "Angular bank vs chord arcing?", "opts": ["Angular bank when close (\u003c~**22 NM**); chord when farther.", "Angular bank when close (\u003c~**24 NM**); chord when farther.", "Angular bank when close (\u003c~**6 NM**); chord when farther.", "Angular bank when close (\u003c~**12 NM**); chord when farther."], "ans": 3, "expl": "Angular bank when close (\u003c~**12 NM**); chord when farther."}, {"q": "Lead radial formula?", "opts": ["**(30 / arc DME) × (0.01 × GS)** — use **GS**, not IAS.", "**(120 / arc DME) × (0.01 × GS)** — use **GS**, not IAS.", "**(60 / arc DME) × (0.01 × GS)** — use **GS**, not IAS.", "**(70 / arc DME) × (0.01 × GS)** — use **GS**, not IAS."], "ans": 2, "expl": "**(60 / arc DME) × (0.01 × GS)** — use **GS**, not IAS."}, {"q": "Level 250 KT pitch / fuel flow approx?", "opts": ["~**+1°** waterline; ~**1300 pph** (lecture also shows ~1400 in demo).", "~**+3°** waterline; ~**1300 pph** (lecture also shows ~1400 in demo).", "~**+6°** waterline; ~**1300 pph** (lecture also shows ~1400 in demo).", "~**+13°** waterline; ~**1300 pph** (lecture also shows ~1400 in demo)."], "ans": 1, "expl": "~**+3°** waterline; ~**1300 pph** (lecture also shows ~1400 in demo)."}, {"q": "When Rotate 120 KIAS smoothly to ~10° nose up; don't exceed optimum AOA; positive climb, what happens?", "opts": ["gear (when cleared); \u003e280 request flaps up.", "gear (when cleared); \u003e150 request flaps up.", "gear (when cleared); \u003e70 request flaps up.", "gear (when cleared); \u003e140 request flaps up."], "ans": 3, "expl": "gear (when cleared); \u003e140 request flaps up."}, {"q": "When ~250 KIAS: raise nose 10°, what happens?", "opts": ["~34° to hold 250; check-in with departure (passing/climbing); request full SID.", "~17° to hold 250; check-in with departure (passing/climbing); request full SID.", "~27° to hold 250; check-in with departure (passing/climbing); request full SID.", "~8° to hold 250; check-in with departure (passing/climbing); request full SID."], "ans": 1, "expl": "~17° to hold 250; check-in with departure (passing/climbing); request full SID."}, {"q": "When 250-kt climb (\u003e1,000' to go): MRT + ~15–18° NU (colder, what happens?", "opts": ["higher pitch); level 125: ~+3° WL, ~1300 pph FF.", "higher pitch); level 260: ~+3° WL, ~1300 pph FF.", "higher pitch); level 250: ~+3° WL, ~1300 pph FF.", "higher pitch); level 500: ~+3° WL, ~1300 pph FF."], "ans": 2, "expl": "higher pitch); level 250: ~+3° WL, ~1300 pph FF."}, {"q": "What is correct for: YouTube title?", "opts": ["** BI1111 (3) Departure and Course Rules", "** BI2202 (3) Departure and Course Rules", "** BI1101 (3) Departure and Course Rules", "** BI550 (3) Departure and Course Rules"], "ans": 2, "expl": "** BI1101 (3) Departure and Course Rules"}, {"q": "When B — e.g. 292 KT GS, what happens?", "opts": ["1.4 NM prior.", "12.9 NM prior.", "5.8 NM prior.", "2.9 NM prior."], "ans": 3, "expl": "2.9 NM prior."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= QUESTIONS.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
</html>
