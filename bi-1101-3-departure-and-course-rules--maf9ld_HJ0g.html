const QUESTIONS = [{"q": "Rotate at approximately:", "opts": ["100 KIAS / 5° NU", "120 KIAS / 10° NU", "140 KIAS / 17° NU", "200 KIAS / 3° NU"], "ans": 1, "expl": "Smooth rotate; don't exceed opt AOA."}, {"q": "Arc lead distance rule:", "opts": ["10% of IAS", "1% of ground speed (NM)", "Fixed 5 NM", "DME×2"], "ans": 1, "expl": "e.g. 292 KT GS → 2.9 NM prior."}, {"q": "Lead radial uses:", "opts": ["IAS only", "(60/DME)×(0.01×GS)", "Fixed 10 radials", "Mag var only"], "ans": 1, "expl": "Common error: using IAS instead of GS."}, {"q": "Prefer angular-bank arcing when:", "opts": ["\u003e30 NM", "Roughly \u003c12 NM from station", "Only in VMC", "Never"], "ans": 1, "expl": "Chord method when farther out."}, {"q": "Rotate airspeed and initial pitch?", "opts": ["**240 KIAS** to about **10° nose up** (don't exceed optimum AOA).", "**130 KIAS** to about **10° nose up** (don't exceed optimum AOA).", "**60 KIAS** to about **10° nose up** (don't exceed optimum AOA).", "**120 KIAS** to about **10° nose up** (don't exceed optimum AOA)."], "ans": 3, "expl": "**120 KIAS** to about **10° nose up** (don't exceed optimum AOA)."}, {"q": "Clean configuration callout timing?", "opts": ["Before **200 KIAS** — gear/flaps up, lights/cautions clear, handle seated.", "Before **210 KIAS** — gear/flaps up, lights/cautions clear, handle seated.", "Before **100 KIAS** — gear/flaps up, lights/cautions clear, handle seated.", "Before **400 KIAS** — gear/flaps up, lights/cautions clear, handle seated."], "ans": 0, "expl": "Before **200 KIAS** — gear/flaps up, lights/cautions clear, handle seated."}, {"q": "Level-off lead rule of thumb?", "opts": ["Lead by ~**10% of VSI** (e.g., 4000 fpm → start ~400' prior).", "Lead by ~**5% of VSI** (e.g., 4000 fpm → start ~400' prior).", "Lead by ~**110% of VSI** (e.g., 4000 fpm → start ~400' prior).", "Lead by ~**20% of VSI** (e.g., 4000 fpm → start ~400' prior)."], "ans": 0, "expl": "Lead by ~**10% of VSI** (e.g., 4000 fpm → start ~400' prior)."}, {"q": "Arc intercept lead distance?", "opts": ["**2% of ground speed** in NM (250 KT GS → 2.5 NM prior).", "**101% of ground speed** in NM (250 KT GS → 2.5 NM prior).", "**11% of ground speed** in NM (250 KT GS → 2.5 NM prior).", "**1% of ground speed** in NM (250 KT GS → 2.5 NM prior)."], "ans": 3, "expl": "**1% of ground speed** in NM (250 KT GS → 2.5 NM prior)."}, {"q": "Angular bank vs chord arcing?", "opts": ["Angular bank when close (\u003c~**22 NM**); chord when farther.", "Angular bank when close (\u003c~**24 NM**); chord when farther.", "Angular bank when close (\u003c~**6 NM**); chord when farther.", "Angular bank when close (\u003c~**12 NM**); chord when farther."], "ans": 3, "expl": "Angular bank when close (\u003c~**12 NM**); chord when farther."}, {"q": "Lead radial formula?", "opts": ["**(30 / arc DME) × (0.01 × GS)** — use **GS**, not IAS.", "**(120 / arc DME) × (0.01 × GS)** — use **GS**, not IAS.", "**(60 / arc DME) × (0.01 × GS)** — use **GS**, not IAS.", "**(70 / arc DME) × (0.01 × GS)** — use **GS**, not IAS."], "ans": 2, "expl": "**(60 / arc DME) × (0.01 × GS)** — use **GS**, not IAS."}, {"q": "Level 250 KT pitch / fuel flow approx?", "opts": ["~**+1°** waterline; ~**1300 pph** (lecture also shows ~1400 in demo).", "~**+3°** waterline; ~**1300 pph** (lecture also shows ~1400 in demo).", "~**+6°** waterline; ~**1300 pph** (lecture also shows ~1400 in demo).", "~**+13°** waterline; ~**1300 pph** (lecture also shows ~1400 in demo)."], "ans": 1, "expl": "~**+3°** waterline; ~**1300 pph** (lecture also shows ~1400 in demo)."}, {"q": "Takeoff checks are completed over ICS before calling tower on which button?", "opts": ["Button 4", "Button 3", "Button 1", "Button 6"], "ans": 1, "expl": "\"Complete the takeoff checks over ICS prior to calling tower on button 3 for takeoff.\""}, {"q": "After being cleared for takeoff (hold short checklist), you switch to departure on which button?", "opts": ["Button 3", "Button 5", "Button 2", "Button 4"], "ans": 3, "expl": "\"Switch to departure button 4.\""}, {"q": "Which items are in the hold short checklist once cleared for takeoff?", "opts": ["Fuel control normal; strobes, pitot heat, IFF, taxi light ON", "Speed brake out; nav lights off; IFF standby", "Fuel control manual; anti-skid off; flaps up", "Canopy open; hood installed; pitot heat off"], "ans": 0, "expl": "Lecture: fuel control normal, strobes, pitot heat, IFF, taxi light all on, VCR as desired."}, {"q": "Why must the IP confirm the groove is clear in the aircraft?", "opts": ["Because the rear seat has no HUD", "Because tower requires it", "Because the student has no ICS", "Because you will be under the IFR hood"], "ans": 3, "expl": "\"The IP will have to confirm groove is clear in the aircraft since you will be under the IFR hood.\""}, {"q": "Lined up on the runway, what do you do for MRT checks?", "opts": ["Release brakes and advance to 80%", "Hold the brakes and smoothly push the throttle to MRT (back to idle if the aircraft starts to roll)", "Hold brakes at idle and check flaps", "Advance to 100% with speed brakes out"], "ans": 1, "expl": "Lecture: hold the brakes for MRT checks; bring throttle back to idle if the jet starts to roll."}, {"q": "Which report is part of the MRT check on the runway?", "opts": ["Two positive rates, gear up", "Gear up, flaps up, no slats caution", "Off the peg, 100 knots", "Good brakes, good heading, no OFF flags, good EGT/RPM/fuel flow, no warnings/cautions, hyds 3000/3000, good volts"], "ans": 3, "expl": "MRT checks per lecture transcript."}, {"q": "When do you report \"off the peg\" on the takeoff roll?", "opts": ["When airspeed registers on the ADI", "At 100 knots", "At rotation", "At 80 knots"], "ans": 0, "expl": "\"Report off the peg when airspeed registers on the ADI.\""}, {"q": "The \"100 knots\" (high speed) call indicates:", "opts": ["Time to rotate", "Refusal speed reached", "Time to raise the flaps", "Transition from the low-speed abort environment to the high-speed abort environment"], "ans": 3, "expl": "Lecture."}, {"q": "At what airspeed do you rotate on an instrument takeoff, and to what attitude?", "opts": ["100 knots, 15° nose up", "120 knots, 10° nose up on the ADI", "130 knots, 7° nose up", "120 knots, 17° nose up"], "ans": 1, "expl": "\"At 120 knots, smoothly rotate to 10 degrees nose up on the ADI. Do not exceed optimum AOA.\""}, {"q": "During rotation, what AOA limit should you not exceed?", "opts": ["Optimum AOA", "8 units", "Stall warning AOA", "22 units"], "ans": 0, "expl": "\"Do not exceed optimum AOA.\""}, {"q": "What two indications do you wait for before reporting \"two positive rates\" for the gear?", "opts": ["RPM and EGT", "AOA and airspeed", "HSI and CDI", "Climb indications on the VSI and altimeter"], "ans": 3, "expl": "\"Wait for climb indications on your VSI and altimeter and report two positive rates.\""}, {"q": "At what airspeed do you request flaps up after takeoff?", "opts": ["Accelerating through 140 knots", "200 knots", "160 knots", "120 knots"], "ans": 0, "expl": "\"Accelerating through 140 knots, request above 140 flaps up.\""}, {"q": "What must be checked (gear up, flaps up, no door light, no slats caution, gear handle light out) prior to what airspeed?", "opts": ["180 knots", "150 knots", "200 knots", "250 knots"], "ans": 2, "expl": "Lecture: gear/flaps up, lights out prior to 200 knots; report \"clean before 200\"."}, {"q": "If the gear handle/door lights are not out approaching 200 knots, you should:", "opts": ["Extend the speed brakes and continue", "Lower the nose and continue at MRT", "Cycle the gear handle immediately", "Raise the nose attitude slightly and reduce throttle setting"], "ans": 3, "expl": "Lecture."}, {"q": "Approaching 250 knots on the climbout, what pitch change is made?", "opts": ["Raise the nose from 10° to 25°", "Hold 10° and reduce to 90%", "Raise the nose from 10° to about 17° nose up on the ADI to hold 250 knots", "Lower the nose from 10° to 3°"], "ans": 2, "expl": "Lecture: \"approaching 250 knots raise the nose from 10 degrees to 17 degrees nose up.\""}, {"q": "Passing 5000 ft AGL on departure, what do you reset?", "opts": ["The radar altimeter to 5000 ft for the RTB", "The altimeter to 29.92", "The bingo to 500 lb", "The LAW to 500 ft"], "ans": 0, "expl": "\"Passing 5000 feet AGL reset your radalt to 5000 for the RTB.\""}, {"q": "Passing 10,000 ft on departure, what do you check?", "opts": ["Fuel balance", "Standby compass", "Cabin altimeter", "Radar altimeter"], "ans": 2, "expl": "Lecture: \"passing 10,000 feet check your cabin altimeter.\""}, {"q": "Before every level-off, what call is made and what action begins?", "opts": ["Call \"500 to go\" and extend speed brakes", "Verbalize \"1000 feet to go,\" crack the power below MRT and start to lower the nose", "Call \"level\" and reduce to idle", "Call \"2000 to go\" and roll wings level"], "ans": 1, "expl": "Lecture."}, {"q": "Rule of thumb for leading a level-off:", "opts": ["5% of the VSI", "At least 10% of the VSI", "20% of the VSI", "1% of ground speed"], "ans": 1, "expl": "Lecture."}, {"q": "With a VSI of 4000 ft/min, start the level-off how many feet prior?", "opts": ["1000 ft", "200 ft", "400 ft", "40 ft"], "ans": 2, "expl": "10% of 4000 = 400 ft."}, {"q": "Which departure is used by VT-7 from NAS Meridian to Area 1?", "opts": ["Pine Hill Departure", "Dancy Departure", "Union Departure", "NQI2 Departure"], "ans": 2, "expl": "Instrument Departures slide."}, {"q": "Which departure is used by VT-9 from NAS Meridian to Area 4?", "opts": ["Pine Hill Departure", "Kingsville Two Departure", "Dancy Departure", "Union Departure"], "ans": 2, "expl": "Instrument Departures slide."}, {"q": "The Pine Hill departure is approved for:", "opts": ["Aircraft only", "Night flights only", "Simulator only (VT-7 and VT-9)", "Both aircraft and sim"], "ans": 2, "expl": "\"This is a simulator only departure and is not approved in the aircraft.\""}, {"q": "The Union departure clearance is the:", "opts": ["Radar vectors to the EWA VORTAC", "\"SKIP\" STEREO route", "Kingsville Two departure", "\"CARP\" STEREO route as published in the TRAWING ONE In-Flight Guide"], "ans": 3, "expl": "Union Departure slide."}, {"q": "The actual-flight clearance to Pine Hill West (PHW) is the:", "opts": ["Dancy departure", "\"SKIP\" STEREO route", "\"CARP\" STEREO route", "NQI2 departure"], "ans": 1, "expl": "Pine Hill slide: Actual Flight Clearance \"SKIP\" STEREO route to PHW."}, {"q": "In the Pine Hill simulator clearance, what is the initial altitude and the final altitude with Atlanta Center?", "opts": ["5000 ft then 9000 ft", "10,000 ft then 17,000 ft", "Climb to 7000 ft; then 11,000 ft with Atlanta Center", "7000 ft then 15,000 ft"], "ans": 2, "expl": "Slide: radar vectors climbing to 7000, direct EWA VORTAC (Ch-85) climbing to 11,000 with Atlanta Center, out the EWA 150 radial to the 40 DME fix."}, {"q": "The Pine Hill sim clearance takes you out the EWA ___ radial to the ___ DME fix.", "opts": ["105 radial, 40 DME", "150 radial, 15 DME", "150 radial, 40 DME", "240 radial, 25 DME"], "ans": 2, "expl": "Pine Hill Simulator Departure slide."}, {"q": "Climbing on the SID with greater than 1000 ft to go, the reference setting is:", "opts": ["MRT and 15–18° nose up (250 KIAS climbout)", "90% and 10° nose up", "1300 pph and 3° nose up", "MRT and 25° nose up"], "ans": 0, "expl": "Flying the SID table: 250 KIAS climbout – 15–18° up – MRT."}, {"q": "Straight and level at 250 KIAS clean, reference attitude and fuel flow:", "opts": ["3° nose up, MRT", "3° nose up, 1300–1400 PPH", "0° pitch, 900–1000 PPH", "5° nose up, 1800–2000 PPH"], "ans": 1, "expl": "Flying the SID table."}, {"q": "When should you expect higher pitch attitudes on departures and missed approaches?", "opts": ["During summer months", "During the winter months", "At night", "At heavier weights only"], "ans": 1, "expl": "\"Expect higher pitch attitudes on departure and missed approaches during the winter months.\""}, {"q": "Arc intercept lead point (based on a 90° turn) is:", "opts": ["60 / DME", "2% of ground speed", "10% of ground speed", "1% of ground speed in nm"], "ans": 3, "expl": "Arc Intercept slide."}, {"q": "At 250 knots ground speed, how far prior do you begin the turn to intercept an arc?", "opts": ["5.0 nm", "2.5 nm", "3.5 nm", "1.5 nm"], "ans": 1, "expl": "Slide: 250 KTS GS = 2.5 nm prior."}, {"q": "Flying outbound to intercept a 6 DME arc at 250 kts GS, start the turn no later than:", "opts": ["6.0 DME", "8.5 DME", "2.5 DME", "3.5 DME"], "ans": 3, "expl": "Lecture example: 6 – 2.5 = 3.5 DME."}, {"q": "When intercepting a small arc outbound you should ___ the lead point; inbound you should ___ it.", "opts": ["Increase both", "Decrease outbound; increase inbound", "Increase outbound; decrease inbound", "Not change either"], "ans": 2, "expl": "Because you turn more than 90° outbound and less than 90° inbound."}, {"q": "In the video example (ground speed 292 kts, 10 nm arc, outbound), at what DME does the student start the turn?", "opts": ["7.5 DME", "6.6 DME", "8.0 DME", "7.1 DME"], "ans": 3, "expl": "292 → 2.9 nm lead; 10 – 2.9 = 7.1 DME."}, {"q": "In the video example, level at 10,000 ft/250 kts the fuel flow was about:", "opts": ["1400 PPH", "1000 PPH", "1800 PPH", "2200 PPH"], "ans": 0, "expl": "\"Our fuel flow setting at 1400 pounds of fuel flow\" with 3° nose up."}, {"q": "If you turn late onto the arc, you should:", "opts": ["Add speed brakes", "Roll wings level and fly back", "Increase angle of bank slightly past 30°", "Decrease bank to 15°"], "ans": 2, "expl": "Lecture."}, {"q": "The chord method is used when the arc is ___; the AOB method when the arc is ___.", "opts": ["20 or more DME; less than 20 DME", "Less than 12 DME; 12 or more DME", "10 or more DME; less than 10 DME", "12 or more DME; less than 12 DME"], "ans": 3, "expl": "Two Methods for Maintaining the Arc slide."}, {"q": "With the AOB arc method, where do you keep the TACAN needle head?", "opts": ["On the nose", "On the lubber line", "10° behind the tail", "On the wingtip (3/9) line"], "ans": 3, "expl": "Lecture: TACAN pointer on the wingtip position / 3-9 line."}, {"q": "On the AOB arc, if you roll out early (inside the arc), you should:", "opts": ["Climb to increase DME", "Push the needle ahead of the 3/9 line", "Turn directly toward the station", "Allow the needle to drift aft of the 3/9 line to increase DME, then increase bank to replace it on the 3/9 line"], "ans": 3, "expl": "Lecture."}, {"q": "When is CDI mode on the HSI required?", "opts": ["Only for level-offs", "Never in BI", "Only when established on an arc", "When tracking inbound or outbound on a radial"], "ans": 3, "expl": "\"Using CDI mode on your HSI is required when tracking outbound or inbound on a radial.\" Once on the arc you may select planimetric for SA."}, {"q": "Lead radials for intercepting a radial off an arc =", "opts": ["60 × DME / ground speed", "(60 / DME of arc) × 1% of ground speed", "(DME / 60) × ground speed", "1% of ground speed only"], "ans": 1, "expl": "Intercepting a Radial from the Arc slide."}, {"q": "For a 10 nm arc at 292 kts ground speed, the lead is about:", "opts": ["10 radials", "29 radials", "6 radials", "17 radials (17.4)"], "ans": 3, "expl": "(60/10) × 1% of 292 GS; the video computes 17.4 radials, rounded to 17."}, {"q": "The \"touch turn\" technique for a radial lead uses which HSI scale?", "opts": ["40 nm scale", "20 nm scale – start the turn when the aircraft symbol's nose touches the course line", "5 nm scale", "80 nm scale"], "ans": 1, "expl": "Lecture technique; a calculated lead radial is more accurate."}, {"q": "The departure in the lecture video was flown from which runway at NAS Meridian?", "opts": ["Runway 13", "Runway 1R", "Runway 19L", "Runway 31"], "ans": 1, "expl": "\"This departure, taking off from runway 1R at NAS Meridian, was used in the making of this lecture video.\""}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= queue.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
</html>
