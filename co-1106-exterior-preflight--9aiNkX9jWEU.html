.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }

.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;

.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }

t-static tube CONDITION."}, {"q": "Right avionics access door should be:", "opts": ["Closed and secured", "Removed for high-speed taxi", "Left unlocked for MX", "Open until after oil check"], "ans": 0, "expl": "Nose section — right avionics door."}, {"q": "Total temperature (TOT) probe check:", "opts": ["Spin with finger like AOA", "Inspect for damage; ensure nothing obstructs free airflow", "Cover until after takeoff", "Only check if icing forecast"], "ans": 1, "expl": "TOT probe CONDITION."}, {"q": "Nose landing gear doors and linkages — look for:", "opts": ["Only the side number", "Only tire brand", "Only strut color", "Damage, loose fittings, or hydraulic leaks"], "ans": 3, "expl": "NLG doors/linkages."}, {"q": "Electric nose gear door motor safety pin should be:", "opts": ["Painted over", "Pulled and stowed", "Left in until after landing", "Installed for flight"], "ans": 1, "expl": "NLG door motor pin."}, {"q": "Nose landing gear door safety pin should be:", "opts": ["Wired to the holdback", "Installed red-streamered for flight", "Left in for field only", "Removed and stowed"], "ans": 3, "expl": "NLG door safety pin."}, {"q": "NLG tires — tread wear limit taught in the video:", "opts": ["Wear only matters on the mains", "Up to 50% groove depth OK", "Any wear OK if pressure is good", "Not worn below the grooves at any spot on the tires"], "ans": 3, "expl": "Tire tread criteria."}, {"q": "NLG tires also require checking:", "opts": ["Sufficient inflation", "Only the serial number", "Only the valve-cap color", "Only the green dots"], "ans": 0, "expl": "Tire inflation."}, {"q": "Field NLG strut extension target is about:", "opts": ["Two orange tabs only", "7/8 inch", "5.2 inches", "3.25 inches (about 4–5 fingers)"], "ans": 3, "expl": "Checklist/narration — field strut chrome."}, {"q": "Carrier (CV) NLG strut extension target is about:", "opts": ["7/8–1 7/8 inches", "5.2 inches", "Exactly one finger", "3.25 inches"], "ans": 1, "expl": "Checklist — 5.2 in for CV ops."}, {"q": "Launch bar on NLG — check:", "opts": ["Remove it for field takeoff", "Only electrical continuity", "Only that it is painted red", "General condition"], "ans": 3, "expl": "NLG checklist — launch bar."}, {"q": "Nosewheel steering assembly — ensure:", "opts": ["It is disconnected for taxi", "Full of jet fuel", "Safety-pinned for flight", "General condition and no visible hydraulic leaks"], "ans": 3, "expl": "NWS assembly."}, {"q": "Launch bar retract proximity switch — check:", "opts": ["Continuity with a multimeter every flight", "Oil saturation", "That it is removed", "General condition"], "ans": 3, "expl": "NLG checklist item."}, {"q": "Taxi/landing light — check:", "opts": ["Only after airborne", "Cover it for day VFR", "Not broken or cracked; for night ops, verify operation with the PC before pulling out of the line", "Ignore unless INOP light is on"], "ans": 2, "expl": "Taxi/landing light + night ops note."}, {"q": "Approach light assembly — inspect for:", "opts": ["Only bulb color", "Only wiring behind the panel", "Nothing — MX only", "Damage, cracks, or broken components"], "ans": 3, "expl": "Approach light CONDITION."}, {"q": "Pitot-static drain caps — ensure:", "opts": ["Safety-wired open", "Removed and discarded", "Free of debris or blockage", "Filled with grease"], "ans": 2, "expl": "Pitot-static drain caps CHECK."}, {"q": "Nose weight-on-wheels proximity switch — check:", "opts": ["Removed to pin bag", "Painted over", "That it is bypassed", "Good/general condition"], "ans": 3, "expl": "Nose WOW prox switch."}, {"q": "NLG external down-and-locked indicator proper indication is:", "opts": ["One green tab", "No tabs visible", "Two orange tabs showing (down and locked)", "Three red flags"], "ans": 2, "expl": "Two orange tabs = down and locked."}, {"q": "Holdback assembly check includes:", "opts": ["Remove it for field ops", "Kick it hard to full travel", "Only visual — never touch", "Look for damage and check freedom of motion with the toe of your bo let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= queue.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
