<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CO 1106 Exterior Preflight — T-45 Quiz</title>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">T-45 Local Quizzes</a> · Cockpit Orientation</div>
    <h1>CO 1106 Exterior Preflight</h1>
    <div class="meta">15 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 15</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Cockpit Orientation</div>
    <h2 style="margin:0.2rem 0">CO 1106 Exterior Preflight</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="index.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to Index</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="index.html">← All quizzes</a></div>
</div>
<script>
const QUESTIONS = [{"q": "Emergency oxygen bottle should read:", "opts": ["500–900 psi", "1800–2500 psi", "Exactly 3000 psi", "Any pressure if ring stowed"], "ans": 1, "expl": "Prelim cockpit check."}, {"q": "Carrier NLG strut extension target is about:", "opts": ["3.25 inches", "5.2 inches", "7/8 inch", "Two orange tabs only"], "ans": 1, "expl": "Field ~3.25 in; carrier 5.2 in."}, {"q": "HYD1 flight-control accumulator should indicate:", "opts": ["950 psi", "1100 ± 50 psi", "≥1300 psi", "Zero when cold"], "ans": 1, "expl": "Emer flap/brake accum is ≥1300."}, {"q": "If the pressure refueling point door is left open:", "opts": ["No effect", "Circuits can stay energized and drain the battery even with batt off", "Only HYD2 depletes", "Only affects night lights"], "ans": 1, "expl": "Cross-country dead-battery hazard."}, {"q": "Where is the ground wire located?", "opts": ["**1300 psi** or greater.", "Outside of the **left intake**.", "**1800–2500 psi**; grain ring stowed.", "** CO1106 Exterior Preflight"], "ans": 1, "expl": "Outside of the **left intake**."}, {"q": "Name the six pin locations?", "opts": ["Open door energizes circuits even with battery off → dead battery risk.", "L MLG lock link; NLG doors; NLG drag brace; NLG door motor; R MLG lock link; tailhook assembly.", "Front cockpit **clockwise**; rear **counterclockwise**; each does a full inspection.", "Circuits can stay energized and drain the battery even with batt off"], "ans": 1, "expl": "L MLG lock link; NLG doors; NLG drag brace; NLG door motor; R MLG lock link; tailhook assembly."}, {"q": "Emergency O2 bottle pressure band?", "opts": ["**1810–2500 psi**; grain ring stowed.", "**900–2500 psi**; grain ring stowed.", "**1800–2500 psi**; grain ring stowed.", "**3600–2500 psi**; grain ring stowed."], "ans": 2, "expl": "**1800–2500 psi**; grain ring stowed."}, {"q": "Preflight direction after FAM solo?", "opts": ["Open door energizes circuits even with battery off → dead battery risk.", "Front cockpit **clockwise**; rear **counterclockwise**; each does a full inspection.", "Circuits can stay energized and drain the battery even with batt off", "L MLG lock link; NLG doors; NLG drag brace; NLG door motor; R MLG lock link; tailhook assembly."], "ans": 1, "expl": "Front cockpit **clockwise**; rear **counterclockwise**; each does a full inspection."}, {"q": "Field vs carrier NLG strut extension?", "opts": ["~**1.6 in** (4–5 fingers) field; **5.2 in** carrier.", "~**3.25 in** (4–5 fingers) field; **5.2 in** carrier.", "~**13.2 in** (4–5 fingers) field; **5.2 in** carrier.", "~**6.5 in** (4–5 fingers) field; **5.2 in** carrier."], "ans": 1, "expl": "~**3.25 in** (4–5 fingers) field; **5.2 in** carrier."}, {"q": "HYD1 flight control accumulator pressure?", "opts": ["**1100 ± 50 psi**.", "**1110 ± 50 psi**.", "**550 ± 50 psi**.", "**2200 ± 50 psi**."], "ans": 0, "expl": "**1100 ± 50 psi**."}, {"q": "Emergency flap/brake accumulator minimum?", "opts": ["**1300 psi** or greater.", "**650 psi** or greater.", "**1310 psi** or greater.", "**2600 psi** or greater."], "ans": 0, "expl": "**1300 psi** or greater."}, {"q": "Brake wear indicator requirement?", "opts": ["Front cockpit **clockwise**; rear **counterclockwise**; each does a full inspection.", "Open door energizes circuits even with battery off → dead battery risk.", "Both pins **protruding** beyond recesses top and bottom of housing.", "Circuits can stay energized and drain the battery even with batt off"], "ans": 2, "expl": "Both pins **protruding** beyond recesses top and bottom of housing."}, {"q": "Hook damper pressure approx?", "opts": ["About **950 psi**; hook retracted and safety pin stowed.", "About **475 psi**; hook retracted and safety pin stowed.", "About **1900 psi**; hook retracted and safety pin stowed.", "About **960 psi**; hook retracted and safety pin stowed."], "ans": 0, "expl": "About **950 psi**; hook retracted and safety pin stowed."}, {"q": "Why close pressure refueling door?", "opts": ["Front cockpit **clockwise**; rear **counterclockwise**; each does a full inspection.", "Open door energizes circuits even with battery off → dead battery risk.", "Both pins **protruding** beyond recesses top and bottom of housing.", "Circuits can stay energized and drain the battery even with batt off"], "ans": 1, "expl": "Open door energizes circuits even with battery off → dead battery risk."}, {"q": "What is correct for: YouTube title?", "opts": ["** CO2212 Exterior Preflight", "** CO1106 Exterior Preflight", "** CO553 Exterior Preflight", "** CO1116 Exterior Preflight"], "ans": 1, "expl": "** CO1106 Exterior Preflight"}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= QUESTIONS.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
</html>
