}
.opt:hover:not(:disabled) { border-color: var(--accent); }

.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;

.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {

0. IDLE RPM....± 2% OF NATOPS"}, {"q": "Idle RPM on taxi back (CNATRA):", "opts": ["± 5% of NATOPS", "± 2% OF NATOPS", "± 2% of 70%", "exactly 52%"], "ans": 1, "expl": "CNATRA Ground Ops video (on-screen checklist): 10. IDLE RPM....± 2% OF NATOPS"}, {"q": "Engine Shutdown: items at 30 SECONDS AFTER PRK BRK SET:", "opts": ["BATT SWITCHES OFF", "GINA POWER OFF; LEFT MFD OFF", "FUEL SHUTOFF HANDLE PULL", "ENGINE SWITCH OFF"], "ans": 1, "expl": "CNATRA Ground Ops video (on-screen checklist): - 30 SECONDS AFTER PRK BRK SET: 6. GINA POWER....OFF 7. LEFT MFD....OFF"}, {"q": "Engine Shutdown: items at 45 SECONDS AFTER THROTTLE OFF (CNATRA order):", "opts": ["ENGINE SWITCH → BATT OFF", "ENGINE SWITCH (F/C ONLY) OFF → FUEL SHUTOFF HANDLE PULL → POS/FORM LIGHTS OFF → CHECK BRK PRESS ACCUM MIN 2700PSI", "GINA OFF → LEFT MFD OFF", "FUEL SHUTOFF PULL → ENGINE SWITCH OFF → CONTR AUG SBI"], "ans": 1, "expl": "CNATRA Ground Ops video (on-screen checklist): - 45 SECONDS AFTER THROTTLE OFF: 8. ENGINE SWITCH (F/C ONLY)....OFF 9. FUEL SHUTOFF HANDLE....PULL 10. POS/FORM LIGHTS....OFF 11. CHECK BRK PRESS ACCUM....MIN 2700PSI (Doc has Fuel Shutoff first, then Engine Switch)"}, {"q": "Narration: at 45 seconds after throttle off, in the forward cockpit turn off:", "opts": ["the pinky switch", "the GINA", "the engine switch as well as anti-skid switch", "the batteries"], "ans": 2, "expl": "CNATRA Ground Ops video (narration): Forty-five seconds after throttle off, turn the engine switch as well as anti-skid switch off in the forward cockpit."}, {"q": "PCU (control stick) check timing (CNATRA):", "opts": ["immediately after batteries off", "45 seconds after throttle off", "50 SECONDS AFTER THROTTLE OFF", "30 seconds after parking brake"], "ans": 2, "expl": "CNATRA Ground Ops video (on-screen checklist): - 50 SECONDS AFTER THROTTLE OFF: 12. CTRL STICK...1/2 Lat Defection at 1 cycle per 2 secs. Neutalize when HYD1 reaches 0 PSI"}, {"q": "Engine Shutdown items 13-14 (CNATRA):", "opts": ["GINA OFF; LMFD OFF", "BATT OFF; SEAT PINNED", "ENGINE SWITCH OFF; CONTR AUG SBI", "PINKY SWITCH OFF; CONSOLE/MIP LITS OFF"], "ans": 3, "expl": "CNATRA Ground Ops video (on-screen checklist): 13. PINKY SWITCH....OFF 14. CONSOLE/MIP LITS....OFF"}, {"q": "Engine Shutdown: MDL / VCR TAPE / USB:", "opts": ["Remove MDL before engine start", "MDL REMOVE • VCR TAPE REMOVE • USB/DOWNLOAD INSERT/INITIATE • USB DEVICE UNPLUG/STOW • CONTROL PANEL SECURE COVER", "USB at prestart only", "Leave MDL installed"], "ans": 1, "expl": "CNATRA Ground Ops video (on-screen checklist): 15. MDL....REMOVE VCR TAPE....REMOVE 17. USB/DOWNLOAD....INSERT/INITIATE USB DEVICE....UNPLUG/STOW CONTROL PANEL....SECURE COVER"}, {"q": "Final two CNATRA shutdown items:", "opts": ["ENGINE OFF; BATT OFF", "CANOPY CLOSED; SEAT SAFE", "BATT SWITCHES (2&2) OFF; SEAT/MDC PINNED", "SEAT/MDC PINNED; BATT OFF"], "ans": 2, "expl": "CNATRA Ground Ops video (on-screen checklist): 20. BATT SWITCHES (2&2)....OFF 21. SEAT/MDC....PINNED"}, {"q": "Narration: before the throttle-off call, the front seat says (shutdown):", "opts": ["“All my equipment's off ... I'll be clear of canopy and OBOGS on shutdown.” → “Roger.”", "“Engine off” → “Roger”", "“Ready to shut down” → “Clear”", "“Throttle off, canopy” → “Clear”"], "ans": 0, "expl": "CNATRA Ground Ops video (narration): All my equipment's off and back, I'll be clear of canopy and o-bogs on shutdown. / Roger. (ASR; Doc: “Throttle Off, Canopy” R/C “Clear”)"}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= queue.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
