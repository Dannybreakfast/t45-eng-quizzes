<title>ENG0102 (3) Electrical Controls, Switches, &amp; Indicators — T-45 Quiz</title>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>

 as forward.", "Momentary DIM dims warning/caution/advisory lights; to restore daylight intensity set MIP knob to OFF.", "Come on if MIP or console light switches are NOT set to OFF."], "ans": 0, "expl": "Spring-loaded to ON; RESET resets voltage regulator; OFF turns generator off."}, {"q": "What does the cockpit voltmeter read?", "opts": ["OFF (disconnect; select before starting GTS), NORMAL (energize aircraft if generator not running and external power quality OK), RESET (spring-loaded to NORMAL; must reset before applying external power).", "On nose gear; red/amber/green; AOA system when gear down and locked. Day/bright = MIP knob in detented OFF; night/dim = knob out of OFF + WARN/CAUT dim. Hook bypass CARRIER → flash if hook not down; FIELD → steady reg...", "ON (forward) = selected nav lights on; OFF (middle); AFT held = momentary nav lights (spring to OFF) — used to signal config changes at night when wingman is NORDO.", "Tied to 28 VDC essential services bus: generator voltage with GEN on, battery voltage with GEN off. Scale 21–29 V in 2 V increments; orange 21–24 (battery only), green 24–29 (generator or external power)."], "ans": 3, "expl": "Tied to 28 VDC essential services bus: generator voltage with GEN on, battery voltage with GEN off. Scale 21–29 V in 2 V increments; orange 21–24 (battery only), green 24–29 (generator or external power)."}, {"q": "Aft cockpit power panel?", "opts": ["Come on if MIP or console light switches are NOT set to OFF.", "Spring-loaded to ON; RESET resets voltage regulator; OFF turns generator off.", "Momentary DIM dims warning/caution/advisory lights; to restore daylight intensity set MIP knob to OFF.", "AC inverter reset, generator reset, and voltmeter — same functions as forward."], "ans": 3, "expl": "AC inverter reset, generator reset, and voltmeter — same functions as forward."}, {"q": "External lights Master on throttle (FWD cockpit)?", "opts": ["ON (forward) = selected nav lights on; OFF (middle); AFT held = momentary nav lights (spring to OFF) — used to signal config changes at night when wingman is NORDO.", "Landing/taxi ON/OFF; anti-collision/strobe BOTH / OFF / anti-collision only; nav FLASHING/AUTO or STEADY; tail/wing/formation BRIGHT / OFF / DIM.", "Glare shield both cockpits: upper green chevron, amber donut, lower red chevron; 4-position dim lever; press-to-test (lights test switch will NOT test indexer).", "A: DU, ADRS, HUD camera, SADS, forward left MFD. B: A plus the three remaining MFDs. C: yaw damper controller and GINA. D: C plus radar altimeter."], "ans": 0, "expl": "ON (forward) = selected nav lights on; OFF (middle); AFT held = momentary nav lights (spring to OFF) — used to signal config changes at night when wingman is NORDO."}, {"q": "AOA/approach lights control?", "opts": ["On nose gear; red/amber/green; AOA system when gear down and locked. Day/bright = MIP knob in detented OFF; night/dim = knob out of OFF + WARN/CAUT dim. Hook bypass CARRIER → flash if hook not down; FIELD → steady reg...", "Tied to 28 VDC essential services bus: generator voltage with GEN on, battery voltage with GEN off. Scale 21–29 V in 2 V increments; orange 21–24 (battery only), green 24–29 (generator or external power).", "OFF (disconnect; select before starting GTS), NORMAL (energize aircraft if generator not running and external power quality OK), RESET (spring-loaded to NORMAL; must reset before applying external power).", "ON (forward) = selected nav lights on; OFF (middle); AFT held = momentary nav lights (spring to OFF) — used to signal config changes at night when wingman is NORDO."], "ans": 0, "expl": "On nose gear; red/amber/green; AOA system when gear down and locked. Day/bright = MIP knob in detented OFF; night/dim = knob out of OFF + WARN/CAUT dim. Hook bypass CARRIER → flash if hook not down; FIELD → steady regardless of hook."}, {"q": "Exterior light switch row (right console outboard) highlights?", "opts": ["Landing/taxi ON/OFF; anti-collision/strobe BOTH / OFF / anti-collision only; nav FLASHING/AUTO or STEADY; tail/wing/formation BRIGHT / OFF / DIM.", "Forward cockpit, aft left bulkhead — apply external electrical power for ground maintenance so the engine/generator need not be running.", "A: DU, ADRS, HUD camera, SADS, forward left MFD. B: A plus the three remaining MFDs. C: yaw damper controller and GINA. D: C plus radar altimeter.", "UP = reset inverter 1; CENTER = normal; DOWN = reset inverter 2. Caution light does not say which inverter failed on a single failure."], "ans": 0, "expl": "Landing/taxi ON/OFF; anti-collision/strobe BOTH / OFF / anti-collision only; nav FLASHING/AUTO or STEADY; tail/wing/formation BRIGHT / OFF / DIM."}, {"q": "Instrument lights panel knobs?", "opts": ["Momentary DIM dims warning/caution/advisory lights; to restore daylight intensity set MIP knob to OFF.", "MIP (main instrument panel primary), Console (both consoles primary), Flood (secondary lights except map lights).", "Spring-loaded to ON; RESET resets voltage regulator; OFF turns generator off.", "AC inverter reset, generator reset, and voltmeter — same functions as forward."], "ans": 1, "expl": "MIP (main instrument panel primary), Console (both consoles primary), Flood (secondary lights except map lights)."}, {"q": "WARN/CAUT dim switch?", "opts": ["AC inverter reset, generator reset, and voltmeter — same functions as forward.", "Spring-loaded to ON; RESET resets voltage regulator; OFF turns generator off.", "MIP (main instrument panel primary), Console (both consoles primary), Flood (secondary lights except map lights).", "Momentary DIM dims warning/caution/advisory lights; to restore daylight intensity set MIP knob to OFF."], "ans": 3, "expl": "Momentary DIM dims warning/caution/advisory lights; to restore daylight intensity set MIP knob to OFF."}, {"q": "AOA indexer?", "opts": ["Landing/taxi ON/OFF; anti-collision/strobe BOTH / OFF / anti-collision only; nav FLASHING/AUTO or STEADY; tail/wing/formation BRIGHT / OFF / DIM.", "A: DU, ADRS, HUD camera, SADS, forward left MFD. B: A plus the three remaining MFDs. C: yaw damper controller and GINA. D: C plus radar altimeter.", "Glare shield both cockpits: upper green chevron, amber donut, lower red chevron; 4-position dim lever; press-to-test (lights test switch will NOT test indexer).", "ON (forward) = selected nav lights on; OFF (middle); AFT held = momentary nav lights (spring to OFF) — used to signal config changes at night when wingman is NORDO."], "ans": 2, "expl": "Glare shield both cockpits: upper green chevron, amber donut, lower red chevron; 4-position dim lever; press-to-test (lights test switch will NOT test indexer)."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= QUESTIONS.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
