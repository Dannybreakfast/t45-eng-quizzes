<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ENG0103 Electrical System Malfunctions — T-45 Quiz</title>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">Home</a> · <a href="section-eng.html">ENG</a> · Electrical</div>
    <h1>ENG0103 Electrical System Malfunctions</h1>
    <div class="meta">23 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 23</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Electrical</div>
    <h2 style="margin:0.2rem 0">ENG0103 Electrical System Malfunctions</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-eng.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to ENG</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="section-eng.html">← ENG</a> · <a href="index.html">Home</a></div>
</div>
<script>
const QUESTIONS = [{"q": "After GEN warning, left MFD:", "opts": ["Goes blank immediately forever", "Reverts to ADI for ~2 min unless display override", "Shows only radar altimeter", "Switches to right MFD bus"], "ans": 1, "expl": "Left MFD → ADI, powered ~2 minutes unless display override."}, {"q": "On battery-only power, prioritize securing:", "opts": ["Map lights", "Pitot heat (largest draw)", "Magnetic compass", "Standby VSI"], "ans": 1, "expl": "Pitot heat has the largest draw — secure if possible."}, {"q": "Dual AC inverter failure is indicated by AC inverter caution plus:", "opts": ["Loss of ATTK/AZIMUTH", "Green voltmeter", "Only F PRES", "Hook unlock"], "ans": 0, "expl": "Loss of attack and azimuth → dual failure."}, {"q": "Electrical servicing required when pre-start battery voltage is:", "opts": ["\u003c 30.2 V", "\u003c 28.2 V", "\u003c 24 V", "\u003c 16 V"], "ans": 2, "expl": "Servicing when battery voltage \u003c 24 VDC."}, {"q": "Two good batteries after generator loss provide about:", "opts": ["9 minutes", "12 minutes", "27 minutes", "45 minutes"], "ans": 2, "expl": "27 minutes both; 12 minutes one."}, {"q": "With total electrical failure, nosewheel steering is:", "opts": ["Available (hydraulic only)", "Not available (electrically actuated)", "Available in aft cockpit only", "Available above 45% N2 only"], "ans": 1, "expl": "NWS electrically actuated — lost in total electrical failure."}, {"q": "Overvoltage unit trip value to remember:", "opts": ["25 V", "24 V", "30.2 V", "16 V"], "ans": 2, "expl": "30.2 V overvoltage unit."}, {"q": "If you isolate the good battery while troubleshooting:", "opts": ["Nothing happens", "You can dump INS and cause total electrical failure until restored", "Inverters automatically swap", "External power connects airborne"], "ans": 1, "expl": "50/50 bad-battery isolation — wrong choice dumps INS / total electrical until good battery back ON."}, {"q": "Immediate display effects of a generator warning?", "opts": ["Standby VSI/airspeed/altitude (pitot-static), N2 tach, magnetic compass, emergency gear (mech/gravity), HYD 1/2 flight controls, standby gyro ~9 min, hook extend (no retract), normal brakes (HYD 1) without anti-skid.", "50/50 chance; isolating the good battery dumps INS and can cause total electrical failure until the good battery is restored.", "OVU 30.2 V; regulator ~27–29 V (lecture summary; earlier 28.2–29.2); UV 25 V; ≥24 V both batteries for engine start; 27 min / 12 min battery life.", "Lose both right MFDs; HUD drops offline; left MFD reverts to ADI and stays powered ~2 minutes unless display override selected. After 1.5 s delay: GEN warning + master alert + tone."], "ans": 3, "expl": "Lose both right MFDs; HUD drops offline; left MFD reverts to ADI and stays powered ~2 minutes unless display override selected. After 1.5 s delay: GEN warning + master alert + tone."}, {"q": "First confirmation after GEN warning?", "opts": ["Confirm your engine is running.", "Pitot heat (largest draw)", "Loss of ATTK and AZIMUTH → dual inverter failure.", "Loss of ATTK/AZIMUTH"], "ans": 0, "expl": "Confirm your engine is running."}, {"q": "Bad battery isolation risk?", "opts": ["OVU 30.2 V; regulator ~27–29 V (lecture summary; earlier 28.2–29.2); UV 25 V; ≥24 V both batteries for engine start; 27 min / 12 min battery life.", "Lose both right MFDs; HUD drops offline; left MFD reverts to ADI and stays powered ~2 minutes unless display override selected. After 1.5 s delay: GEN warning + master alert + tone.", "No flaps/slats (electrically actuated) → plan no-flap landing if flaps up; no trim; no nosewheel steering (electrically actuated).", "50/50 chance; isolating the good battery dumps INS and can cause total electrical failure until the good battery is restored."], "ans": 3, "expl": "50/50 chance; isolating the good battery dumps INS and can cause total electrical failure until the good battery is restored."}, {"q": "Largest electrical draw to secure on battery power?", "opts": ["You can dump INS and cause total electrical failure until restored", "F PRES caution + master alert + tone as boost pumps turn off to conserve battery.", "Battery voltage \u003c 24 VDC — charge with ground unit or replace bad battery/batteries.", "Pitot heat (secure if possible to conserve battery)."], "ans": 3, "expl": "Pitot heat (secure if possible to conserve battery)."}, {"q": "Differentiate single vs dual AC inverter caution?", "opts": ["Loss of ATTK/AZIMUTH", "Confirm your engine is running.", "Loss of ATTK and AZIMUTH → dual inverter failure.", "Pitot heat (largest draw)"], "ans": 2, "expl": "Loss of ATTK and AZIMUTH → dual inverter failure."}, {"q": "AC inverter caution with GEN warning?", "opts": ["Battery voltage \u003c 24 VDC — charge with ground unit or replace bad battery/batteries.", "NATOPS flight manual — understand essential vs non-essential to know what is lost/retained and land safely.", "Examples: VOR/ILS/marker beacon, DU, yaw damper, radar altimeter, instrument/console lights, formation lights.", "Will NOT illuminate because essential AC buses remain energized from battery-powered essential services bus."], "ans": 3, "expl": "Will NOT illuminate because essential AC buses remain energized from battery-powered essential services bus."}, {"q": "What non-essential AC losses follow GEN warning or single inverter loss?", "opts": ["Will NOT illuminate because essential AC buses remain energized from battery-powered essential services bus.", "Battery voltage \u003c 24 VDC — charge with ground unit or replace bad battery/batteries.", "Examples: VOR/ILS/marker beacon, DU, yaw damper, radar altimeter, instrument/console lights, formation lights.", "NATOPS flight manual — understand essential vs non-essential to know what is lost/retained and land safely."], "ans": 2, "expl": "Examples: VOR/ILS/marker beacon, DU, yaw damper, radar altimeter, instrument/console lights, formation lights."}, {"q": "CAUG caution with GEN warning?", "opts": ["Yes — available in the aft cockpit only.", "Yes — after selecting GAIN ORIDE.", "Yes — fully available with no limitations.", "Normal (loss of non-essential AC / yaw damper). After good GEN reset, still reset CAUG."], "ans": 3, "expl": "Normal (loss of non-essential AC / yaw damper). After good GEN reset, still reset CAUG."}, {"q": "If GEN not reset within 30 seconds?", "opts": ["F PRES caution + master alert + tone as boost pumps turn off to conserve battery.", "Battery voltage \u003c 24 VDC — charge with ground unit or replace bad battery/batteries.", "NATOPS flight manual — understand essential vs non-essential to know what is lost/retained and land safely.", "You can dump INS and cause total electrical failure until restored"], "ans": 0, "expl": "F PRES caution + master alert + tone as boost pumps turn off to conserve battery."}, {"q": "When is electrical servicing required (pre-start)?", "opts": ["NATOPS flight manual — understand essential vs non-essential to know what is lost/retained and land safely.", "You can dump INS and cause total electrical failure until restored", "F PRES caution + master alert + tone as boost pumps turn off to conserve battery.", "Battery voltage \u003c 24 VDC — charge with ground unit or replace bad battery/batteries."], "ans": 3, "expl": "Battery voltage \u003c 24 VDC — charge with ground unit or replace bad battery/batteries."}, {"q": "Battery endurance ratings to remember?", "opts": ["Two good batteries ≈ 54 min; one ≈ 12 min.", "Two good batteries ≈ 27 min; one ≈ 12 min.", "Two good batteries ≈ 13 min; one ≈ 12 min.", "Two good batteries ≈ 37 min; one ≈ 12 min."], "ans": 1, "expl": "Two good batteries ≈ 27 min; one ≈ 12 min."}, {"q": "Total electrical failure — still available (highlights)?", "opts": ["Lose both right MFDs; HUD drops offline; left MFD reverts to ADI and stays powered ~2 minutes unless display override selected. After 1.5 s delay: GEN warning + master alert + tone.", "OVU 30.2 V; regulator ~27–29 V (lecture summary; earlier 28.2–29.2); UV 25 V; ≥24 V both batteries for engine start; 27 min / 12 min battery life.", "Standby VSI/airspeed/altitude (pitot-static), N2 tach, magnetic compass, emergency gear (mech/gravity), HYD 1/2 flight controls, standby gyro ~9 min, hook extend (no retract), normal brakes (HYD 1) without anti-skid.", "50/50 chance; isolating the good battery dumps INS and can cause total electrical failure until the good battery is restored."], "ans": 2, "expl": "Standby VSI/airspeed/altitude (pitot-static), N2 tach, magnetic compass, emergency gear (mech/gravity), HYD 1/2 flight controls, standby gyro ~9 min, hook extend (no retract), normal brakes (HYD 1) without anti-skid."}, {"q": "Total electrical failure — lost / plan for?", "opts": ["Yes — after selecting GAIN ORIDE.", "Yes — fully available with no limitations.", "Yes — available in the aft cockpit only.", "No flaps/slats (electrically actuated) → plan no-flap landing if flaps up; no trim; no nosewheel steering (electrically actuated)."], "ans": 3, "expl": "No flaps/slats (electrically actuated) → plan no-flap landing if flaps up; no trim; no nosewheel steering (electrically actuated)."}, {"q": "Key numbers summary from lecture?", "opts": ["Lose both right MFDs; HUD drops offline; left MFD reverts to ADI and stays powered ~2 minutes unless display override selected. After 1.5 s delay: GEN warning + master alert + tone.", "OVU 30.2 V; regulator ~27–29 V (lecture summary; earlier 28.2–29.2); UV 25 V; ≥24 V both batteries for engine start; 27 min / 12 min battery life.", "Standby VSI/airspeed/altitude (pitot-static), N2 tach, magnetic compass, emergency gear (mech/gravity), HYD 1/2 flight controls, standby gyro ~9 min, hook extend (no retract), normal brakes (HYD 1) without anti-skid.", "50/50 chance; isolating the good battery dumps INS and can cause total electrical failure until the good battery is restored."], "ans": 1, "expl": "OVU 30.2 V; regulator ~27–29 V (lecture summary; earlier 28.2–29.2); UV 25 V; ≥24 V both batteries for engine start; 27 min / 12 min battery life."}, {"q": "Where is the authoritative reference?", "opts": ["Battery voltage \u003c 24 VDC — charge with ground unit or replace bad battery/batteries.", "NATOPS flight manual — understand essential vs non-essential to know what is lost/retained and land safely.", "Examples: VOR/ILS/marker beacon, DU, yaw damper, radar altimeter, instrument/console lights, formation lights.", "Will NOT illuminate because essential AC buses remain energized from battery-powered essential services bus."], "ans": 1, "expl": "NATOPS flight manual — understand essential vs non-essential to know what is lost/retained and land safely."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= QUESTIONS.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
