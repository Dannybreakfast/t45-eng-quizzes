<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ENG0119 Flight Instruments — T-45 Quiz</title>
<script src="auth.js"></script>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt span + span, #q-text { white-space: pre-line; }
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">Home</a> · <a href="section-eng.html">ENG</a> · Flight Instruments</div>
    <h1>ENG0119 Flight Instruments</h1>
    <div class="meta">24 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 24</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Flight Instruments</div>
    <h2 style="margin:0.2rem 0">ENG0119 Flight Instruments</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-eng.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to ENG</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="section-eng.html">← ENG</a> · <a href="index.html">Home</a></div>
</div>
<script>
const QUESTIONS = [{"q": "There is a HUD in:", "opts": ["Both cockpits", "Front cockpit only (HUD info can still be shown on MFDs)", "Rear cockpit only", "Neither — HUD is standby-only"], "ans": 1, "expl": "No HUD in rear; HUD info can be pulled up on any MFD."}, {"q": "After total electrical failure, the standby attitude indicator is guaranteed for about:", "opts": ["90 seconds", "9 minutes", "19 minutes", "Indefinitely"], "ans": 1, "expl": "~9 minutes after electrical power removed."}, {"q": "Multiple electronic displays fail / act up. Next step taught in the lecture:", "opts": ["Cycle only the HUD", "Reset the DEU via the display power switch", "Pull the RADALT CB", "Box MONO immediately"], "ans": 1, "expl": "DEU reset via display power switch for multi-display anomalies."}, {"q": "HYBD on the ADI auto-boxes when:", "opts": ["Weight on wheels", "Full INS alignment is attained (INS + HYBD pushtiles appear)", "Gear is raised", "CALT is entered"], "ans": 1, "expl": "Full alignment → INS and HYBD appear; HYBD auto-boxes."}, {"q": "VVI linear pointer limits are:", "opts": ["±9990 fpm", "−2000 to +1600 fpm", "±2000 fpm only", "0 to +6000 fpm"], "ans": 1, "expl": "Digital continues to ±9990 fpm."}, {"q": "Assigned altitude 7000 ft entered via CALT/DEP as:", "opts": ["7000", "700", "70", "7"], "ans": 2, "expl": "Flight Level protocol: 7K → 70; FL230 → 230; 2100 → 21."}, {"q": "MONO color selection is available:", "opts": ["Anytime in flight", "Weight-on-wheels only", "Only above 10,000 ft", "Only after DEU reset"], "ans": 1, "expl": "WOW only; locked once airborne."}, {"q": "TACAN symbology on the HSI is presented in:", "opts": ["Green", "Magenta", "Cyan", "White only"], "ans": 1, "expl": "TACAN magenta; VOR green."}, {"q": "On the 20 nm HSI scale, the aircraft-symbol wingspan represents:", "opts": ["2.5 nm", "3.0 nm", "6.0 nm", "10 nm"], "ans": 2, "expl": "Nose 2.5 nm; wingspan 6.0 nm (3 nm/wing)."}, {"q": "SEQ2 on the HSI is drawn as a:", "opts": ["Solid line", "Dashed line", "Dotted line", "Magenta arc"], "ans": 1, "expl": "SEQ1 solid, SEQ2 dashed, SEQ3 dotted."}, {"q": "What are the primary vs secondary T-45 flight instrument displays?", "opts": ["Primary: electronic — HUD + two MFCDs (front); two MFCDs rear (no HUD aft). Secondary: standby suite in both cockpits — ASI, VSI, altimeter, standby attitude indicator.", "Select that display OFF, wait about a minute, turn back ON. If still bad or fails again, leave OFF (possible overheating display assembly).", "Full INS alignment: both INS and HYBD appear top-center; HYBD auto-boxes when alignment complete and GPS updates are available (normal hybrid mode).", "Course-deviation sensitivity increases when going from normal to approach mode — not a sudden change in aircraft position relative to course."], "ans": 0, "expl": "Primary: electronic — HUD + two MFCDs (front); two MFCDs rear (no HUD aft). Secondary: standby suite in both cockpits — ASI, VSI, altimeter, standby attitude indicator."}, {"q": "How long is the standby attitude indicator guaranteed after total electrical failure?", "opts": ["About 9 minutes after electrical power is removed (other standby instruments continue to function).", "10° increments from 0–30°; 30° increments from 30–90°. Nose-up pitch ladder blue; nose-down orange.", "Box CRS, CDI, and a nav source (TCN, VOR, WYPT, ILS, or offset). CRS and HDG cannot be boxed simultaneously.", "Weight-on-wheels only (box MONO on ADI). Once airborne, MONO↔COLOR change is not available."], "ans": 0, "expl": "About 9 minutes after electrical power is removed (other standby instruments continue to function)."}, {"q": "Single HUD/MFD anomaly procedure?", "opts": ["GPS / Inertial Navigation Assembly — GPS antenna on top of fuselage just aft of the rear cockpit; GPS/INS assembly in the avionics bay.", "Course-deviation sensitivity increases when going from normal to approach mode — not a sudden change in aircraft position relative to course.", "Select that display OFF, wait about a minute, turn back ON. If still bad or fails again, leave OFF (possible overheating display assembly).", "When RADALT limits are exceeded (angle of bank, pitch, or altitude) — unit still functioning but out of limits for a numeric readout."], "ans": 2, "expl": "Select that display OFF, wait about a minute, turn back ON. If still bad or fails again, leave OFF (possible overheating display assembly)."}, {"q": "Multiple electronic-display anomaly?", "opts": ["Weight-on-wheels only", "Reset the DEU via the display power switch.", "Magenta", "Dashed line"], "ans": 1, "expl": "Reset the DEU via the display power switch."}, {"q": "What is GINA and where are its major parts?", "opts": ["Course-deviation sensitivity increases when going from normal to approach mode — not a sudden change in aircraft position relative to course.", "Select that display OFF, wait about a minute, turn back ON. If still bad or fails again, leave OFF (possible overheating display assembly).", "GPS / Inertial Navigation Assembly — GPS antenna on top of fuselage just aft of the rear cockpit; GPS/INS assembly in the avionics bay.", "When RADALT limits are exceeded (angle of bank, pitch, or altitude) — unit still functioning but out of limits for a numeric readout."], "ans": 2, "expl": "GPS / Inertial Navigation Assembly — GPS antenna on top of fuselage just aft of the rear cockpit; GPS/INS assembly in the avionics bay."}, {"q": "What do INS and HYBD pushtiles on the ADI mean?", "opts": ["Course-deviation sensitivity increases when going from normal to approach mode — not a sudden change in aircraft position relative to course.", "Full INS alignment: both INS and HYBD appear top-center; HYBD auto-boxes when alignment complete and GPS updates are available (normal hybrid mode).", "Select that display OFF, wait about a minute, turn back ON. If still bad or fails again, leave OFF (possible overheating display assembly).", "GPS / Inertial Navigation Assembly — GPS antenna on top of fuselage just aft of the rear cockpit; GPS/INS assembly in the avionics bay."], "ans": 1, "expl": "Full INS alignment: both INS and HYBD appear top-center; HYBD auto-boxes when alignment complete and GPS updates are available (normal hybrid mode)."}, {"q": "Where does ADI flight data come from?", "opts": ["Pitch, roll, heading, and vertical velocity from GINA; altitude and indicated airspeed from pitot-static instruments.", "About 9 minutes after electrical power is removed (other standby instruments continue to function).", "Box CRS, CDI, and a nav source (TCN, VOR, WYPT, ILS, or offset). CRS and HDG cannot be boxed simultaneously.", "10° increments from 0–30°; 30° increments from 30–90°. Nose-up pitch ladder blue; nose-down orange."], "ans": 0, "expl": "Pitch, roll, heading, and vertical velocity from GINA; altitude and indicated airspeed from pitot-static instruments."}, {"q": "VVI linear vs digital limits?", "opts": ["Linear pointer −2010 to +1600 fpm; digital readout continues to ±9990 fpm.", "Linear pointer −4000 to +1600 fpm; digital readout continues to ±9990 fpm.", "Linear pointer −2000 to +1600 fpm; digital readout continues to ±9990 fpm.", "Linear pointer −1000 to +1600 fpm; digital readout continues to ±9990 fpm."], "ans": 2, "expl": "Linear pointer −2000 to +1600 fpm; digital readout continues to ±9990 fpm."}, {"q": "When does RADALT show only “R”?", "opts": ["Course-deviation sensitivity increases when going from normal to approach mode — not a sudden change in aircraft position relative to course.", "When RADALT limits are exceeded (angle of bank, pitch, or altitude) — unit still functioning but out of limits for a numeric readout.", "Select that display OFF, wait about a minute, turn back ON. If still bad or fails again, leave OFF (possible overheating display assembly).", "GPS / Inertial Navigation Assembly — GPS antenna on top of fuselage just aft of the rear cockpit; GPS/INS assembly in the avionics bay."], "ans": 1, "expl": "When RADALT limits are exceeded (angle of bank, pitch, or altitude) — unit still functioning but out of limits for a numeric readout."}, {"q": "How do you enter Command Altitude (CALT)?", "opts": ["Select that display OFF, wait about a minute, turn back ON. If still bad or fails again, leave OFF (possible overheating display assembly).", "Box CALT on ADI → enter value on DEP scratchpad → ENTER. Use Flight Level protocol: FL230 → 230; 7000 ft → 70; 2100 ft → 21.", "GPS / Inertial Navigation Assembly — GPS antenna on top of fuselage just aft of the rear cockpit; GPS/INS assembly in the avionics bay.", "When RADALT limits are exceeded (angle of bank, pitch, or altitude) — unit still functioning but out of limits for a numeric readout."], "ans": 1, "expl": "Box CALT on ADI → enter value on DEP scratchpad → ENTER. Use Flight Level protocol: FL230 → 230; 7000 ft → 70; 2100 ft → 21."}, {"q": "Recommended Pitch Trim (PT) watermark setting?", "opts": ["PT = 0 (default) at all times.", "PT = 100 (default) at all times.", "PT = 1 (default) at all times.", "PT = 10 (default) at all times."], "ans": 0, "expl": "PT = 0 (default) at all times."}, {"q": "What does one needle-width on the spin/turn indicator mean?", "opts": ["One-half standard-rate turn. Slip ball is directly below the turn needle.", "Front cockpit only (HUD info can still be shown on MFDs)", "Full INS alignment is attained (INS + HYBD pushtiles appear)", "TACAN (needle, station, range/bearing/TTG) = magenta; VOR (needle, bearing) = green."], "ans": 0, "expl": "One-half standard-rate turn. Slip ball is directly below the turn needle."}, {"q": "AOB pointer scale?", "opts": ["About 9 minutes after electrical power is removed (other standby instruments continue to function).", "10° increments from 0–30°; 30° increments from 30–90°. Nose-up pitch ladder blue; nose-down orange.", "Weight-on-wheels only (box MONO on ADI). Once airborne, MONO↔COLOR change is not available.", "Box CRS, CDI, and a nav source (TCN, VOR, WYPT, ILS, or offset). CRS and HDG cannot be boxed simultaneously."], "ans": 1, "expl": "10° increments from 0–30°; 30° increments from 30–90°. Nose-up pitch ladder blue; nose-down orange."}, {"q": "When can you select MONO displays?", "opts": ["Weight-on-wheels only (box MONO on ADI). Once airborne, MONO↔COLOR change is not available.", "10° increments from 0–30°; 30° increments from 30–90°. Nose-up pitch ladder blue; nose-down orange.", "TACAN (needle, station, range/bearing/TTG) = magenta; VOR (needle, bearing) = green.", "About 9 minutes after electrical power is removed (other standby instruments continue to function)."], "ans": 0, "expl": "Weight-on-wheels only (box MONO on ADI). Once airborne, MONO↔COLOR change is not available."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= queue.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
</html>
