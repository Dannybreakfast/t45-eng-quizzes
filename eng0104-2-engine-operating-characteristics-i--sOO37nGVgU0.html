<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ENG0104 (2) Engine Operating Characteristics I — T-45 Quiz</title>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">T-45 Local Quizzes</a> · Engine</div>
    <h1>ENG0104 (2) Engine Operating Characteristics I</h1>
    <div class="meta">20 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 20</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Engine</div>
    <h2 style="margin:0.2rem 0">ENG0104 (2) Engine Operating Characteristics I</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="index.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to Index</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="index.html">← All quizzes</a></div>
</div>
<script>
const QUESTIONS = [{"q": "N2 percentage display goes up to:", "opts": ["100%", "112%", "115%", "120%"], "ans": 2, "expl": "N2 displayed 0–115% in 1% increments."}, {"q": "N1 percentage display goes up to:", "opts": ["100%", "112%", "115%", "120%"], "ans": 3, "expl": "N1 ranges 0–120%."}, {"q": "Maximum fuel quantity shown on the display?", "opts": ["2,400 lb", "3,000 lb", "3,306 lb", "4,000 lb"], "ans": 2, "expl": "0–3,306 pounds."}, {"q": "EPR on the T-45 engine display is:", "opts": ["Primary thrust limit", "Information only", "Only valid airborne", "Replaces EGT"], "ans": 1, "expl": "Provided for information only."}, {"q": "Digital T6 compared to analog EGT:", "opts": ["Always identical", "Will not match", "Higher by fixed 50 °C", "Only shown WOW"], "ans": 1, "expl": "Lecture notes digital will not match analog EGT."}, {"q": "PLA (power lever angle) is available:", "opts": ["Always", "Only airborne", "Only weight on wheels", "Only above 70% N2"], "ans": 2, "expl": "Available only with weight on wheels."}, {"q": "P3 compressor discharge pressure range?", "opts": ["0–50 psi", "0–100 psi", "0–250 psi", "0–1,000 psi"], "ans": 2, "expl": "0–250 psi in 1 psi increments."}, {"q": "Fuel flow display upper end?", "opts": ["1,000 pph", "3,306 pph", "7,000 pph", "15,000 pph"], "ans": 2, "expl": "1–7,000 pounds per hour."}, {"q": "Engine flow path order (high level)?", "opts": ["2-stage N1 → bypass for cooling + core through 5-stage N2 → combust → turbines → mix in exhaust → tailpipe.", "Intake → 2-stage N1 → bypass duct + core through 5-stage N2 → combustion → turbines → mix bypass/core in exhaust → tailpipe.", "High-pressure compressor discharge pressure 0–250 psi in 1 psi increments.", "Digital T6 (0–1000 °C from ADR/ASDC/digital data) will NOT match the analog EGT gauge."], "ans": 1, "expl": "Intake → 2-stage N1 → bypass duct + core through 5-stage N2 → combustion → turbines → mix bypass/core in exhaust → tailpipe."}, {"q": "N2 RPM display range?", "opts": ["100–115% in 1% increments.", "1–115% in 1% increments.", "0–115% in 1% increments.", "10–115% in 1% increments."], "ans": 2, "expl": "0–115% in 1% increments."}, {"q": "Fuel flow display range?", "opts": ["101–7,000 pounds per hour in 1 pph increments.", "11–7,000 pounds per hour in 1 pph increments.", "1–7,000 pounds per hour in 1 pph increments.", "2–7,000 pounds per hour in 1 pph increments."], "ans": 2, "expl": "1–7,000 pounds per hour in 1 pph increments."}, {"q": "Internal fuel quantity display range?", "opts": ["100–3,306 pounds in 1 lb increments.", "0–3,306 pounds in 1 lb increments.", "1–3,306 pounds in 1 lb increments.", "10–3,306 pounds in 1 lb increments."], "ans": 1, "expl": "0–3,306 pounds in 1 lb increments."}, {"q": "N1 RPM display range?", "opts": ["0–120% in 1% increments.", "100–120% in 1% increments.", "1–120% in 1% increments.", "10–120% in 1% increments."], "ans": 0, "expl": "0–120% in 1% increments."}, {"q": "TAT display range and purpose?", "opts": ["−120 to +99 °C in 1 °C increments; indicates icing conditions.", "−60 to +99 °C in 1 °C increments; indicates icing conditions.", "−70 to +99 °C in 1 °C increments; indicates icing conditions.", "−30 to +99 °C in 1 °C increments; indicates icing conditions."], "ans": 1, "expl": "−60 to +99 °C in 1 °C increments; indicates icing conditions."}, {"q": "Is EPR a primary limit instrument?", "opts": ["Yes — available in the aft cockpit only.", "Yes — fully available with no limitations.", "No — EPR 0–9.99 (0.01 increments) is provided for information only.", "Yes — after selecting GAIN ORIDE."], "ans": 2, "expl": "No — EPR 0–9.99 (0.01 increments) is provided for information only."}, {"q": "Digital T6 vs analog EGT?", "opts": ["No — EPR 0–9.99 (0.01 increments) is provided for information only.", "High-pressure compressor discharge pressure 0–250 psi in 1 psi increments.", "Digital T6 (0–1000 °C from ADR/ASDC/digital data) will NOT match the analog EGT gauge.", "2-stage N1 → bypass for cooling + core through 5-stage N2 → combust → turbines → mix in exhaust → tailpipe."], "ans": 2, "expl": "Digital T6 (0–1000 °C from ADR/ASDC/digital data) will NOT match the analog EGT gauge."}, {"q": "P3 display?", "opts": ["High-pressure compressor discharge pressure 1–250 psi in 1 psi increments.", "High-pressure compressor discharge pressure 0–250 psi in 1 psi increments.", "High-pressure compressor discharge pressure 100–250 psi in 1 psi increments.", "High-pressure compressor discharge pressure 10–250 psi in 1 psi increments."], "ans": 1, "expl": "High-pressure compressor discharge pressure 0–250 psi in 1 psi increments."}, {"q": "When is PLA available?", "opts": ["Power lever angle 10–48° — available only with weight on wheels.", "Power lever angle 100–48° — available only with weight on wheels.", "Power lever angle 1–48° — available only with weight on wheels.", "Power lever angle 0–48° — available only with weight on wheels."], "ans": 3, "expl": "Power lever angle 0–48° — available only with weight on wheels."}, {"q": "Which analog gauges are on the right side of the display slide?", "opts": ["Fuel flow, fuel quantity, N1 and EGT indicators.", "Fuel flow, fuel quantity, N2, and EGT indicators.", "Fuel flow, fuel quantity, N12 and EGT indicators.", "Fuel flow, fuel quantity, N4 and EGT indicators."], "ans": 1, "expl": "Fuel flow, fuel quantity, N2, and EGT indicators."}, {"q": "When Flow path: intake, what happens?", "opts": ["2-stage N1 → bypass for cooling + core through 5-stage N2 → combust → turbines → mix in exhaust → tailpipe.", "Intake → 2-stage N1 → bypass duct + core through 5-stage N2 → combustion → turbines → mix bypass/core in exhaust → tailpipe.", "High-pressure compressor discharge pressure 0–250 psi in 1 psi increments.", "Digital T6 (0–1000 °C from ADR/ASDC/digital data) will NOT match the analog EGT gauge."], "ans": 0, "expl": "2-stage N1 → bypass for cooling + core through 5-stage N2 → combust → turbines → mix in exhaust → tailpipe."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= QUESTIONS.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
</html>
