<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ENG0115-16 Egress System VBT — T-45 Quiz</title>
<script src="auth.js"></script>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt span + span, #q-text { white-space: pre-line; }
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">Home</a> · <a href="section-eng.html">ENG</a> · Egress</div>
    <h1>ENG0115-16 Egress System VBT</h1>
    <div class="meta">24 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 24</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Egress</div>
    <h2 style="margin:0.2rem 0">ENG0115-16 Egress System VBT</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-eng.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to ENG</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="section-eng.html">← ENG</a> · <a href="index.html">Home</a></div>
</div>
<script>
const QUESTIONS = [{"q": "Aft windscreen primary roles?", "opts": ["HUD glass only", "Cockpit separation + aft windblast protection if fwd windscreen fails", "MDC storage only", "Pressurization seal only"], "ans": 1, "expl": "Separation + aft windblast protection."}, {"q": "Canopy hinges are on which side?", "opts": ["Left", "Right", "Forward", "Aft centerline"], "ans": 1, "expl": "Four hinges on the right side."}, {"q": "SEAT caution SOLO switch effect?", "opts": ["Disables all SEAT cautions", "Illuminates only for front seat SAFE + \u003e~60% N2", "Arms aft seat", "Fires MDC"], "ans": 1, "expl": "SOLO watches front seat SAFE only."}, {"q": "Each MDC initiation manifold fires:", "opts": ["One end only", "Both ends of the MDC circuit", "Only peripheral MDC", "Only SMDC"], "ans": 1, "expl": "Both ends for redundancy if cord broken."}, {"q": "Parachute visibility / backup through canopy?", "opts": ["Visible packed on back; no breakers", "Packed in metal headbox (not visible); two canopy breakers for backup mode", "External pack only", "No parachute — drogue only"], "ans": 1, "expl": "Headbox pack + canopy breakers."}, {"q": "Command FWD BOTH/AFT SELF: aft handle does what?", "opts": ["Ejects both with 0.4 s delay", "Ejects aft only", "Ejects fwd only", "Arms MDC only"], "ans": 1, "expl": "Aft self only in that mode."}, {"q": "Mode 1 airspeed/altitude gate?", "opts": ["\u003c18k / any speed", "\u003c8k and \u003c300 KIAS", "\u003e18k only", "Gear down only"], "ans": 1, "expl": "\u003c8,000 ft and \u003c300 KIAS."}, {"q": "EOS and OBOGS interaction note?", "opts": ["EOS blocked if OBOGS ON", "Shuttle valve sends higher pressure source to mask; place OBOGS FLOW OFF when EOS activated for undiluted O2", "Must select OBOGS MAX", "No interaction"], "ans": 1, "expl": "Shuttle valve; OBOGS FLOW OFF with EOS."}, {"q": "IFF on dual command sequence?", "opts": ["7500", "7600", "7700", "Off"], "ans": 2, "expl": "Squawk 7700."}, {"q": "Solo flight command selector?", "opts": ["BOTH without collar", "SOLO with collar installed", "FWD BOTH only", "Any position"], "ans": 1, "expl": "SOLO + collar required to stay in SOLO."}, {"q": "NACES zero/zero meaning?", "opts": ["Ejection capability at zero airspeed and zero altitude (and throughout the envelope); cartridge-operated, rocket-assisted, automatic electronic sequencing.", "Never MOR in flight. One armed + one safe → armed can eject both. Manual seat/man sep below 14k MSL if terrain allows. No manual bailout.", "Don’t delay below 2,000 ft AGL; if descending out of control, eject by 10,000 ft AGL; zoom climb useful when time allows.", "CANOPY unlocked → Master Alert/tone if throttle \u003e~95% N2. SEAT: SAFE + throttle \u003e~60% N2 (NORM either seat; SOLO front only)."], "ans": 0, "expl": "Ejection capability at zero airspeed and zero altitude (and throughout the envelope); cartridge-operated, rocket-assisted, automatic electronic sequencing."}, {"q": "How is canopy lock verified visually?", "opts": ["Shuttle valve sends higher pressure source to mask; place OBOGS FLOW OFF when EOS activated for undiluted O2", "Mode 1: \u003c8k & \u003c300 KIAS; bridles off at 0.32 s then chute. Mode 5: \u003e18k; ride drogue to 18k then separate.", "Aft immediate, fwd 0.4 s later. Fwd initiation also routed through 0.5 s delay cartridge as backup.", "Safety catch fully obscures UNLOCKED label in each cockpit; any visible part of UNLOCKED means not locked."], "ans": 3, "expl": "Safety catch fully obscures UNLOCKED label in each cockpit; any visible part of UNLOCKED means not locked."}, {"q": "CANOPY vs SEAT caution throttle trips?", "opts": ["Ejection capability at zero airspeed and zero altitude (and throughout the envelope); cartridge-operated, rocket-assisted, automatic electronic sequencing.", "Don’t delay below 2,000 ft AGL; if descending out of control, eject by 10,000 ft AGL; zoom climb useful when time allows.", "CANOPY unlocked → Master Alert/tone if throttle \u003e~95% N2. SEAT: SAFE + throttle \u003e~60% N2 (NORM either seat; SOLO front only).", "Never MOR in flight. One armed + one safe → armed can eject both. Manual seat/man sep below 14k MSL if terrain allows. No manual bailout."], "ans": 2, "expl": "CANOPY unlocked → Master Alert/tone if throttle \u003e~95% N2. SEAT: SAFE + throttle \u003e~60% N2 (NORM either seat; SOLO front only)."}, {"q": "Manual MDC handle effect and travel?", "opts": ["Mode 1: \u003c8k & \u003c300 KIAS; bridles off at 0.32 s then chute. Mode 5: \u003e18k; ride drogue to 18k then separate.", "Either cockpit handle fires both MDC circuits. ~4 in travel; last ~1 in initiates. Remove safety pins before flight.", "Shuttle valve sends higher pressure source to mask; place OBOGS FLOW OFF when EOS activated for undiluted O2", "Safety catch fully obscures UNLOCKED label in each cockpit; any visible part of UNLOCKED means not locked."], "ans": 1, "expl": "Either cockpit handle fires both MDC circuits. ~4 in travel; last ~1 in initiates. Remove safety pins before flight."}, {"q": "Seat designations and five assemblies?", "opts": ["SJU-17A(V)5/A fwd, (V)6/A aft. Catapult, main beams, seat bucket, parachute, survival kit.", "Spigot indicator flush with top latch plunger. Thermal batteries white or light pink stripes.", "FULL 1,800–2,500 psi (REFILL 0–1,800). ~10–15 min at ≥10k cabin; may be ≤6 min low altitude.", "Seat pitot assemblies + thermal batteries only — not GINA/ADC/SADS/aircraft pitot-static."], "ans": 0, "expl": "SJU-17A(V)5/A fwd, (V)6/A aft. Catapult, main beams, seat bucket, parachute, survival kit."}, {"q": "Sequencer air data source?", "opts": ["Spigot indicator flush with top latch plunger. Thermal batteries white or light pink stripes.", "SJU-17A(V)5/A fwd, (V)6/A aft. Catapult, main beams, seat bucket, parachute, survival kit.", "FULL 1,800–2,500 psi (REFILL 0–1,800). ~10–15 min at ≥10k cabin; may be ≤6 min low altitude.", "Seat pitot assemblies + thermal batteries only — not GINA/ADC/SADS/aircraft pitot-static."], "ans": 3, "expl": "Seat pitot assemblies + thermal batteries only — not GINA/ADC/SADS/aircraft pitot-static."}, {"q": "Barostatic release three paths?", "opts": ["FULL 1,800–2,500 psi (REFILL 0–1,800). ~10–15 min at ≥10k cabin; may be ≤6 min low altitude.", "Aft immediate, fwd 0.4 s later. Fwd initiation also routed through 0.5 s delay cartridge as backup.", "Electronic sequencer at 18,000 ft; mechanical barostat 14–16,000 ft; MOR 4-second delay cartridge.", "Spigot indicator flush with top latch plunger. Thermal batteries white or light pink stripes."], "ans": 2, "expl": "Electronic sequencer at 18,000 ft; mechanical barostat 14–16,000 ft; MOR 4-second delay cartridge."}, {"q": "Ejection handle forces and travel?", "opts": ["~1 in; last 1 in fires. 25–40 lb to extract; 30–60 lb to initiate.", "~3 in; last 1 in fires. 25–40 lb to extract; 30–60 lb to initiate.", "~6 in; last 1 in fires. 25–40 lb to extract; 30–60 lb to initiate.", "~13 in; last 1 in fires. 25–40 lb to extract; 30–60 lb to initiate."], "ans": 1, "expl": "~3 in; last 1 in fires. 25–40 lb to extract; 30–60 lb to initiate."}, {"q": "Command ejection BOTH timing and backups?", "opts": ["Safety catch fully obscures UNLOCKED label in each cockpit; any visible part of UNLOCKED means not locked.", "Aft immediate, fwd 0.4 s later. Fwd initiation also routed through 0.5 s delay cartridge as backup.", "Spigot indicator flush with top latch plunger. Thermal batteries white or light pink stripes.", "Electronic sequencer at 18,000 ft; mechanical barostat 14–16,000 ft; MOR 4-second delay cartridge."], "ans": 1, "expl": "Aft immediate, fwd 0.4 s later. Fwd initiation also routed through 0.5 s delay cartridge as backup."}, {"q": "Mode 1 vs Mode 5 essentials?", "opts": ["Safety catch fully obscures UNLOCKED label in each cockpit; any visible part of UNLOCKED means not locked.", "Aft immediate, fwd 0.4 s later. Fwd initiation also routed through 0.5 s delay cartridge as backup.", "Mode 1: \u003c8k & \u003c300 KIAS; bridles off at 0.32 s then chute. Mode 5: \u003e18k; ride drogue to 18k then separate.", "Shuttle valve sends higher pressure source to mask; place OBOGS FLOW OFF when EOS activated for undiluted O2"], "ans": 2, "expl": "Mode 1: \u003c8k & \u003c300 KIAS; bridles off at 0.32 s then chute. Mode 5: \u003e18k; ride drogue to 18k then separate."}, {"q": "EOS servicing band and duration?", "opts": ["Seat pitot assemblies + thermal batteries only — not GINA/ADC/SADS/aircraft pitot-static.", "FULL 1,800–2,500 psi (REFILL 0–1,800). ~10–15 min at ≥10k cabin; may be ≤6 min low altitude.", "Spigot indicator flush with top latch plunger. Thermal batteries white or light pink stripes.", "SJU-17A(V)5/A fwd, (V)6/A aft. Catapult, main beams, seat bucket, parachute, survival kit."], "ans": 1, "expl": "FULL 1,800–2,500 psi (REFILL 0–1,800). ~10–15 min at ≥10k cabin; may be ≤6 min low altitude."}, {"q": "Critical MOR / armed-seat warnings?", "opts": ["Don’t delay below 2,000 ft AGL; if descending out of control, eject by 10,000 ft AGL; zoom climb useful when time allows.", "CANOPY unlocked → Master Alert/tone if throttle \u003e~95% N2. SEAT: SAFE + throttle \u003e~60% N2 (NORM either seat; SOLO front only).", "Ejection capability at zero airspeed and zero altitude (and throughout the envelope); cartridge-operated, rocket-assisted, automatic electronic sequencing.", "Never MOR in flight. One armed + one safe → armed can eject both. Manual seat/man sep below 14k MSL if terrain allows. No manual bailout."], "ans": 3, "expl": "Never MOR in flight. One armed + one safe → armed can eject both. Manual seat/man sep below 14k MSL if terrain allows. No manual bailout."}, {"q": "Envelope decision altitudes from VBT?", "opts": ["Don’t delay below 2,000 ft AGL; if descending out of control, eject by 10,000 ft AGL; zoom climb useful when time allows.", "CANOPY unlocked → Master Alert/tone if throttle \u003e~95% N2. SEAT: SAFE + throttle \u003e~60% N2 (NORM either seat; SOLO front only).", "Ejection capability at zero airspeed and zero altitude (and throughout the envelope); cartridge-operated, rocket-assisted, automatic electronic sequencing.", "Never MOR in flight. One armed + one safe → armed can eject both. Manual seat/man sep below 14k MSL if terrain allows. No manual bailout."], "ans": 0, "expl": "Don’t delay below 2,000 ft AGL; if descending out of control, eject by 10,000 ft AGL; zoom climb useful when time allows."}, {"q": "Top latch and thermal battery preflight?", "opts": ["Seat pitot assemblies + thermal batteries only — not GINA/ADC/SADS/aircraft pitot-static.", "Spigot indicator flush with top latch plunger. Thermal batteries white or light pink stripes.", "FULL 1,800–2,500 psi (REFILL 0–1,800). ~10–15 min at ≥10k cabin; may be ≤6 min low altitude.", "SJU-17A(V)5/A fwd, (V)6/A aft. Catapult, main beams, seat bucket, parachute, survival kit."], "ans": 1, "expl": "Spigot indicator flush with top latch plunger. Thermal batteries white or light pink stripes."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= queue.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
