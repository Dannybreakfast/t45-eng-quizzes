<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AERO 0101 General Aerodynamics Review — T-45 Quiz</title>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">T-45 Local Quizzes</a> · Aerodynamics</div>
    <h1>AERO 0101 General Aerodynamics Review</h1>
    <div class="meta">23 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 23</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Aerodynamics</div>
    <h2 style="margin:0.2rem 0">AERO 0101 General Aerodynamics Review</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="index.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to Index</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="index.html">← All quizzes</a></div>
</div>
<script>
const QUESTIONS = [{"q": "T-45 critical Mach number (first local sonic flow) is approximately:", "opts": ["0.67", "0.80", "0.95", "1.20"], "ans": 1, "expl": "Critical Mach ≈ 0.8."}, {"q": "Force-divergent Mach for the T-45 is approximately:", "opts": ["0.67", "0.80", "0.85", "1.04"], "ans": 2, "expl": "Force divergence ≈ 0.85."}, {"q": "Speed of sound depends primarily on:", "opts": ["Pressure only", "Density only", "Temperature only", "Mach number"], "ans": 2, "expl": "a = f(temperature only)."}, {"q": "Mid-span vortex pitch sensitivity band is roughly:", "opts": ["0.50–0.60 M", "0.67–0.70 M", "0.84–0.87 M", "1.2–1.3 M"], "ans": 2, "expl": "Mid-span vortex ≈ 0.84–0.87 M."}, {"q": "Aero-center movement in local-supersonic wing flow tends to cause:", "opts": ["Nose-up pitch", "Nose tuck (nose-down)", "Pure roll", "Dutch roll only"], "ans": 1, "expl": "Aero center aft → nose tuck."}, {"q": "Pure-supersonic regime (all local flow \u003e a) typically begins near:", "opts": ["0.8 M", "0.85 M", "1.04 M", "1.2–1.3 M"], "ans": 3, "expl": "Pure sonic ~1.2–1.3 M."}, {"q": "WWII “aileron reversal” / control fade was largely due to:", "opts": ["Hydraulic failure", "Local shocks + separated flow over controls / wing twist", "Icing only", "Propeller torque only"], "ans": 1, "expl": "Transonic local shocks / separation / flexibility."}, {"q": "Fastest Mach cited for T-45 flight test:", "opts": ["0.85", "0.95", "1.04", "1.30"], "ans": 2, "expl": "~1.04 M max observed."}, {"q": "T-45 critical Mach and force-divergent Mach?", "opts": ["increased horiz-tail downwash → pitch sensitive; \u003e4G dive pullout / ~3 lb stick → +1–3G excursion risk; uneven CL drop → heavy wing (covered further in 0102).", "Typically ~**1.2–1.3 M** when **all** local flow \u003e a. Fastest T-45 has gone ≈ **1.04 M**; cannot sustain pure supersonic / level-flight push through divergence.", "Critical Mach ≈ **0.8** (first local sonic flow, outer panels / gear blisters). Force-divergent Mach ≈ **0.85** (CD rises steeply with shock growth).", "Separated air **behind shock waves** — described as light chop on T-45 (some types hammer harder; dedicated sonic designs may feel little)."], "ans": 2, "expl": "Critical Mach ≈ **0.8** (first local sonic flow, outer panels / gear blisters). Force-divergent Mach ≈ **0.85** (CD rises steeply with shock growth)."}, {"q": "When is flow “purely supersonic,” and can the T-45 get there?", "opts": ["increased horiz-tail downwash → pitch sensitive; \u003e4G dive pullout / ~3 lb stick → +1–3G excursion risk; uneven CL drop → heavy wing (covered further in 0102).", "≈ **0.84–0.87 M**. Acts like aero fence → extra tail downwash → pitch hypersensitive; slight stick (~3 lb) can add **+1–3 G**; \u003e4G dive pullouts risk overstress.", "Typically ~**1.2–1.3 M** when **all** local flow \u003e a. Fastest T-45 has gone ≈ **1.04 M**; cannot sustain pure supersonic / level-flight push through divergence.", "**Normal** shock: larger energy loss, larger separation. **Oblique** (esp. attached sharp LE): less energy loss, less separation — preferred for pure-supersonic design."], "ans": 2, "expl": "Typically ~**1.2–1.3 M** when **all** local flow \u003e a. Fastest T-45 has gone ≈ **1.04 M**; cannot sustain pure supersonic / level-flight push through divergence."}, {"q": "Speed of sound dependence and example values?", "opts": ["**Outer wing panels** (higher camber than inboard) and **main-gear door blisters**.", "Sustained **supersonic without afterburner**. Examples cited: Concorde, F-22, F-14B/D with larger engines.", "Function of **temperature only**. SL std (~59 °F/15 °C) ≈ **662 kt**; tropopause ~35,000 ft (−60 °C) ≈ **570 kt** TAS.", "T-6 limit cited ≈ **360 KIAS / 0.67 IMN**. T-45 lives into the **transonic** regime (~0.8 M critical)."], "ans": 2, "expl": "Function of **temperature only**. SL std (~59 °F/15 °C) ≈ **662 kt**; tropopause ~35,000 ft (−60 °C) ≈ **570 kt** TAS."}, {"q": "Why did WWII fighters see tuck / aileron reversal below Mach 1?", "opts": ["≈ **0.84–0.87 M**. Acts like aero fence → extra tail downwash → pitch hypersensitive; slight stick (~3 lb) can add **+1–3 G**; \u003e4G dive pullouts risk overstress.", "Local **transonic** flow over cambered surfaces → shocks + separated air over controls; aero center aft → nose tuck; ailerons in separated wake ineffective / reversal risk with flexible wings.", "**Normal** shock: larger energy loss, larger separation. **Oblique** (esp. attached sharp LE): less energy loss, less separation — preferred for pure-supersonic design.", "Typically ~**1.2–1.3 M** when **all** local flow \u003e a. Fastest T-45 has gone ≈ **1.04 M**; cannot sustain pure supersonic / level-flight push through divergence."], "ans": 1, "expl": "Local **transonic** flow over cambered surfaces → shocks + separated air over controls; aero center aft → nose tuck; ailerons in separated wake ineffective / reversal risk with flexible wings."}, {"q": "Where does T-45 first see local sonic flow?", "opts": ["T-6 limit cited ≈ **360 KIAS / 0.67 IMN**. T-45 lives into the **transonic** regime (~0.8 M critical).", "Local shocks + separated flow over controls / wing twist", "**Outer wing panels** (higher camber than inboard) and **main-gear door blisters**.", "Sustained **supersonic without afterburner**. Examples cited: Concorde, F-22, F-14B/D with larger engines."], "ans": 2, "expl": "**Outer wing panels** (higher camber than inboard) and **main-gear door blisters**."}, {"q": "Mid-span vortex Mach band and hazard?", "opts": ["Typically ~**1.2–1.3 M** when **all** local flow \u003e a. Fastest T-45 has gone ≈ **1.04 M**; cannot sustain pure supersonic / level-flight push through divergence.", "≈ **0.84–0.87 M**. Acts like aero fence → extra tail downwash → pitch hypersensitive; slight stick (~3 lb) can add **+1–3 G**; \u003e4G dive pullouts risk overstress.", "increased horiz-tail downwash → pitch sensitive; \u003e4G dive pullout / ~3 lb stick → +1–3G excursion risk; uneven CL drop → heavy wing (covered further in 0102).", "**Normal** shock: larger energy loss, larger separation. **Oblique** (esp. attached sharp LE): less energy loss, less separation — preferred for pure-supersonic design."], "ans": 1, "expl": "≈ **0.84–0.87 M**. Acts like aero fence → extra tail downwash → pitch hypersensitive; slight stick (~3 lb) can add **+1–3 G**; \u003e4G dive pullouts risk overstress."}, {"q": "Normal vs oblique shock (energy / separation)?", "opts": ["≈ **0.84–0.87 M**. Acts like aero fence → extra tail downwash → pitch hypersensitive; slight stick (~3 lb) can add **+1–3 G**; \u003e4G dive pullouts risk overstress.", "Typically ~**1.2–1.3 M** when **all** local flow \u003e a. Fastest T-45 has gone ≈ **1.04 M**; cannot sustain pure supersonic / level-flight push through divergence.", "increased horiz-tail downwash → pitch sensitive; \u003e4G dive pullout / ~3 lb stick → +1–3G excursion risk; uneven CL drop → heavy wing (covered further in 0102).", "**Normal** shock: larger energy loss, larger separation. **Oblique** (esp. attached sharp LE): less energy loss, less separation — preferred for pure-supersonic design."], "ans": 3, "expl": "**Normal** shock: larger energy loss, larger separation. **Oblique** (esp. attached sharp LE): less energy loss, less separation — preferred for pure-supersonic design."}, {"q": "Super-cruise (definition / examples)?", "opts": ["Sustained **supersonic without afterburner**. Examples cited: Concorde, F-22, F-14B/D with larger engines.", "Function of **temperature only**. SL std (~59 °F/15 °C) ≈ **662 kt**; tropopause ~35,000 ft (−60 °C) ≈ **570 kt** TAS.", "**Outer wing panels** (higher camber than inboard) and **main-gear door blisters**.", "T-6 limit cited ≈ **360 KIAS / 0.67 IMN**. T-45 lives into the **transonic** regime (~0.8 M critical)."], "ans": 0, "expl": "Sustained **supersonic without afterburner**. Examples cited: Concorde, F-22, F-14B/D with larger engines."}, {"q": "T-6 vs T-45 speed context in this lecture?", "opts": ["T-6 limit cited ≈ **360 KIAS / 0.67 IMN**. T-45 lives into the **transonic** regime (~0.8 M critical).", "Function of **temperature only**. SL std (~59 °F/15 °C) ≈ **662 kt**; tropopause ~35,000 ft (−60 °C) ≈ **570 kt** TAS.", "Sustained **supersonic without afterburner**. Examples cited: Concorde, F-22, F-14B/D with larger engines.", "**Outer wing panels** (higher camber than inboard) and **main-gear door blisters**."], "ans": 0, "expl": "T-6 limit cited ≈ **360 KIAS / 0.67 IMN**. T-45 lives into the **transonic** regime (~0.8 M critical)."}, {"q": "What causes light airframe buffet near shocks?", "opts": ["Typically ~**1.2–1.3 M** when **all** local flow \u003e a. Fastest T-45 has gone ≈ **1.04 M**; cannot sustain pure supersonic / level-flight push through divergence.", "Separated air **behind shock waves** — described as light chop on T-45 (some types hammer harder; dedicated sonic designs may feel little).", "Critical Mach ≈ **0.8** (first local sonic flow, outer panels / gear blisters). Force-divergent Mach ≈ **0.85** (CD rises steeply with shock growth).", "increased horiz-tail downwash → pitch sensitive; \u003e4G dive pullout / ~3 lb stick → +1–3G excursion risk; uneven CL drop → heavy wing (covered further in 0102)."], "ans": 1, "expl": "Separated air **behind shock waves** — described as light chop on T-45 (some types hammer harder; dedicated sonic designs may feel little)."}, {"q": "When Critical Mach (T-45 ~0.8): local sonic flow first on outer wing panels (more camber) and main-gear door blisters, what happens?", "opts": ["normal shocks → separation → reduced control effectiveness (WWII aileron/elevator issues).", "Yes — after selecting GAIN ORIDE.", "Yes — fully available with no limitations.", "Yes — available in the aft cockpit only."], "ans": 0, "expl": "normal shocks → separation → reduced control effectiveness (WWII aileron/elevator issues)."}, {"q": "When Force-divergent Mach (~0.85 T-45): CD climbs precipitously once shocks grow; thrust cannot overcome in level flight, what happens?", "opts": ["cannot push past in 2G level.", "cannot push past in 11G level.", "cannot push past in 1G level.", "cannot push past in 101G level."], "ans": 2, "expl": "cannot push past in 1G level."}, {"q": "When Aero center moves aft in local-supersonic regions, what happens?", "opts": ["nose tuck; light shock buffet (“light chop”).", "Yes — fully available with no limitations.", "Yes — after selecting GAIN ORIDE.", "Yes — available in the aft cockpit only."], "ans": 0, "expl": "nose tuck; light shock buffet (“light chop”)."}, {"q": "When Mid-span vortex (≈0.84–0.87 M): outer-panel shocks act as aero fence, what happens?", "opts": ["≈ **0.84–0.87 M**. Acts like aero fence → extra tail downwash → pitch hypersensitive; slight stick (~3 lb) can add **+1–3 G**; \u003e4G dive pullouts risk overstress.", "increased horiz-tail downwash → pitch sensitive; \u003e4G dive pullout / ~3 lb stick → +1–3G excursion risk; uneven CL drop → heavy wing (covered further in 0102).", "Typically ~**1.2–1.3 M** when **all** local flow \u003e a. Fastest T-45 has gone ≈ **1.04 M**; cannot sustain pure supersonic / level-flight push through divergence.", "Critical Mach ≈ **0.8** (first local sonic flow, outer panels / gear blisters). Force-divergent Mach ≈ **0.85** (CD rises steeply with shock growth)."], "ans": 1, "expl": "increased horiz-tail downwash → pitch sensitive; \u003e4G dive pullout / ~3 lb stick → +1–3G excursion risk; uneven CL drop → heavy wing (covered further in 0102)."}, {"q": "When B — Aero center aft, what happens?", "opts": ["Yes — fully available with no limitations.", "Yes — available in the aft cockpit only.", "nose tuck.", "Yes — after selecting GAIN ORIDE."], "ans": 2, "expl": "nose tuck."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= QUESTIONS.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
</html>
