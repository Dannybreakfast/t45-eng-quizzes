<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>T45C EP1 (Quizlet) — T-45 Quiz</title>
<script src="auth.js"></script>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt span + span, #q-text { white-space: pre-line; }
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">Home</a> · <a href="section-ep.html">EP</a> · Emergency Procedures</div>
    <h1>T45C EP1 (Quizlet)</h1>
    <div class="meta">26 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 26</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Emergency Procedures</div>
    <h2 style="margin:0.2rem 0">T45C EP1 (Quizlet)</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-ep.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to EP</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="section-ep.html">← EP</a> · <a href="index.html">Home</a></div>
</div>
<script>
const QUESTIONS = [{"q": "Engine fails to light off with in 15 sec from putting throttle to idle", "opts": ["Land as soon as practical and do not exceed 90% above 20K MSL, 95% below 20K MSL, do not exceed 600 deg EGT", "Wet Start", "Emergency Shutdown", "Electrically controlled, mechanically extended, and hydraulically retracted"], "ans": 1, "expl": "Quizlet set 783093107, card #1 (verbatim)."}, {"q": "Audible bang, Increase EGT, RPM lowers", "opts": ["Aircraft would be steered by differential braking", "Engine Stall", "Eject", "Avoid negative G maneuvers"], "ans": 1, "expl": "Quizlet set 783093107, card #2 (verbatim)."}, {"q": "During descent passing 7000 MSL, ACCEL Caution light", "opts": ["Expect slower engine acceleration during an approach", "False", "EJECT (not prepare for controlled ejection)", "Monitor HYD 1 Pressure"], "ans": 0, "expl": "Quizlet set 783093107, card #3 (verbatim)."}, {"q": "HYD 2 pressure failure", "opts": ["Throttle full, check 24 AOA, if settle continues Eject", "False (yeah we had no f'ng idea either)", "Avoid abrupt throttle movements and set min for flight", "RAT will maintain HYD 2 pressure at 2500-3000"], "ans": 3, "expl": "Quizlet set 783093107, card #4 (verbatim)."}, {"q": "Taxi clear of active, NWS malfunction", "opts": ["Neutral/IDLE", "Engine Stall", "FIRE light illums", "Aircraft would be steered by differential braking"], "ans": 3, "expl": "Quizlet set 783093107, card #5 (verbatim). NOTE: IC 21/43 LOSS OF DIRECTIONAL CONTROL: if NWS failure suspected – Paddle switch – press."}, {"q": "If aborting with a blown tire, set ANTI-SKID switch ON", "opts": ["False", "Momentarily press NWS button.", "Reset HYD 2 (correct but not the first thing to do, Instructar took note & future test may be changed)", "Ditch straight ahead"], "ans": 0, "expl": "Quizlet set 783093107, card #6 (verbatim)."}, {"q": "ECA 2 Caution light", "opts": ["Electrically controlled, mechanically extended, and hydraulically retracted", "Throttle idle (min safe flight)", "Land as soon as practical and do not exceed 90% above 20K MSL, 95% below 20K MSL, do not exceed 600 deg EGT", "Wet Start"], "ans": 2, "expl": "Quizlet set 783093107, card #7 (verbatim)."}, {"q": "Just flamed out, airspeed is 150 and at 1000' you should", "opts": ["Engine Stall", "Eject", "Expect slower engine acceleration during an approach", "Neutral/IDLE"], "ans": 1, "expl": "Quizlet set 783093107, card #8 (verbatim)."}, {"q": "Abort procedures", "opts": ["FIRE light illums", "IDLE, BOARDS retract, BRAKES, HOOK (1000 ft. prior)", "Momentarily press NWS button.", "Reduce A/S below 300 KIAS/.6 MACH"], "ans": 1, "expl": "Quizlet set 783093107, card #9 (verbatim). NOTE: Older gouge — differs. IC 21/43 ABORT: 1. Throttle – idle 2. Speed brakes – EXTEND 3. Brakes – apply 4. Hook – down (if required) 5. Brakes – release prior to crossing the arresting gear."}, {"q": "LP PUMP light in flight", "opts": ["(A,E,B,D,F, if different use PCLI) 1) Throttle OFF, 2) Engine Switch-OFF (both Cockpits), 3)\nFuel Shutoff - PULL, 4) BATT switches - OFF, 5) Emergency Egress", "Eject", "Avoid abrupt throttle movements and set min for flight", "Avoid negative G maneuvers"], "ans": 2, "expl": "Quizlet set 783093107, card #10 (verbatim)."}, {"q": "What requires an immediate shutdown on deck w/out 2ndary indications", "opts": ["FIRE light illums", "Electrically controlled, mechanically extended, and hydraulically retracted", "Avoid negative G maneuvers", "EJECT (not prepare for controlled ejection)"], "ans": 0, "expl": "Quizlet set 783093107, card #11 (verbatim)."}, {"q": "When flying @ 15K, TP HOT light", "opts": ["Throttle full, check 24 AOA, if settle continues Eject", "Electrically controlled, mechanically extended, and hydraulically retracted", "Reduce A/S below 300 KIAS/.6 MACH", "Throttle idle (min safe flight)"], "ans": 3, "expl": "Quizlet set 783093107, card #12 (verbatim). NOTE: IC 21/43 TP HOT – IN-FLIGHT: 1. Throttle – minimum for safe flight."}, {"q": "On cat stroke, aircraft settles", "opts": ["Engine Stall", "IDLE, BOARDS retract, BRAKES, HOOK (1000 ft. prior)", "(A,E,B,D,F, if different use PCLI) 1) Throttle OFF, 2) Engine Switch-OFF (both Cockpits), 3)\nFuel Shutoff - PULL, 4) BATT switches - OFF, 5) Emergency Egress", "Throttle full, check 24 AOA, if settle continues Eject"], "ans": 3, "expl": "Quizlet set 783093107, card #13 (verbatim). NOTE: IC 21/43 EMERGENCY CATAPULT FLYAWAY: 1. Throttle – MRT 2. Maintain 24 units AOA; if engine failed or unable to stop settle: 3. Eject."}, {"q": "Launch bar system is", "opts": ["Momentarily press NWS button.", "Expect slower engine acceleration during an approach", "Electrically controlled, mechanically extended, and hydraulically retracted", "Throttle full, check 24 AOA, if settle continues Eject"], "ans": 2, "expl": "Quizlet set 783093107, card #14 (verbatim). NOTE: Other gouge pages (p.3, p.54 #140, hw p.60) say the opposite: hydraulically (HYD 1) extended, mechanically (spring) retracted."}, {"q": "Engine failure on cat stroke and unable to eject", "opts": ["Avoid negative G maneuvers", "False (yeah we had no f'ng idea either)", "RAT will maintain HYD 2 pressure at 2500-3000", "Ditch straight ahead"], "ans": 3, "expl": "Quizlet set 783093107, card #15 (verbatim)."}, {"q": "For HYD 1 or HYD 2 Failure 1st consideration", "opts": ["Engine Stall", "False (yeah we had no f'ng idea either)", "Reduce A/S below 300 KIAS/.6 MACH", "Throttle full, check 24 AOA, if settle continues Eject"], "ans": 2, "expl": "Quizlet set 783093107, card #16 (verbatim)."}, {"q": "After F PRESS light illuminates and checking engine switch on you should", "opts": ["EJECT (not prepare for controlled ejection)", "Land as soon as practical and do not exceed 90% above 20K MSL, 95% below 20K MSL, do not exceed 600 deg EGT", "Avoid negative G maneuvers", "RAT will maintain HYD 2 pressure at 2500-3000"], "ans": 2, "expl": "Quizlet set 783093107, card #17 (verbatim)."}, {"q": "While cruising 23K you get FIRE light, with secondaries", "opts": ["(A,E,B,D,F, if different use PCLI) 1) Throttle OFF, 2) Engine Switch-OFF (both Cockpits), 3)\nFuel Shutoff - PULL, 4) BATT switches - OFF, 5) Emergency Egress", "EJECT (not prepare for controlled ejection)", "Wet Start", "Throttle full, check 24 AOA, if settle continues Eject"], "ans": 1, "expl": "Quizlet set 783093107, card #18 (verbatim). NOTE: IC 21/43 FIRE WARNING LIGHT in-flight: if fire confirmed or flight control lost – Eject."}, {"q": "NWS AUG system provides yaw rate feedback in high gain nose wheel steering", "opts": ["Avoid abrupt throttle movements and set min for flight", "Eject", "Electrically controlled, mechanically extended, and hydraulically retracted", "False (yeah we had no f'ng idea either)"], "ans": 3, "expl": "Quizlet set 783093107, card #19 (verbatim)."}, {"q": "3-4 questions that deal with procedures for COMP Stall and EGT RPM Light. Know the first 3 steps in that procedure and that's 3-4 free questions.", "opts": ["False (yeah we had no f'ng idea either)", "Avoid negative G maneuvers", "(no definition on this Quizlet card)", "False"], "ans": 2, "expl": "Quizlet set 783093107, card #20 (verbatim). This card has no definition on Quizlet; the correct option is a placeholder. NOTE: Card has no definition on Quizlet. IC 21/43 COMPRESSOR STALL OR EGT/RPM WARNING LIGHT: 1. Throttle – idle 2. EGT/RPM – check; if EGT \u003e 450°C for \u003e 6 s at idle: 3. Execute engine failure procedure; if normal: 4. Throttle – slowly advance to minimum for safe flight 5. Minimize throttle movements."}, {"q": "If you get a HYD 2 failure", "opts": ["FIRE light illums", "Momentarily press NWS button.", "Land as soon as practical and do not exceed 90% above 20K MSL, 95% below 20K MSL, do not exceed 600 deg EGT", "Monitor HYD 1 Pressure"], "ans": 3, "expl": "Quizlet set 783093107, card #21 (verbatim)."}, {"q": "Executing the Engine Fire Emergency Shutdown on the Ground state the procedures verbatim", "opts": ["Throttle idle (min safe flight)", "(A,E,B,D,F, if different use PCLI) 1) Throttle OFF, 2) Engine Switch-OFF (both Cockpits), 3)\nFuel Shutoff - PULL, 4) BATT switches - OFF, 5) Emergency Egress", "Momentarily press NWS button.", "Reduce A/S below 300 KIAS/.6 MACH"], "ans": 1, "expl": "Quizlet set 783093107, card #22 (verbatim). NOTE: Older gouge — differs. IC 21/43 EMERGENCY SHUTDOWN/EGRESS: 1. Throttle – Off 2. Engine switch – Off 3. Fuel Shutoff Handle – Pull 4. Ejection Seats – Safe 5. Batt switches – Off."}, {"q": "During ACM you get a HYD caution light, RAT caution light and then the HYD light extinguishes you should:", "opts": ["Reset HYD 2 (correct but not the first thing to do, Instructar took note & future test may be changed)", "Emergency Shutdown", "Throttle full, check 24 AOA, if settle continues Eject", "Ditch straight ahead"], "ans": 0, "expl": "Quizlet set 783093107, card #23 (verbatim)."}, {"q": "First step in the EGT/RPM warning light:", "opts": ["Momentarily press NWS button.", "False (yeah we had no f'ng idea either)", "Emergency Shutdown", "Neutral/IDLE"], "ans": 3, "expl": "Quizlet set 783093107, card #24 (verbatim). NOTE: Older gouge — differs (no 'neutral' step now). IC 21/43: 1. Throttle – idle 2. EGT/RPM – check."}, {"q": "If NWS AUG goes on during taxi, you should:", "opts": ["(A,E,B,D,F, if different use PCLI) 1) Throttle OFF, 2) Engine Switch-OFF (both Cockpits), 3)\nFuel Shutoff - PULL, 4) BATT switches - OFF, 5) Emergency Egress", "Momentarily press NWS button.", "Aircraft would be steered by differential braking", "Ditch straight ahead"], "ans": 1, "expl": "Quizlet set 783093107, card #25 (verbatim)."}, {"q": "GTS Fire on deck:", "opts": ["Throttle full, check 24 AOA, if settle continues Eject", "Avoid abrupt throttle movements and set min for flight", "Wet Start", "Emergency Shutdown"], "ans": 3, "expl": "Quizlet set 783093107, card #26 (verbatim). NOTE: IC 21/43 GTS FIRE WARNING LIGHT – GROUND: Execute emergency shutdown/egress; IN-FLIGHT: Engine switch – off."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= queue.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
</html>
