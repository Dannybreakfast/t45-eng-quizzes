<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ENG0112 Hydraulic Subsystems Servicing and Operating Limitations — T-45 Quiz</title>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">T-45 Local Quizzes</a> · Hydraulic</div>
    <h1>ENG0112 Hydraulic Subsystems Servicing and Operating Limitations</h1>
    <div class="meta">16 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 16</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Hydraulic</div>
    <h2 style="margin:0.2rem 0">ENG0112 Hydraulic Subsystems Servicing and Operating Limitations</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="index.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to Index</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="index.html">← All quizzes</a></div>
</div>
<script>
const QUESTIONS = [{"q": "Carrier tire pressure is approximately:", "opts": ["175 psi", "250 psi", "350 psi", "950 psi"], "ans": 2, "expl": "350 psi carrier; 175 land."}, {"q": "Landing gear operating limit airspeed:", "opts": ["150 KIAS", "176 KIAS", "200 KIAS", "450 KIAS"], "ans": 2, "expl": "≤200 KIAS for extend/retract."}, {"q": "Hook actuator/damper pressure on preflight:", "opts": ["1100 ± 50", "1300 ± 50", "950 ± 50", "1500 ± 100"], "ans": 2, "expl": "950 ± 50 psi."}, {"q": "NLG oleo chrome showing (land vs CV)?", "opts": ["About 6¼\" land; about 5.2\" for CV ops.", "About 1¼\" land; about 5.2\" for CV ops.", "About 13¼\" land; about 5.2\" for CV ops.", "About 3¼\" land; about 5.2\" for CV ops."], "ans": 3, "expl": "About 3¼\" land; about 5.2\" for CV ops."}, {"q": "Main tire pressures land vs carrier?", "opts": ["175 psi land-based; 350 psi carrier.", "87 psi land-based; 350 psi carrier.", "350 psi land-based; 350 psi carrier.", "185 psi land-based; 350 psi carrier."], "ans": 0, "expl": "175 psi land-based; 350 psi carrier."}, {"q": "Brake wear indicator check?", "opts": ["Indicators must protrude beyond recess on top and bottom of each MLG brake housing.", "Unable to retract gear; no AOA indexers or e-bracket on HUD.", "Turn anti-skid OFF or you may have no brakes.", "Inoperative; restow emerg handle (if HYD 1 available) restores NWS."], "ans": 0, "expl": "Indicators must protrude beyond recess on top and bottom of each MLG brake housing."}, {"q": "Hook actuator/damper precharge?", "opts": ["960 ± 50 psi.", "950 ± 50 psi.", "475 ± 50 psi.", "1900 ± 50 psi."], "ans": 1, "expl": "950 ± 50 psi."}, {"q": "Max gear operate airspeed?", "opts": ["≤ 210 KIAS.", "≤ 400 KIAS.", "≤ 100 KIAS.", "≤ 200 KIAS."], "ans": 3, "expl": "≤ 200 KIAS."}, {"q": "Max hook airspeed?", "opts": ["≤ 225 KIAS.", "≤ 450 KIAS.", "≤ 900 KIAS.", "≤ 460 KIAS."], "ans": 1, "expl": "≤ 450 KIAS."}, {"q": "Max tire groundspeed?", "opts": ["≤ 176 knots groundspeed.", "≤ 88 knots groundspeed.", "≤ 186 knots groundspeed.", "≤ 352 knots groundspeed."], "ans": 0, "expl": "≤ 176 knots groundspeed."}, {"q": "NWS high-gain max groundspeed?", "opts": ["Less than 5 knots.", "Less than 20 knots.", "Less than 110 knots.", "Less than 10 knots."], "ans": 3, "expl": "Less than 10 knots."}, {"q": "Can launch bar extend with HYD 1 failed?", "opts": ["Yes — available in the aft cockpit only.", "Yes — after selecting GAIN ORIDE.", "Yes — fully available with no limitations.", "No."], "ans": 3, "expl": "No."}, {"q": "Can hook retract with HYD 1 failed?", "opts": ["Yes — after selecting GAIN ORIDE.", "Yes — fully available with no limitations.", "Yes — available in the aft cockpit only.", "No (extend still available)."], "ans": 3, "expl": "No (extend still available)."}, {"q": "NWS with emerg gear handle pulled?", "opts": ["Inoperative; restow emerg handle (if HYD 1 available) restores NWS.", "Inoperative; restow emerg handle (if HYD 2 available) restores NWS.", "Inoperative; restow emerg handle (if HYD 101 available) restores NWS.", "Inoperative; restow emerg handle (if HYD 11 available) restores NWS."], "ans": 0, "expl": "Inoperative; restow emerg handle (if HYD 1 available) restores NWS."}, {"q": "Signs of weight-off-wheels failure after takeoff?", "opts": ["Indicators must protrude beyond recess on top and bottom of each MLG brake housing.", "Unable to retract gear; no AOA indexers or e-bracket on HUD.", "Inoperative; restow emerg handle (if HYD 1 available) restores NWS.", "Turn anti-skid OFF or you may have no brakes."], "ans": 1, "expl": "Unable to retract gear; no AOA indexers or e-bracket on HUD."}, {"q": "Lesson from SKID caution landing story?", "opts": ["Turn anti-skid OFF or you may have no brakes.", "175 psi land-based; 350 psi carrier.", "About 3¼\" land; about 5.2\" for CV ops.", "Unable to retract gear; no AOA indexers or e-bracket on HUD."], "ans": 0, "expl": "Turn anti-skid OFF or you may have no brakes."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= QUESTIONS.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
</html>
