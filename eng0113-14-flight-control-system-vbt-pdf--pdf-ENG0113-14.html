<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<script src="auth.js"></script>
<title>ENG0113-14 Flight Control System — VBT (PDF) — T-45 Quiz</title>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">Home</a> · <a href="section-eng.html">ENG</a> · Flight Controls</div>
    <h1>ENG0113-14 Flight Control System — VBT (PDF)</h1>
    <div class="meta">24 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 24</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Flight Controls</div>
    <h2 style="margin:0.2rem 0">ENG0113-14 Flight Control System — VBT (PDF)</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-eng.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to ENG</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="section-eng.html">← ENG</a> · <a href="index.html">Home</a></div>
</div>
<script>
const QUESTIONS = [{"q": "HYD2 powers which flight controls?", "opts": ["Flaps and speed brakes only", "Aileron and stabilator only", "Rudder and nosewheel steering", "Slats only"], "ans": 1, "expl": "HYD2 dedicated to aileron + stabilator."}, {"q": "Main stabilator trim after generator failure:", "opts": ["Inoperative", "Still available (ESS bus)", "Only via standby switch without lifting guard", "Replaced by SBI automatically"], "ans": 1, "expl": "Main stab trim on ESS bus is the only trim after GEN fail."}, {"q": "Aileron deflection gear UP vs gear DOWN:", "opts": ["±15.5° / ±12.5°", "±12.5° / ±15.5°", "±6° / ±9°", "±20° / ±20°"], "ans": 1, "expl": "Gear up ±12.5°; gear down ±15.5° (trim authority 6°/9° is separate)."}, {"q": "Emergency flaps with accumulator 1900 psi and HYD1 failed:", "opts": ["Full flaps + slats", "Will not extend (\u003c2000 psi)", "Half flaps only", "Slats only"], "ans": 1, "expl": "Need accumulator \u003e2000 psi when HYD1 failed."}, {"q": "Slats extend above 217 KIAS?", "opts": ["Yes", "No", "Only with emerg flaps", "Only gear down"], "ans": 1, "expl": "SADS inhibits extension above 217 KIAS."}, {"q": "Speed brake blowback begins approximately:", "opts": ["200 KIAS", "217 KIAS", "340 KIAS", "380 KIAS"], "ans": 3, "expl": "Blowback ~380; may not fully extend above 340."}, {"q": "CAUG BIT successful light-out time:", "opts": ["30 sec", "60 sec", "120 sec", "200 sec"], "ans": 2, "expl": "120 seconds."}, {"q": "Dirty-configuration max bank:", "opts": ["30°", "60°", "90°", "Unlimited"], "ans": 2, "expl": "90° with gear and/or flaps/slats down."}, {"q": "Raising standby stab trim guard:", "opts": ["Enables emerg flaps", "Makes main stab trim inoperative", "Starts CAUG BIT", "Locks rudder"], "ans": 1, "expl": "Guard up disengages main trim motor."}, {"q": "Flaps/slats airspeed limit:", "opts": ["150 KIAS", "200 KIAS", "250 KIAS", "340 KIAS"], "ans": 1, "expl": "\u003c200 KIAS for transition/extension / emerg flaps."}, {"q": "With C AUG caution, SBI available?", "opts": ["Yes", "No", "Only above 0.8 Mach", "Only with flaps UP"], "ans": 1, "expl": "CAUG caution ⇒ no ARI, SBI, yaw damper, or rudder trim."}, {"q": "Preflight brake/emerg-flap accumulator minimum:", "opts": ["1000 psi", "1250 psi (~1300 normal)", "2000 psi gauge minimum always", "3000 psi"], "ans": 1, "expl": "~1300 psi, min 1250 in RMLG well."}, {"q": "Aircraft controlled in flight by which primary surfaces/systems?", "opts": ["Tandem HYD1/HYD2 hydraulically actuated stabilator and ailerons; conventional unpowered rudder; flaps/slats; speed brakes (HYD1, ESS-bus controlled); plus control augmentation.", "Masked if both HYD1 and HYD2 work. Unmasked on single HYD → full TEU deflection → uncommanded roll (port+HYD1→left; stbd+HYD2→right). Do not delay eject if uncontrollable.", "May not fully extend above 340 KIAS; blowback begins ~380. SBI moves stab (not stick). With C AUG/SBI inop avoid close formation SB use esp. 220–300 KIAS; expect up to ±2° pitch.", "Flaps/slats transition/extension \u003c200 KIAS; emerg flaps \u003c200 KIAS; SB full below 340 / blowback ~380; dirty G 0–+2 sym / +1–+1.5 unsym; bank ≤90° gear/flaps down; AOA 21.5 with flaps ½/full."], "ans": 0, "expl": "Tandem HYD1/HYD2 hydraulically actuated stabilator and ailerons; conventional unpowered rudder; flaps/slats; speed brakes (HYD1, ESS-bus controlled); plus control augmentation."}, {"q": "HYD1 vs HYD2 flight-control loads?", "opts": ["Gear down increases aileron deflection and reduces max lateral stick travel. Gear up ±12.5° aileron; gear down ±15.5°. Trim authority 6° gear up / 9° gear down.", "HYD1: aileron, stabilator, flaps, speed brakes. HYD2: aileron and stabilator only. If HYD1 \u003c1500 psi, emerg flap extension available if accumulator \u003e2000 psi.", "ALL: yaw damping, ARI, rudder trim, SBI. SBI: rudder trim + SBI. RESET (spring to SBI): resets CAUG / neutralizes rudder & SBI actuators after paddle.", "Reversible; no-float lock breakout 6–8 lb; blown-out rudder may need \u003e250 lb. Max deflection 20±0.5°. Centering unit does not always keep rudder centered."], "ans": 1, "expl": "HYD1: aileron, stabilator, flaps, speed brakes. HYD2: aileron and stabilator only. If HYD1 \u003c1500 psi, emerg flap extension available if accumulator \u003e2000 psi."}, {"q": "Aileron PCU failure masked vs unmasked?", "opts": ["May not fully extend above 340 KIAS; blowback begins ~380. SBI moves stab (not stick). With C AUG/SBI inop avoid close formation SB use esp. 220–300 KIAS; expect up to ±2° pitch.", "Gear down increases aileron deflection and reduces max lateral stick travel. Gear up ±12.5° aileron; gear down ±15.5°. Trim authority 6° gear up / 9° gear down.", "Masked if both HYD1 and HYD2 work. Unmasked on single HYD → full TEU deflection → uncommanded roll (port+HYD1→left; stbd+HYD2→right). Do not delay eject if uncontrollable.", "Tandem HYD1/HYD2 hydraulically actuated stabilator and ailerons; conventional unpowered rudder; flaps/slats; speed brakes (HYD1, ESS-bus controlled); plus control augmentation."], "ans": 2, "expl": "Masked if both HYD1 and HYD2 work. Unmasked on single HYD → full TEU deflection → uncommanded roll (port+HYD1→left; stbd+HYD2→right). Do not delay eject if uncontrollable."}, {"q": "Stick-to-aileron ratio changer?", "opts": ["Gear down increases aileron deflection and reduces max lateral stick travel. Gear up ±12.5° aileron; gear down ±15.5°. Trim authority 6° gear up / 9° gear down.", "HYD1: aileron, stabilator, flaps, speed brakes. HYD2: aileron and stabilator only. If HYD1 \u003c1500 psi, emerg flap extension available if accumulator \u003e2000 psi.", "ALL: yaw damping, ARI, rudder trim, SBI. SBI: rudder trim + SBI. RESET (spring to SBI): resets CAUG / neutralizes rudder & SBI actuators after paddle.", "Reversible; no-float lock breakout 6–8 lb; blown-out rudder may need \u003e250 lb. Max deflection 20±0.5°. Centering unit does not always keep rudder centered."], "ans": 0, "expl": "Gear down increases aileron deflection and reduces max lateral stick travel. Gear up ±12.5° aileron; gear down ±15.5°. Trim authority 6° gear up / 9° gear down."}, {"q": "Stabilator trim buses?", "opts": ["Main stab trim: 28 VDC ESS bus (only trim after GEN fail). Standby stab trim: GEN bus. Raising standby guard disengages main trim.", "Momentary paddle, then RESET, then SBI→ALL with WOW, \u003c80 KIAS, flaps/slats UP. C AUG light ≤120 sec then out if successful.", "Still work (mechanical + HYD1/HYD2/RAT). Will not work with total loss of hydraulics. Aileron trim will NOT work after GEN fail.", "Will not extend above 217 KIAS; SADS/ADC provides signal. Loss of SADS → loss of slats. Synchro cable keeps wings within 2°."], "ans": 0, "expl": "Main stab trim: 28 VDC ESS bus (only trim after GEN fail). Standby stab trim: GEN bus. Raising standby guard disengages main trim."}, {"q": "Rudder blow-out / no-float?", "opts": ["Gear down increases aileron deflection and reduces max lateral stick travel. Gear up ±12.5° aileron; gear down ±15.5°. Trim authority 6° gear up / 9° gear down.", "Reversible; no-float lock breakout 6–8 lb; blown-out rudder may need \u003e250 lb. Max deflection 20±0.5°. Centering unit does not always keep rudder centered.", "HYD1: aileron, stabilator, flaps, speed brakes. HYD2: aileron and stabilator only. If HYD1 \u003c1500 psi, emerg flap extension available if accumulator \u003e2000 psi.", "ALL: yaw damping, ARI, rudder trim, SBI. SBI: rudder trim + SBI. RESET (spring to SBI): resets CAUG / neutralizes rudder & SBI actuators after paddle."], "ans": 1, "expl": "Reversible; no-float lock breakout 6–8 lb; blown-out rudder may need \u003e250 lb. Max deflection 20±0.5°. Centering unit does not always keep rudder centered."}, {"q": "Flaps/slats normal & emergency?", "opts": ["Tandem HYD1/HYD2 hydraulically actuated stabilator and ailerons; conventional unpowered rudder; flaps/slats; speed brakes (HYD1, ESS-bus controlled); plus control augmentation.", "Flaps/slats transition/extension \u003c200 KIAS; emerg flaps \u003c200 KIAS; SB full below 340 / blowback ~380; dirty G 0–+2 sym / +1–+1.5 unsym; bank ≤90° gear/flaps down; AOA 21.5 with flaps ½/full.", "½: flaps 25° + slats 15°. DN: flaps 50° + slats 15°. Emerg flaps: full 50°, slats remain UP; ESS control; HYD1 or accumulator \u003e2000 psi. Don’t select emerg flaps with normal HYD1 (dump valve damage).", "May not fully extend above 340 KIAS; blowback begins ~380. SBI moves stab (not stick). With C AUG/SBI inop avoid close formation SB use esp. 220–300 KIAS; expect up to ±2° pitch."], "ans": 2, "expl": "½: flaps 25° + slats 15°. DN: flaps 50° + slats 15°. Emerg flaps: full 50°, slats remain UP; ESS control; HYD1 or accumulator \u003e2000 psi. Don’t select emerg flaps with normal HYD1 (dump valve damage)."}, {"q": "Slats airspeed / SADS?", "opts": ["Will not extend above 217 KIAS; SADS/ADC provides signal. Loss of SADS → loss of slats. Synchro cable keeps wings within 2°.", "Momentary paddle, then RESET, then SBI→ALL with WOW, \u003c80 KIAS, flaps/slats UP. C AUG light ≤120 sec then out if successful.", "Still work (mechanical + HYD1/HYD2/RAT). Will not work with total loss of hydraulics. Aileron trim will NOT work after GEN fail.", "Main stab trim: 28 VDC ESS bus (only trim after GEN fail). Standby stab trim: GEN bus. Raising standby guard disengages main trim."], "ans": 0, "expl": "Will not extend above 217 KIAS; SADS/ADC provides signal. Loss of SADS → loss of slats. Synchro cable keeps wings within 2°."}, {"q": "Speed brake blowback / SBI?", "opts": ["Flaps/slats transition/extension \u003c200 KIAS; emerg flaps \u003c200 KIAS; SB full below 340 / blowback ~380; dirty G 0–+2 sym / +1–+1.5 unsym; bank ≤90° gear/flaps down; AOA 21.5 with flaps ½/full.", "Masked if both HYD1 and HYD2 work. Unmasked on single HYD → full TEU deflection → uncommanded roll (port+HYD1→left; stbd+HYD2→right). Do not delay eject if uncontrollable.", "Tandem HYD1/HYD2 hydraulically actuated stabilator and ailerons; conventional unpowered rudder; flaps/slats; speed brakes (HYD1, ESS-bus controlled); plus control augmentation.", "May not fully extend above 340 KIAS; blowback begins ~380. SBI moves stab (not stick). With C AUG/SBI inop avoid close formation SB use esp. 220–300 KIAS; expect up to ±2° pitch."], "ans": 3, "expl": "May not fully extend above 340 KIAS; blowback begins ~380. SBI moves stab (not stick). With C AUG/SBI inop avoid close formation SB use esp. 220–300 KIAS; expect up to ±2° pitch."}, {"q": "CONTR AUG ALL vs SBI vs RESET?", "opts": ["ALL: yaw damping, ARI, rudder trim, SBI. SBI: rudder trim + SBI. RESET (spring to SBI): resets CAUG / neutralizes rudder & SBI actuators after paddle.", "Reversible; no-float lock breakout 6–8 lb; blown-out rudder may need \u003e250 lb. Max deflection 20±0.5°. Centering unit does not always keep rudder centered.", "HYD1: aileron, stabilator, flaps, speed brakes. HYD2: aileron and stabilator only. If HYD1 \u003c1500 psi, emerg flap extension available if accumulator \u003e2000 psi.", "RMLG wheel well: ~1300 psi, minimum 1250 psi. Monitor airborne (run-up, 10k level-off, 15-min updates). Emerg flaps need \u003e2000 psi if HYD1 failed."], "ans": 0, "expl": "ALL: yaw damping, ARI, rudder trim, SBI. SBI: rudder trim + SBI. RESET (spring to SBI): resets CAUG / neutralizes rudder & SBI actuators after paddle."}, {"q": "CAUG IBIT conditions / time?", "opts": ["Will not extend above 217 KIAS; SADS/ADC provides signal. Loss of SADS → loss of slats. Synchro cable keeps wings within 2°.", "Momentary paddle, then RESET, then SBI→ALL with WOW, \u003c80 KIAS, flaps/slats UP. C AUG light ≤120 sec then out if successful.", "Main stab trim: 28 VDC ESS bus (only trim after GEN fail). Standby stab trim: GEN bus. Raising standby guard disengages main trim.", "Still work (mechanical + HYD1/HYD2/RAT). Will not work with total loss of hydraulics. Aileron trim will NOT work after GEN fail."], "ans": 1, "expl": "Momentary paddle, then RESET, then SBI→ALL with WOW, \u003c80 KIAS, flaps/slats UP. C AUG light ≤120 sec then out if successful."}, {"q": "SLATS caution light?", "opts": ["Yes — available in the aft cockpit only.", "Yes — fully available with no limitations.", "Yes — after selecting GAIN ORIDE.", "Not in selected position; split slats; selected above 217 (won’t extend); exceeding 217 with slats down. Split/slats up → abrupt rolloff risk near ~25 units clean stall; flaps ½/full + slats up max AOA 21.5."], "ans": 3, "expl": "Not in selected position; split slats; selected above 217 (won’t extend); exceeding 217 with slats down. Split/slats up → abrupt rolloff risk near ~25 units clean stall; flaps ½/full + slats up max AOA 21.5."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= QUESTIONS.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
