<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>BI 1105 (2) S-3 Pattern — T-45 Quiz</title>
<script src="auth.js"></script>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt span + span, #q-text { white-space: pre-line; }
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">Home</a> · <a href="section-bi.html">BI</a> · Basic Instruments</div>
    <h1>BI 1105 (2) S-3 Pattern</h1>
    <div class="meta">23 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 23</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Basic Instruments</div>
    <h2 style="margin:0.2rem 0">BI 1105 (2) S-3 Pattern</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-bi.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to BI</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="section-bi.html">← BI</a> · <a href="index.html">Home</a></div>
</div>
<script>
const QUESTIONS = [{"q": "S-3 pattern primarily combines:", "opts": ["Aerobatics + stalls", "Timed climbs/descents with ½ SRT", "Only steep turns", "Formation"], "ans": 1, "expl": "More complex than S-1."}, {"q": "What makes S-3 harder than S-1?", "opts": ["ADI, HSI/HDG, VSI/alt, airspeed, standby turn needle, clock.", "Yes — **30° per 20 seconds** / one needle-width goals while vertical path continues.", "Timed climbs/descents with ½ SRT", "Adds **half SRT** turning while doing timed climbs/descents."], "ans": 3, "expl": "Adds **half SRT** turning while doing timed climbs/descents."}, {"q": "Turn timing still used in S-3?", "opts": ["No — the function is completely lost.", "No — inhibited above 10,000 ft.", "No — only available on external power.", "Yes — **30° per 20 seconds** / one needle-width goals while vertical path continues."], "ans": 3, "expl": "Yes — **30° per 20 seconds** / one needle-width goals while vertical path continues."}, {"q": "Primary scan instruments for S-3?", "opts": ["Timed climbs/descents with ½ SRT", "Yes — **30° per 20 seconds** / one needle-width goals while vertical path continues.", "ADI, HSI/HDG, VSI/alt, airspeed, standby turn needle, clock.", "Adds **half SRT** turning while doing timed climbs/descents."], "ans": 2, "expl": "ADI, HSI/HDG, VSI/alt, airspeed, standby turn needle, clock."}, {"q": "The S-3 pattern combines:", "opts": ["A turn pattern and LSC", "Slow flight and S-1", "An S-1 pattern and a ½ SRT at 200 KIAS", "An S-1 pattern and an SRT at 250 KIAS"], "ans": 2, "expl": "S-3 slide."}, {"q": "S-3 descent entry (3 sec prior to 12 o'clock):", "opts": ["1500 pph, pitch +2°, 20° AOB", "Idle, pitch −5°, 30° AOB", "700 pph, reduce pitch 1–2°, 20° AOB for ½ SRT", "700 pph, reduce pitch 1–2°, 40° AOB"], "ans": 2, "expl": "S-3 slide."}, {"q": "Each S-3 leg (1 minute) produces:", "opts": ["1000 ft and 180°", "1000 ft and 30°", "1000 ft of altitude change and 90° of heading change", "500 ft and 90°"], "ans": 2, "expl": "S-3 slide."}, {"q": "S-3 checkpoints:", "opts": ["250 ft every 10 seconds and 30° every 10 seconds", "250 ft every 15 seconds and 30° of heading every 20 seconds", "500 ft every 30 sec and 45° every 30 sec", "100 ft every 6 sec and 30° every 20 sec"], "ans": 1, "expl": "S-3 slide."}, {"q": "At the bottom of the first S-3 descent, the turn:", "opts": ["Reverses", "Stops for 1 minute", "Continues in the same direction while climbing", "Becomes a full SRT"], "ans": 2, "expl": "S-3 slide: keep turning in the same direction."}, {"q": "At the top of the first S-3 climb (after 180° total), you:", "opts": ["Set 1500 pph and climb again", "Level off for 1 minute", "Set 700 pph, lower pitch, reverse and set 20° AOB in the opposite direction", "Continue the turn same direction"], "ans": 2, "expl": "S-3 slide."}, {"q": "By minute 2 of the S-3 you should be:", "opts": ["Back at the original altitude with 180° of turn total", "2000 ft low with 90° of turn", "At original altitude, 360° of turn", "1000 ft low, 180° of turn"], "ans": 0, "expl": "S-3 slide."}, {"q": "Total S-3 time:", "opts": ["4 minutes", "2 minutes", "3 minutes", "8 minutes"], "ans": 0, "expl": "Lecture."}, {"q": "In the S-3, AOB controls:", "opts": ["Two needle widths", "Rate of descent", "Airspeed", "½ SRT (one needle-width deflection)"], "ans": 3, "expl": "S-3 slide."}, {"q": "S-3 reference pitch attitudes at 200 knots: level / descent / climb", "opts": ["~5° / ~7° / ~3°", "~5° / ~1° / ~9°", "~3° / ~0° / ~10°", "~5° / ~3° / ~7° nose up"], "ans": 3, "expl": "Lecture."}, {"q": "S-3 reference fuel flows: level / descent / climb", "opts": ["~1100 / ~700 / ~1500 pph", "~1050 / ~900 / ~1300", "~1400 / ~700 / MRT", "~1100 / idle / ~1800"], "ans": 0, "expl": "Lecture."}, {"q": "S-3 demo start:", "opts": ["Heading 360, 15,000 ft, 200 knots", "Heading 360, 12,000 ft, 200 knots", "Heading 090, 12,000 ft, 250 knots", "Heading 270, 10,000 ft, 200 knots"], "ans": 1, "expl": "Demo."}, {"q": "S-3 demo first heading checkpoint:", "opts": ["045 at the 6 o'clock", "060 at the 4 o'clock", "030 at the 4 o'clock position", "030 at the 3 o'clock"], "ans": 2, "expl": "Demo."}, {"q": "S-3 demo: end of the first descent (12 o'clock) checkpoint:", "opts": ["11,500 ft and heading 090", "11,000 ft and heading 060", "11,000 ft and heading 090", "11,000 ft and heading 180"], "ans": 2, "expl": "Demo."}, {"q": "S-3 demo: during the climb, heading 120 should be reached at:", "opts": ["The 8 o'clock", "The 3 o'clock", "The 12 o'clock", "The 4 o'clock position"], "ans": 3, "expl": "Demo."}, {"q": "S-3 finishes:", "opts": ["1000 ft low", "On the reciprocal heading", "Level on original altitude and heading, clock at 12 o'clock, 200 KIAS", "At 250 KIAS"], "ans": 2, "expl": "S-3 slide."}, {"q": "Suggested S-3 challenge after mastering it:", "opts": ["Fly it on standby instruments (ADI off), then also HSI off using timing", "Fly it with gear down", "Fly it with full SRT", "Fly it at 300 knots"], "ans": 0, "expl": "Lecture."}, {"q": "Transition rule for S-3 climb/descent changes:", "opts": ["200 ft prior", "3 seconds or 100 ft prior, whichever occurs first", "10 sec or 50 ft prior", "Exactly at the 12 o'clock"], "ans": 1, "expl": "S-3 slide."}, {"q": "S-3 bank angle at 200 KIAS:", "opts": ["30°", "20°", "25°", "40°"], "ans": 1, "expl": "10% rule for ½ SRT."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= queue.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
</html>
