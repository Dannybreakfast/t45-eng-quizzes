<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>NAV 0104 Approach Plates — T-45 Quiz</title>
<script src="auth.js"></script>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt span + span, #q-text { white-space: pre-line; }
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">Home</a> · <a href="section-nav.html">NAV</a> · Navigation</div>
    <h1>NAV 0104 Approach Plates</h1>
    <div class="meta">24 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 24</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Navigation</div>
    <h2 style="margin:0.2rem 0">NAV 0104 Approach Plates</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-nav.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to NAV</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="section-nav.html">← NAV</a> · <a href="index.html">Home</a></div>
</div>
<script>
const QUESTIONS = [{"q": "Emergency Safe Altitude typically provides obstacle clearance out to:", "opts": ["10 NM", "25 NM", "100 NM", "200 NM"], "ans": 2, "expl": "ESA ≈ 100 NM."}, {"q": "In designated mountainous terrain, Emergency Safe Altitude clearance above obstacles is:", "opts": ["500 ft", "1000 ft", "2000 ft", "3000 ft"], "ans": 2, "expl": "2000 ft in designated mountainous terrain."}, {"q": "A sequenced-flasher / strobe indication on ALS symbology is shown as:", "opts": ["A Trouble T only", "A black circle with white lettering", "A dot above the ALS code (e.g. A5)", "An asterisk next to ATIS"], "ans": 2, "expl": "Dot above ALS code = sequenced flashers/strobes."}, {"q": "For CNAF 3710 single-pilot rules, RVR should be no lower than about:", "opts": ["12 RVR", "18 RVR", "24 RVR (≈ 1/2 mile)", "60 RVR"], "ans": 2, "expl": "≥ ~24 RVR / ½ mile for single-pilot 3710."}, {"q": "T-45 land-and-hold-short (LAHSO) authorization:", "opts": ["Authorized anytime LAHSO distance ≥ 5750 ft", "Authorized only at civilian fields", "Not really authorized for T-45s", "Required for all Category C approaches"], "ans": 2, "expl": "T-45s not really authorized for LAHSO."}, {"q": "If a low plate has no Emergency Safe Altitude depicted, a substitute concept from the low IFR chart is:", "opts": ["MEA only", "OROCA", "Decision altitude", "TCH"], "ans": 1, "expl": "Use OROCA when ESA absent on low plates."}, {"q": "At the outer marker with a centered glide-slope needle, you should see approximately:", "opts": ["Field elevation", "The published glide-slope altitude for that fix", "MDA for the localizer approach", "Pattern altitude"], "ans": 1, "expl": "Published GS altitude at the OM/FAF."}, {"q": "For single-pilot PAR planning under 3710, if published HAT is 100 ft you should plan approximately:", "opts": ["50 ft HAT", "100 ft HAT unchanged", "200 ft HAT (add 100 ft) and raise DA accordingly", "Circling MDA only"], "ans": 2, "expl": "Add 100 ft to HAT/DA for single-pilot PAR."}, {"q": "A displaced threshold may be used for:", "opts": ["Touchdown on landing", "Takeoff roll and landing rollout, but not as the touchdown point", "Taxi only", "LAHSO exclusively"], "ans": 1, "expl": "Displaced threshold: rollout/takeoff yes, touchdown no."}, {"q": "Typical plate frequency listing order starts with:", "opts": ["Tower then ATIS", "Ground then Tower", "ATIS, then Approach, Tower, Ground, Clearance Delivery", "Clearance Delivery only"], "ans": 2, "expl": "ATIS → Approach → Tower → Ground → Clearance."}, {"q": "Where can you get official PDF approach plates and IFR charts (high and low)?", "opts": ["Increase RVR to 4000 (~¾ mile) per inoperative-components table / plate note (verify plate-specific notes).", "Usable for takeoff roll and landing rollout; not a legal touchdown point (pavement not hardened for landings).", "FAA.gov; printed NGA High Approach Playbook East also used; SkyVector/ForeFlight ultimately pull from these sources.", "3710 requires no lower than ~24 RVR (½ mile); 18 RVR on the civil plate is not enough for single-pilot rules."], "ans": 2, "expl": "FAA.gov; printed NGA High Approach Playbook East also used; SkyVector/ForeFlight ultimately pull from these sources."}, {"q": "What does the Trouble T on an approach plate header indicate?", "opts": ["Takeoff issues / complications out of that airport (often lighting-related notes).", "Add 100 ft to height-above-touchdown (and correspondingly to DA) so HAT is at least ~200 ft.", "Sequence flashers / strobe lights associated with that approach lighting system.", "OROCA (off-route obstruction clearance altitude) — same 1000/2000 ft clearance idea."], "ans": 0, "expl": "Takeoff issues / complications out of that airport (often lighting-related notes)."}, {"q": "What does a dot above an ALS code (e.g. A5) mean?", "opts": ["Sequence flashers / strobe lights associated with that approach lighting system.", "Takeoff issues / complications out of that airport (often lighting-related notes).", "Add 100 ft to height-above-touchdown (and correspondingly to DA) so HAT is at least ~200 ft.", "OROCA (off-route obstruction clearance altitude) — same 1000/2000 ft clearance idea."], "ans": 0, "expl": "Sequence flashers / strobe lights associated with that approach lighting system."}, {"q": "MSA vs Emergency Safe Altitude — radius and clearance?", "opts": ["The published glide-slope altitude at that fix (e.g. 1433 MSL at Tuscaloosa example). Mismatch → consider localizer-only and time from FAF.", "MSA typically based on a ~25 NM circle about the defining navaid (quadrants). ESA out to 100 NM: 1000 ft obstacle clearance in flat terrain, 2000 ft in designated mountainous terrain.", "Usable for takeoff roll and landing rollout; not a legal touchdown point (pavement not hardened for landings).", "FAA.gov; printed NGA High Approach Playbook East also used; SkyVector/ForeFlight ultimately pull from these sources."], "ans": 1, "expl": "MSA typically based on a ~25 NM circle about the defining navaid (quadrants). ESA out to 100 NM: 1000 ft obstacle clearance in flat terrain, 2000 ft in designated mountainous terrain."}, {"q": "CNAF 3710 single-pilot RVR floor vs a plate showing 18 RVR (Atlantic City ILS example)?", "opts": ["Increase RVR to 4000 (~¾ mile) per inoperative-components table / plate note (verify plate-specific notes).", "Usable for takeoff roll and landing rollout; not a legal touchdown point (pavement not hardened for landings).", "3710 requires no lower than ~24 RVR (½ mile); 18 RVR on the civil plate is not enough for single-pilot rules.", "FAA.gov; printed NGA High Approach Playbook East also used; SkyVector/ForeFlight ultimately pull from these sources."], "ans": 2, "expl": "3710 requires no lower than ~24 RVR (½ mile); 18 RVR on the civil plate is not enough for single-pilot rules."}, {"q": "If MALSR is OTS on an ILS that was designed for 1800 RVR, what correction is typical?", "opts": ["3710 requires no lower than ~24 RVR (½ mile); 18 RVR on the civil plate is not enough for single-pilot rules.", "Increase RVR to 4000 (~¾ mile) per inoperative-components table / plate note (verify plate-specific notes).", "Usable for takeoff roll and landing rollout; not a legal touchdown point (pavement not hardened for landings).", "Lighting symbology as a black circle with white lettering; click frequency to raise/lower intensity."], "ans": 1, "expl": "Increase RVR to 4000 (~¾ mile) per inoperative-components table / plate note (verify plate-specific notes)."}, {"q": "What is a displaced threshold usable for, and not usable for?", "opts": ["Increase RVR to 4000 (~¾ mile) per inoperative-components table / plate note (verify plate-specific notes).", "Usable for takeoff roll and landing rollout; not a legal touchdown point (pavement not hardened for landings).", "FAA.gov; printed NGA High Approach Playbook East also used; SkyVector/ForeFlight ultimately pull from these sources.", "3710 requires no lower than ~24 RVR (½ mile); 18 RVR on the civil plate is not enough for single-pilot rules."], "ans": 1, "expl": "Usable for takeoff roll and landing rollout; not a legal touchdown point (pavement not hardened for landings)."}, {"q": "Are T-45s authorized for land-and-hold-short (LAHSO) operations?", "opts": ["No — T-45s are not really authorized for LAHSO.", "Yes — after selecting GAIN ORIDE.", "Yes — available in the aft cockpit only.", "Yes — fully available with no limitations."], "ans": 0, "expl": "No — T-45s are not really authorized for LAHSO."}, {"q": "If a low approach plate omits Emergency Safe Altitude, what chart altitude can substitute conceptually?", "opts": ["Takeoff issues / complications out of that airport (often lighting-related notes).", "Add 100 ft to height-above-touchdown (and correspondingly to DA) so HAT is at least ~200 ft.", "OROCA (off-route obstruction clearance altitude) — same 1000/2000 ft clearance idea.", "Sequence flashers / strobe lights associated with that approach lighting system."], "ans": 2, "expl": "OROCA (off-route obstruction clearance altitude) — same 1000/2000 ft clearance idea."}, {"q": "How is pilot-controlled lighting depicted on plates?", "opts": ["Increase RVR to 4000 (~¾ mile) per inoperative-components table / plate note (verify plate-specific notes).", "Add 100 ft to height-above-touchdown (and correspondingly to DA) so HAT is at least ~200 ft.", "Lighting symbology as a black circle with white lettering; click frequency to raise/lower intensity.", "ATIS, Approach Control, Tower, Ground, Clearance Delivery (plus ASR/PAR note if applicable)."], "ans": 2, "expl": "Lighting symbology as a black circle with white lettering; click frequency to raise/lower intensity."}, {"q": "At the outer marker on an ILS, centered glide slope should show what?", "opts": ["The published glide-slope altitude at that fix (e.g. 1433 MSL at Tuscaloosa example). Mismatch → consider localizer-only and time from FAF.", "Usable for takeoff roll and landing rollout; not a legal touchdown point (pavement not hardened for landings).", "MSA typically based on a ~25 NM circle about the defining navaid (quadrants). ESA out to 100 NM: 1000 ft obstacle clearance in flat terrain, 2000 ft in designated mountainous terrain.", "FAA.gov; printed NGA High Approach Playbook East also used; SkyVector/ForeFlight ultimately pull from these sources."], "ans": 0, "expl": "The published glide-slope altitude at that fix (e.g. 1433 MSL at Tuscaloosa example). Mismatch → consider localizer-only and time from FAF."}, {"q": "Approx VSI for a 3° glide path at 120 kt ground speed (descent gradient table)?", "opts": ["About 318 feet per minute.", "About 1274 feet per minute.", "About 647 feet per minute.", "About 637 feet per minute."], "ans": 3, "expl": "About 637 feet per minute."}, {"q": "For PAR minima under single-pilot 3710 rules, what adjustment is emphasized?", "opts": ["Add 100 ft to height-above-touchdown (and correspondingly to DA) so HAT is at least ~200 ft.", "OROCA (off-route obstruction clearance altitude) — same 1000/2000 ft clearance idea.", "ATIS, Approach Control, Tower, Ground, Clearance Delivery (plus ASR/PAR note if applicable).", "Lighting symbology as a black circle with white lettering; click frequency to raise/lower intensity."], "ans": 0, "expl": "Add 100 ft to height-above-touchdown (and correspondingly to DA) so HAT is at least ~200 ft."}, {"q": "Frequency order typically listed on the plate header?", "opts": ["Lighting symbology as a black circle with white lettering; click frequency to raise/lower intensity.", "OROCA (off-route obstruction clearance altitude) — same 1000/2000 ft clearance idea.", "Add 100 ft to height-above-touchdown (and correspondingly to DA) so HAT is at least ~200 ft.", "ATIS, Approach Control, Tower, Ground, Clearance Delivery (plus ASR/PAR note if applicable)."], "ans": 3, "expl": "ATIS, Approach Control, Tower, Ground, Clearance Delivery (plus ASR/PAR note if applicable)."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= queue.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
</html>
