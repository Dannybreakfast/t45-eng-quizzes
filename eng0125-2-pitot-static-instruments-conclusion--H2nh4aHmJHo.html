<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ENG0125 (2) Pitot Static Instruments &amp; Conclusion — T-45 Quiz</title>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">Home</a> · <a href="section-eng.html">ENG</a> · Displays</div>
    <h1>ENG0125 (2) Pitot Static Instruments &amp; Conclusion</h1>
    <div class="meta">24 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 24</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Displays</div>
    <h2 style="margin:0.2rem 0">ENG0125 (2) Pitot Static Instruments &amp; Conclusion</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-eng.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to ENG</a>
    </div>
    <div class="review" id="review"></div>
  </div>

</div>
<script>
const QUESTIONS = [{"q": "Which cockpit’s standby altimeter setting does the aircraft data system use?", "opts": ["Rear only", "Front cockpit", "Average of both", "Neither — GPS only"], "ans": 1, "expl": "Front cockpit setting drives the data system."}, {"q": "Standby airspeed comes alive approximately at:", "opts": ["20–30 KIAS", "50–60 KIAS", "100 KIAS", "150 KIAS"], "ans": 1, "expl": "~50–60 KIAS."}, {"q": "On-speed AOA on the T-45 indicator is:", "opts": ["12 units", "14 units", "17 units (needle at 3 o’clock)", "21.5 units"], "ans": 2, "expl": "17 units on-speed."}, {"q": "Rudder shakers (artificial stall warning) activate at:", "opts": ["14 units", "17 units", "21.5 units", "28 units"], "ans": 2, "expl": "21.5 units rudder shakers."}, {"q": "AOA indexers illuminate when:", "opts": ["Always with MASTER ARM", "Weight-off-wheels with gear down and locked", "Only on LIGHTS test", "Only above 200 KIAS"], "ans": 1, "expl": "WOW off + gear down/locked."}, {"q": "Radar altimeter is not operable:", "opts": ["Below 100 ft AGL", "Above 5,000 ft AGL or roll/pitch \u003e 40°", "Only in IMC", "With gear up"], "ans": 1, "expl": "\u003e5,000’ AGL or \u003e40° attitude."}, {"q": "After electrical power loss, standby attitude indicators provide pitch/roll for about:", "opts": ["30 seconds", "2 minutes", "9 minutes", "30 minutes"], "ans": 2, "expl": "~9 minutes."}, {"q": "Electronic MFCD/HUD data passes through:", "opts": ["Only GINA", "The DEU", "OBOGS computer alone", "Standby manifold"], "ans": 1, "expl": "Through the DEU."}, {"q": "Holding DISPLAY POWER to RESET for ~5 seconds:", "opts": ["Shuts down the engine", "Resets the DEU", "Erases WYPT ZERO only", "Cages both standby AIs"], "ans": 1, "expl": "DEU reset."}, {"q": "Display Override after generator failure is used to:", "opts": ["Blank both MFDs immediately", "Retain the left MFD past the 2-minute threshold", "Power only the HUD camera", "Disable SADS"], "ans": 1, "expl": "Keep left MFD past 2-min post-gen-fail."}, {"q": "Where is the altimeter setting dialed, and which cockpit feeds the aircraft data system?", "opts": ["Standby VSI is accurate but **lags** — needs smooth, precise, patient BAW. HUD/ADI VVI is **instantaneous**.", "Standby **barometric altimeter**. The **front cockpit** setting is what the aircraft data system utilizes.", "~**50–60 KIAS**. **10-knot** ticks to 200 KIAS; above 200, **50-knot** increments.", "Amber donut = on-speed. Red chevron bottom = fast (low AOA). Green chevron top = slow (high AOA). Donut + chevron = slightly fast/slow."], "ans": 1, "expl": "Standby **barometric altimeter**. The **front cockpit** setting is what the aircraft data system utilizes."}, {"q": "Standby airspeed “comes alive” and scale ticks?", "opts": ["~**50–60 KIAS**. **10-knot** ticks to 200 KIAS; above 200, **50-knot** increments.", "Standby **barometric altimeter**. The **front cockpit** setting is what the aircraft data system utilizes.", "Standby VSI is accurate but **lags** — needs smooth, precise, patient BAW. HUD/ADI VVI is **instantaneous**.", "Not operable above **5,000 ft AGL** or at roll/pitch angles **\u003e 40°**."], "ans": 0, "expl": "~**50–60 KIAS**. **10-knot** ticks to 200 KIAS; above 200, **50-knot** increments."}, {"q": "Standby VSI vs HUD/ADI VVI?", "opts": ["Standby VSI is accurate but **lags** — needs smooth, precise, patient BAW. HUD/ADI VVI is **instantaneous**.", "Standby **barometric altimeter**. The **front cockpit** setting is what the aircraft data system utilizes.", "~**50–60 KIAS**. **10-knot** ticks to 200 KIAS; above 200, **50-knot** increments.", "Amber donut = on-speed. Red chevron bottom = fast (low AOA). Green chevron top = slow (high AOA). Donut + chevron = slightly fast/slow."], "ans": 0, "expl": "Standby VSI is accurate but **lags** — needs smooth, precise, patient BAW. HUD/ADI VVI is **instantaneous**."}, {"q": "Pitot vs static pressure routing?", "opts": ["On-speed **17** (needle 3 o’clock). Max-range **12** (triangle). Max-endurance **14** (rectangle). Rudder shakers **21.5**. Yellow stall tics **26–28**. With power on, no OFF flag expected.", "Glareshields both cockpits, left of DEP. Lit with **WOW off** and gear **down and locked**. Not on LIGHTS test — press top button to check. Thumbwheel rheostat left side for brightness.", "**Pitot (dynamic):** both cockpits’ standby ASI + **SADS**. **Static:** SADS, **OBOGS**, and each cockpit **static manifold** (standby instruments). Probe protrudes from the nose cone.", "All MFCD/HUD electronic data passes through the **DEU**. If pitot-static plumbing is good, **standby gauges** should remain reliable in electrical / SADS / DEU degrades."], "ans": 2, "expl": "**Pitot (dynamic):** both cockpits’ standby ASI + **SADS**. **Static:** SADS, **OBOGS**, and each cockpit **static manifold** (standby instruments). Probe protrudes from the nose cone."}, {"q": "Key AOA indicator values (units)?", "opts": ["All MFCD/HUD electronic data passes through the **DEU**. If pitot-static plumbing is good, **standby gauges** should remain reliable in electrical / SADS / DEU degrades.", "**Pitot (dynamic):** both cockpits’ standby ASI + **SADS**. **Static:** SADS, **OBOGS**, and each cockpit **static manifold** (standby instruments). Probe protrudes from the nose cone.", "On-speed **17** (needle 3 o’clock). Max-range **12** (triangle). Max-endurance **14** (rectangle). Rudder shakers **21.5**. Yellow stall tics **26–28**. With power on, no OFF flag expected.", "Glareshields both cockpits, left of DEP. Lit with **WOW off** and gear **down and locked**. Not on LIGHTS test — press top button to check. Thumbwheel rheostat left side for brightness."], "ans": 2, "expl": "On-speed **17** (needle 3 o’clock). Max-range **12** (triangle). Max-endurance **14** (rectangle). Rudder shakers **21.5**. Yellow stall tics **26–28**. With power on, no OFF flag expected."}, {"q": "AOA indexers — location, when lit, test/brightness?", "opts": ["All MFCD/HUD electronic data passes through the **DEU**. If pitot-static plumbing is good, **standby gauges** should remain reliable in electrical / SADS / DEU degrades.", "On-speed **17** (needle 3 o’clock). Max-range **12** (triangle). Max-endurance **14** (rectangle). Rudder shakers **21.5**. Yellow stall tics **26–28**. With power on, no OFF flag expected.", "Glareshields both cockpits, left of DEP. Lit with **WOW off** and gear **down and locked**. Not on LIGHTS test — press top button to check. Thumbwheel rheostat left side for brightness.", "**Pitot (dynamic):** both cockpits’ standby ASI + **SADS**. **Static:** SADS, **OBOGS**, and each cockpit **static manifold** (standby instruments). Probe protrudes from the nose cone."], "ans": 2, "expl": "Glareshields both cockpits, left of DEP. Lit with **WOW off** and gear **down and locked**. Not on LIGHTS test — press top button to check. Thumbwheel rheostat left side for brightness."}, {"q": "Indexer light meanings?", "opts": ["Values show on ADI/HSI and can be boxed there with increment tiles, but preferred/recommended method is the **Data Entry Panel (DEP)**.", "AOB scale on **top** of standby AI (bottom of ADI); scales themselves are the same pattern as each other for that instrument family — still distinct from HUD scale.", "Left fuselage just forward of front cockpit. Heated whenever electrical power is applied. AOA also digital on HUD, HUD repeater, and ADI.", "Amber donut = on-speed. Red chevron bottom = fast (low AOA). Green chevron top = slow (high AOA). Donut + chevron = slightly fast/slow."], "ans": 3, "expl": "Amber donut = on-speed. Red chevron bottom = fast (low AOA). Green chevron top = slow (high AOA). Donut + chevron = slightly fast/slow."}, {"q": "AOA probe location and heat?", "opts": ["Amber donut = on-speed. Red chevron bottom = fast (low AOA). Green chevron top = slow (high AOA). Donut + chevron = slightly fast/slow.", "AOB scale on **top** of standby AI (bottom of ADI); scales themselves are the same pattern as each other for that instrument family — still distinct from HUD scale.", "Values show on ADI/HSI and can be boxed there with increment tiles, but preferred/recommended method is the **Data Entry Panel (DEP)**.", "Left fuselage just forward of front cockpit. Heated whenever electrical power is applied. AOA also digital on HUD, HUD repeater, and ADI."], "ans": 3, "expl": "Left fuselage just forward of front cockpit. Heated whenever electrical power is applied. AOA also digital on HUD, HUD repeater, and ADI."}, {"q": "Approach lights vs indexers for the LSO?", "opts": ["Yes — after selecting GAIN ORIDE.", "Nose-gear approach lights same green–amber–red top-to-bottom as indexers, but **only one light on at a time** (no “slightly” combinations).", "Yes — fully available with no limitations.", "Yes — available in the aft cockpit only."], "ans": 1, "expl": "Nose-gear approach lights same green–amber–red top-to-bottom as indexers, but **only one light on at a time** (no “slightly” combinations)."}, {"q": "Radar altimeter operating limits?", "opts": ["Yes — available in the aft cockpit only.", "Yes — after selecting GAIN ORIDE.", "Not operable above **5,000 ft AGL** or at roll/pitch angles **\u003e 40°**.", "Yes — fully available with no limitations."], "ans": 2, "expl": "Not operable above **5,000 ft AGL** or at roll/pitch angles **\u003e 40°**."}, {"q": "Standby attitude indicator power / OFF flag / caging?", "opts": ["Electrically powered gyro; **~9 minutes** after electrical loss. Independent per cockpit. OFF if no power or CAGE knob pulled/held/locked out. Don’t take off with OFF flag. **Lock CAGE extended when exiting** to prote...", "Hold **DISPLAY POWER** to **RESET ~5 seconds** to reset DEU (clear BIT degrade or multiple display failures). **Display Override** retains the **left MFD** past the **2-minute** threshold after generator failure.", "Turn needle electrical; slip mechanical (works without power). May not perfectly match GINA ADI. Compass on canopy bow; accurate wings-level, lags in turn. Clock: wind lower-left (not too tight); pull to set; ET butto...", "On-speed **17** (needle 3 o’clock). Max-range **12** (triangle). Max-endurance **14** (rectangle). Rudder shakers **21.5**. Yellow stall tics **26–28**. With power on, no OFF flag expected."], "ans": 0, "expl": "Electrically powered gyro; **~9 minutes** after electrical loss. Independent per cockpit. OFF if no power or CAGE knob pulled/held/locked out. Don’t take off with OFF flag. **Lock CAGE extended when exiting** to protect the gyro."}, {"q": "Standby attitude AOB scale placement vs ADI?", "opts": ["All MFCD/HUD electronic data passes through the **DEU**. If pitot-static plumbing is good, **standby gauges** should remain reliable in electrical / SADS / DEU degrades.", "Glareshields both cockpits, left of DEP. Lit with **WOW off** and gear **down and locked**. Not on LIGHTS test — press top button to check. Thumbwheel rheostat left side for brightness.", "AOB scale on **top** of standby AI (bottom of ADI); scales themselves are the same pattern as each other for that instrument family — still distinct from HUD scale.", "**Pitot (dynamic):** both cockpits’ standby ASI + **SADS**. **Static:** SADS, **OBOGS**, and each cockpit **static manifold** (standby instruments). Probe protrudes from the nose cone."], "ans": 2, "expl": "AOB scale on **top** of standby AI (bottom of ADI); scales themselves are the same pattern as each other for that instrument family — still distinct from HUD scale."}, {"q": "Turn-and-slip, standby compass, 8-day clock?", "opts": ["Turn needle electrical; slip mechanical (works without power). May not perfectly match GINA ADI. Compass on canopy bow; accurate wings-level, lags in turn. Clock: wind lower-left (not too tight); pull to set; ET butto...", "On-speed **17** (needle 3 o’clock). Max-range **12** (triangle). Max-endurance **14** (rectangle). Rudder shakers **21.5**. Yellow stall tics **26–28**. With power on, no OFF flag expected.", "Hold **DISPLAY POWER** to **RESET ~5 seconds** to reset DEU (clear BIT degrade or multiple display failures). **Display Override** retains the **left MFD** past the **2-minute** threshold after generator failure.", "Electrically powered gyro; **~9 minutes** after electrical loss. Independent per cockpit. OFF if no power or CAGE knob pulled/held/locked out. Don’t take off with OFF flag. **Lock CAGE extended when exiting** to prote..."], "ans": 0, "expl": "Turn needle electrical; slip mechanical (works without power). May not perfectly match GINA ADI. Compass on canopy bow; accurate wings-level, lags in turn. Clock: wind lower-left (not too tight); pull to set; ET button cycles stop → reset → run."}, {"q": "Electronic display data path and standby reliability in degrades?", "opts": ["**Pitot (dynamic):** both cockpits’ standby ASI + **SADS**. **Static:** SADS, **OBOGS**, and each cockpit **static manifold** (standby instruments). Probe protrudes from the nose cone.", "Glareshields both cockpits, left of DEP. Lit with **WOW off** and gear **down and locked**. Not on LIGHTS test — press top button to check. Thumbwheel rheostat left side for brightness.", "AOB scale on **top** of standby AI (bottom of ADI); scales themselves are the same pattern as each other for that instrument family — still distinct from HUD scale.", "All MFCD/HUD electronic data passes through the **DEU**. If pitot-static plumbing is good, **standby gauges** should remain reliable in electrical / SADS / DEU degrades."], "ans": 3, "expl": "All MFCD/HUD electronic data passes through the **DEU**. If pitot-static plumbing is good, **standby gauges** should remain reliable in electrical / SADS / DEU degrades."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= QUESTIONS.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
