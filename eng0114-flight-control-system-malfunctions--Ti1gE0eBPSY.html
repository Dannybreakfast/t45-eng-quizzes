<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ENG0114 Flight Control System Malfunctions — T-45 Quiz</title>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">T-45 Local Quizzes</a> · Flight Controls</div>
    <h1>ENG0114 Flight Control System Malfunctions</h1>
    <div class="meta">24 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 24</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Flight Controls</div>
    <h2 style="margin:0.2rem 0">ENG0114 Flight Control System Malfunctions</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="index.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to Index</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="index.html">← All quizzes</a></div>
</div>
<script>
const QUESTIONS = [{"q": "With C AUG caution from paddle/fail, which is LOST?", "opts": ["Aileron hydraulic power", "Rudder trim, SBI, yaw damping, ARI", "Main stab trim on ESS bus", "Wheel brakes"], "ans": 1, "expl": "Classic CAUG loss set; NWS also if paddled gear down."}, {"q": "Split slats / slats up near clean stall — expect:", "opts": ["Gentle buffet only at 15 units", "Possible abrupt rolloff with little stall warning ~25 units", "Automatic emerg flaps", "HYD2 isolation"], "ans": 1, "expl": "Abrupt rolloff risk ~25 units clean stall AOA."}, {"q": "Rudder trim after total hydraulic failure:", "opts": ["Inoperative", "Still available (GEN-bus electrical)", "Only via emerg flaps switch", "Only above 217 KIAS"], "ans": 1, "expl": "Electrical trim/YDA path; needs GEN."}, {"q": "Emerg flaps with HYD1 failed and accumulator 1800 psi:", "opts": ["Will extend full flaps", "Will not work (\u003c2000 psi)", "Extends slats only", "Raises flaps"], "ans": 1, "expl": "Need accumulator \u003e2000 psi when HYD1 failed."}, {"q": "Preflight emerg flap/brake accumulator minimum:", "opts": ["800 psi", "1250 psi (target ~1300)", "2000 psi minimum on gauge always", "3000 psi"], "ans": 1, "expl": "~1300 indicated, min 1250 in RMLG well."}, {"q": "Successful CAUG BIT light extinguishes after:", "opts": ["30 seconds", "60 seconds", "120 seconds", "217 seconds"], "ans": 2, "expl": "120 seconds."}, {"q": "Speed brakes may not fully extend above / blowback begins:", "opts": ["200 / 217", "340 / 380", "150 / 200", "400 / 450"], "ans": 1, "expl": "~340 full extend limit; blowback ~380."}, {"q": "Gear or flaps down max bank:", "opts": ["45°", "60°", "90°", "180°"], "ans": 2, "expl": "90° max bank dirty."}, {"q": "Standby stab trim guard lifted:", "opts": ["Enables both trim motors", "Makes normal/main trim inoperative", "Starts IBIT", "Locks rudder"], "ans": 1, "expl": "Guard up disengages main trim."}, {"q": "Total electrical failure, flaps already UP:", "opts": ["Use emerg flaps normally", "Expect no-flap landing", "Slats still extend electrically", "CAUG provides flap drive"], "ans": 1, "expl": "No electrics → can’t move flaps → no-flap landing."}, {"q": "What do you lose with C AUG paddled off or failed?", "opts": ["Weight on wheels, airspeed \u003c80 KIAS, flaps/slats UP. C AUG light on during BIT; extinguishes after **120 seconds** if successful.", "Rudder trim, SBI, yaw damping (dutch roll), and turn coordination (ARI). Paddle also dumps NWS / NWS caution if gear down.", "GEN-bus electrical control; HYD actuation. Works with HYD1 fail. Fails with GEN fail, total electrical, or total HYD loss.", "Slats not in selected position; split slats (\u003e~2°); slats selected above 217 KIAS (won’t extend); exceeding 217 with slats down."], "ans": 1, "expl": "Rudder trim, SBI, yaw damping (dutch roll), and turn coordination (ARI). Paddle also dumps NWS / NWS caution if gear down."}, {"q": "How to restore rudder trim + SBI if dutch-roll/ARI is the problem?", "opts": ["Momentarily select RESET, then remain in SBI. Avoid parade/close SB use especially 220–300 KIAS with SBI inop.", "Still work (mechanical control; HYD1/HYD2/RAT actuation). Will NOT work with total loss of hydraulics.", "Check in right MLG wheel well: ~1300 psi, minimum 1250 psi. Below 1250 → may need servicing. Also monitor airborne.", "Still works (electrically controlled and actuated on GEN bus). Fails with GEN fail or total electrical failure."], "ans": 0, "expl": "Momentarily select RESET, then remain in SBI. Avoid parade/close SB use especially 220–300 KIAS with SBI inop."}, {"q": "SLATS caution light causes?", "opts": ["Abrupt rolloff with little/no stall warning near clean stall ~25 units. With flaps ½/full and slats up, max AOA / shaker = 21.5 units.", "Rudder trim, SBI, yaw damping (dutch roll), and turn coordination (ARI). Paddle also dumps NWS / NWS caution if gear down.", "Slats not in selected position; split slats (\u003e~2°); slats selected above 217 KIAS (won’t extend); exceeding 217 with slats down.", "Weight on wheels, airspeed \u003c80 KIAS, flaps/slats UP. C AUG light on during BIT; extinguishes after **120 seconds** if successful."], "ans": 2, "expl": "Slats not in selected position; split slats (\u003e~2°); slats selected above 217 KIAS (won’t extend); exceeding 217 with slats down."}, {"q": "AOA risk with split slats or slats up?", "opts": ["Rudder trim, SBI, yaw damping (dutch roll), and turn coordination (ARI). Paddle also dumps NWS / NWS caution if gear down.", "Abrupt rolloff with little/no stall warning near clean stall ~25 units. With flaps ½/full and slats up, max AOA / shaker = 21.5 units.", "Weight on wheels, airspeed \u003c80 KIAS, flaps/slats UP. C AUG light on during BIT; extinguishes after **120 seconds** if successful.", "Slats not in selected position; split slats (\u003e~2°); slats selected above 217 KIAS (won’t extend); exceeding 217 with slats down."], "ans": 1, "expl": "Abrupt rolloff with little/no stall warning near clean stall ~25 units. With flaps ½/full and slats up, max AOA / shaker = 21.5 units."}, {"q": "Ailerons with GEN fail / total electrical / HYD1 fail?", "opts": ["Momentarily select RESET, then remain in SBI. Avoid parade/close SB use especially 220–300 KIAS with SBI inop.", "Check in right MLG wheel well: ~1300 psi, minimum 1250 psi. Below 1250 → may need servicing. Also monitor airborne.", "Still works (electrically controlled and actuated on GEN bus). Fails with GEN fail or total electrical failure.", "Still work (mechanical control; HYD1/HYD2/RAT actuation). Will NOT work with total loss of hydraulics."], "ans": 3, "expl": "Still work (mechanical control; HYD1/HYD2/RAT actuation). Will NOT work with total loss of hydraulics."}, {"q": "Aileron trim failure modes?", "opts": ["Weight on wheels, airspeed \u003c80 KIAS, flaps/slats UP. C AUG light on during BIT; extinguishes after **120 seconds** if successful.", "GEN-bus electrical control; HYD actuation. Works with HYD1 fail. Fails with GEN fail, total electrical, or total HYD loss.", "Slats not in selected position; split slats (\u003e~2°); slats selected above 217 KIAS (won’t extend); exceeding 217 with slats down.", "Rudder trim, SBI, yaw damping (dutch roll), and turn coordination (ARI). Paddle also dumps NWS / NWS caution if gear down."], "ans": 1, "expl": "GEN-bus electrical control; HYD actuation. Works with HYD1 fail. Fails with GEN fail, total electrical, or total HYD loss."}, {"q": "Rudder trim with total HYD loss?", "opts": ["Still works (electrically controlled and actuated on GEN bus). Fails with GEN fail or total electrical failure.", "Check in right MLG wheel well: ~1300 psi, minimum 1250 psi. Below 1250 → may need servicing. Also monitor airborne.", "Still work (mechanical control; HYD1/HYD2/RAT actuation). Will NOT work with total loss of hydraulics.", "Momentarily select RESET, then remain in SBI. Avoid parade/close SB use especially 220–300 KIAS with SBI inop."], "ans": 0, "expl": "Still works (electrically controlled and actuated on GEN bus). Fails with GEN fail or total electrical failure."}, {"q": "Emergency flaps work when?", "opts": ["Weight on wheels, airspeed \u003c80 KIAS, flaps/slats UP. C AUG light on during BIT; extinguishes after **120 seconds** if successful.", "Slats not in selected position; split slats (\u003e~2°); slats selected above 217 KIAS (won’t extend); exceeding 217 with slats down.", "Abrupt rolloff with little/no stall warning near clean stall ~25 units. With flaps ½/full and slats up, max AOA / shaker = 21.5 units.", "ESS-bus control; HYD1 or brake/emerg-flap accumulator \u003e2000 psi. Works with GEN fail; with HYD1 fail if accumulator \u003e2000. Fails total electrical or HYD1 fail with accumulator \u003c2000."], "ans": 3, "expl": "ESS-bus control; HYD1 or brake/emerg-flap accumulator \u003e2000 psi. Works with GEN fail; with HYD1 fail if accumulator \u003e2000. Fails total electrical or HYD1 fail with accumulator \u003c2000."}, {"q": "Accumulator preflight numbers?", "opts": ["Still works (electrically controlled and actuated on GEN bus). Fails with GEN fail or total electrical failure.", "Momentarily select RESET, then remain in SBI. Avoid parade/close SB use especially 220–300 KIAS with SBI inop.", "Check in right MLG wheel well: ~1300 psi, minimum 1250 psi. Below 1250 → may need servicing. Also monitor airborne.", "Still work (mechanical control; HYD1/HYD2/RAT actuation). Will NOT work with total loss of hydraulics."], "ans": 2, "expl": "Check in right MLG wheel well: ~1300 psi, minimum 1250 psi. Below 1250 → may need servicing. Also monitor airborne."}, {"q": "Flaps/slats and emerg flaps airspeed limit?", "opts": ["≤200 KIAS. Flaps do not blow back if oversped. Emerg flaps = full 50°, no slats.", "Still work (mechanical control; HYD1/HYD2/RAT actuation). Will NOT work with total loss of hydraulics.", "Expect a **no-flap** landing (can’t move flaps without electrics).", "TRUE — if guard is lifted in either cockpit, normal (main) trim is inoperative."], "ans": 0, "expl": "≤200 KIAS. Flaps do not blow back if oversped. Emerg flaps = full 50°, no slats."}, {"q": "Total electrical failure with flaps UP — landing?", "opts": ["Still work (mechanical control; HYD1/HYD2/RAT actuation). Will NOT work with total loss of hydraulics.", "TRUE — if guard is lifted in either cockpit, normal (main) trim is inoperative.", "≤200 KIAS. Flaps do not blow back if oversped. Emerg flaps = full 50°, no slats.", "Expect a **no-flap** landing (can’t move flaps without electrics)."], "ans": 3, "expl": "Expect a **no-flap** landing (can’t move flaps without electrics)."}, {"q": "Dirty-configuration G limits (gear or flaps down)?", "opts": ["Symmetrical 0.0 to +4 g; unsymmetrical +1 to +1.5 g. Max bank 90°.", "Symmetrical 0.0 to +2.0 g; unsymmetrical +1 to +1.5 g. Max bank 90°.", "Symmetrical -5 to +2.0 g; unsymmetrical +1 to +1.5 g. Max bank 90°.", "Symmetrical 10 to +2.0 g; unsymmetrical +1 to +1.5 g. Max bank 90°."], "ans": 1, "expl": "Symmetrical 0.0 to +2.0 g; unsymmetrical +1 to +1.5 g. Max bank 90°."}, {"q": "CAUG IBIT enable conditions and successful duration?", "opts": ["Slats not in selected position; split slats (\u003e~2°); slats selected above 217 KIAS (won’t extend); exceeding 217 with slats down.", "Abrupt rolloff with little/no stall warning near clean stall ~25 units. With flaps ½/full and slats up, max AOA / shaker = 21.5 units.", "Rudder trim, SBI, yaw damping (dutch roll), and turn coordination (ARI). Paddle also dumps NWS / NWS caution if gear down.", "Weight on wheels, airspeed \u003c80 KIAS, flaps/slats UP. C AUG light on during BIT; extinguishes after **120 seconds** if successful."], "ans": 3, "expl": "Weight on wheels, airspeed \u003c80 KIAS, flaps/slats UP. C AUG light on during BIT; extinguishes after **120 seconds** if successful."}, {"q": "Standby stab trim guard true/false?", "opts": ["Still work (mechanical control; HYD1/HYD2/RAT actuation). Will NOT work with total loss of hydraulics.", "≤200 KIAS. Flaps do not blow back if oversped. Emerg flaps = full 50°, no slats.", "TRUE — if guard is lifted in either cockpit, normal (main) trim is inoperative.", "Expect a **no-flap** landing (can’t move flaps without electrics)."], "ans": 2, "expl": "TRUE — if guard is lifted in either cockpit, normal (main) trim is inoperative."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= QUESTIONS.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
</html>
