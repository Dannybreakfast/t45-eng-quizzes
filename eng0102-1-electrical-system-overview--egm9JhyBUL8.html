<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<script src="auth.js"></script>
<title>ENG0102 (1) Electrical System Overview — T-45 Quiz</title>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">Home</a> · <a href="section-eng.html">ENG</a> · Electrical</div>
    <h1>ENG0102 (1) Electrical System Overview</h1>
    <div class="meta">23 multiple-choice questions · offline · tap an answer</div>

        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>

  </div>

  <div class="results" id="results">
    <div class="crumb">Electrical</div>
    <h2 style="margin:0.2rem 0">ENG0102 (1) Electrical System Overview</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-eng.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to ENG</a>
    </div>
    <div class="review" id="review"></div>
  </div>

</div>
<script>

tart on external power is not permitted.", "Fleet aircraft often use AC generators with transformer-rectifiers (AC→DC). The T-45 uses inverters/static converters to transform DC power to AC."], "ans": 1, "expl": "Each supplies 115 V 400 Hz to the 115 VAC buses and 26 V 400 Hz to the 26 VAC buses (powered from the 28 VDC essential services bus)."}, {"q": "Where are the batteries and what are their specs (per lecture ASR)?", "opts": ["Two 12 V, 18 amp-hour lead sealed batteries in the main equipment bay.", "Two 34 V, 18 amp-hour lead sealed batteries in the main equipment bay.", "Two 48 V, 18 amp-hour lead sealed batteries in the main equipment bay.", "Two 24 V, 18 amp-hour lead sealed batteries in the main equipment bay."], "ans": 3, "expl": "Two 24 V, 18 amp-hour lead sealed batteries in the main equipment bay."}, {"q": "What do the battery switches do?", "opts": ["Each supplies 115 V 400 Hz to the 115 VAC buses and 26 V 400 Hz to the 26 VAC buses (powered from the 28 VDC essential services bus).", "28 VDC at 300 amps for servicing/charging. Auto cut off as engine RPM exceeds ~45% N2. Starting GTS / engine start on external power is not permitted.", "Fleet aircraft often use AC generators with transformer-rectifiers (AC→DC). The T-45 uses inverters/static converters to transform DC power to AC.", "ON connects that battery to the 28 VDC essential services bus (charged by the generator when online); OFF disconnects it."], "ans": 3, "expl": "ON connects that battery to the 28 VDC essential services bus (charged by the generator when online); OFF disconnects it."}, {"q": "Battery endurance with generator failed?", "opts": ["Does not illuminate because inverters still feed essential AC buses from batteries", "One fully charged battery ≈ 12 minutes; both ≈ 27 minutes of essential services bus loads.", "HUD and left MFD turn off prior to master alert light, warning tone, and generator warning light.", "An engine-driven 9 kilowatt DC generator supplying 28 volts to the 28 VDC generator bus."], "ans": 1, "expl": "One fully charged battery ≈ 12 minutes; both ≈ 27 minutes of essential services bus loads."}, {"q": "What is lost vs retained on generator failure?", "opts": ["28 VDC at 300 amps for servicing/charging. Auto cut off as engine RPM exceeds ~45% N2. Starting GTS / engine start on external power is not permitted.", "Takes the generator offline when voltage exceeds 30.2 V; GEN warning comes via undervoltage sensing. Reset with generator switch to RESET if condition clears.", "AC and DC non-essential loads on the generator bus are lost. Essential services bus loads (including essential 115/26/6 VAC via inverters) continue from batteries if battery switches are ON.", "Fleet aircraft often use AC generators with transformer-rectifiers (AC→DC). The T-45 uses inverters/static converters to transform DC power to AC."], "ans": 2, "expl": "AC and DC non-essential loads on the generator bus are lost. Essential services bus loads (including essential 115/26/6 VAC via inverters) continue from batteries if battery switches are ON."}, {"q": "Voltage regulator set range?", "opts": ["Maintains generator output between 38.2 and 29.2 VDC.", "Maintains generator output between 28.2 and 29.2 VDC.", "Maintains generator output between 14.1 and 29.2 VDC.", "Maintains generator output between 56.4 and 29.2 VDC."], "ans": 1, "expl": "Maintains generator output between 28.2 and 29.2 VDC."}, {"q": "Overvoltage unit trip point and action?", "opts": ["Fleet aircraft often use AC generators with transformer-rectifiers (AC→DC). The T-45 uses inverters/static converters to transform DC power to AC.", "Takes the generator offline when voltage exceeds 30.2 V; GEN warning comes via undervoltage sensing. Reset with generator switch to RESET if condition clears.", "Each supplies 115 V 400 Hz to the 115 VAC buses and 26 V 400 Hz to the 26 VAC buses (powered from the 28 VDC essential services bus).", "28 VDC at 300 amps for servicing/charging. Auto cut off as engine RPM exceeds ~45% N2. Starting GTS / engine start on external power is not permitted."], "ans": 1, "expl": "Takes the generator offline when voltage exceeds 30.2 V; GEN warning comes via undervoltage sensing. Reset with generator switch to RESET if condition clears."}, {"q": "Undervoltage sensing trip logic?", "opts": ["≤ 25 VDC on the 28 VDC generator bus; 1.5-second delay to ignore transients; illuminates generator warning.", "DU, both left MFDs, SADS, and VCR/camera electronic unit (CEU) for up to two minutes from batteries.", "Drop offline below 16 ± 1 V; automatically come online at 18 ± 1 V. Also drop offline if frequency is out of range.", "HUD and left MFD turn off prior to master alert light, warning tone, and generator warning light."], "ans": 0, "expl": "≤ 25 VDC on the 28 VDC generator bus; 1.5-second delay to ignore transients; illuminates generator warning."}, {"q": "What happens to displays just before GEN warning on undervoltage?", "opts": ["One fully charged battery ≈ 12 minutes; both ≈ 27 minutes of essential services bus loads.", "An engine-driven 9 kilowatt DC generator supplying 28 volts to the 28 VDC generator bus.", "DU, both left MFDs, SADS, and VCR/camera electronic unit (CEU) for up to two minutes from batteries.", "HUD and left MFD turn off prior to master alert light, warning tone, and generator warning light."], "ans": 3, "expl": "HUD and left MFD turn off prior to master alert light, warning tone, and generator warning light."}, {"q": "Inverter DC input drop-off / come-online voltages?", "opts": ["HUD and left MFD turn off prior to master alert light, warning tone, and generator warning light.", "Drop offline below 16 ± 1 V; automatically come online at 18 ± 1 V. Also drop offline if frequency is out of range.", "≤ 25 VDC on the 28 VDC generator bus; 1.5-second delay to ignore transients; illuminates generator warning.", "DU, both left MFDs, SADS, and VCR/camera electronic unit (CEU) for up to two minutes from batteries."], "ans": 1, "expl": "Drop offline below 16 ± 1 V; automatically come online at 18 ± 1 V. Also drop offline if frequency is out of range."}, {"q": "Two-minute timer after generator offline — what stays powered?", "opts": ["≤ 25 VDC on the 28 VDC generator bus; 1.5-second delay to ignore transients; illuminates generator warning.", "HUD and left MFD turn off prior to master alert light, warning tone, and generator warning light.", "One fully charged battery ≈ 12 minutes; both ≈ 27 minutes of essential services bus loads.", "DU, both left MFDs, SADS, and VCR/camera electronic unit (CEU) for up to two minutes from batteries."], "ans": 3, "expl": "DU, both left MFDs, SADS, and VCR/camera electronic unit (CEU) for up to two minutes from batteries."}, {"q": "External ground power requirements and limits?", "opts": ["28 VDC at 300 amps for servicing/charging. Auto cut off as engine RPM exceeds ~45% N2. Starting GTS / engine start on external power is not permitted.", "Fleet aircraft often use AC generators with transformer-rectifiers (AC→DC). The T-45 uses inverters/static converters to transform DC power to AC.", "Takes the generator offline when voltage exceeds 30.2 V; GEN warning comes via undervoltage sensing. Reset with generator switch to RESET if condition clears.", "Each supplies 115 V 400 Hz to the 115 VAC buses and 26 V 400 Hz to the 26 VAC buses (powered from the 28 VDC essential services bus)."], "ans": 0, "expl": "28 VDC at 300 amps for servicing/charging. Auto cut off as engine RPM exceeds ~45% N2. Starting GTS / engine start on external power is not permitted."}, {"q": "Other electrical protection mentioned?", "opts": ["310 amp fuse, power isolation diodes, and relays (see NATOPS foldouts).", "150 amp fuse, power isolation diodes, and relays (see NATOPS foldouts).", "300 amp fuse, power isolation diodes, and relays (see NATOPS foldouts).", "600 amp fuse, power isolation diodes, and relays (see NATOPS foldouts)."], "ans": 2, "expl": "300 amp fuse, power isolation diodes, and relays (see NATOPS foldouts)."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= QUESTIONS.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
