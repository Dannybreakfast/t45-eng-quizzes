const QUESTIONS = [{"q": "The two basic types of ground-controlled approaches are:", "opts": ["TACAN and ASR", "ILS and PAR", "PAR and VOR", "PAR and ASR"], "ans": 3, "expl": "Correct: PAR and ASR · Source: \"There are two basic types of ground-controlled approaches—the precision radar approach (PAR) and the surveillance radar approach (ASR).\""}, {"q": "A PAR provides:", "opts": ["Course and range only (non-precision)", "Course, range and recommended altitudes only", "Glidepath only", "Precise course, glidepath, and range information (precision approach)"], "ans": 3, "expl": "Correct: Precise course, glidepath, and range information (precision approach) · Source: \"A PAR provides you with precise course, glidepath, and range information and is classified as a precision approach.\""}, {"q": "An ASR provides:", "opts": ["Lower resolution course and range information only (no glideslope); non-precision", "Course, glidepath and range; precision", "Precise course and glidepath", "Glideslope only"], "ans": 0, "expl": "Correct: Lower resolution course and range information only (no glideslope); non-precision · Source: \"An ASR (commonly referred to as a surveillance approach) provides lower resolution course and range information only (no glideslope) and is classified as a non-precision approach.\""}, {"q": "Glideslope is defined as:", "opts": ["The VSI on final", "The descent angle assigned to an approach to a given runway for obstacle clearance and/or signal reception", "The portion of a precision approach that intercepts the azimuth of an ILS or the FAC of a PAR", "The 300 ft per mile recommended altitudes"], "ans": 1, "expl": "Correct: The descent angle assigned to an approach to a given runway for obstacle clearance and/or signal reception · Source: \"Glideslope is defined as the descent angle assigned to an approach to a given runway for obstacle clearance and/or signal reception.\""}, {"q": "Glidepath is defined as:", "opts": ["The portion of a precision approach that intercepts the azimuth of an ILS approach or the FAC of a PAR approach", "The descent angle assigned for obstacle clearance", "The ASR recommended altitudes", "The penetration descent"], "ans": 0, "expl": "Correct: The portion of a precision approach that intercepts the azimuth of an ILS approach or the FAC of a PAR approach · Source: \"Glidepath is defined as the portion of a precision approach that intercepts the azimuth of an ILS approach or the FAC of a PAR approach.\""}, {"q": "PAR and ASR approaches are divided into which two segments?", "opts": ["Arc and final", "Penetration and final", "Downwind and base", "Initial pattern and final approach"], "ans": 3, "expl": "Correct: Initial pattern and final approach · Source: \"Both the PAR and ASR approaches are divided into two segments, initial pattern and final approach.\""}, {"q": "During the initial pattern of an ASR or PAR you are guided by:", "opts": ["Precision radar", "ILS", "Surveillance radar", "TACAN"], "ans": 2, "expl": "Correct: Surveillance radar · Source: \"During the initial pattern of an ASR or PAR approach, you will be guided by surveillance radar.\""}, {"q": "The initial pattern segment ends when the aircraft is inbound on the FAC at approximately:", "opts": ["5 nm from touchdown", "10 nm from touchdown", "8 nm from touchdown", "3 nm from touchdown"], "ans": 2, "expl": "Correct: 8 nm from touchdown · Source: \"This segment includes all maneuvering up to the point at which your aircraft is inbound on the final approach course and at approximately 8 nm from touchdown.\""}, {"q": "During the transition to final, the GCA controller directs:", "opts": ["Your fuel flow", "Your headings and altitudes", "Only your altimeter setting", "Your airspeed and configuration"], "ans": 1, "expl": "Correct: Your headings and altitudes · Source: \"During the transition to final, the GCA controller will direct your headings and altitudes.\""}, {"q": "Controller instructions to initiate turns and descents should be complied with:", "opts": ["Only after landing checks", "Immediately", "Within 10 seconds", "After readback is acknowledged"], "ans": 1, "expl": "Correct: Immediately · Source: \"All controller instructions to initiate turns and descents should be complied with immediately.\""}, {"q": "In the GCA pattern, turns are:", "opts": ["Half standard rate, not to exceed 10 degrees", "20 degrees AOB maximum", "Standard rate, not to exceed 30 degrees AOB", "Not to exceed 45 degrees AOB"], "ans": 2, "expl": "Correct: Standard rate, not to exceed 30 degrees AOB · Source: \"In the pattern, maintain standard rate turns not to exceed 30 degrees AOB.\""}, {"q": "On final, AOB should approximate the degrees to be turned, not to exceed:", "opts": ["20 degrees AOB", "Standard rate (30 degrees AOB)", "Half standard rate (approximately 10 degrees AOB)", "5 degrees AOB"], "ans": 2, "expl": "Correct: Half standard rate (approximately 10 degrees AOB) · Source: \"On final, your AOB should approximate the number of degrees to be turned not to exceed half standard rate (approximately 10 degrees AOB).\""}, {"q": "Good technique for AOB turning base to final:", "opts": ["45 degrees", "20 degrees", "30 degrees", "10 degrees"], "ans": 1, "expl": "Correct: 20 degrees · Source: \"A good technique is 30 degrees AOB in pattern, 20 degrees AOB turning base to final.\""}, {"q": "Good technique for AOB in the GCA pattern:", "opts": ["45 degrees", "20 degrees", "10 degrees", "30 degrees"], "ans": 3, "expl": "Correct: 30 degrees · Source: \"A good technique is 30 degrees AOB in pattern, 20 degrees AOB turning base to final.\""}, {"q": "Once on final, max AOB for heading corrections to course:", "opts": ["10 degrees", "5 degrees", "20 degrees", "30 degrees"], "ans": 0, "expl": "Correct: 10 degrees · Source: \"Once on final, do not exceed 10 degrees AOB for heading corrections to course.\""}, {"q": "Radar approach minimums can be found:", "opts": ["Only on the ATIS", "Only in the NATOPS", "In FLIP instrument approach procedure publications — on the approach plates and in the radar approach minimums section", "Only from the controller"], "ans": 2, "expl": "Correct: In FLIP instrument approach procedure publications — on the approach plates and in the radar approach minimums section · Source: \"Radar approach minimums can be found in the FLIP instrument approach procedure publications, both on the approach plates and in the radar approach minimums section (Figure 6-29).\""}, {"q": "Absolute minimums when single-piloted:", "opts": ["200-1/2", "400-1", "300-1", "100-1/4"], "ans": 0, "expl": "Correct: 200-1/2 · Source: \"Although some published approach minimums are lower than 200-1/2, you are limited to absolute minimums of 200-1/2 when single-piloted.\""}, {"q": "During a GCA, the controller continuously feeds you:", "opts": ["Only altitude information", "Glidepath information on both PAR and ASR", "Only position reports", "Course and heading information, and on a PAR, glidepath information on final"], "ans": 3, "expl": "Correct: Course and heading information, and on a PAR, glidepath information on final · Source: \"During a GCA, your position in the pattern and on final will be directed by a controller who will continuously feed you course and heading information and, in the case of a PAR approach, glidepath information on final.\""}, {"q": "In the GCA pattern you must acknowledge all radio calls and read back:", "opts": ["All headings, altitudes, and altimeter settings", "Only headings", "Nothing — just acknowledge", "Only altimeter settings"], "ans": 0, "expl": "Correct: All headings, altitudes, and altimeter settings · Source: \"In the pattern, you are required to acknowledge all radio calls and read back all headings, altitudes, and altimeter settings.\""}, {"q": "Per FAR 7110.65 the controller is required to give:", "opts": ["Only the altimeter", "Weather always and fuel state", "Runway, wind and traffic only", "Missed approach instructions, weather (if less than VFR), altimeter, and lost comm instructions (if likely to encounter IMC)"], "ans": 3, "expl": "Correct: Missed approach instructions, weather (if less than VFR), altimeter, and lost comm instructions (if likely to encounter IMC) · Source: \"According to FAR 7110.65, the controller is required to give missed approach instructions, weather conditions (if less than VFR), altimeter, and lost comm instructions (if likely to encounter IMC).\""}, {"q": "Per FAR 7110.65, weather conditions are given when:", "opts": ["Less than VFR", "Only if IMC on final", "Only on request", "Always"], "ans": 0, "expl": "Correct: Less than VFR · Source: \"...weather conditions (if less than VFR)...\""}, {"q": "Per FAR 7110.65, lost comm instructions are given when:", "opts": ["Likely to encounter IMC", "Only on PAR", "Always", "Only if less than VFR at the field"], "ans": 0, "expl": "Correct: Likely to encounter IMC · Source: \"...lost comm instructions (if likely to encounter IMC).\""}, {"q": "In the pattern, the controller must communicate with you at least:", "opts": ["Every 30 seconds", "Every 15 seconds", "Every 5 seconds", "Once a minute"], "ans": 3, "expl": "Correct: Once a minute · Source: \"In the pattern, the controller must communicate with you at least once a minute and you are required to acknowledge the controller's calls.\""}, {"q": "In the pattern, if you hear no transmissions for more than ___ seconds, attempt to contact the controller.", "opts": ["15", "30", "60", "5"], "ans": 2, "expl": "Correct: 60 · Source: \"If you hear no transmissions for more than 60 seconds, attempt to contact the controller.\""}, {"q": "In the pattern, if unable to reestablish contact you:", "opts": ["Continue the last heading indefinitely", "Squawk and orbit", "Climb to 10,000 ft", "Comply with the lost communication instructions"], "ans": 3, "expl": "Correct: Comply with the lost communication instructions · Source: \"If you are unable to reestablish contact, then comply with the lost communication instructions.\""}, {"q": "Controller info furnished in the pattern — item 1:", "opts": ["Location of the missed approach point (MAP) (surveillance only)", "Missed approach and lost communication instructions", "Advisory to perform landing check (USN/USMC controllers only)", "Type of approach to expect (precision or surveillance)"], "ans": 3, "expl": "Correct: Type of approach to expect (precision or surveillance) · Source: \"1. Type of approach to expect (precision or surveillance)\""}, {"q": "Controller info furnished in the pattern — item 2:", "opts": ["Missed approach and lost communication instructions", "Advisory to perform landing check (USN/USMC controllers only)", "Location of the missed approach point (MAP) (surveillance only)", "Duty runway"], "ans": 3, "expl": "Correct: Duty runway · Source: \"2. Duty runway\""}, {"q": "Controller info furnished in the pattern — item 3:", "opts": ["Duty runway", "Advisory to perform landing check (USN/USMC controllers only)", "Location of the missed approach point (MAP) (surveillance only)", "Missed approach and lost communication instructions"], "ans": 2, "expl": "Correct: Location of the missed approach point (MAP) (surveillance only) · Source: \"3. Location of the missed approach point (MAP) (surveillance only)\""}, {"q": "Controller info furnished in the pattern — item 4:", "opts": ["Type of approach to expect (precision or surveillance)", "Location of the missed approach point (MAP) (surveillance only)", "Duty runway", "Advisory to perform landing check (USN/USMC controllers only)"], "ans": 3, "expl": "Correct: Advisory to perform landing check (USN/USMC controllers only) · Source: \"4. Advisory to perform landing check (USN/USMC controllers only)\""}, {"q": "Controller info furnished in the pattern — item 5:", "opts": ["Missed approach and lost communication instructions", "Location of the missed approach point (MAP) (surveillance only)", "Duty runway", "Type of approach to expect (precision or surveillance)"], "ans": 0, "expl": "Correct: Missed approach and lost communication instructions · Source: \"5. Missed approach and lost communication instructions\""}, {"q": "Which is NOT on the list of information the controller furnishes in the pattern?", "opts": ["Recommended altitudes each mile", "Duty runway", "Missed approach and lost communication instructions", "Type of approach to expect"], "ans": 0, "expl": "Correct: Recommended altitudes each mile · Source: \"1. Type of approach to expect (precision or surveillance) 2. Duty runway 3. Location of the missed approach point (MAP) (surveillance only) 4. Advisory to perform landing check (USN/USMC controllers only) 5. Missed approach and lost communication instructions\""}, {"q": "The location of the MAP is furnished in the pattern for:", "opts": ["Surveillance approaches only", "Both PAR and ASR", "Neither", "Precision approaches only"], "ans": 0, "expl": "Correct: Surveillance approaches only · Source: \"3. Location of the missed approach point (MAP) (surveillance only)\""}, {"q": "The advisory to perform landing check is given by:", "opts": ["Tower only", "All controllers", "FAA controllers only", "USN/USMC controllers only"], "ans": 3, "expl": "Correct: USN/USMC controllers only · Source: \"4. Advisory to perform landing check (USN/USMC controllers only)\""}, {"q": "Besides the listed items, the controller also gives:", "opts": ["Wind shear reports every minute", "Position information and heading changes as necessary to keep you on course", "Recommended power settings", "Fuel state checks"], "ans": 1, "expl": "Correct: Position information and heading changes as necessary to keep you on course · Source: \"Additionally, the controller will give you position information and heading changes as necessary to keep you on course.\""}, {"q": "Final controller radio check as you commence final:", "opts": ["\"THIS IS MCCAIN FINAL CONTROLLER. HOW DO YOU HEAR?\"", "\"PERFORM LANDING CHECKS\"", "\"MCCAIN APPROACH, RADAR CONTACT\"", "\"BEGIN DESCENT\""], "ans": 0, "expl": "Correct: \"THIS IS MCCAIN FINAL CONTROLLER. HOW DO YOU HEAR?\" · Source: \"As you commence your final approach, the final controller will perform a radio check; \"THIS IS MCCAIN FINAL CONTROLLER. HOW DO YOU HEAR?\"\""}, {"q": "Your response to the final controller's radio check:", "opts": ["\"LOUD AND CLEAR, LANDING CHECKLIST COMPLETE\"", "\"WILCO, GEAR DOWN\"", "\"LOUD AND CLEAR, THREE DOWN AND LOCKED\" (or position of gear)", "\"SPEED BRAKES FULL, LANDING CHECKLIST COMPLETE\""], "ans": 2, "expl": "Correct: \"LOUD AND CLEAR, THREE DOWN AND LOCKED\" (or position of gear) · Source: \"You should respond with \"LOUD AND CLEAR, THREE DOWN AND LOCKED\" (or position of gear).\""}, {"q": "After the radio check, the controller may also tell you:", "opts": ["To report every mile", "To read back every heading on final", "To slow to 150 KIAS", "That you need not acknowledge further transmissions"], "ans": 3, "expl": "Correct: That you need not acknowledge further transmissions · Source: \"The controller may also tell you that you need not acknowledge further transmissions.\""}, {"q": "On final, the controller must contact you at least every ___ on a PAR.", "opts": ["5 seconds", "10 seconds", "15 seconds", "60 seconds"], "ans": 0, "expl": "Correct: 5 seconds · Source: \"On final approach, the controller is required to make contact with you at least every 5 seconds on a PAR or 15 seconds on an ASR.\""}, {"q": "On final, the controller must contact you at least every ___ on an ASR.", "opts": ["60 seconds", "5 seconds", "15 seconds", "30 seconds"], "ans": 2, "expl": "Correct: 15 seconds · Source: \"On final approach, the controller is required to make contact with you at least every 5 seconds on a PAR or 15 seconds on an ASR.\""}, {"q": "Comm intervals — pattern / PAR final / ASR final:", "opts": ["30 seconds / 5 seconds / 15 seconds", "Once a minute / 15 seconds / 5 seconds", "Once a minute / 5 seconds / 15 seconds", "Once a minute / 10 seconds / 30 seconds"], "ans": 2, "expl": "Correct: Once a minute / 5 seconds / 15 seconds · Source: \"In the pattern, the controller must communicate with you at least once a minute … at least every 5 seconds on a PAR or 15 seconds on an ASR.\""}, {"q": "If you lose contact on final for the respective time for the approach being flown:", "opts": ["Attempt to recontact; if not successful, execute the lost communication instructions", "Execute the missed approach immediately without trying", "Continue to minimums", "Wait 60 seconds"], "ans": 0, "expl": "Correct: Attempt to recontact; if not successful, execute the lost communication instructions · Source: \"If you lose contact with the controller for the respective amount of time for the approach being flown, attempt to recontact and if not successful, execute the lost communication instructions.\""}, {"q": "GCA pattern entry configuration — Airspeed:", "opts": ["150 KIAS", "200 KIAS", "On-speed", "250 KIAS"], "ans": 1, "expl": "Correct: 200 KIAS · Source: \"Airspeed: 200 KIAS\""}, {"q": "GCA pattern entry configuration — Gear:", "opts": ["As required", "Down and locked", "Down", "Up"], "ans": 3, "expl": "Correct: Up · Source: \"Gear: Up\""}, {"q": "GCA pattern entry configuration — Speed brakes:", "opts": ["Full", "Out", "In", "As required"], "ans": 2, "expl": "Correct: In · Source: \"Speed brakes: In\""}, {"q": "GCA pattern entry configuration — Flaps/slats:", "opts": ["Down", "Half", "Up", "Full"], "ans": 2, "expl": "Correct: Up · Source: \"Flaps/slats: Up\""}, {"q": "GCA pattern entry configuration — Available NAVAIDS:", "opts": ["Off", "Tuned", "Standby", "Tuned after final"], "ans": 1, "expl": "Correct: Tuned · Source: \"Available NAVAIDS: Tuned\""}, {"q": "The downwind leg is normally flown:", "opts": ["At 250 KIAS", "Descending at 1,000 fpm", "Straight and level at 200 KIAS and pattern altitude", "At 150 KIAS dirty"], "ans": 2, "expl": "Correct: Straight and level at 200 KIAS and pattern altitude · Source: \"Normally, you fly the first leg of the pattern (the downwind leg) straight and level at 200 KIAS and pattern altitude.\""}, {"q": "At the end of the downwind leg, the controller directs a turn to:", "opts": ["Base leg", "Final", "Crosswind", "Dogleg"], "ans": 0, "expl": "Correct: Base leg · Source: \"At the end of the downwind leg, the controller will direct a turn to base leg.\""}, {"q": "At the end of the base leg, the controller directs a turn to:", "opts": ["Holding", "The missed approach", "Either a dogleg or the final approach course", "Downwind"], "ans": 2, "expl": "Correct: Either a dogleg or the final approach course · Source: \"At the end of the base leg, the controller will direct a turn to either a dogleg or the final approach course.\""}, {"q": "On base or a dogleg, unless directed by ATC, stay clean at 200 KIAS until within:", "opts": ["10 nm and 10 radials", "8 nm and 20 radials", "5 nm and 30 radials", "10 nm of the field and 30 radials of the FAC"], "ans": 3, "expl": "Correct: 10 nm of the field and 30 radials of the FAC · Source: \"Once established on base leg or on a dogleg to the FAC, unless directed by ATC, stay clean and at 200 KIAS until you are within 10 nm of the field and 30 radials of the final approach course.\""}, {"q": "When within those parameters, you transition to landing configuration and slow to:", "opts": ["130 KIAS", "200 KIAS", "150 KIAS (speed brakes retracted, complete landing checklist)", "On-speed immediately"], "ans": 2, "expl": "Correct: 150 KIAS (speed brakes retracted, complete landing checklist) · Source: \"When within those parameters, transition to landing configuration, speed brakes retracted, slow to 150 KIAS, and complete the landing checklist (speed brakes retracted).\""}, {"q": "After configuring in the GCA pattern you will have to:", "opts": ["Report gear down to ICS", "Add MRT", "Extend speed brakes", "Retrim the nose to maintain level flight"], "ans": 3, "expl": "Correct: Retrim the nose to maintain level flight · Source: \"You will have to retrim the nose to maintain level flight.\""}, {"q": "Slow to on-speed when:", "opts": ["Within 5 nm of touchdown", "On downwind", "Within 10 nm and on an intercept heading within 30 degrees of the FAC", "Passing the FAF"], "ans": 2, "expl": "Correct: Within 10 nm and on an intercept heading within 30 degrees of the FAC · Source: \"When within 10 nm and on an intercept heading that is within 30 degrees of the final approach course, slow to on-speed.\""}, {"q": "USN/USMC controllers' \"PERFORM LANDING CHECKS\" on the base leg is:", "opts": ["Only a reminder; it does not direct the pilot to dirty up", "A directive to slow to approach speed", "A directive to configure immediately", "A lost comm instruction"], "ans": 0, "expl": "Correct: Only a reminder; it does not direct the pilot to dirty up · Source: \"USN/USMC controllers will state \"PERFORM LANDING CHECKS\" on the base leg; this is only a reminder and does not direct the pilot to dirty up.\""}, {"q": "If the controller says \"SLOW TO APPROACH SPEED\":", "opts": ["Ignore until 10 nm", "It is only a reminder", "Extend speed brakes", "It is directed for sequencing; comply or state that you are unable"], "ans": 3, "expl": "Correct: It is directed for sequencing; comply or state that you are unable · Source: \"If the controller says, \"SLOW TO APPROACH SPEED,\" the controller is directing this for sequencing and the aircrew must comply or state that they are unable.\""}, {"q": "GCAs can be flown in which flap configurations?", "opts": ["Full only", "Full and one-half only", "No-flap only", "Full, one-half, and no-flap"], "ans": 3, "expl": "Correct: Full, one-half, and no-flap · Source: \"GCAs can be flown at full, one-half, and no-flap configurations.\""}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= queue.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
</html>
