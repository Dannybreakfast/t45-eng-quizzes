<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ENG0116 Egress System Malfunctions — T-45 Quiz</title>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">Home</a> · <a href="section-eng.html">ENG</a> · Egress</div>
    <h1>ENG0116 Egress System Malfunctions</h1>
    <div class="meta">22 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 22</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Egress</div>
    <h2 style="margin:0.2rem 0">ENG0116 Egress System Malfunctions</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-eng.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to ENG</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="section-eng.html">← ENG</a> · <a href="index.html">Home</a></div>
</div>
<script>
const QUESTIONS = [{"q": "Mode 1 is selected approximately when:", "opts": ["Above 18,000 ft", "Below 8,000 ft and below 300 KIAS", "Any speed above 400 KIAS", "Only on the ground"], "ans": 1, "expl": "\u003c8k and \u003c300 KIAS."}, {"q": "Mode 1 drogue bridle release delay after first motion?", "opts": ["0.10 s", "0.32 s", "0.40 s", "4.00 s"], "ans": 1, "expl": "0.32 seconds."}, {"q": "Mode 5 holds the crew on the seat/drogue until:", "opts": ["10,000 ft", "14,000 ft", "18,000 ft", "Touchdown"], "ans": 2, "expl": "Descend to 18,000 ft then separate."}, {"q": "Uncontrolled flight: eject by what AGL (lecture)?", "opts": ["2,000 ft", "5,000 ft", "10,000 ft", "18,000 ft"], "ans": 2, "expl": "10,000 ft AGL uncontrolled."}, {"q": "Controlled flight: do not delay eject decision below:", "opts": ["500 ft AGL", "2,000 ft AGL", "5,000 ft AGL", "10,000 ft AGL"], "ans": 1, "expl": "Don’t delay below 2,000 ft AGL."}, {"q": "Sequencer uses which air data?", "opts": ["Aircraft pitot-static", "GINA only", "Seat pitot heads", "Standby ASI only"], "ans": 2, "expl": "Seat pitot heads only."}, {"q": "EOS preflight pressure FULL band?", "opts": ["0–1,800 psi", "1,800–2,500 psi", "2,500–3,000 psi", "Any above 500 psi"], "ans": 1, "expl": "1,800–2,500 psi."}, {"q": "Thermal battery stripe color for good check?", "opts": ["Bright red", "Black", "White or light pink", "Blue"], "ans": 2, "expl": "White or light pink stripes."}, {"q": "In Modes 2–4, parachute rocket fires:", "opts": ["After drogue bridles release", "Before drogue bridles release", "Only on MOR", "Never — drogue is the chute"], "ans": 1, "expl": "Chute rocket before bridle release."}, {"q": "Raised MOR on preflight is unacceptable because:", "opts": ["It arms the seat", "Seat cannot be armed / ejection initiation by occupant impossible", "It starts the EOS", "It fires MDC"], "ans": 1, "expl": "MOR up safes seat and prevents occupant-initiated ejection."}, {"q": "What selects NACES ejection mode?", "opts": ["Spigot indicator flush with end of top latch plunger — if not, seat could rise up guide rail in maneuvering flight.", "Slow to a safer ejection speed and/or gain time and glide distance if immediate ejection is not necessary.", "Seat electronic sequencer using seat pitot-head data at ejection — not aircraft GINA/ADC/SADS/pitot-static.", "Below 18,000 ft. Drogue decelerates first; chute rocket fires **before** drogue bridles release (sequencer delay)."], "ans": 2, "expl": "Seat electronic sequencer using seat pitot-head data at ejection — not aircraft GINA/ADC/SADS/pitot-static."}, {"q": "Mode 1 entry conditions and key timing?", "opts": ["Above 18,000 ft: seat descends on drogue to 18,000 ft, then bridles release, chute deploys, harness releases — limits exposure to cold/thin air.", "SAFE/ARMED handle SAFE (up). Manual override fully down and locked (raised MOR prevents arming / makes ejection impossible).", "Below 8,000 ft and below 300 KIAS. Drogue bridles release 0.32 s after seat first motion; then chute rocket and seat/man sep via chute opening shock.", "Prefer ~250 KIAS or less; controlled flight no lower than 2,000 ft AGL; uncontrolled no lower than 10,000 ft AGL; don’t delay the eject decision below 2,000 ft AGL."], "ans": 2, "expl": "Below 8,000 ft and below 300 KIAS. Drogue bridles release 0.32 s after seat first motion; then chute rocket and seat/man sep via chute opening shock."}, {"q": "Modes 2–4 altitude band and sequence difference vs Mode 1?", "opts": ["Below 18,000 ft. Drogue decelerates first; chute rocket fires **before** drogue bridles release (sequencer delay).", "Slow to a safer ejection speed and/or gain time and glide distance if immediate ejection is not necessary.", "Seat electronic sequencer using seat pitot-head data at ejection — not aircraft GINA/ADC/SADS/pitot-static.", "Spigot indicator flush with end of top latch plunger — if not, seat could rise up guide rail in maneuvering flight."], "ans": 0, "expl": "Below 18,000 ft. Drogue decelerates first; chute rocket fires **before** drogue bridles release (sequencer delay)."}, {"q": "Mode 5 behavior?", "opts": ["Prefer ~250 KIAS or less; controlled flight no lower than 2,000 ft AGL; uncontrolled no lower than 10,000 ft AGL; don’t delay the eject decision below 2,000 ft AGL.", "SAFE/ARMED handle SAFE (up). Manual override fully down and locked (raised MOR prevents arming / makes ejection impossible).", "Above 18,000 ft: seat descends on drogue to 18,000 ft, then bridles release, chute deploys, harness releases — limits exposure to cold/thin air.", "Below 8,000 ft and below 300 KIAS. Drogue bridles release 0.32 s after seat first motion; then chute rocket and seat/man sep via chute opening shock."], "ans": 2, "expl": "Above 18,000 ft: seat descends on drogue to 18,000 ft, then bridles release, chute deploys, harness releases — limits exposure to cold/thin air."}, {"q": "Manual seat/man separation altitude guidance?", "opts": ["If high terrain is not a factor, do not use until below 28000 ft MSL.", "If high terrain is not a factor, do not use until below 7000 ft MSL.", "If high terrain is not a factor, do not use until below 14,000 ft MSL.", "If high terrain is not a factor, do not use until below 14010 ft MSL."], "ans": 2, "expl": "If high terrain is not a factor, do not use until below 14,000 ft MSL."}, {"q": "Lecture “optimal” / decision altitudes?", "opts": ["Below 8,000 ft and below 300 KIAS. Drogue bridles release 0.32 s after seat first motion; then chute rocket and seat/man sep via chute opening shock.", "Prefer ~250 KIAS or less; controlled flight no lower than 2,000 ft AGL; uncontrolled no lower than 10,000 ft AGL; don’t delay the eject decision below 2,000 ft AGL.", "Above 18,000 ft: seat descends on drogue to 18,000 ft, then bridles release, chute deploys, harness releases — limits exposure to cold/thin air.", "SAFE/ARMED handle SAFE (up). Manual override fully down and locked (raised MOR prevents arming / makes ejection impossible)."], "ans": 1, "expl": "Prefer ~250 KIAS or less; controlled flight no lower than 2,000 ft AGL; uncontrolled no lower than 10,000 ft AGL; don’t delay the eject decision below 2,000 ft AGL."}, {"q": "Why zoom climb before eject (when time allows)?", "opts": ["Spigot indicator flush with end of top latch plunger — if not, seat could rise up guide rail in maneuvering flight.", "Slow to a safer ejection speed and/or gain time and glide distance if immediate ejection is not necessary.", "Seat electronic sequencer using seat pitot-head data at ejection — not aircraft GINA/ADC/SADS/pitot-static.", "Below 18,000 ft. Drogue decelerates first; chute rocket fires **before** drogue bridles release (sequencer delay)."], "ans": 1, "expl": "Slow to a safer ejection speed and/or gain time and glide distance if immediate ejection is not necessary."}, {"q": "Do min-ejection-altitude charts include pilot reaction time?", "opts": ["Yes — after selecting GAIN ORIDE.", "Yes — available in the aft cockpit only.", "No — based on escape-system initiation and time to complete dual-sequence ejection; reaction time not included.", "Yes — fully available with no limitations."], "ans": 2, "expl": "No — based on escape-system initiation and time to complete dual-sequence ejection; reaction time not included."}, {"q": "Preflight: SAFE/ARMED and MOR?", "opts": ["SAFE/ARMED handle SAFE (up). Manual override fully down and locked (raised MOR prevents arming / makes ejection impossible).", "Below 8,000 ft and below 300 KIAS. Drogue bridles release 0.32 s after seat first motion; then chute rocket and seat/man sep via chute opening shock.", "Above 18,000 ft: seat descends on drogue to 18,000 ft, then bridles release, chute deploys, harness releases — limits exposure to cold/thin air.", "Command ejection selector SOLO with collar; SEAT LIGHT switch pinned; seat SAFE; seat and MDC handles pinned as required."], "ans": 0, "expl": "SAFE/ARMED handle SAFE (up). Manual override fully down and locked (raised MOR prevents arming / makes ejection impossible)."}, {"q": "Preflight EOS and thermal batteries?", "opts": ["Slow to a safer ejection speed and/or gain time and glide distance if immediate ejection is not necessary.", "Seat electronic sequencer using seat pitot-head data at ejection — not aircraft GINA/ADC/SADS/pitot-static.", "Seat cannot be armed / ejection initiation by occupant impossible", "Green ring OFF; gauge 1,800–2,500 psi. Thermal batteries: white or light pink stripes."], "ans": 3, "expl": "Green ring OFF; gauge 1,800–2,500 psi. Thermal batteries: white or light pink stripes."}, {"q": "Top latch mechanism preflight check?", "opts": ["Spigot indicator flush with end of top latch plunger — if not, seat could rise up guide rail in maneuvering flight.", "Seat electronic sequencer using seat pitot-head data at ejection — not aircraft GINA/ADC/SADS/pitot-static.", "Below 18,000 ft. Drogue decelerates first; chute rocket fires **before** drogue bridles release (sequencer delay).", "Slow to a safer ejection speed and/or gain time and glide distance if immediate ejection is not necessary."], "ans": 0, "expl": "Spigot indicator flush with end of top latch plunger — if not, seat could rise up guide rail in maneuvering flight."}, {"q": "Solo preflight egress-related items (PDF/lecture)?", "opts": ["Command ejection selector SOLO with collar; SEAT LIGHT switch pinned; seat SAFE; seat and MDC handles pinned as required.", "Below 8,000 ft and below 300 KIAS. Drogue bridles release 0.32 s after seat first motion; then chute rocket and seat/man sep via chute opening shock.", "Above 18,000 ft: seat descends on drogue to 18,000 ft, then bridles release, chute deploys, harness releases — limits exposure to cold/thin air.", "SAFE/ARMED handle SAFE (up). Manual override fully down and locked (raised MOR prevents arming / makes ejection impossible)."], "ans": 0, "expl": "Command ejection selector SOLO with collar; SEAT LIGHT switch pinned; seat SAFE; seat and MDC handles pinned as required."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= QUESTIONS.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
