<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>BI 1104 (3) Slow Flight Maneuver — T-45 Quiz</title>
<script src="auth.js"></script>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt span + span, #q-text { white-space: pre-line; }
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">Home</a> · <a href="section-bi.html">BI</a> · Basic Instruments</div>
    <h1>BI 1104 (3) Slow Flight Maneuver</h1>
    <div class="meta">37 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 37</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Basic Instruments</div>
    <h2 style="margin:0.2rem 0">BI 1104 (3) Slow Flight Maneuver</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-bi.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to BI</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="section-bi.html">← BI</a> · <a href="index.html">Home</a></div>
</div>
<script>
const QUESTIONS = [{"q": "Extending flaps tends to:", "opts": ["Pitch down", "Pitch up", "No pitch change", "Roll only"], "ans": 1, "expl": "Guard stick/trim."}, {"q": "On-speed target cited:", "opts": ["10 units", "17 units", "25 units", "0 units"], "ans": 1, "expl": "Slow flight / approach skill."}, {"q": "Pitch tendency when extending flaps/speed brakes?", "opts": ["Yes — fully available with no limitations.", "Yes — available in the aft cockpit only.", "Nose wants to **pitch up / climb** — guard stick, then trim.", "Yes — after selecting GAIN ORIDE."], "ans": 2, "expl": "Nose wants to **pitch up / climb** — guard stick, then trim."}, {"q": "Pitch tendency when retracting flaps/speed brakes?", "opts": ["Yes — after selecting GAIN ORIDE.", "Yes — available in the aft cockpit only.", "Nose wants to **pitch down / descend**.", "Yes — fully available with no limitations."], "ans": 2, "expl": "Nose wants to **pitch down / descend**."}, {"q": "Config call before gear/flaps?", "opts": ["Report **below 200** gear/full flaps and wait for IP **clear**.", "Report **below 400** gear/full flaps and wait for IP **clear**.", "Report **below 100** gear/full flaps and wait for IP **clear**.", "Report **below 210** gear/full flaps and wait for IP **clear**."], "ans": 0, "expl": "Report **below 200** gear/full flaps and wait for IP **clear**."}, {"q": "On-speed AOA referenced?", "opts": ["**17 units**.", "**8 units**.", "**34 units**.", "**27 units**."], "ans": 0, "expl": "**17 units**."}, {"q": "How many basic maneuvers make up the slow flight maneuver (lettered A–O)?", "opts": ["Fifteen", "Eighteen", "Twelve", "Ten"], "ans": 0, "expl": "Slow Flight slide: fifteen basic maneuvers A–O."}, {"q": "The slow flight maneuver develops the skills required to:", "opts": ["Fly formation", "Perform a wingover", "Recover from a spin", "Fly an approach"], "ans": 3, "expl": "Slide."}, {"q": "Slow flight item A and B are:", "opts": ["A: Level flight (250 KIAS); B: Level speed change (200 KIAS)", "A: Level speed change; B: Landing configuration", "A: 30° AOB turn; B: Level flight", "A: Level flight (200 KIAS); B: LSC (150 KIAS)"], "ans": 0, "expl": "Slide list."}, {"q": "Slow flight item C is:", "opts": ["45° AOB turn for 90°", "10° AOB turn for 30°", "20° AOB turn for 45°", "30° AOB turn for 90° of heading change"], "ans": 3, "expl": "Slide list."}, {"q": "Slow flight item D (with checklist) is:", "opts": ["Gear and half flaps, 175 KIAS", "Full flaps, gear up, 150 KIAS", "Gear only, 200 KIAS", "Landing configuration – gear, full flaps, 150 KIAS"], "ans": 3, "expl": "Slide list."}, {"q": "Slow flight items E and F are:", "opts": ["Two 20° AOB turns for 45° of heading change each", "Two 30° AOB turns for 90° each", "Two 10° AOB turns for 30° each", "Two 45° AOB turns for 45° each"], "ans": 0, "expl": "Slide list."}, {"q": "Slow flight item G (final approach speed) is:", "opts": ["700 pph until 17 units AOA", "Idle until 15 units", "700 pph until 22 units", "1100 pph until 17 units"], "ans": 0, "expl": "Slide list."}, {"q": "Slow flight items H and I are:", "opts": ["Two 20° AOB turns for 45°", "Two 30° AOB turns for 60°", "Two 15° AOB turns for 30°", "Two 10° AOB turns for 30° of heading change each"], "ans": 3, "expl": "Slide list."}, {"q": "Slow flight item J (on-speed descent) is:", "opts": ["Descend 2000 ft at 500 fpm, gear up", "Descend 1000 ft at 1000 fpm, 15 units", "Descend 1000 ft at 500 fpm with speed brakes extended full at 17 units AOA", "Descend 500 ft at 1000 fpm, speed brakes in"], "ans": 2, "expl": "Slide: power controls rate, pitch controls AOA."}, {"q": "In the on-speed descent (item J), what controls rate of descent and what controls AOA?", "opts": ["Power controls rate; pitch controls AOA", "Speed brakes control both", "Pitch controls rate; power controls AOA", "Trim controls rate"], "ans": 0, "expl": "Slide labels \"Power\" and \"Pitch\"."}, {"q": "Slow flight item L (missed approach) is:", "opts": ["+500 ft; 90% power, speed brakes out", "+1000 ft; MRT, retract speed brakes, gear/flaps up", "+1000 ft; idle, gear down", "+2000 ft; MRT, flaps full"], "ans": 1, "expl": "Slide list."}, {"q": "Slow flight items M, N and O are:", "opts": ["Missed approach, slow cruise, LSC", "Level flight, landing config, LSC", "Slow cruise (200 KIAS), level speed change (250 KIAS), level flight", "LSC (150), slow cruise (200), level"], "ans": 2, "expl": "Slide list."}, {"q": "Reference setting: on-speed, gear and ½ flaps:", "opts": ["5° nose up, 1100 pph", "4° nose up, 1500 pph", "8° nose up, 2100 pph", "8° nose up, 1800 pph"], "ans": 3, "expl": "Slow flight table."}, {"q": "Reference setting: on-speed, gear and full flaps:", "opts": ["10° nose up, MRT", "3° nose up, 1400 pph", "8° nose up, 2100 pph", "8° nose up, 1800 pph"], "ans": 2, "expl": "Slow flight table."}, {"q": "Reference: on-speed 500 fpm descent:", "opts": ["Idle with back stick", "Gear up and 700 pph", "Speed brakes in, reduce 300 pph", "Speed brakes out with forward stick pressure"], "ans": 3, "expl": "Slow flight table."}, {"q": "Reference: on-speed level-off at MDA:", "opts": ["Forward stick and −300 pph", "MRT", "Retract speed brakes", "Back stick pressure and +300 pph"], "ans": 3, "expl": "Slow flight table."}, {"q": "Reference: 200 KIAS clean:", "opts": ["5° up, 700 pph", "8° up, 1800 pph", "3° up, 1300–1400 pph", "5° nose up, 1050–1100 pph"], "ans": 3, "expl": "Slow flight table."}, {"q": "What does the T-45 do when speed brakes are extended or flaps lowered?", "opts": ["Pitches up and tries to climb", "No trim change", "Rolls left", "Pitches down and descends"], "ans": 0, "expl": "Lecture; guard the stick and maintain attitude, then trim."}, {"q": "What does the T-45 do when speed brakes are retracted or flaps raised?", "opts": ["Pitches down and tries to descend", "No change", "Yaws right", "Pitches up and climbs"], "ans": 0, "expl": "Lecture."}, {"q": "Slow flight demo start:", "opts": ["12,000 ft, 200 knots, heading 270", "10,000 ft, 200 knots, heading 360", "12,000 ft, 250 knots, heading 090", "15,000 ft, 250 knots, heading 180"], "ans": 2, "expl": "Demo."}, {"q": "In the demo, after the 90° turn the new heading is 360. What do you do next?", "opts": ["Extend speed brakes and descend", "Accelerate to 250 and raise flaps", "Lower flaps half only", "Reduce power below 200 knots and lower gear and full flaps (report \"below 200, gear, full flaps\" and wait for \"clear\")"], "ans": 3, "expl": "Demo."}, {"q": "Transitioning to full flaps, to maintain level flight the nose must be:", "opts": ["Lowered to slightly below the horizon, then reset to ~4° nose up as the jet slows to 150 knots", "Raised to 10° immediately", "Held at 8° throughout", "Lowered to −5°"], "ans": 0, "expl": "Demo."}, {"q": "In the demo, 5 knots prior to 150 knots, what fuel flow is set to hold 150 level?", "opts": ["~700 pph", "MRT", "~1100 pph", "~2400 pph"], "ans": 3, "expl": "Demo narration."}, {"q": "Common error noted on the 20° AOB turns in slow flight:", "opts": ["Forgetting gear", "Climbing 500 ft", "Using 30° AOB", "Reversing after only ~30° instead of the full 45° of heading change"], "ans": 3, "expl": "Demo."}, {"q": "On final approach speed (item G), as you decelerate to 17 units the nose goes from:", "opts": ["~0° to ~3°", "~3° to ~5°", "~4° nose up to ~8° nose up", "~8° to ~4°"], "ans": 2, "expl": "Demo."}, {"q": "On-speed AOA used in slow flight:", "opts": ["20 units", "15 units", "22 units", "17 units"], "ans": 3, "expl": "Lecture."}, {"q": "The on-speed 500 fpm descent is started by:", "opts": ["Retracting flaps", "Extending the speed brakes with forward stick pressure, then adjusting power for 500 fpm", "Reducing to idle and pushing over", "Raising the gear"], "ans": 1, "expl": "Demo."}, {"q": "Level-off lead for the 500 fpm on-speed descent:", "opts": ["400 ft prior", "50 ft prior", "5 ft prior", "100 ft prior"], "ans": 1, "expl": "10% rule: 500 fpm → 50 ft."}, {"q": "Missed approach execution in slow flight:", "opts": ["Idle and speed brakes out", "Raise gear first, then MRT", "MRT and leave speed brakes out", "Simultaneously MRT, rotate, retract speed brakes; gear up after two positive rates (when cleared)"], "ans": 3, "expl": "Demo."}, {"q": "After the missed approach, what must happen before accelerating through 200 knots?", "opts": ["Speed brakes out", "Nothing", "Report 10K checks", "Gear and flaps fully up and stowed, all lights out (\"clean below 200, gear handle checked\")"], "ans": 3, "expl": "Demo."}, {"q": "The final step of slow flight the student forgot in the demo was:", "opts": ["The 10° turns", "The missed approach", "The LSC from 200 back to 250 knots", "Lowering the gear"], "ans": 2, "expl": "Demo."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= queue.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
</html>
