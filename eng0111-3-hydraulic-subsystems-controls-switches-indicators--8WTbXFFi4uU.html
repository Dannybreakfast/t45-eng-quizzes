<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ENG0111 (3) Hydraulic Subsystems Controls, Switches, &amp; Indicators — T-45 Quiz</title>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">T-45 Local Quizzes</a> · Hydraulic</div>
    <h1>ENG0111 (3) Hydraulic Subsystems Controls, Switches, &amp; Indicators</h1>
    <div class="meta">17 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 17</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Hydraulic</div>
    <h2 style="margin:0.2rem 0">ENG0111 (3) Hydraulic Subsystems Controls, Switches, &amp; Indicators</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="index.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to Index</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="index.html">← All quizzes</a></div>
</div>
<script>
const QUESTIONS = [{"q": "WHEELS warning requires gear not down and throttle below 95% N2 plus:", "opts": ["RAT caution", "Low altitude/airspeed box OR flaps/slats not up", "HYD FAIL", "NWS high gain"], "ans": 1, "expl": "Altitude/airspeed criteria or flaps not up."}, {"q": "Minimum preflight brake accumulator indication in wheel well:", "opts": ["1100 psi", "1250 psi", "1500 psi", "3000 psi"], "ans": 1, "expl": "1250 psi minimum; service per chart if lower."}, {"q": "With SKID caution the correct action is:", "opts": ["Leave A/S on and continue", "Select anti-skid OFF", "Pull parking brake", "Reset HYD 2"], "ans": 1, "expl": "Restores normal brakes; leaving ON risks no brakes."}, {"q": "Where is the landing gear handle?", "opts": ["Select anti-skid OFF", "Rotate clockwise, then pull.", "Left vertical console.", "AOA approach lights flash if hook not down."], "ans": 2, "expl": "Left vertical console."}, {"q": "Emergency gear handle procedure?", "opts": ["Left vertical console.", "Rotate clockwise, then pull.", "Select anti-skid OFF", "AOA approach lights flash if hook not down."], "ans": 1, "expl": "Rotate clockwise, then pull."}, {"q": "When does the gear handle warning light illuminate?", "opts": ["When any gear disagrees with handle position / not downlocked with handle down / doors not uplocked with handle up.", "Advisory: A/S switches ON and gear down. Caution: A/S malfunction — select OFF.", "Gear handle not DOWN, throttle \u003c95% N2, and either low-alt/slow-speed criteria OR flaps/slats not UP.", "Momentary engages low gain; press-and-hold selects high gain until release."], "ans": 0, "expl": "When any gear disagrees with handle position / not downlocked with handle down / doors not uplocked with handle up."}, {"q": "WHEELS warning basic conditions?", "opts": ["Advisory: A/S switches ON and gear down. Caution: A/S malfunction — select OFF.", "When any gear disagrees with handle position / not downlocked with handle down / doors not uplocked with handle up.", "Gear handle not DOWN, throttle \u003c95% N2, and either low-alt/slow-speed criteria OR flaps/slats not UP.", "Momentary engages low gain; press-and-hold selects high gain until release."], "ans": 2, "expl": "Gear handle not DOWN, throttle \u003c95% N2, and either low-alt/slow-speed criteria OR flaps/slats not UP."}, {"q": "How cancel wheels warning tone?", "opts": ["Pull J-handle fully and rotate clockwise (right vertical console).", "May NOT illuminate; systems need hyd fluid — BITs are electrical only.", "Momentarily press tone button next to gear handle.", "Spring-loaded to RETRACT; magnetically held EXTEND with WOW."], "ans": 2, "expl": "Momentarily press tone button next to gear handle."}, {"q": "Anti-skid switch OFF does what?", "opts": ["Low altitude/airspeed box OR flaps/slats not up", "Rotate clockwise, then pull.", "AOA approach lights flash if hook not down.", "Reverts to normal braking without A/S modulation."], "ans": 3, "expl": "Reverts to normal braking without A/S modulation."}, {"q": "Parking brake set method?", "opts": ["May NOT illuminate; systems need hyd fluid — BITs are electrical only.", "Momentary engages low gain; press-and-hold selects high gain until release.", "Pull J-handle fully and rotate clockwise (right vertical console).", "Spring-loaded to RETRACT; magnetically held EXTEND with WOW."], "ans": 2, "expl": "Pull J-handle fully and rotate clockwise (right vertical console)."}, {"q": "Min brake accumulator on preflight (wheel well)?", "opts": ["625 psi minimum (else see servicing chart).", "1260 psi minimum (else see servicing chart).", "1250 psi minimum (else see servicing chart).", "2500 psi minimum (else see servicing chart)."], "ans": 2, "expl": "1250 psi minimum (else see servicing chart)."}, {"q": "SKID advisory vs caution?", "opts": ["Pull J-handle fully and rotate clockwise (right vertical console).", "May NOT illuminate; systems need hyd fluid — BITs are electrical only.", "Advisory: A/S switches ON and gear down. Caution: A/S malfunction — select OFF.", "Momentary engages low gain; press-and-hold selects high gain until release."], "ans": 2, "expl": "Advisory: A/S switches ON and gear down. Caution: A/S malfunction — select OFF."}, {"q": "NWS button: momentary vs hold?", "opts": ["Momentary engages low gain; press-and-hold selects high gain until release.", "Pull J-handle fully and rotate clockwise (right vertical console).", "Advisory: A/S switches ON and gear down. Caution: A/S malfunction — select OFF.", "May NOT illuminate; systems need hyd fluid — BITs are electrical only."], "ans": 0, "expl": "Momentary engages low gain; press-and-hold selects high gain until release."}, {"q": "Launch bar switch spring/magnetic behavior?", "opts": ["Spring-loaded to RETRACT; magnetically held EXTEND with WOW.", "May NOT illuminate; systems need hyd fluid — BITs are electrical only.", "Pull J-handle fully and rotate clockwise (right vertical console).", "Momentarily press tone button next to gear handle."], "ans": 0, "expl": "Spring-loaded to RETRACT; magnetically held EXTEND with WOW."}, {"q": "HOOK BYPASS CARRIER position effect?", "opts": ["AOA approach lights flash if hook not down.", "Low altitude/airspeed box OR flaps/slats not up", "Rotate clockwise, then pull.", "Reverts to normal braking without A/S modulation."], "ans": 0, "expl": "AOA approach lights flash if hook not down."}, {"q": "Total electrical failure — normal gear extend available?", "opts": ["Yes — after selecting GAIN ORIDE.", "No — must use emergency free-fall.", "Yes — available in the aft cockpit only.", "Yes — fully available with no limitations."], "ans": 1, "expl": "No — must use emergency free-fall."}, {"q": "HYD 1 failure — NWS/brakes/A-S lights?", "opts": ["May NOT illuminate; systems need hyd fluid — BITs are electrical only.", "Pull J-handle fully and rotate clockwise (right vertical console).", "Momentary engages low gain; press-and-hold selects high gain until release.", "Advisory: A/S switches ON and gear down. Caution: A/S malfunction — select OFF."], "ans": 0, "expl": "May NOT illuminate; systems need hyd fluid — BITs are electrical only."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= QUESTIONS.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
</html>
