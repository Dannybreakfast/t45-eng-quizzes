<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<script src="auth.js"></script>
<title>ENG0106 Engine Operating Limitations — T-45 Quiz</title>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">Home</a> · <a href="section-eng.html">ENG</a> · Engine</div>
    <h1>ENG0106 Engine Operating Limitations</h1>
    <div class="meta">13 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 13</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Engine</div>
    <h2 style="margin:0.2rem 0">ENG0106 Engine Operating Limitations</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-eng.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to ENG</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="section-eng.html">← ENG</a> · <a href="index.html">Home</a></div>
</div>
<script>
const QUESTIONS = [{"q": "General engine operating limits are in:", "opts": ["NATOPS Section 1 only", "NATOPS Section 4", "Only the pocket checklist", "Manufacturer brochure only"], "ans": 1, "expl": "NATOPS Section 4."}, {"q": "Ground-start maximum EGT (before overshoot note)?", "opts": ["300 °C", "450 °C", "550 °C", "650 °C"], "ans": 2, "expl": "550 °C during start."}, {"q": "Note 2 ground-start EGT overshoot allowance:", "opts": ["+10 °C for 5 s", "+20 °C for 10 s", "+50 °C for 30 s", "No overshoot allowed"], "ans": 1, "expl": "+20 °C for 10 seconds (up to 570 °C)."}, {"q": "With Note 2, max start EGT for 10 seconds can be:", "opts": ["550 °C", "570 °C", "650 °C", "700 °C"], "ans": 1, "expl": "550 + 20 = 570 °C for 10 seconds."}, {"q": "Limits categories listed for the F405-RR-401 include:", "opts": ["Only cruise fuel flow", "Handling, manual fuel, starting, GTS", "Only hydraulic limits", "Only electrical bus loads"], "ans": 1, "expl": "Engine handling, manual fuel control, starting, and GTS limitations."}, {"q": "ECA 2 with manual fuel is highlighted because:", "opts": ["Limits no longer apply", "Handling/operating limits are especially critical", "GTS is prohibited forever", "EPR becomes primary"], "ans": 1, "expl": "Lecture flags ECA 2 + manual fuel as a key handling-limits scenario."}, {"q": "Where are F405-RR-401 general operating limits found?", "opts": ["Max temperature during start 550 °C; Note 2 allows +20 °C overshoot for 10 seconds → up to 570 °C for 10 seconds.", "NATOPS Section 4 — engine handling, manual fuel control, starting, and GTS limitations.", "Maximum RPM, EGT, and time limits for military-rated thrust, transient accelerations, ground starts, and air starts.", "Time limitations during start and GTS limitations between starts (spacing / cooldown)."], "ans": 1, "expl": "NATOPS Section 4 — engine handling, manual fuel control, starting, and GTS limitations."}, {"q": "When do engine handling limitations especially apply?", "opts": ["Insight into why NATOPS procedures are written as they are — operate within F405-RR-401 design limits and preserve the jet.", "Max temperature during start 550 °C; Note 2 allows +20 °C overshoot for 10 seconds → up to 570 °C for 10 seconds.", "Maximum RPM, EGT, and time limits for military-rated thrust, transient accelerations, ground starts, and air starts.", "Examples: stall-series recovery, FAMs, ACM/BFM, high-altitude cross-country, and ECA 2 caution with manual fuel control."], "ans": 3, "expl": "Examples: stall-series recovery, FAMs, ACM/BFM, high-altitude cross-country, and ECA 2 caution with manual fuel control."}, {"q": "What limit categories must you know cold?", "opts": ["Maximum RPM, EGT, and time limits for military-rated thrust, transient accelerations, ground starts, and air starts.", "Time limitations during start and GTS limitations between starts (spacing / cooldown).", "Max temperature during start 550 °C; Note 2 allows +20 °C overshoot for 10 seconds → up to 570 °C for 10 seconds.", "NATOPS Section 4 — engine handling, manual fuel control, starting, and GTS limitations."], "ans": 0, "expl": "Maximum RPM, EGT, and time limits for military-rated thrust, transient accelerations, ground starts, and air starts."}, {"q": "Ground-start max EGT and Note 2 overshoot?", "opts": ["Maximum RPM, EGT, and time limits for military-rated thrust, transient accelerations, ground starts, and air starts.", "Time limitations during start and GTS limitations between starts (spacing / cooldown).", "Max temperature during start 550 °C; Note 2 allows +20 °C overshoot for 10 seconds → up to 570 °C for 10 seconds.", "NATOPS Section 4 — engine handling, manual fuel control, starting, and GTS limitations."], "ans": 2, "expl": "Max temperature during start 550 °C; Note 2 allows +20 °C overshoot for 10 seconds → up to 570 °C for 10 seconds."}, {"q": "Besides EGT, what else constrains starts?", "opts": ["Max temperature during start 550 °C; Note 2 allows +20 °C overshoot for 10 seconds → up to 570 °C for 10 seconds.", "NATOPS Section 4 — engine handling, manual fuel control, starting, and GTS limitations.", "Maximum RPM, EGT, and time limits for military-rated thrust, transient accelerations, ground starts, and air starts.", "Time limitations during start and GTS limitations between starts (spacing / cooldown)."], "ans": 3, "expl": "Time limitations during start and GTS limitations between starts (spacing / cooldown)."}, {"q": "Why understand systems beyond rote boldface?", "opts": ["Max temperature during start 550 °C; Note 2 allows +20 °C overshoot for 10 seconds → up to 570 °C for 10 seconds.", "Insight into why NATOPS procedures are written as they are — operate within F405-RR-401 design limits and preserve the jet.", "Maximum RPM, EGT, and time limits for military-rated thrust, transient accelerations, ground starts, and air starts.", "Examples: stall-series recovery, FAMs, ACM/BFM, high-altitude cross-country, and ECA 2 caution with manual fuel control."], "ans": 1, "expl": "Insight into why NATOPS procedures are written as they are — operate within F405-RR-401 design limits and preserve the jet."}, {"q": "When Example — ground start max temp 550 °C; Note 2 allows +20 °C overshoot for 10 s, what happens?", "opts": ["up to 1140 °C for 10 seconds.", "up to 285 °C for 10 seconds.", "up to 570 °C for 10 seconds.", "up to 580 °C for 10 seconds."], "ans": 2, "expl": "up to 570 °C for 10 seconds."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= QUESTIONS.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
</html>
