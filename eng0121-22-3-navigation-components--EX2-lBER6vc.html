<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ENG0121/22 (3) Navigation Components — T-45 Quiz</title>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">Home</a> · <a href="section-eng.html">ENG</a> · CNI</div>
    <h1>ENG0121/22 (3) Navigation Components</h1>
    <div class="meta">21 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 21</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">CNI</div>
    <h2 style="margin:0.2rem 0">ENG0121/22 (3) Navigation Components</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-eng.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to ENG</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="section-eng.html">← ENG</a> · <a href="index.html">Home</a></div>
</div>
<script>
const QUESTIONS = [{"q": "VOR on HSI requires:", "opts": ["PLAN view only", "CDI mode", "ILS boxed only", "Both inverters failed"], "ans": 1, "expl": "VOR will not appear in PLAN; use CDI."}, {"q": "After generator failure, which still works?", "opts": ["COMM2 and VOR/ILS", "COMM1, TACAN, GINA, IFF", "Marker Beacon only", "Nothing CNI-related"], "ans": 1, "expl": "ESS bus: COMM1, TACAN, GINA, IFF."}, {"q": "TACAN A-A channel separation:", "opts": ["10", "30", "63", "126"], "ans": 2, "expl": "63 channels (29–92 mnemonic); range only."}, {"q": "Good TACAN BIT bearing indication:", "opts": ["315±3°", "180±2.5°", "000±1°", "090±5°"], "ans": 1, "expl": "TACAN BIT uses CRS 180 → 180±2.5°, 0±1 NM, CDI centered. (VOR BIT uses 315±3°.)"}, {"q": "ILS odd-decimal example band (paired GS):", "opts": ["108.00–111.85 even only", "108.10–111.95 odd decimals", "112.00–117.95 only", "225–399.975"], "ans": 1, "expl": "ILS odd decimals 108.10–111.95 with auto-paired GS."}, {"q": "Both AC inverters failed — lose:", "opts": ["COMM1 only", "TACAN azimuth (and VOR freq control already lost)", "IFF only", "GINA only"], "ans": 1, "expl": "Dual inverter fail loses TACAN azimuth."}, {"q": "Does VOR appear on HSI in PLAN view?", "opts": ["Yes — available in the aft cockpit only.", "Yes — fully available with no limitations.", "No — CDI mode must be selected. With VOR station tuned and CDI boxed, green digital bearing + head/tail appear; box CRS for deviation steering.", "Yes — after selecting GAIN ORIDE."], "ans": 2, "expl": "No — CDI mode must be selected. With VOR station tuned and CDI boxed, green digital bearing + head/tail appear; box CRS for deviation steering."}, {"q": "If TCN is boxed and ILS is also boxed, what does CDI/PLAN steer to?", "opts": ["Bearing pointer 315±3°, course deviation left ≤2 dots, marker beacon lights illuminate. Hold Power/Freq in TEST with CDI+VOR/ILS and CRS 000.", "VOR: even decimal freqs 108.00–111.85 (+ all 112.00–117.95). ILS: odd decimals 108.10–111.95; tuning LOC auto-selects paired glideslope.", "Which cockpit owns nav systems: HSI PLAN/CDI mode, VOR/ILS & TACAN panels, command HDG/CRS, waypoint selection, steering reference/sequence, SCL. Defaults FWD after start or power interrupt.", "The boxed nav source (TCN/WYPT/offset) — not the ILS. ILS needles still available on ADI/HUD when ILS boxed and in range."], "ans": 3, "expl": "The boxed nav source (TCN/WYPT/offset) — not the ILS. ILS needles still available on ADI/HUD when ILS boxed and in range."}, {"q": "VOR vs ILS frequency rules (108–111.95 band)?", "opts": ["Which cockpit owns nav systems: HSI PLAN/CDI mode, VOR/ILS & TACAN panels, command HDG/CRS, waypoint selection, steering reference/sequence, SCL. Defaults FWD after start or power interrupt.", "Bearing pointer 315±3°, course deviation left ≤2 dots, marker beacon lights illuminate. Hold Power/Freq in TEST with CDI+VOR/ILS and CRS 000.", "The boxed nav source (TCN/WYPT/offset) — not the ILS. ILS needles still available on ADI/HUD when ILS boxed and in range.", "VOR: even decimal freqs 108.00–111.85 (+ all 112.00–117.95). ILS: odd decimals 108.10–111.95; tuning LOC auto-selects paired glideslope."], "ans": 3, "expl": "VOR: even decimal freqs 108.00–111.85 (+ all 112.00–117.95). ILS: odd decimals 108.10–111.95; tuning LOC auto-selects paired glideslope."}, {"q": "VOR/ILS BIT expected indications (valid VOR)?", "opts": ["Bearing pointer 315±3°, course deviation left ≤2 dots, marker beacon lights illuminate. Hold Power/Freq in TEST with CDI+VOR/ILS and CRS 000.", "The boxed nav source (TCN/WYPT/offset) — not the ILS. ILS needles still available on ADI/HUD when ILS boxed and in range.", "VOR: even decimal freqs 108.00–111.85 (+ all 112.00–117.95). ILS: odd decimals 108.10–111.95; tuning LOC auto-selects paired glideslope.", "Which cockpit owns nav systems: HSI PLAN/CDI mode, VOR/ILS & TACAN panels, command HDG/CRS, waypoint selection, steering reference/sequence, SCL. Defaults FWD after start or power interrupt."], "ans": 0, "expl": "Bearing pointer 315±3°, course deviation left ≤2 dots, marker beacon lights illuminate. Hold Power/Freq in TEST with CDI+VOR/ILS and CRS 000."}, {"q": "After generator failure, which CNI gear still works?", "opts": ["63 channels apart (remember 29–92). Provides **range only** to the other aircraft; no ground TACAN nav while in A-A.", "Lose TACAN azimuth (and VOR control box already disabled for freq changes with single or dual inverter failure).", "On 28 VDC Essential Services Bus: COMM1, TACAN, GINA, IFF. Lost (GEN bus): COMM2, VOR/ILS, Marker Beacon.", "CDI+TCN boxed, CRS 180, hold TEST ≥5 s → bearing 180±2.5°, range 0±1 NM, CDI bar centered."], "ans": 2, "expl": "On 28 VDC Essential Services Bus: COMM1, TACAN, GINA, IFF. Lost (GEN bus): COMM2, VOR/ILS, Marker Beacon."}, {"q": "Dual AC inverter failure effect on TACAN?", "opts": ["Lose TACAN azimuth (and VOR control box already disabled for freq changes with single or dual inverter failure).", "CDI+TCN boxed, CRS 180, hold TEST ≥5 s → bearing 180±2.5°, range 0±1 NM, CDI bar centered.", "On 28 VDC Essential Services Bus: COMM1, TACAN, GINA, IFF. Lost (GEN bus): COMM2, VOR/ILS, Marker Beacon.", "63 channels apart (remember 29–92). Provides **range only** to the other aircraft; no ground TACAN nav while in A-A."], "ans": 0, "expl": "Lose TACAN azimuth (and VOR control box already disabled for freq changes with single or dual inverter failure)."}, {"q": "TACAN air-to-air channel separation and mnemonic?", "opts": ["CDI+TCN boxed, CRS 180, hold TEST ≥5 s → bearing 180±2.5°, range 0±1 NM, CDI bar centered.", "On 28 VDC Essential Services Bus: COMM1, TACAN, GINA, IFF. Lost (GEN bus): COMM2, VOR/ILS, Marker Beacon.", "Lose TACAN azimuth (and VOR control box already disabled for freq changes with single or dual inverter failure).", "63 channels apart (remember 29–92). Provides **range only** to the other aircraft; no ground TACAN nav while in A-A."], "ans": 3, "expl": "63 channels apart (remember 29–92). Provides **range only** to the other aircraft; no ground TACAN nav while in A-A."}, {"q": "TACAN BIT pass criteria?", "opts": ["Y usually shipboard; X usually fixed land-based; XA/A selects air-to-air mode.", "CDI+TCN boxed, CRS 180, hold TEST ≥5 s → bearing 180±2.5°, range 0±1 NM, CDI bar centered.", "On 28 VDC Essential Services Bus: COMM1, TACAN, GINA, IFF. Lost (GEN bus): COMM2, VOR/ILS, Marker Beacon.", "Lose TACAN azimuth (and VOR control box already disabled for freq changes with single or dual inverter failure)."], "ans": 1, "expl": "CDI+TCN boxed, CRS 180, hold TEST ≥5 s → bearing 180±2.5°, range 0±1 NM, CDI bar centered."}, {"q": "X vs Y TACAN channels?", "opts": ["Lose TACAN azimuth (and VOR control box already disabled for freq changes with single or dual inverter failure).", "Y usually shipboard; X usually fixed land-based; XA/A selects air-to-air mode.", "On 28 VDC Essential Services Bus: COMM1, TACAN, GINA, IFF. Lost (GEN bus): COMM2, VOR/ILS, Marker Beacon.", "CDI+TCN boxed, CRS 180, hold TEST ≥5 s → bearing 180±2.5°, range 0±1 NM, CDI bar centered."], "ans": 1, "expl": "Y usually shipboard; X usually fixed land-based; XA/A selects air-to-air mode."}, {"q": "What does the HSI FWD/AFT pushbutton control?", "opts": ["Bearing pointer 315±3°, course deviation left ≤2 dots, marker beacon lights illuminate. Hold Power/Freq in TEST with CDI+VOR/ILS and CRS 000.", "VOR: even decimal freqs 108.00–111.85 (+ all 112.00–117.95). ILS: odd decimals 108.10–111.95; tuning LOC auto-selects paired glideslope.", "The boxed nav source (TCN/WYPT/offset) — not the ILS. ILS needles still available on ADI/HUD when ILS boxed and in range.", "Which cockpit owns nav systems: HSI PLAN/CDI mode, VOR/ILS & TACAN panels, command HDG/CRS, waypoint selection, steering reference/sequence, SCL. Defaults FWD after start or power interrupt."], "ans": 3, "expl": "Which cockpit owns nav systems: HSI PLAN/CDI mode, VOR/ILS & TACAN panels, command HDG/CRS, waypoint selection, steering reference/sequence, SCL. Defaults FWD after start or power interrupt."}, {"q": "When ILS boxing: LOC/GS needles on ADI/HUD when ILS freq tuned/in range and ILS boxed. ILS can be boxed in PLAN or CDI and does not block TCN/WYPT/offset steering; if those are boxed, CDI/PLAN shows that source, not ILS. If TCN/WYPT/offset all unboxed + ILS boxed, what happens?", "opts": ["also lose TACAN azimuth.", "CDI steers to localizer.", "TACAN azimuth (and VOR freq control already lost)", "CDI mode"], "ans": 1, "expl": "CDI steers to localizer."}, {"q": "When VOR BIT: CDI + VOR/ILS, CRS 000, hold TEST, what happens?", "opts": ["bearing 315±3°, CDI left ≤2 dots, MB lights on. No valid VOR → MB lights only.", "bearing 325±3°, CDI left ≤2 dots, MB lights on. No valid VOR → MB lights only.", "bearing 630±3°, CDI left ≤2 dots, MB lights on. No valid VOR → MB lights only.", "bearing 157±3°, CDI left ≤2 dots, MB lights on. No valid VOR → MB lights only."], "ans": 0, "expl": "bearing 315±3°, CDI left ≤2 dots, MB lights on. No valid VOR → MB lights only."}, {"q": "When GEN fail: ESS bus keeps COMM1, TACAN, GINA, IFF. GEN bus loss drops COMM2, VOR/ILS, MB. Single/dual AC inverter fail disables VOR freq change; both inverters, what happens?", "opts": ["also lose TACAN azimuth.", "CDI mode", "TACAN azimuth (and VOR freq control already lost)", "CDI steers to localizer."], "ans": 0, "expl": "also lose TACAN azimuth."}, {"q": "When TACAN: Bearing + slant range (or A-A range only if channels 63 apart). Y ≈ shipboard; X ≈ land; XA/A = air-to-air. BIT: CDI+TCN, CRS 180, hold TEST ≥5 s, what happens?", "opts": ["bearing 180±2.5°, range 0±1 NM, CDI centered.", "bearing 360±2.5°, range 0±1 NM, CDI centered.", "bearing 190±2.5°, range 0±1 NM, CDI centered.", "bearing 90±2.5°, range 0±1 NM, CDI centered."], "ans": 0, "expl": "bearing 180±2.5°, range 0±1 NM, CDI centered."}, {"q": "When B — TACAN BIT uses CRS 180, what happens?", "opts": ["360±2.5°, 0±1 NM, CDI centered. (VOR BIT uses 315±3°.)", "180±2.5°, 0±1 NM, CDI centered. (VOR BIT uses 315±3°.)", "190±2.5°, 0±1 NM, CDI centered. (VOR BIT uses 315±3°.)", "90±2.5°, 0±1 NM, CDI centered. (VOR BIT uses 315±3°.)"], "ans": 1, "expl": "180±2.5°, 0±1 NM, CDI centered. (VOR BIT uses 315±3°.)"}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= QUESTIONS.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
</html>
