<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ENG0110 (2) Hyd 2 System Malfunctions — T-45 Quiz</title>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">Home</a> · <a href="section-eng.html">ENG</a> · Hydraulic</div>
    <h1>ENG0110 (2) Hyd 2 System Malfunctions</h1>
    <div class="meta">16 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 16</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Hydraulic</div>
    <h2 style="margin:0.2rem 0">ENG0110 (2) Hyd 2 System Malfunctions</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-eng.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to ENG</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="section-eng.html">← ENG</a> · <a href="index.html">Home</a></div>
</div>
<script>
const QUESTIONS = [{"q": "HYD FAIL illuminates when:", "opts": ["Either HYD system \u003c1660", "RAT extended", "Both EDPs \u003c1660±110 and RAT \u003c600±50", "Brake accumulator \u003c1300"], "ans": 2, "expl": "Requires both EDPs low AND RAT emergency circuit below 600±50. Brake accum irrelevant."}, {"q": "On RAT power after HYD 2 EDP failure you should expect:", "opts": ["Steady 3000 and no cautions", "HYD+RAT cautions and ~2500–3000 fluctuating", "HYD FAIL immediately", "HYD 2 gauge at 0"], "ans": 1, "expl": "Designed RAT indications; do not reset."}, {"q": "RAT retracts from spring pressure near:", "opts": ["1500 psi", "1100 psi", "700 psi", "600 psi"], "ans": 2, "expl": "About 700 psi; 600±50 is HYD FAIL RAT threshold."}, {"q": "HYD 2 pressure that triggers HYD caution?", "opts": ["Below 830 ± 110 psi (clears above 2000 psi).", "Below 1670 ± 110 psi (clears above 2000 psi).", "Below 1660 ± 110 psi (clears above 2000 psi).", "Below 3320 ± 110 psi (clears above 2000 psi)."], "ans": 2, "expl": "Below 1660 ± 110 psi (clears above 2000 psi)."}, {"q": "HYD 2 pressure that deploys the RAT?", "opts": ["Below approximately 750 psi.", "Below approximately 1510 psi.", "Below approximately 3000 psi.", "Below approximately 1500 psi."], "ans": 3, "expl": "Below approximately 1500 psi."}, {"q": "Why does HYD 2 gauge fluctuate on RAT?", "opts": ["rudder (yaw/roll) + power (pitch); likely unrecoverable", "RAT pump is fixed-displacement with ~7300 RPM speed limiter (not pressure-regulated).", "Only rudder for yaw/roll and power for pitch; most likely not recoverable.", "HYD 1 EDP \u003c1660±110 AND HYD 2 EDP \u003c1660±110 AND RAT circuit \u003c600±50 psi."], "ans": 1, "expl": "RAT pump is fixed-displacement with ~7300 RPM speed limiter (not pressure-regulated)."}, {"q": "Does RAT need electrical power?", "opts": ["Yes — available in the aft cockpit only.", "No.", "Yes — after selecting GAIN ORIDE.", "Yes — fully available with no limitations."], "ans": 1, "expl": "No."}, {"q": "Approx pressure when RAT spring-retracts?", "opts": ["About 1400 psi remaining in HYD 2.", "About 350 psi remaining in HYD 2.", "About 710 psi remaining in HYD 2.", "About 700 psi remaining in HYD 2."], "ans": 3, "expl": "About 700 psi remaining in HYD 2."}, {"q": "HYD FAIL light logic?", "opts": ["HYD 11 EDP \u003c1660±110 AND HYD 2 EDP \u003c1660±110 AND RAT circuit \u003c600±50 psi.", "HYD 2 EDP \u003c1660±110 AND HYD 2 EDP \u003c1660±110 AND RAT circuit \u003c600±50 psi.", "HYD 1 EDP \u003c1660±110 AND HYD 2 EDP \u003c1660±110 AND RAT circuit \u003c600±50 psi.", "HYD 101 EDP \u003c1660±110 AND HYD 2 EDP \u003c1660±110 AND RAT circuit \u003c600±50 psi."], "ans": 2, "expl": "HYD 1 EDP \u003c1660±110 AND HYD 2 EDP \u003c1660±110 AND RAT circuit \u003c600±50 psi."}, {"q": "Does brake accumulator affect HYD FAIL?", "opts": ["Yes — fully available with no limitations.", "No.", "Yes — available in the aft cockpit only.", "Yes — after selecting GAIN ORIDE."], "ans": 1, "expl": "No."}, {"q": "Dual hydraulic failure airborne outlook?", "opts": ["HYD 1 EDP \u003c1660±110 AND HYD 2 EDP \u003c1660±110 AND RAT circuit \u003c600±50 psi.", "Only rudder for yaw/roll and power for pitch; most likely not recoverable.", "RAT pump is fixed-displacement with ~7300 RPM speed limiter (not pressure-regulated).", "rudder (yaw/roll) + power (pitch); likely unrecoverable"], "ans": 1, "expl": "Only rudder for yaw/roll and power for pitch; most likely not recoverable."}, {"q": "Reset HYD 2 with HYD caution + RAT caution and fluctuating pressure?", "opts": ["Yes — fully available with no limitations.", "Yes — after selecting GAIN ORIDE.", "Yes — available in the aft cockpit only.", "No — system functioning as designed."], "ans": 3, "expl": "No — system functioning as designed."}, {"q": "What is correct for: HYD caution (HYD 2)?", "opts": ["\u003c1670 ± 110; clear \u003e2000", "\u003c3320 ± 110; clear \u003e2000", "\u003c1660 ± 110; clear \u003e2000", "\u003c830 ± 110; clear \u003e2000"], "ans": 2, "expl": "\u003c1660 ± 110; clear \u003e2000"}, {"q": "What is correct for: RAT extend?", "opts": ["\u003c~1510 psi HYD 2 EDP; RAT caution; gauge 2500–3000 fluctuating", "\u003c~1500 psi HYD 2 EDP; RAT caution; gauge 2500–3000 fluctuating", "\u003c~3000 psi HYD 2 EDP; RAT caution; gauge 2500–3000 fluctuating", "\u003c~750 psi HYD 2 EDP; RAT caution; gauge 2500–3000 fluctuating"], "ans": 1, "expl": "\u003c~1500 psi HYD 2 EDP; RAT caution; gauge 2500–3000 fluctuating"}, {"q": "What is correct for: HYD FAIL?", "opts": ["HYD1 EDP \u003c1660±110 AND HYD2 EDP \u003c1660±110 AND RAT \u003c600±50", "HYD101 EDP \u003c1660±110 AND HYD2 EDP \u003c1660±110 AND RAT \u003c600±50", "HYD11 EDP \u003c1660±110 AND HYD2 EDP \u003c1660±110 AND RAT \u003c600±50", "HYD2 EDP \u003c1660±110 AND HYD2 EDP \u003c1660±110 AND RAT \u003c600±50"], "ans": 0, "expl": "HYD1 EDP \u003c1660±110 AND HYD2 EDP \u003c1660±110 AND RAT \u003c600±50"}, {"q": "What is correct for: Dual hyd loss?", "opts": ["rudder (yaw/roll) + power (pitch); likely unrecoverable", "RAT pump is fixed-displacement with ~7300 RPM speed limiter (not pressure-regulated).", "Only rudder for yaw/roll and power for pitch; most likely not recoverable.", "HYD1 EDP \u003c1660±110 AND HYD2 EDP \u003c1660±110 AND RAT \u003c600±50"], "ans": 0, "expl": "rudder (yaw/roll) + power (pitch); likely unrecoverable"}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= QUESTIONS.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
</html>
