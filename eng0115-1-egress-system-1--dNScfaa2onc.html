<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ENG0115 (1) Egress System 1 — T-45 Quiz</title>
<script src="auth.js"></script>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt span + span, #q-text { white-space: pre-line; }
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">Home</a> · <a href="section-eng.html">ENG</a> · Egress</div>
    <h1>ENG0115 (1) Egress System 1</h1>
    <div class="meta">22 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 22</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Egress</div>
    <h2 style="margin:0.2rem 0">ENG0115 (1) Egress System 1</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-eng.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to ENG</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="section-eng.html">← ENG</a> · <a href="index.html">Home</a></div>
</div>
<script>
const QUESTIONS = [{"q": "NACES provides ejection capability at:", "opts": ["120 KIAS / 500 ft minimum only", "Zero airspeed, zero altitude, and throughout the envelope", "Gear down / flaps down only", "Above 200 KIAS only"], "ans": 1, "expl": "Zero/zero throughout the envelope."}, {"q": "The canopy opens:", "opts": ["Aft on two hinges", "Forward clamshell", "Sideways about four right-side hinges", "Vertically via hydraulic actuators"], "ans": 2, "expl": "Sideways on four right-side hinges."}, {"q": "Canopy locked lever position?", "opts": ["Fully aft", "Mid detent", "Fully forward", "Outboard only"], "ans": 2, "expl": "Fully forward locks; spring-loaded forward."}, {"q": "UNLOCKED label rule?", "opts": ["Ignore if Master Alert off", "Any visible part of UNLOCKED means not locked", "Visible UNLOCKED means locked", "Only aft cockpit label matters"], "ans": 1, "expl": "Safety catch must totally obscure UNLOCKED."}, {"q": "CANOPY unlocked + throttle above ~95% N2 causes:", "opts": ["SEAT caution only", "Master Alert light and tone", "Automatic MDC fire", "RAT deploy"], "ans": 1, "expl": "Master Alert + tone above ~95% N2."}, {"q": "SEAT caution (NORM): illuminates when", "opts": ["Either seat SAFE and throttle \u003e~60% N2", "Both seats ARMED", "Canopy unlocked only", "MDC pin installed"], "ans": 0, "expl": "NORM: either seat SAFE + \u003e~60% N2."}, {"q": "Manual MDC handle in either cockpit:", "opts": ["Fires only that cockpit’s MDC", "Fires both front and aft MDC circuits", "Opens canopy locks only", "Arms the seats"], "ans": 1, "expl": "Either handle fires both circuits."}, {"q": "MDC handle: firing occurs during", "opts": ["First inch of travel", "Mid travel only", "Last ~1 inch of ~4 inch travel", "On release after full travel"], "ans": 2, "expl": "Lost motion; last inch fires."}, {"q": "Peripheral MDC protection for aircrew?", "opts": ["None", "Deflector plates partially covering peripheral MDC", "Armored glass only", "Seat headbox only"], "ans": 1, "expl": "Deflector plates on peripheral MDC."}, {"q": "Boarding ladders available at:", "opts": ["Any civilian field", "T-45 bases and Stennis airport only", "Carrier only", "Anywhere with GPU"], "ans": 1, "expl": "T-45 bases and Stennis."}, {"q": "What ejection capability does NACES provide?", "opts": ["Retractable footstep, toe-in step, two pull-out footsteps, nonskid step on intake; handholds between cockpits and on aft glareshield LH.", "~4 inches total travel through lost-motion unit; only the last ~1 inch initiates firing. Safety pin must be removed before flight.", "Zero airspeed, zero altitude, and throughout the flight envelope (cartridge-operated, rocket-assisted, automatic electronic sequencing).", "Overhead patterned MDC, peripheral MDC (with deflector plates), plus fuselage- and canopy-mounted SMDC to transfer the explosive signal."], "ans": 2, "expl": "Zero airspeed, zero altitude, and throughout the flight envelope (cartridge-operated, rocket-assisted, automatic electronic sequencing)."}, {"q": "How does the T-45 canopy open and what balances it?", "opts": ["Sideways about four hinges on the right side; manually operated; torsion bar counterbalance; can be secured in any position.", "Fully forward = locked (lock + safety catch). Fully aft = unlocked / allows manual positioning. Spring-loaded to forward.", "Zero airspeed, zero altitude, and throughout the flight envelope (cartridge-operated, rocket-assisted, automatic electronic sequencing).", "~4 inches total travel through lost-motion unit; only the last ~1 inch initiates firing. Safety pin must be removed before flight."], "ans": 0, "expl": "Sideways about four hinges on the right side; manually operated; torsion bar counterbalance; can be secured in any position."}, {"q": "Canopy control lever locked vs unlocked positions?", "opts": ["Sideways about four hinges on the right side; manually operated; torsion bar counterbalance; can be secured in any position.", "Fully forward = locked (lock + safety catch). Fully aft = unlocked / allows manual positioning. Spring-loaded to forward.", "Zero airspeed, zero altitude, and throughout the flight envelope (cartridge-operated, rocket-assisted, automatic electronic sequencing).", "~4 inches total travel through lost-motion unit; only the last ~1 inch initiates firing. Safety pin must be removed before flight."], "ans": 1, "expl": "Fully forward = locked (lock + safety catch). Fully aft = unlocked / allows manual positioning. Spring-loaded to forward."}, {"q": "How do you confirm the canopy is locked via the UNLOCKED label?", "opts": ["Zero airspeed, zero altitude, and throughout the envelope", "Deflector plates partially covering peripheral MDC", "CANOPY caution when unlocked. Master Alert light + tone if throttle advanced above ~95% N2 with canopy unlocked.", "Safety catch must totally obscure the word UNLOCKED. Any visible part of the word means not locked."], "ans": 3, "expl": "Safety catch must totally obscure the word UNLOCKED. Any visible part of the word means not locked."}, {"q": "When does the CANOPY caution / Master Alert occur?", "opts": ["Zero airspeed, zero altitude, and throughout the envelope", "CANOPY caution when unlocked. Master Alert light + tone if throttle advanced above ~95% N2 with canopy unlocked.", "Safety catch must totally obscure the word UNLOCKED. Any visible part of the word means not locked.", "Deflector plates partially covering peripheral MDC"], "ans": 1, "expl": "CANOPY caution when unlocked. Master Alert light + tone if throttle advanced above ~95% N2 with canopy unlocked."}, {"q": "When does the SEAT caution light illuminate (NORM vs SOLO)?", "opts": ["Yes — after selecting GAIN ORIDE.", "Yes — fully available with no limitations.", "Yes — available in the aft cockpit only.", "NORM: either seat SAFE and throttle \u003e~60% N2. SOLO: only front seat SAFE and throttle \u003e~60% N2."], "ans": 3, "expl": "NORM: either seat SAFE and throttle \u003e~60% N2. SOLO: only front seat SAFE and throttle \u003e~60% N2."}, {"q": "How is MDC activated and what does a manual handle pull do?", "opts": ["Overhead patterned MDC, peripheral MDC (with deflector plates), plus fuselage- and canopy-mounted SMDC to transfer the explosive signal.", "Zero airspeed, zero altitude, and throughout the flight envelope (cartridge-operated, rocket-assisted, automatic electronic sequencing).", "Don’t grasp canopy transparencies or use forward glareshield as handhold; don’t use bottom lip of left intake as a step. Canopy rail/windscreen frame OK.", "Auto by seat ejection (per-seat ballistic signal) or manual MDC handle. Either cockpit’s manual handle fires **both** front and aft MDC circuits."], "ans": 3, "expl": "Auto by seat ejection (per-seat ballistic signal) or manual MDC handle. Either cockpit’s manual handle fires **both** front and aft MDC circuits."}, {"q": "MDC handle travel / fire point?", "opts": ["Sideways about four hinges on the right side; manually operated; torsion bar counterbalance; can be secured in any position.", "~4 inches total travel through lost-motion unit; only the last ~1 inch initiates firing. Safety pin must be removed before flight.", "Overhead patterned MDC, peripheral MDC (with deflector plates), plus fuselage- and canopy-mounted SMDC to transfer the explosive signal.", "Zero airspeed, zero altitude, and throughout the flight envelope (cartridge-operated, rocket-assisted, automatic electronic sequencing)."], "ans": 1, "expl": "~4 inches total travel through lost-motion unit; only the last ~1 inch initiates firing. Safety pin must be removed before flight."}, {"q": "MDC types on the canopy?", "opts": ["Zero airspeed, zero altitude, and throughout the flight envelope (cartridge-operated, rocket-assisted, automatic electronic sequencing).", "Overhead patterned MDC, peripheral MDC (with deflector plates), plus fuselage- and canopy-mounted SMDC to transfer the explosive signal.", "Retractable footstep, toe-in step, two pull-out footsteps, nonskid step on intake; handholds between cockpits and on aft glareshield LH.", "~4 inches total travel through lost-motion unit; only the last ~1 inch initiates firing. Safety pin must be removed before flight."], "ans": 1, "expl": "Overhead patterned MDC, peripheral MDC (with deflector plates), plus fuselage- and canopy-mounted SMDC to transfer the explosive signal."}, {"q": "Boarding system components (left fuselage)?", "opts": ["Retractable footstep, toe-in step, two pull-out footsteps, nonskid step on intake; handholds between cockpits and on aft glareshield LH.", "Zero airspeed, zero altitude, and throughout the flight envelope (cartridge-operated, rocket-assisted, automatic electronic sequencing).", "Overhead patterned MDC, peripheral MDC (with deflector plates), plus fuselage- and canopy-mounted SMDC to transfer the explosive signal.", "~4 inches total travel through lost-motion unit; only the last ~1 inch initiates firing. Safety pin must be removed before flight."], "ans": 0, "expl": "Retractable footstep, toe-in step, two pull-out footsteps, nonskid step on intake; handholds between cockpits and on aft glareshield LH."}, {"q": "Boarding CAUTION highlights?", "opts": ["Overhead patterned MDC, peripheral MDC (with deflector plates), plus fuselage- and canopy-mounted SMDC to transfer the explosive signal.", "Zero airspeed, zero altitude, and throughout the flight envelope (cartridge-operated, rocket-assisted, automatic electronic sequencing).", "Don’t grasp canopy transparencies or use forward glareshield as handhold; don’t use bottom lip of left intake as a step. Canopy rail/windscreen frame OK.", "Auto by seat ejection (per-seat ballistic signal) or manual MDC handle. Either cockpit’s manual handle fires **both** front and aft MDC circuits."], "ans": 2, "expl": "Don’t grasp canopy transparencies or use forward glareshield as handhold; don’t use bottom lip of left intake as a step. Canopy rail/windscreen frame OK."}, {"q": "Which NACES seats are in fwd vs aft?", "opts": ["SJU-27A(V)5/A forward; SJU-17A(V)6/A aft.", "SJU-17A(V)5/A forward; SJU-17A(V)6/A aft.", "SJU-8A(V)5/A forward; SJU-17A(V)6/A aft.", "SJU-34A(V)5/A forward; SJU-17A(V)6/A aft."], "ans": 1, "expl": "SJU-17A(V)5/A forward; SJU-17A(V)6/A aft."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= queue.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
</html>
