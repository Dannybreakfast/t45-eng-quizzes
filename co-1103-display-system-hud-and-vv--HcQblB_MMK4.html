<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<script src="auth.js"></script>
<title>CO 1103 Display System (HUD and VV) — T-45 Quiz</title>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">Home</a> · <a href="section-co.html">CO</a> · Cockpit Orientation</div>
    <h1>CO 1103 Display System (HUD and VV)</h1>
    <div class="meta">14 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 14</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Cockpit Orientation</div>
    <h2 style="margin:0.2rem 0">CO 1103 Display System (HUD and VV)</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-co.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to CO</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="section-co.html">← CO</a> · <a href="index.html">Home</a></div>
</div>
<script>
const QUESTIONS = [{"q": "Velocity vector lateral limit from the waterline is about:", "opts": ["2°", "7°", "15°", "30°"], "ans": 1, "expl": "±7° lateral; +3/−11 vertical."}, {"q": "With landing gear down the HUD NAV mode becomes:", "opts": ["Air-to-air", "Approach (E-bracket)", "CCIP only", "Standby"], "ans": 1, "expl": "Approach submode auto with gear down."}, {"q": "On-speed AOA for the E-bracket centered on the VV is:", "opts": ["15 units", "17 units", "19.5 units", "8 degrees only"], "ans": 1, "expl": "16–17–18 ticks; 17 on-speed."}, {"q": "After a dynamic maneuver you should:", "opts": ["Trust VV alone for altitude trend", "Cross-check altitude; VV/GINA VSI may be wrong", "Cage and ignore altitude", "Switch to A/G mode"], "ans": 1, "expl": "Lecture warning."}, {"q": "What does the velocity vector represent?", "opts": ["The aircraft’s **actual flight path** / point it is flying toward (not just nose heading).", "VV and GINA-derived VSI may be **erroneous**—cross-check altitude.", "Caged stays near HUD center (ghost shows true VV outside 2°); uncaged = true vector.", "Automatically with **landing gear down** (E-bracket appears)."], "ans": 0, "expl": "The aircraft’s **actual flight path** / point it is flying toward (not just nose heading)."}, {"q": "VV lateral/vertical limits from waterline?", "opts": ["**3°** lateral; **+3° to −11°** vertical.", "**17°** lateral; **+3° to −11°** vertical.", "**14°** lateral; **+3° to −11°** vertical.", "**7°** lateral; **+3° to −11°** vertical."], "ans": 3, "expl": "**7°** lateral; **+3° to −11°** vertical."}, {"q": "Caged vs uncaged VV?", "opts": ["Caged stays near HUD center (ghost shows true VV outside 2°); uncaged = true vector.", "VV and GINA-derived VSI may be **erroneous**—cross-check altitude.", "Automatically with **landing gear down** (E-bracket appears).", "The aircraft’s **actual flight path** / point it is flying toward (not just nose heading)."], "ans": 0, "expl": "Caged stays near HUD center (ghost shows true VV outside 2°); uncaged = true vector."}, {"q": "When does NAV approach HUD submode select?", "opts": ["Automatically with **landing gear down** (E-bracket appears).", "VV and GINA-derived VSI may be **erroneous**—cross-check altitude.", "Change from LCOS to **RTGS** (real-time gunsight).", "Caged stays near HUD center (ghost shows true VV outside 2°); uncaged = true vector."], "ans": 0, "expl": "Automatically with **landing gear down** (E-bracket appears)."}, {"q": "E-bracket tick marks?", "opts": ["**16, 17, 18** units; centered VV = on-speed **17** units.", "**26 17, 18** units; centered VV = on-speed **17** units.", "**32 17, 18** units; centered VV = on-speed **17** units.", "**8 17, 18** units; centered VV = on-speed **17** units."], "ans": 0, "expl": "**16, 17, 18** units; centered VV = on-speed **17** units."}, {"q": "T-45C A/A gun reticle wing size / range?", "opts": ["**41 feet** wing filling reticle at **1000 ft** slant range.", "**15 feet** wing filling reticle at **1000 ft** slant range.", "**62 feet** wing filling reticle at **1000 ft** slant range.", "**31 feet** wing filling reticle at **1000 ft** slant range."], "ans": 3, "expl": "**31 feet** wing filling reticle at **1000 ft** slant range."}, {"q": "Preferred A/A gunsight mode vs default?", "opts": ["Automatically with **landing gear down** (E-bracket appears).", "Change from LCOS to **RTGS** (real-time gunsight).", "Caged stays near HUD center (ghost shows true VV outside 2°); uncaged = true vector.", "VV and GINA-derived VSI may be **erroneous**—cross-check altitude."], "ans": 1, "expl": "Change from LCOS to **RTGS** (real-time gunsight)."}, {"q": "Warning after dynamic maneuvering?", "opts": ["Change from LCOS to **RTGS** (real-time gunsight).", "VV and GINA-derived VSI may be **erroneous**—cross-check altitude.", "Caged stays near HUD center (ghost shows true VV outside 2°); uncaged = true vector.", "Automatically with **landing gear down** (E-bracket appears)."], "ans": 1, "expl": "VV and GINA-derived VSI may be **erroneous**—cross-check altitude."}, {"q": "Flashing VV at bottom of HUD suggests?", "opts": ["High AOA (~**9.8 units**); VV HUD-limited.", "High AOA (~**29.5 units**); VV HUD-limited.", "High AOA (~**39 units**); VV HUD-limited.", "High AOA (~**19.5 units**); VV HUD-limited."], "ans": 3, "expl": "High AOA (~**19.5 units**); VV HUD-limited."}, {"q": "What is correct for: YouTube title?", "opts": ["** CO1103 Display System (HUD and VV)", "** CO551 Display System (HUD and VV)", "** CO1113 Display System (HUD and VV)", "** CO2206 Display System (HUD and VV)"], "ans": 0, "expl": "** CO1103 Display System (HUD and VV)"}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= QUESTIONS.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
</html>
