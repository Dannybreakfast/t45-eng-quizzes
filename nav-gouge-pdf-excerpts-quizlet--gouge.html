<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>NAV Gouge (PDF excerpts + Quizlet) — T-45 Quiz</title>
<script src="auth.js"></script>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt span + span, #q-text { white-space: pre-line; }
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">Home</a> · <a href="section-nav.html">NAV</a> · Navigation</div>
    <h1>NAV Gouge (PDF excerpts + Quizlet)</h1>
    <div class="meta">24 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 24</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Navigation</div>
    <h2 style="margin:0.2rem 0">NAV Gouge (PDF excerpts + Quizlet)</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-nav.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to NAV</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="section-nav.html">← NAV</a> · <a href="index.html">Home</a></div>
</div>
<script>
const QUESTIONS = [{"q": "Cleared for a published DP; after takeoff ATC says \"climb and maintain FL350.\" You should:", "opts": ["Remain on SID routing and climb when convenient", "Climb immediately to FL350 and proceed direct to the DP transition point", "Level at 10,000 until further clearance", "Cancel IFR and climb VFR"], "ans": 1, "expl": "Climb immediately to FL350 and proceed direct to the DP transition point."}, {"q": "Jet fuel reserve required by 3710 (takeoff to landing plus reserve) is:", "opts": ["20% of planned fuel or 10 min at max endurance", "10% of planned fuel, but not less than 20 min max endurance at 10,000 MSL", "Fixed 45 minutes holding fuel only", "5% of planned fuel at cruise altitude"], "ans": 1, "expl": "10%, but not less than 20 min max endurance at 10,000 MSL."}, {"q": "With precision approach available for the duty runway, typical takeoff minimums for a standard instrument-rated pilot are:", "opts": ["0-0", "300-1", "200-1/2", "500-1"], "ans": 2, "expl": "200-1/2 when precision available."}, {"q": "To be cleared for a visual approach you must have the field (or preceding aircraft) in sight and weather at least:", "opts": ["500-1", "700-2", "1000-3", "3000-5"], "ans": 2, "expl": "Visual approach requires ≥1000-3."}, {"q": "An airport designated \"Official Business Only\":", "opts": ["May be used freely as destination or alternate", "May not be designated as an alternate on an IFR flight plan", "Is restricted to VFR only", "Requires special PAR clearance"], "ans": 1, "expl": "Official Business Only cannot be IFR alternate."}, {"q": "In the GCA box pattern within 25 NM of the field in IMC with lost communications, maintain:", "opts": ["2000 ft AGL until landing", "The highest of your last assigned altitude or published MSA until established on a published approach segment", "MEA for the filed route only", "Pattern altitude only"], "ans": 1, "expl": "Higher of last assigned or published MSA."}, {"q": "If you lose the runway in IMC while circling to land, you should:", "opts": ["Continue circling to the intended runway", "Climb straight ahead to pattern altitude", "Execute the missed approach for the original approach procedure", "Squawk 7700 and land any runway"], "ans": 2, "expl": "Missed approach for the original procedure."}, {"q": "Reading back an ATC clearance implies acceptance unless you:", "opts": ["File a NASA form later", "First state refusal and the reasons", "Ask for a phone number after landing", "Remain silent for 30 seconds"], "ans": 1, "expl": "Refuse and state reasons."}, {"q": "Normal anticipated interference-free reception range for a high-altitude NAVAID (jet route structure) is:", "opts": ["40 NM", "80 NM", "130 NM", "200 NM"], "ans": 2, "expl": "High NAVAID ≈ 130 NM."}, {"q": "For the HI ILS into Montgomery Regional, which TACAN should be tuned and identified?", "opts": ["NMM Ch 45", "MXF Ch 97", "CEW Ch 122", "MGM Ch 40"], "ans": 1, "expl": "MXF Channel 97."}, {"q": "A star (*) next to the ATIS frequency on an approach plate indicates:", "opts": ["ATIS is UHF only", "ATIS operates on a noncontinuous basis", "ATIS is inoperative", "ATIS requires a discrete squawk"], "ans": 1, "expl": "Noncontinuous ATIS."}, {"q": "DPs on the DD-175 are:", "opts": ["Mandatory for all IFR departures", "Encouraged but not mandatory", "Prohibited in the jet route structure", "Only used for lost-comm planning"], "ans": 1, "expl": "DPs encouraged, not mandatory on DD-175."}, {"q": "Cleared for published DP on IFR flight plan. After takeoff \"climb and maintain FL350...\"?", "opts": ["Climb immediately to FL350 and proceed via direct flight to the DP transition point", "Pass through highest initiated penetration altitude of the IAFs at the airport.", "10%, but not less than that required for 20 minutes flight at max endurance at 10,000 MSL", "Squawk 7600, maintain VMC, and something traffic pattern and land at a suitable airport"], "ans": 0, "expl": "Climb immediately to FL350 and proceed via direct flight to the DP transition point"}, {"q": "On a flight from NAS Meridian to Montgomery Regional, prior to commencing a HI ILS approach, tune and ID NAVAIDS. Which TACAN should be tuned and IDed?", "opts": ["Channel 107 (MXF)", "Channel 97 (MXF)", "Channel 194 (MXF)", "Channel 48 (MXF)"], "ans": 1, "expl": "Channel 97 (MXF)"}, {"q": "For all flights in a jet, 3710 requires fuel from takeoff to landing plus a reserve of:?", "opts": ["10%, but not less than that required for 20 minutes flight at max endurance at 10,000 MSL", "Indicate the portion of the DP routing that still applies and reinstated altitude restrictions", "Squawk 7600, maintain VMC, and something traffic pattern and land at a suitable airport", "Climb immediately to FL350 and proceed via direct flight to the DP transition point"], "ans": 0, "expl": "10%, but not less than that required for 20 minutes flight at max endurance at 10,000 MSL"}, {"q": "Which of the following are true concerning HI-TACAN RWY 19L approach chart to NAS Meridian?", "opts": ["You must maintain 1500 ft between the 328 and 358 radials", "You must maintain 3000 ft between the 328 and 358 radials", "You must maintain 6000 ft between the 328 and 358 radials", "You must maintain 3010 ft between the 328 and 358 radials"], "ans": 1, "expl": "You must maintain 3000 ft between the 328 and 358 radials"}, {"q": "With all NAVAIDs and facilities operating, takeoff mins for a standard instrument pilot departing runway 9 at NAS Jax would be?", "opts": ["400-1/2", "200-1/2", "100-1/2", "210-1/2"], "ans": 1, "expl": "200-1/2"}, {"q": "When on an IFR flight plan and cleared to an intermediate point not in a filed route, short of filed destination, should not accept the clearance without first obtaining?", "opts": ["Idk thats all that was written", "Expect further routing", "Encouraged but not mandatory", "All of the above"], "ans": 1, "expl": "Expect further routing"}, {"q": "On a missed approach at NAS Meridian you decide to go to your alternate, Maxwell AFB. Cat C mins for an ILS RWY 15 circle to land RWY 33 approach will be:?", "opts": ["250-1/2", "1000-1/2", "510-1/2", "500-1/2"], "ans": 3, "expl": "500-1/2"}, {"q": "You are in the GCA box pattern, within 25 nm of the field in IMC, when comms are lost. From here, intercept a published instrument approach maintaining ____ until established on a segment of the approach?", "opts": ["Execute missed approach for the original approach procedure", "The highest of your last assigned or published MSA", "May not be designated as an alternate on an IFR flight plan", "Be designated as an alternate on an IFR flight plan"], "ans": 1, "expl": "The highest of your last assigned or published MSA"}, {"q": "Your destination is forecasting 800-1/2 . Published approach procedures (NW winds) at alternate, Columbus AFB, lowest weather conditions for filing would be ____. ILS and ALS inop?", "opts": ["350-2", "1400-2", "700-2", "710-2"], "ans": 2, "expl": "700-2"}, {"q": "To be cleared for a visual approach, must report to approach control that you have field or interval in sight and weather must be reported as?", "opts": ["500-3 or greater", "1010-3 or greater", "2000-3 or greater", "1000-3 or greater"], "ans": 3, "expl": "1000-3 or greater"}, {"q": "Inadvertent IMC and lose sight of the runway while circle to land?", "opts": ["Be designated as an alternate on an IFR flight plan", "Execute missed approach for the original approach procedure", "Execute the missed approach for the original approach procedure", "May not be designated as an alternate on an IFR flight plan"], "ans": 1, "expl": "Execute missed approach for the original approach procedure"}, {"q": "Minimum forecast weather needed to plan for NAS Meridian (RWY 01L) as your destination? Maxwell AFB is alternate and forecasting 900-3. NAS Meridian NOTAMS: GCA O/S ALL, ALS O/S 01L?", "opts": ["500-1-½", "250-1-½", "1000-1-½", "510-1-½"], "ans": 0, "expl": "500-1-½"}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= queue.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
</html>
