<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>BI 1108 Malfunctions and Conclusion — T-45 Quiz</title>
<script src="auth.js"></script>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt span + span, #q-text { white-space: pre-line; }
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">Home</a> · <a href="section-bi.html">BI</a> · Basic Instruments</div>
    <h1>BI 1108 Malfunctions and Conclusion</h1>
    <div class="meta">26 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 26</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Basic Instruments</div>
    <h2 style="margin:0.2rem 0">BI 1108 Malfunctions and Conclusion</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-bi.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to BI</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="section-bi.html">← BI</a> · <a href="index.html">Home</a></div>
</div>
<script>
const QUESTIONS = [{"q": "With a failed attitude reference you should:", "opts": ["Trust it anyway", "Cross-check and fly remaining reliable instruments", "Ignore airspeed", "Shut engines down"], "ans": 1, "expl": "Partial-panel mindset."}, {"q": "First step with suspected instrument failure?", "opts": ["**Cross-check** — identify failed instrument; fly good ones.", "Fall back to **TACAN/VOR** / ATC and raw-data procedures.", "Cross-check and fly remaining reliable instruments", "Reliable **scan** + **Power–Attitude–Trim** + published procedures under stress/malfunctions."], "ans": 0, "expl": "**Cross-check** — identify failed instrument; fly good ones."}, {"q": "BI takeaway end-state?", "opts": ["Cross-check and fly remaining reliable instruments", "Fall back to **TACAN/VOR** / ATC and raw-data procedures.", "Reliable **scan** + **Power–Attitude–Trim** + published procedures under stress/malfunctions.", "**Cross-check** — identify failed instrument; fly good ones."], "ans": 2, "expl": "Reliable **scan** + **Power–Attitude–Trim** + published procedures under stress/malfunctions."}, {"q": "Training mode failure \"VOR\" removes:", "opts": ["All VOR data from the HSI and HUD", "VOR and TACAN data", "All VOR data from the ADI only", "All attitude data"], "ans": 0, "expl": "Training Mode – Failure Implications table."}, {"q": "Training mode failure \"ILS\" removes:", "opts": ["All ILS data from the HSI, ADI and HUD", "Marker beacon audio only", "ILS and VOR data from the HSI", "ILS data from the HUD only"], "ans": 0, "expl": "Table."}, {"q": "Training mode failure \"TCN\" removes:", "opts": ["TACAN audio only", "All TACAN data from the HSI and HUD", "TACAN data from the ADI", "All navigation and attitude data"], "ans": 1, "expl": "Table."}, {"q": "Training mode failure \"GINA\" removes:", "opts": ["All attitude and navigation information from the HSI, ADI and HUD", "Only TACAN data", "True airspeed and baro altitude", "Left MFD only"], "ans": 0, "expl": "Table."}, {"q": "Training mode failure \"SADS\" removes:", "opts": ["HUD display", "ILS needles", "All attitude information", "True airspeed, barometric altitude, Mach, and wind direction/speed from displays"], "ans": 3, "expl": "Table."}, {"q": "Training mode failure \"LMFD\" results in:", "opts": ["Opposite cockpit left MFD blank", "Both MFDs blank", "HUD blank", "Same cockpit left MFD blank"], "ans": 0, "expl": "Table."}, {"q": "Training mode failure \"ADI FRZ\" results in:", "opts": ["ADI attitude frozen", "ADI and HSI heading frozen", "ADI blank", "HUD frozen"], "ans": 0, "expl": "Table."}, {"q": "Training mode failure \"HSI FRZ\" results in:", "opts": ["HSI blank", "ADI and HSI heading frozen", "ADI attitude frozen", "TACAN frozen"], "ans": 1, "expl": "Table."}, {"q": "If the instructor fails your TACAN on the HI TACAN/VOR-B at Key Field:", "opts": ["Climb and hold", "Use the AOA gouge", "Transition to the VOR", "Ask for a no-gyro approach"], "ans": 2, "expl": "Lecture."}, {"q": "If the instructor fails one of your displays:", "opts": ["Ask for a no-gyro", "Abort the event", "Use the AOA gouge", "Transition to another display or the standby instruments"], "ans": 3, "expl": "Lecture."}, {"q": "If your headings are failed:", "opts": ["Use the HUD", "Transition to the VOR", "Use the AOA gouge", "Ask for a no-gyro approach"], "ans": 3, "expl": "Lecture."}, {"q": "If you lose airspeed indications:", "opts": ["Use fuel flow only", "Use AOA gouge settings found in the Electronic In-flight Guide", "Ask for a no-gyro", "Use GPS ground speed"], "ans": 1, "expl": "Lecture."}, {"q": "Show up to the sim building ready for your event how long prior to brief time?", "opts": ["15 minutes", "1 hour", "30 minutes", "2 hours"], "ans": 2, "expl": "Conclusion."}, {"q": "Fuel flow indicator in the conclusion slide is reading:", "opts": ["1,400 lb/hr", "1,700 lb/hr", "2,100 lb/hr", "700 lb/hr"], "ans": 1, "expl": "Conclusion slide."}, {"q": "The fuel flow indicator is calibrated in ___ and numbered at ___ intervals.", "opts": ["Hundreds of pph; 1,000 lb/hr", "Hundreds; 2,000 lb/hr", "Thousands; 500 lb/hr", "Tens; 100 lb/hr"], "ans": 0, "expl": "Conclusion slide (PPH × 1000)."}, {"q": "Why does fuel flow decrease with altitude?", "opts": ["It doesn't", "Because the gauge is barometric", "Because it is a measurement of thrust", "Because of fuel temperature"], "ans": 2, "expl": "Conclusion slide."}, {"q": "Fuel flow is used with what other indication to achieve proper airspeed?", "opts": ["AOA indexer", "Turn needle", "VSI", "ADI attitude waterline symbol"], "ans": 3, "expl": "Conclusion slide."}, {"q": "Gouge table: 250 KIAS clean", "opts": ["15–18° up, MRT", "5° up, 1050–1100", "8° up, 1800", "3° up, 1300–1400 pph"], "ans": 3, "expl": "Gouge table."}, {"q": "Gouge table: 200 KIAS clean", "opts": ["5° up, 1050–1100 pph", "3° up, 1300–1400", "8° up, 2100", "5° up, 700"], "ans": 0, "expl": "Gouge table."}, {"q": "Gouge table: on-speed, gear and full flaps", "opts": ["10° up, 2500", "8° up, 1800", "5° up, 2100", "8° up, 2100 pph"], "ans": 3, "expl": "Gouge table."}, {"q": "Gouge table: on-speed gear and ½ flaps", "opts": ["8° up, 1800 pph", "3° up, 1400", "5° up, 1100", "8° up, 2100"], "ans": 0, "expl": "Gouge table."}, {"q": "The conclusion says you're well on your way to mastering T-45 control if you can fly which on standby instruments?", "opts": ["A ½ SRT and an S-3 pattern", "A barrel roll and wingover", "The turn pattern", "Clean and dirty stalls"], "ans": 0, "expl": "Conclusion."}, {"q": "Typical BI recovery from the working area:", "opts": ["Single PAR to full stop", "High penetrating approach followed by multiple low approaches, fuel permitting", "Visual straight-in", "Overhead break only"], "ans": 1, "expl": "Conclusion."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= queue.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
</html>
