<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ENG0126 Engine Start Procedures — T-45 Quiz</title>
<script src="auth.js"></script>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt span + span, #q-text { white-space: pre-line; }
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">Home</a> · <a href="section-eng.html">ENG</a> · Engine Start</div>
    <h1>ENG0126 Engine Start Procedures</h1>
    <div class="meta">24 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 24</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Engine Start</div>
    <h2 style="margin:0.2rem 0">ENG0126 Engine Start Procedures</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-eng.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to ENG</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="section-eng.html">← ENG</a> · <a href="index.html">Home</a></div>
</div>
<script>
const QUESTIONS = [{"q": "Pre-start alternate battery individual voltage should be between:", "opts": ["12 and 14 volts", "18 and 22 volts", "24 and 29 volts", "27 and 35 volts"], "ans": 2, "expl": "24–29 V each alt bat."}, {"q": "Pre-start HYD 1 / HYD 2 / brake pressure indications taught in the lecture:", "opts": ["3000 / 3000 / 3000", "0 / 0 / 1250", "1250 / 1250 / 0", "0 / 3000 / 2700"], "ans": 1, "expl": "0 / 0 / 1250."}, {"q": "After pressing the GTS button, the GTS light should illuminate within:", "opts": ["5 seconds", "15 seconds", "20 seconds", "30 seconds"], "ans": 2, "expl": "GTS light within 20 seconds."}, {"q": "READY light after ENGINE switch to START should illuminate within:", "opts": ["5 seconds", "15 seconds", "20 seconds", "45 seconds"], "ans": 1, "expl": "READY within 15 seconds."}, {"q": "Throttle is advanced to IDLE when N2 is about:", "opts": ["5–8%", "10–12%", "17–20%", "40–45%"], "ans": 2, "expl": "17–20% N2 (+ PC run-up signal)."}, {"q": "On the 70% post-start run-up, EGT should:", "opts": ["Stay flat", "Initially climb then drop about 50 °C", "Climb continuously through 550 °C", "Drop first then spike 100 °C"], "ans": 1, "expl": "Climb then ~50 °C drop."}, {"q": "Fuel control / INFUEL test — maximum RPM drop allowed:", "opts": ["2%", "6%", "10%", "15%"], "ans": 1, "expl": "Maximum 6% RPM drop."}, {"q": "HYD 2 reset should show high pressure about:", "opts": ["1250 psi", "2000 psi", "2700 psi", "3000 psi"], "ans": 3, "expl": "3000 psi, light out."}, {"q": "Takeoff-check flap/slat setting taught:", "opts": ["FULL", "HALF (indicate half; visual slats down)", "UP", "AUTO only"], "ans": 1, "expl": "HALF flaps/slats."}, {"q": "About 50 seconds after throttle OFF on shutdown, cycle the stick until:", "opts": ["EGT is below 200 °C", "HYD 1 pressure reaches 0 psi", "Both MFDs blank", "Brake accumulator reads 1250 psi"], "ans": 1, "expl": "½ lateral every 2 s until HYD 1 = 0."}, {"q": "Pre-start alternate battery voltage check?", "opts": ["While taxiing: press **ADR evade/record**; **mask on / flow on** in front and back (OBOGS integrity check).", "After PC GTS-clear signal, press **GTS momentarily**. **GTS light should illuminate within 20 seconds**.", "Press and release paddle → **nosewheel steering caution light ON**; verify throttle OFF, lights and tones.", "Alt bat 1 and 2 ON; check each between **24 and 29 volts**, then master alert light out and both BAT switches ON."], "ans": 3, "expl": "Alt bat 1 and 2 ON; check each between **24 and 29 volts**, then master alert light out and both BAT switches ON."}, {"q": "Pre-start paddle switch check?", "opts": ["On PC run-up signal, slowly advance to **70%**. EGT should initially climb then drop about **50 °C**.", "While taxiing: press **ADR evade/record**; **mask on / flow on** in front and back (OBOGS integrity check).", "After PC GTS-clear signal, press **GTS momentarily**. **GTS light should illuminate within 20 seconds**.", "Press and release paddle → **nosewheel steering caution light ON**; verify throttle OFF, lights and tones."], "ans": 3, "expl": "Press and release paddle → **nosewheel steering caution light ON**; verify throttle OFF, lights and tones."}, {"q": "Engine start — GTS button action and GTS light timing?", "opts": ["Press and release paddle → **nosewheel steering caution light ON**; verify throttle OFF, lights and tones.", "On PC run-up signal, slowly advance to **70%**. EGT should initially climb then drop about **50 °C**.", "After PC GTS-clear signal, press **GTS momentarily**. **GTS light should illuminate within 20 seconds**.", "While taxiing: press **ADR evade/record**; **mask on / flow on** in front and back (OBOGS integrity check)."], "ans": 2, "expl": "After PC GTS-clear signal, press **GTS momentarily**. **GTS light should illuminate within 20 seconds**."}, {"q": "Engine start — ENGINE switch START and READY light?", "opts": ["Control lock BIT may take up to about **120 seconds** to complete (simulates a lock spin).", "On PC run-up signal, slowly advance to **70%**. EGT should initially climb then drop about **50 °C**.", "On PC start-engine signal, ENGINE switch to **START**. **READY light within 15 seconds**.", "Press **HYD 2 reset** — high pressure should indicate **3000 psi** with the light out."], "ans": 2, "expl": "On PC start-engine signal, ENGINE switch to **START**. **READY light within 15 seconds**."}, {"q": "When do you advance throttle to IDLE on start?", "opts": ["Parking brake set → OBOGS OFF → throttle OFF on PC cut-engine signal → monitor **EGT, RPM, and fuel flow** for normal shutdown.", "At **17–20% N2** and when the PC gives the run-up signal — advance to **IDLE**. Monitor instruments; oil pressure light out.", "Pinky OFF; console/MIP lights OFF; remove MDL/VCR/USB as required; both **BAT OFF**; ensure **seat and MDC firing handles are pinned**.", "Check **27–29 V** on voltmeter; turn **OBOGS / anti-G** switch ON; displays/radios/NAVAIDS as desired; IFF to **STANDBY**."], "ans": 1, "expl": "At **17–20% N2** and when the PC gives the run-up signal — advance to **IDLE**. Monitor instruments; oil pressure light out."}, {"q": "Post-start voltmeter and OBOGS/anti-G?", "opts": ["At **17–20% N2** and when the PC gives the run-up signal — advance to **IDLE**. Monitor instruments; oil pressure light out.", "Check **27–29 V** on voltmeter; turn **OBOGS / anti-G** switch ON; displays/radios/NAVAIDS as desired; IFF to **STANDBY**.", "Pinky OFF; console/MIP lights OFF; remove MDL/VCR/USB as required; both **BAT OFF**; ensure **seat and MDC firing handles are pinned**.", "Parking brake set → OBOGS OFF → throttle OFF on PC cut-engine signal → monitor **EGT, RPM, and fuel flow** for normal shutdown."], "ans": 1, "expl": "Check **27–29 V** on voltmeter; turn **OBOGS / anti-G** switch ON; displays/radios/NAVAIDS as desired; IFF to **STANDBY**."}, {"q": "Post-start 70% run-up EGT behavior?", "opts": ["After PC GTS-clear signal, press **GTS momentarily**. **GTS light should illuminate within 20 seconds**.", "While taxiing: press **ADR evade/record**; **mask on / flow on** in front and back (OBOGS integrity check).", "Press and release paddle → **nosewheel steering caution light ON**; verify throttle OFF, lights and tones.", "On PC run-up signal, slowly advance to **70%**. EGT should initially climb then drop about **50 °C**."], "ans": 3, "expl": "On PC run-up signal, slowly advance to **70%**. EGT should initially climb then drop about **50 °C**."}, {"q": "HYD 2 reset expected indication?", "opts": ["On PC run-up signal, slowly advance to **70%**. EGT should initially climb then drop about **50 °C**.", "Control lock BIT may take up to about **120 seconds** to complete (simulates a lock spin).", "On PC start-engine signal, ENGINE switch to **START**. **READY light within 15 seconds**.", "Press **HYD 2 reset** — high pressure should indicate **3000 psi** with the light out."], "ans": 3, "expl": "Press **HYD 2 reset** — high pressure should indicate **3000 psi** with the light out."}, {"q": "Fuel control switch test (INFUEL) limits?", "opts": ["Pinky OFF; console/MIP lights OFF; remove MDL/VCR/USB as required; both **BAT OFF**; ensure **seat and MDC firing handles are pinned**.", "Parking brake set → OBOGS OFF → throttle OFF on PC cut-engine signal → monitor **EGT, RPM, and fuel flow** for normal shutdown.", "**Safe seats in both cockpits**, then retract speed brakes, raise flaps/slats, trim to zero, OBOGS flow OFF, turn off NAV/IFF, check BIT/maint.", "Hold fuel control / test — **INFUEL** light illuminates; RPM drops a **maximum of 6%**. Set **NORM** — light out, RPM returns to normal."], "ans": 3, "expl": "Hold fuel control / test — **INFUEL** light illuminates; RPM drops a **maximum of 6%**. Set **NORM** — light out, RPM returns to normal."}, {"q": "What do you check on BIT / maint / ACFT DATA after start?", "opts": ["Yes — fully available with no limitations.", "Yes — after selecting GAIN ORIDE.", "Yes — available in the aft cockpit only.", "No exceedances, no overflows; **four satellites**; QUAL counting down / alignment progress. Note any DEGD on BIT."], "ans": 3, "expl": "No exceedances, no overflows; **four satellites**; QUAL counting down / alignment progress. Note any DEGD on BIT."}, {"q": "Control lock BIT duration mentioned?", "opts": ["Control lock BIT may take up to about **120 seconds** to complete (simulates a lock spin).", "On PC run-up signal, slowly advance to **70%**. EGT should initially climb then drop about **50 °C**.", "Press **HYD 2 reset** — high pressure should indicate **3000 psi** with the light out.", "On PC start-engine signal, ENGINE switch to **START**. **READY light within 15 seconds**."], "ans": 0, "expl": "Control lock BIT may take up to about **120 seconds** to complete (simulates a lock spin)."}, {"q": "Plane-captain flight-control / configuration flow (high level)?", "opts": ["Flaps/slats **HALF** (indicate + visual down); trim **0 / 0 / 2° nose up**; canopy closed & locked (light out); attached **8 points**, pins removed; selector BOTH / armed as required.", "Follow PC signals: flight controls → engage NWS → flaps down → hook down → speed brakes open → visual flaps/slats & SB/hook lights → hook up → SB close → flaps **HALF** → lights out → canopy clear/close before taxi.", "**Safe seats in both cockpits**, then retract speed brakes, raise flaps/slats, trim to zero, OBOGS flow OFF, turn off NAV/IFF, check BIT/maint.", "~**30 s**: GINA power OFF + left MFD OFF (canopy may open after parking brake). ~**45 s**: ENGINE switch + anti-skid OFF (fwd), pull fuel shutoff, lights off, brake accumulator ≥ **2700 psi**. ~**50 s**: cycle stick ½..."], "ans": 1, "expl": "Follow PC signals: flight controls → engage NWS → flaps down → hook down → speed brakes open → visual flaps/slats & SB/hook lights → hook up → SB close → flaps **HALF** → lights out → canopy clear/close before taxi."}, {"q": "OBOGS integrity ground check cues?", "opts": ["While taxiing: press **ADR evade/record**; **mask on / flow on** in front and back (OBOGS integrity check).", "Alt bat 1 and 2 ON; check each between **24 and 29 volts**, then master alert light out and both BAT switches ON.", "After PC GTS-clear signal, press **GTS momentarily**. **GTS light should illuminate within 20 seconds**.", "Press and release paddle → **nosewheel steering caution light ON**; verify throttle OFF, lights and tones."], "ans": 0, "expl": "While taxiing: press **ADR evade/record**; **mask on / flow on** in front and back (OBOGS integrity check)."}, {"q": "Takeoff checks — flaps/slats, trim, canopy, harness?", "opts": ["Follow PC signals: flight controls → engage NWS → flaps down → hook down → speed brakes open → visual flaps/slats & SB/hook lights → hook up → SB close → flaps **HALF** → lights out → canopy clear/close before taxi.", "Hold fuel control / test — **INFUEL** light illuminates; RPM drops a **maximum of 6%**. Set **NORM** — light out, RPM returns to normal.", "Flaps/slats **HALF** (indicate + visual down); trim **0 / 0 / 2° nose up**; canopy closed & locked (light out); attached **8 points**, pins removed; selector BOTH / armed as required.", "**Safe seats in both cockpits**, then retract speed brakes, raise flaps/slats, trim to zero, OBOGS flow OFF, turn off NAV/IFF, check BIT/maint."], "ans": 2, "expl": "Flaps/slats **HALF** (indicate + visual down); trim **0 / 0 / 2° nose up**; canopy closed & locked (light out); attached **8 points**, pins removed; selector BOTH / armed as required."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= queue.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
