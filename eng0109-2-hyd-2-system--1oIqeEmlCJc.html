<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ENG0109 (2) Hyd 2 System — T-45 Quiz</title>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">T-45 Local Quizzes</a> · Hydraulic</div>
    <h1>ENG0109 (2) Hyd 2 System</h1>
    <div class="meta">19 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 19</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Hydraulic</div>
    <h2 style="margin:0.2rem 0">ENG0109 (2) Hyd 2 System</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="index.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to Index</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="index.html">← All quizzes</a></div>
</div>
<script>
const QUESTIONS = [{"q": "HYD 2 EDP flow rate is approximately:", "opts": ["3.3 gpm", "6 gpm", "9.6 gpm", "Same as HYD 1"], "ans": 1, "expl": "HYD 2 puts out ~6 gpm at 3000 psi; HYD 1 is ~9.6 gpm."}, {"q": "RAT extends when HYD 2 EDP pressure falls below about:", "opts": ["600 psi", "1100 psi", "1500 psi", "2000 psi"], "ans": 2, "expl": "Spool valve extends RAT below ~1500 psi."}, {"q": "HYD 2 bypass is normally reset:", "opts": ["Immediately at idle", "At N2 ≥ 45%, usually during 70% check", "Only airborne", "Automatically at 42%"], "ans": 1, "expl": "Bypass opens below 42%; reset at ≥45%, normally at 70% check."}, {"q": "With RAT deployed for low HYD 2, HYD 2 gauge typically:", "opts": ["Reads 0", "Steady 3000", "Fluctuates ~2500–3000", "Reads 1300"], "ans": 2, "expl": "Fixed-displacement RAT pump with speed limiter causes fluctuation."}, {"q": "HYD 2 approximate fluid capacity?", "opts": ["About 101 gallon.", "About 2 gallon.", "About 11 gallon.", "About 1 gallon."], "ans": 3, "expl": "About 1 gallon."}, {"q": "HYD 2 EDP flow rate vs HYD 1?", "opts": ["Same 1500 psi design but 6 gpm (HYD 1 is 9.6 gpm).", "Same 6000 psi design but 6 gpm (HYD 1 is 9.6 gpm).", "Same 3000 psi design but 6 gpm (HYD 1 is 9.6 gpm).", "Same 3010 psi design but 6 gpm (HYD 1 is 9.6 gpm)."], "ans": 2, "expl": "Same 3000 psi design but 6 gpm (HYD 1 is 9.6 gpm)."}, {"q": "When does the RAT automatically extend?", "opts": ["When HYD 2 EDP pressure falls below approximately 1500 psi.", "When HYD 4 EDP pressure falls below approximately 1500 psi.", "When HYD 1 EDP pressure falls below approximately 1500 psi.", "When HYD 12 EDP pressure falls below approximately 1500 psi."], "ans": 0, "expl": "When HYD 2 EDP pressure falls below approximately 1500 psi."}, {"q": "Does RAT operation require electrical power?", "opts": ["Yes — available in the aft cockpit only.", "Yes — after selecting GAIN ORIDE.", "No.", "Yes — fully available with no limitations."], "ans": 2, "expl": "No."}, {"q": "HYD 2 bypass valve opens when N2 is below?", "opts": ["42% N2 (reduces engine loads during start).", "84% N2 (reduces engine loads during start).", "21% N2 (reduces engine loads during start).", "52% N2 (reduces engine loads during start)."], "ans": 0, "expl": "42% N2 (reduces engine loads during start)."}, {"q": "Minimum N2 to reset HYD 2 bypass?", "opts": ["At least 90% N2 (normally done at 70% check).", "At least 55% N2 (normally done at 70% check).", "At least 45% N2 (normally done at 70% check).", "At least 22% N2 (normally done at 70% check)."], "ans": 2, "expl": "At least 45% N2 (normally done at 70% check)."}, {"q": "After engine start before HYD 2 reset, what do you see?", "opts": ["HYD 12 gauge 0 psi and HYD caution illuminated.", "HYD 4 gauge 0 psi and HYD caution illuminated.", "HYD 1 gauge 0 psi and HYD caution illuminated.", "HYD 2 gauge 0 psi and HYD caution illuminated."], "ans": 3, "expl": "HYD 2 gauge 0 psi and HYD caution illuminated."}, {"q": "Pressure to retract RAT when resetting HYD 2?", "opts": ["HYD 12 pressure 1800 psi or higher.", "HYD 4 pressure 1800 psi or higher.", "HYD 1 pressure 1800 psi or higher.", "HYD 2 pressure 1800 psi or higher."], "ans": 3, "expl": "HYD 2 pressure 1800 psi or higher."}, {"q": "Expected indications with RAT deployed due to low HYD 2?", "opts": ["HYD caution + RAT caution; HYD 1 gauge fluctuating ~2500–3000 psi.", "HYD caution + RAT caution; HYD 12 gauge fluctuating ~2500–3000 psi.", "HYD caution + RAT caution; HYD 2 gauge fluctuating ~2500–3000 psi.", "HYD caution + RAT caution; HYD 4 gauge fluctuating ~2500–3000 psi."], "ans": 2, "expl": "HYD caution + RAT caution; HYD 2 gauge fluctuating ~2500–3000 psi."}, {"q": "Should you reset HYD 2 when RAT is out with HYD caution?", "opts": ["Yes — after selecting GAIN ORIDE.", "No — system is functioning as designed.", "Yes — fully available with no limitations.", "Yes — available in the aft cockpit only."], "ans": 1, "expl": "No — system is functioning as designed."}, {"q": "HYD 2 flight control accumulator precharge?", "opts": ["2200 ± 50 psi.", "550 ± 50 psi.", "1110 ± 50 psi.", "1100 ± 50 psi."], "ans": 3, "expl": "1100 ± 50 psi."}, {"q": "Where is HYD 2 reservoir gauge?", "opts": ["Fluctuates ~2500–3000", "About 240–270 cubic inches.", "Port side of the fuselage.", "HYD 2 gauge is forward of HYD 1."], "ans": 2, "expl": "Port side of the fuselage."}, {"q": "Typical HYD 2 reservoir reading?", "opts": ["About 250–270 cubic inches.", "About 120–270 cubic inches.", "About 240–270 cubic inches.", "About 480–270 cubic inches."], "ans": 2, "expl": "About 240–270 cubic inches."}, {"q": "WARNING with HYD 2 at 0 and HYD 1 above 500 psi?", "opts": ["When HYD 2 EDP pressure falls below approximately 1500 psi.", "HYD caution + RAT caution; HYD 2 gauge fluctuating ~2500–3000 psi.", "Uncommanded left lateral stick/aileron may indicate port aileron actuator failure — can lose control; follow NATOPS (do not just recenter stick).", "Same 3000 psi design but 6 gpm (HYD 1 is 9.6 gpm)."], "ans": 2, "expl": "Uncommanded left lateral stick/aileron may indicate port aileron actuator failure — can lose control; follow NATOPS (do not just recenter stick)."}, {"q": "Where is HYD 2 gauge relative to HYD 1?", "opts": ["HYD 12 gauge is forward of HYD 1.", "HYD 1 gauge is forward of HYD 1.", "HYD 2 gauge is forward of HYD 1.", "HYD 4 gauge is forward of HYD 1."], "ans": 2, "expl": "HYD 2 gauge is forward of HYD 1."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= QUESTIONS.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
</html>
