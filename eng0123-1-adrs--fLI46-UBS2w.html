<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ENG0123 (1) ADRS — T-45 Quiz</title>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">T-45 Local Quizzes</a> · Other Systems</div>
    <h1>ENG0123 (1) ADRS</h1>
    <div class="meta">17 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 17</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Other Systems</div>
    <h2 style="margin:0.2rem 0">ENG0123 (1) ADRS</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="index.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to Index</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="index.html">← All quizzes</a></div>
</div>
<script>
const QUESTIONS = [{"q": "ADRS primary roles include:", "opts": ["Only cockpit voice recording", "Flight incident recorder, engine monitor, structural fatigue monitor", "Only TACAN BIT logging", "Only HUD video"], "ans": 1, "expl": "Incident recorder + engine + structural fatigue monitor."}, {"q": "Instant Record pushbutton protects approximately:", "opts": ["1 second", "10 seconds (±5 around press)", "7.5 hours", "30 minutes"], "ans": 1, "expl": "≈10 s protected window (±5 s)."}, {"q": "ADR recording capacity:", "opts": ["30 minutes", "2 hours", "7.5 hours at 1-second intervals", "Unlimited"], "ans": 2, "expl": "7.5 h continuous @ 1 Hz."}, {"q": "Memory overflow is noted when capacity exceeds:", "opts": ["20%", "50%", "80%", "100% only at full"], "ans": 2, "expl": "Overflow flagged past 80%."}, {"q": "ADR status on Maintenance page can be checked:", "opts": ["Only airborne", "After start and after landing (not airborne / WOFF)", "Only with Master Arm ARM", "Never by aircrew"], "ans": 1, "expl": "Post-start and post-landing; not airborne."}, {"q": "ADR degrade/fail may cascade to:", "opts": ["HYD 2 bypass / no HYD 2 reset, F PRESS / boost pumps off, lost AOA or RALT displays, blanked CCIP/A-A reticle", "Only COMM2 loss", "Only TACAN azimuth loss", "Only landing gear unlock"], "ans": 0, "expl": "Multiple cascading display/HYD/fuel-boost effects."}, {"q": "What three monitoring roles does ADRS/ADR provide?", "opts": ["Flight incident recorder, engine monitor, and structural fatigue monitor.", "Change in the 12 sensor zeros, and/or an X to the right of Exceedance or Overflow.", "Flight incident recorder, engine monitor, structural fatigue monitor", "First weight-off-wheels to last weight-on-wheels — i.e., flight time."], "ans": 0, "expl": "Flight incident recorder, engine monitor, and structural fatigue monitor."}, {"q": "Where is the DDS control panel, and what does the USB do?", "opts": ["After engine start and after landing only — cannot check airborne (weight off wheels).", "Change in the 12 sensor zeros, and/or an X to the right of Exceedance or Overflow.", "Right console, rear cockpit. USB uploads GPS waypoints and downloads aircraft video recordings.", "7.5 hours continuous at 1-second intervals; overflow indicated when 80% capacity surpassed."], "ans": 2, "expl": "Right console, rear cockpit. USB uploads GPS waypoints and downloads aircraft video recordings."}, {"q": "What does the Instant Record pushbutton do?", "opts": ["After 28 VDC Essential/Central Services bus power-up and BIT; recording begins around 30% RPM and continues to engine shutdown.", "Saves/protects about 10 seconds of recorded data (±5 s around the press) for maintenance review. Located below Master Arm (fwd) / Master Arm Override (aft).", "Downloaded ADR data can reconstruct the flight from engine start to shutdown for the mishap investigation report.", "May lose AOA or RALT display (MFCD/HUD); HYD 2 caution with HYD 2 in bypass (no reset); engine page data loss; F PRESS caution / boost pumps off (ADR owns 30 s boost-pump relay on ESS bus); blanked wind, ADI TAS, HUD ..."], "ans": 1, "expl": "Saves/protects about 10 seconds of recorded data (±5 s around the press) for maintenance review. Located below Master Arm (fwd) / Master Arm Override (aft)."}, {"q": "When can ADR status be checked on the Maintenance page?", "opts": ["Right console, rear cockpit. USB uploads GPS waypoints and downloads aircraft video recordings.", "Change in the 12 sensor zeros, and/or an X to the right of Exceedance or Overflow.", "After engine start and after landing only — cannot check airborne (weight off wheels).", "7.5 hours continuous at 1-second intervals; overflow indicated when 80% capacity surpassed."], "ans": 2, "expl": "After engine start and after landing only — cannot check airborne (weight off wheels)."}, {"q": "ADR recording capacity and overflow threshold?", "opts": ["Change in the 12 sensor zeros, and/or an X to the right of Exceedance or Overflow.", "After engine start and after landing only — cannot check airborne (weight off wheels).", "7.5 hours continuous at 1-second intervals; overflow indicated when 80% capacity surpassed.", "Right console, rear cockpit. USB uploads GPS waypoints and downloads aircraft video recordings."], "ans": 2, "expl": "7.5 hours continuous at 1-second intervals; overflow indicated when 80% capacity surpassed."}, {"q": "When does ADRS start recording?", "opts": ["After 28 VDC Essential/Central Services bus power-up and BIT; recording begins around 30% RPM and continues to engine shutdown.", "HYD 2 bypass / no HYD 2 reset, F PRESS / boost pumps off, lost AOA or RALT displays, blanked CCIP/A-A reticle", "Saves/protects about 10 seconds of recorded data (±5 s around the press) for maintenance review. Located below Master Arm (fwd) / Master Arm Override (aft).", "Downloaded ADR data can reconstruct the flight from engine start to shutdown for the mishap investigation report."], "ans": 0, "expl": "After 28 VDC Essential/Central Services bus power-up and BIT; recording begins around 30% RPM and continues to engine shutdown."}, {"q": "What does \"lapse time\" on ADR represent?", "opts": ["Change in the 12 sensor zeros, and/or an X to the right of Exceedance or Overflow.", "Flight incident recorder, engine monitor, structural fatigue monitor", "First weight-off-wheels to last weight-on-wheels — i.e., flight time.", "Flight incident recorder, engine monitor, and structural fatigue monitor."], "ans": 2, "expl": "First weight-off-wheels to last weight-on-wheels — i.e., flight time."}, {"q": "Name key ADR failure / degrade effects on the jet?", "opts": ["Downloaded ADR data can reconstruct the flight from engine start to shutdown for the mishap investigation report.", "May lose AOA or RALT display (MFCD/HUD); HYD 2 caution with HYD 2 in bypass (no reset); engine page data loss; F PRESS caution / boost pumps off (ADR owns 30 s boost-pump relay on ESS bus); blanked wind, ADI TAS, HUD ...", "Saves/protects about 10 seconds of recorded data (±5 s around the press) for maintenance review. Located below Master Arm (fwd) / Master Arm Override (aft).", "After 28 VDC Essential/Central Services bus power-up and BIT; recording begins around 30% RPM and continues to engine shutdown."], "ans": 1, "expl": "May lose AOA or RALT display (MFCD/HUD); HYD 2 caution with HYD 2 in bypass (no reset); engine page data loss; F PRESS caution / boost pumps off (ADR owns 30 s boost-pump relay on ESS bus); blanked wind, ADI TAS, HUD A/A aiming reticle, A/G CCIP."}, {"q": "How is an ADR status change indicated on the Maintenance page?", "opts": ["Change in the 12 sensor zeros, and/or an X to the right of Exceedance or Overflow.", "Flight incident recorder, engine monitor, and structural fatigue monitor.", "7.5 hours continuous at 1-second intervals; overflow indicated when 80% capacity surpassed.", "After engine start and after landing only — cannot check airborne (weight off wheels)."], "ans": 0, "expl": "Change in the 12 sensor zeros, and/or an X to the right of Exceedance or Overflow."}, {"q": "Why is ADRS important after a mishap?", "opts": ["HYD 2 bypass / no HYD 2 reset, F PRESS / boost pumps off, lost AOA or RALT displays, blanked CCIP/A-A reticle", "Downloaded ADR data can reconstruct the flight from engine start to shutdown for the mishap investigation report.", "Right console, rear cockpit. USB uploads GPS waypoints and downloads aircraft video recordings.", "7.5 hours continuous at 1-second intervals; overflow indicated when 80% capacity surpassed."], "ans": 1, "expl": "Downloaded ADR data can reconstruct the flight from engine start to shutdown for the mishap investigation report."}, {"q": "When Power/timeline: Powers with 28 VDC Essential/Central Services bus; BIT on power-up; recording from ≈30% RPM through engine shutdown. Lapse time = first WOFF, what happens?", "opts": ["80%", "last WOW (flight time).", "10 seconds (±5 around press)", "7.5 hours at 1-second intervals"], "ans": 1, "expl": "last WOW (flight time)."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= QUESTIONS.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
</html>
