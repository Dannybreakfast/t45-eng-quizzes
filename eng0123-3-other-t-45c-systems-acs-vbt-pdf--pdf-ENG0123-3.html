<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ENG0123 (3) Other T-45C Systems — ACS VBT (PDF) — T-45 Quiz</title>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">T-45 Local Quizzes</a> · Other Systems</div>
    <h1>ENG0123 (3) Other T-45C Systems — ACS VBT (PDF)</h1>
    <div class="meta">24 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">

      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">

      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Other Systems</div>
    <h2 style="margin:0.2rem 0">ENG0123 (3) Other T-45C Systems — ACS VBT (PDF)</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="index.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to Index</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="index.html">← All quizzes</a></div>
</div>
<script>

olted under wings, 77 lb, contain ejection cartridge. BRU-38 carries four MK-76 or BDU-33 (25 lb smoke) and weighs 101 lb.", "Aircraft defaults to LAC; must switch to RTGS (syllabus primary). RTGS = pipper + target spanner ring (default 31 mils) simulating 20 mm ballistics at 1000 ft."], "ans": 0, "expl": "Defaults to Manual. CCIP (Continuously Computed Impact Point) can be selected; then TGHT can be boxed and target height entered."}, {"q": "SET/DEP default mil depressions?", "opts": ["150 (bombs), 30 (rockets), 12 (guns).", "280 (bombs), 30 (rockets), 12 (guns).", "70 (bombs), 30 (rockets), 12 (guns).", "140 (bombs), 30 (rockets), 12 (guns)."], "ans": 3, "expl": "140 (bombs), 30 (rockets), 12 (guns)."}, {"q": "A/A gunsight: LAC vs RTGS?", "opts": ["Rear-cockpit solenoid switch powered by the armament bus; SAFE renders system inoperative. When forward cockpit selects SAFE, power is removed and Override returns to FORWARD.", "28 VDC Essential Bus; both cockpits; with WOFF jettisons bomb racks from the pylons (BRU-38/A + attached ordnance as a unit via pylon ejection cartridge).", "Aircraft defaults to LAC; must switch to RTGS (syllabus primary). RTGS = pipper + target spanner ring (default 31 mils) simulating 20 mm ballistics at 1000 ft.", "Pylons bolted under wings, 77 lb, contain ejection cartridge. BRU-38 carries four MK-76 or BDU-33 (25 lb smoke) and weighs 101 lb."], "ans": 2, "expl": "Aircraft defaults to LAC; must switch to RTGS (syllabus primary). RTGS = pipper + target spanner ring (default 31 mils) simulating 20 mm ballistics at 1000 ft."}, {"q": "What is correct for: Armament bus?", "opts": ["** **56 VDC Generator Bus** via Master Arm — **no release with GEN fail**", "** **28 VDC Generator Bus** via Master Arm — **no release with GEN fail**", "** **38 VDC Generator Bus** via Master Arm — **no release with GEN fail**", "** **14 VDC Generator Bus** via Master Arm — **no release with GEN fail**"], "ans": 1, "expl": "** **28 VDC Generator Bus** via Master Arm — **no release with GEN fail**"}, {"q": "What is correct for: Jettison?", "opts": ["** **38 VDC Essential Bus**; WOFF; both cockpits", "** **56 VDC Essential Bus**; WOFF; both cockpits", "** **14 VDC Essential Bus**; WOFF; both cockpits", "** **28 VDC Essential Bus**; WOFF; both cockpits"], "ans": 3, "expl": "** **28 VDC Essential Bus**; WOFF; both cockpits"}, {"q": "What is correct for: Override?", "opts": ["** Pylon **77 lb** + ejection cartridge; BRU-38 **101 lb**, **4×** MK-76/BDU-33 (**25 lb**, smoke)", "28 VDC Generator Bus (via Master Arm). No — you cannot release ordnance with a generator failure.", "** Solenoid on armament bus; SAFE disables; fwd SAFE → override returns **FORWARD**", "** Pickle + ARM + Override FORWARD + WOFF + L/R station on A/G stores"], "ans": 2, "expl": "** Solenoid on armament bus; SAFE disables; fwd SAFE → override returns **FORWARD**"}, {"q": "What is correct for: Release?", "opts": ["** Pickle + ARM + Override FORWARD + WOFF + L/R station on A/G stores", "** Solenoid on armament bus; SAFE disables; fwd SAFE → override returns **FORWARD**", "28 VDC Generator Bus (via Master Arm). No — you cannot release ordnance with a generator failure.", "Enables weapons release logic on the armament (Generator) bus"], "ans": 0, "expl": "** Pickle + ARM + Override FORWARD + WOFF + L/R station on A/G stores"}, {"q": "What is correct for: Pylon / BRU-38?", "opts": ["** Default **LAC**; syllabus primary **RTGS** (pipper + spanner default **31 mils**, 20 mm @ 1000 ft)", "** Pylon **77 lb** + ejection cartridge; BRU-38 **101 lb**, **4×** MK-76/BDU-33 (**25 lb**, smoke)", "Master Arm ARM, Override FORWARD, weight off wheels, and Left or Right station selected on the A/G stores page.", "28 VDC Generator Bus (via Master Arm). No — you cannot release ordnance with a generator failure."], "ans": 1, "expl": "** Pylon **77 lb** + ejection cartridge; BRU-38 **101 lb**, **4×** MK-76/BDU-33 (**25 lb**, smoke)"}, {"q": "What is correct for: Qty PB?", "opts": ["** Defaults **6** (usually **4**) — counter only, not BRU pulses", "** Defaults **16** (usually **4**) — counter only, not BRU pulses", "** Defaults **3** (usually **4**) — counter only, not BRU pulses", "** Defaults **12** (usually **4**) — counter only, not BRU pulses"], "ans": 0, "expl": "** Defaults **6** (usually **4**) — counter only, not BRU pulses"}, {"q": "What is correct for: Modes?", "opts": ["** **28 VDC Essential Bus**; WOFF; both cockpits", "** Bombs **140**, rockets **30**, guns **12**", "RTGS", "** Default **Manual**; **CCIP** + box **TGHT**"], "ans": 3, "expl": "** Default **Manual**; **CCIP** + box **TGHT**"}, {"q": "What is correct for: SET/DEP mils?", "opts": ["** Bombs **140**, rockets **30**, guns **12**", "** Bombs **280**, rockets **30**, guns **12**", "** Bombs **70**, rockets **30**, guns **12**", "** Bombs **150**, rockets **30**, guns **12**"], "ans": 0, "expl": "** Bombs **140**, rockets **30**, guns **12**"}, {"q": "What is correct for: A/A?", "opts": ["28 VDC Generator Bus (via Master Arm). No — you cannot release ordnance with a generator failure.", "Master Arm ARM, Override FORWARD, weight off wheels, and Left or Right station selected on the A/G stores page.", "** Pylon **77 lb** + ejection cartridge; BRU-38 **101 lb**, **4×** MK-76/BDU-33 (**25 lb**, smoke)", "** Default **LAC**; syllabus primary **RTGS** (pipper + spanner default **31 mils**, 20 mm @ 1000 ft)"], "ans": 3, "expl": "** Default **LAC**; syllabus primary **RTGS** (pipper + spanner default **31 mils**, 20 mm @ 1000 ft)"}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= QUESTIONS.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
