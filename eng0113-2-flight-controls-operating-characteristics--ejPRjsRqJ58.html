<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>

<title>ENG0113 (2) Flight Controls Operating Characteristics — T-45 Quiz</title>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">Home</a> · <a href="section-eng.html">ENG</a> · Flight Controls</div>
    <h1>ENG0113 (2) Flight Controls Operating Characteristics</h1>
    <div class="meta">24 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">

      <span id="prog-label">Question 1 of 24</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>

      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Flight Controls</div>
    <h2 style="margin:0.2rem 0">ENG0113 (2) Flight Controls Operating Characteristics</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-eng.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to ENG</a>
    </div>
    <div class="review" id="review"></div>
  </div>

</div>
<script>
const QUESTIONS = [{"q": "HYD2 is dedicated to:", "opts": ["Flaps and speed brakes only", "Aileron and stabilator only", "Rudder only", "Landing gear only"], "ans": 1, "expl": "HYD2: aileron + stabilator. HYD1 also does flaps/SB."}, {"q": "Aileron PCU piston/rod failure with BOTH HYD1 and HYD2 working is:", "opts": ["Immediately obvious via uncommanded roll", "Masked / undetectable to aircrew", "Annunciated by SLATS caution only", "Fixed by paddle switch"], "ans": 1, "expl": "Masked until operating on a single HYD."}, {"q": "Gear-down aileron deflection range (each side of neutral):", "opts": ["6°", "12.5°", "15.5°", "20°"], "ans": 2, "expl": "Gear down ±15.5°; gear up ±12.5°."}, {"q": "Rudder max deflection:", "opts": ["12.5 ± 0.5°", "15.5°", "20 ± 0.5°", "60°"], "ans": 2, "expl": "20 ± 0.5° either side."}, {"q": "Flaps will blow back if oversped?", "opts": ["Yes always", "No", "Only above 380 KIAS", "Only with emerg flaps"], "ans": 1, "expl": "Flaps do not blow back."}, {"q": "Slats extend above 217 KIAS?", "opts": ["Yes fully", "No — inhibited (SADS 217 signal)", "Only with emerg flaps", "Only gear up"], "ans": 1, "expl": "Must be below 217 KIAS; SADS provides signal."}, {"q": "Speed brakes begin to blow back around:", "opts": ["200 KIAS", "217 KIAS", "340 KIAS", "380 KIAS"], "ans": 3, "expl": "Blowback begins ~380; may not fully extend above 340."}, {"q": "With SBI inoperative, parade/close formation speed-brake use should be avoided especially:", "opts": ["80–120 KIAS", "220–300 KIAS", "Above 0.9 Mach only", "On deck only"], "ans": 1, "expl": "Especially 220–300 KIAS with SBI inop."}, {"q": "ARI (turn coordination) needs:", "opts": ["WOW off, \u003c217 KIAS, flaps ½ or DN", "WOW on, any speed", "Gear up, flaps UP", "HYD2 only"], "ans": 0, "expl": "Plus YDC/YDA path for ARI."}, {"q": "SBI reduces positive pitch transients roughly between:", "opts": ["0.2–0.7 Mach", "0.8–1.2 Mach", "Only below 100 KIAS", "Only with flaps full"], "ans": 0, "expl": "Positive 0.2–0.7; negative above ~0.7 Mach (lecture)."}, {"q": "What flight controls does HYD1 vs HYD2 power?", "opts": ["HYD1: aileron, stabilator, flaps, speed brakes. HYD2: aileron and stabilator only (dedicated to flight controls).", "Rudder pedal shaker (fwd left pedal) + aural tone at **21.5 units** AOA (clean and landing configs per lecture).", "Increases aileron deflection and reduces max lateral stick displacement. Gear up ±12.5° aileron; gear down ±15.5°.", "Full aileron deflection → uncommanded/uncontrollable roll. Eject without delay if aircraft becomes uncontrollable."], "ans": 0, "expl": "HYD1: aileron, stabilator, flaps, speed brakes. HYD2: aileron and stabilator only (dedicated to flight controls)."}, {"q": "What happens if half an aileron tandem actuator has failed and only one HYD remains?", "opts": ["Rudder pedal shaker (fwd left pedal) + aural tone at **21.5 units** AOA (clean and landing configs per lecture).", "HYD1: aileron, stabilator, flaps, speed brakes. HYD2: aileron and stabilator only (dedicated to flight controls).", "Increases aileron deflection and reduces max lateral stick displacement. Gear up ±12.5° aileron; gear down ±15.5°.", "Full aileron deflection → uncommanded/uncontrollable roll. Eject without delay if aircraft becomes uncontrollable."], "ans": 3, "expl": "Full aileron deflection → uncommanded/uncontrollable roll. Eject without delay if aircraft becomes uncontrollable."}, {"q": "Port aileron actuator failure with only HYD1 — roll direction?", "opts": ["Port aileron TEU full → uncommanded **left** roll. Starboard actuator fail with only HYD2 → uncommanded **right** roll.", "Full aileron deflection → uncommanded/uncontrollable roll. Eject without delay if aircraft becomes uncontrollable.", "May not fully extend above 340 KIAS; begin blowback ~380 KIAS; fully extend below 340. No emergency SB extend/retract.", "Increases aileron deflection and reduces max lateral stick displacement. Gear up ±12.5° aileron; gear down ±15.5°."], "ans": 0, "expl": "Port aileron TEU full → uncommanded **left** roll. Starboard actuator fail with only HYD2 → uncommanded **right** roll."}, {"q": "Post-engine-start aileron PCU check cue?", "opts": ["With HYD2 at 0 psi and HYD1 above ~1500 psi, uncommanded left lateral stick/aileron = port aileron actuator failure. Recentering after HYD2 reset is NOT proof it is fixed.", "~50 sec after throttle OFF: cycle stick half-deflection laterally about neutral at one cycle/2 sec; neutralize when HYD1 reaches 0. After both HYDs at 0, disregard stick forces/movements.", "GINA roll attitude, right aileron position, flaps lever, yaw-rate gyro, SADS IAS, pilot rudder-trim inputs → commands to YDA for yaw damping, ARI, rudder trim.", "Repositions stabilator (stick does NOT move) to counter SB pitch. With C AUG/SBI inop, avoid close/parade formation SB use esp. 220–300 KIAS; expect up to ±2° pitch."], "ans": 0, "expl": "With HYD2 at 0 psi and HYD1 above ~1500 psi, uncommanded left lateral stick/aileron = port aileron actuator failure. Recentering after HYD2 reset is NOT proof it is fixed."}, {"q": "Engine shutdown lateral stick check?", "opts": ["Repositions stabilator (stick does NOT move) to counter SB pitch. With C AUG/SBI inop, avoid close/parade formation SB use esp. 220–300 KIAS; expect up to ±2° pitch.", "GINA roll attitude, right aileron position, flaps lever, yaw-rate gyro, SADS IAS, pilot rudder-trim inputs → commands to YDA for yaw damping, ARI, rudder trim.", "With HYD2 at 0 psi and HYD1 above ~1500 psi, uncommanded left lateral stick/aileron = port aileron actuator failure. Recentering after HYD2 reset is NOT proof it is fixed.", "~50 sec after throttle OFF: cycle stick half-deflection laterally about neutral at one cycle/2 sec; neutralize when HYD1 reaches 0. After both HYDs at 0, disregard stick forces/movements."], "ans": 3, "expl": "~50 sec after throttle OFF: cycle stick half-deflection laterally about neutral at one cycle/2 sec; neutralize when HYD1 reaches 0. After both HYDs at 0, disregard stick forces/movements."}, {"q": "Stick-to-aileron ratio changer effect with gear down?", "opts": ["Increases aileron deflection and reduces max lateral stick displacement. Gear up ±12.5° aileron; gear down ±15.5°.", "HYD1: aileron, stabilator, flaps, speed brakes. HYD2: aileron and stabilator only (dedicated to flight controls).", "Full aileron deflection → uncommanded/uncontrollable roll. Eject without delay if aircraft becomes uncontrollable.", "Rudder pedal shaker (fwd left pedal) + aural tone at **21.5 units** AOA (clean and landing configs per lecture)."], "ans": 0, "expl": "Increases aileron deflection and reduces max lateral stick displacement. Gear up ±12.5° aileron; gear down ±15.5°."}, {"q": "Does aileron trim work on battery/ESS-only power?", "opts": ["Yes — available in the aft cockpit only.", "Yes — after selecting GAIN ORIDE.", "No — aileron trim is on the 28 VDC Generator bus.", "Yes — fully available with no limitations."], "ans": 2, "expl": "No — aileron trim is on the 28 VDC Generator bus."}, {"q": "Stabilator geometry highlights?", "opts": ["Will not extend above 217 KIAS; SADS/ADC provides 217 signal. Loss of SADS → loss of slats. No slats with emerg flaps or HYD1 fail.", "~30.1° sweep, 10° anhedral (tips down); no elevator — entire surface moves; no trim tabs (whole stab repositioned for trim).", "~6–8 lb to break out of no-float lock; blown-out rudder may need \u003e250 lb pedal force to neutralize. Centering unit does NOT always keep rudder centered.", "GINA roll attitude, right aileron position, flaps lever, yaw-rate gyro, SADS IAS, pilot rudder-trim inputs → commands to YDA for yaw damping, ARI, rudder trim."], "ans": 1, "expl": "~30.1° sweep, 10° anhedral (tips down); no elevator — entire surface moves; no trim tabs (whole stab repositioned for trim)."}, {"q": "Which trim works after generator failure?", "opts": ["Yes — available in the aft cockpit only.", "Yes — fully available with no limitations.", "Yes — after selecting GAIN ORIDE.", "Normal (main) stab trim on ESS bus — only trim available after GEN fail. Standby stab, aileron, and rudder trim are GEN-bus."], "ans": 3, "expl": "Normal (main) stab trim on ESS bus — only trim available after GEN fail. Standby stab, aileron, and rudder trim are GEN-bus."}, {"q": "Rudder no-float breakout and blow-out forces?", "opts": ["GINA roll attitude, right aileron position, flaps lever, yaw-rate gyro, SADS IAS, pilot rudder-trim inputs → commands to YDA for yaw damping, ARI, rudder trim.", "~6–8 lb to break out of no-float lock; blown-out rudder may need \u003e250 lb pedal force to neutralize. Centering unit does NOT always keep rudder centered.", "Repositions stabilator (stick does NOT move) to counter SB pitch. With C AUG/SBI inop, avoid close/parade formation SB use esp. 220–300 KIAS; expect up to ±2° pitch.", "With HYD2 at 0 psi and HYD1 above ~1500 psi, uncommanded left lateral stick/aileron = port aileron actuator failure. Recentering after HYD2 reset is NOT proof it is fixed."], "ans": 1, "expl": "~6–8 lb to break out of no-float lock; blown-out rudder may need \u003e250 lb pedal force to neutralize. Centering unit does NOT always keep rudder centered."}, {"q": "Stall warning trigger?", "opts": ["Full aileron deflection → uncommanded/uncontrollable roll. Eject without delay if aircraft becomes uncontrollable.", "HYD1: aileron, stabilator, flaps, speed brakes. HYD2: aileron and stabilator only (dedicated to flight controls).", "Increases aileron deflection and reduces max lateral stick displacement. Gear up ±12.5° aileron; gear down ±15.5°.", "Rudder pedal shaker (fwd left pedal) + aural tone at **21.5 units** AOA (clean and landing configs per lecture)."], "ans": 3, "expl": "Rudder pedal shaker (fwd left pedal) + aural tone at **21.5 units** AOA (clean and landing configs per lecture)."}, {"q": "Flaps half lock / blowback?", "opts": ["Held up/down by HYD pressure; hydraulically locked at ½. Flaps will **not** blow back if oversped.", "Full aileron deflection → uncommanded/uncontrollable roll. Eject without delay if aircraft becomes uncontrollable.", "Rudder pedal shaker (fwd left pedal) + aural tone at **21.5 units** AOA (clean and landing configs per lecture).", "HYD1: aileron, stabilator, flaps, speed brakes. HYD2: aileron and stabilator only (dedicated to flight controls)."], "ans": 0, "expl": "Held up/down by HYD pressure; hydraulically locked at ½. Flaps will **not** blow back if oversped."}, {"q": "Slats inhibit / SADS?", "opts": ["~6–8 lb to break out of no-float lock; blown-out rudder may need \u003e250 lb pedal force to neutralize. Centering unit does NOT always keep rudder centered.", "GINA roll attitude, right aileron position, flaps lever, yaw-rate gyro, SADS IAS, pilot rudder-trim inputs → commands to YDA for yaw damping, ARI, rudder trim.", "~30.1° sweep, 10° anhedral (tips down); no elevator — entire surface moves; no trim tabs (whole stab repositioned for trim).", "Will not extend above 217 KIAS; SADS/ADC provides 217 signal. Loss of SADS → loss of slats. No slats with emerg flaps or HYD1 fail."], "ans": 3, "expl": "Will not extend above 217 KIAS; SADS/ADC provides 217 signal. Loss of SADS → loss of slats. No slats with emerg flaps or HYD1 fail."}, {"q": "Speed brake extend / blowback speeds?", "opts": ["Full aileron deflection → uncommanded/uncontrollable roll. Eject without delay if aircraft becomes uncontrollable.", "May not fully extend above 340 KIAS; begin blowback ~380 KIAS; fully extend below 340. No emergency SB extend/retract.", "Port aileron TEU full → uncommanded **left** roll. Starboard actuator fail with only HYD2 → uncommanded **right** roll.", "Increases aileron deflection and reduces max lateral stick displacement. Gear up ±12.5° aileron; gear down ±15.5°."], "ans": 1, "expl": "May not fully extend above 340 KIAS; begin blowback ~380 KIAS; fully extend below 340. No emergency SB extend/retract."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= QUESTIONS.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
