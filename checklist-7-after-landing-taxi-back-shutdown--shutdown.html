<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Checklist 7. After Landing, Taxi Back &amp; Shutdown — T-45 Quiz</title>
<script src="auth.js"></script>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt span + span, #q-text { white-space: pre-line; }
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">Home</a> · <a href="section-cl.html">CL</a> · Checklist / Comm Flow</div>
    <h1>Checklist 7. After Landing, Taxi Back &amp; Shutdown</h1>
    <div class="meta">25 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 25</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Checklist / Comm Flow</div>
    <h2 style="margin:0.2rem 0">Checklist 7. After Landing, Taxi Back &amp; Shutdown</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-cl.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to CL</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="section-cl.html">← CL</a> · <a href="index.html">Home</a></div>
</div>
<script>
const QUESTIONS = [{"q": "Do not change configuration until:", "opts": ["you stop on the taxiway", "clear of runway and across the hold short", "Ground clears you", "you reach the line"], "ans": 1, "expl": "Doc (Checklist walkthrough): Rolling off runway, put flaps up and retract speed brakes. Do not change configuration until clear of runway and across the hold short."}, {"q": "After Landing safing calls:", "opts": ["“Seats safe” R/C: “Clear”", "“Safe in Back” → “Ready to safe in front”", "“Ready to safe in front” R/C: “Safe in Back” “Safe in Front”", "“Safe in Front” R/C: “Safe in Back”"], "ans": 2, "expl": "Doc (Checklist walkthrough): 1. “Ready to safe in front” R/C: “Safe in Back” “Safe in Front”"}, {"q": "After Landing Checklist lights setting:", "opts": ["Middle x6", "Down, Down, Down, Middle, Middle, Middle; Pinky Switch - Middle (Off)", "Up, Up, Up, Middle, Middle, Middle", "All Off; Pinky Switch - Forward"], "ans": 1, "expl": "Doc (Checklist walkthrough): 8. Lights - Down, Down, Down, Middle, Middle, Middle Pinky Switch - Middle (Off)"}, {"q": "After Landing Checklist final three items:", "opts": ["IFF - Off, TACAN - Off, NAV - Off", "TACAN, NAV, Radios - Off", "IFF - Standby, TACAN - Off, NAV - Off", "HUD - Off, Pitot Heat - Off, Lights"], "ans": 0, "expl": "Doc (Checklist walkthrough): 9. IFF - Off 10. TACAN - Off 11. NAV - Off"}, {"q": "After Landing item 5:", "opts": ["Pitot Heat - Off", "Trim - Zero", "Obogs Flow Selector - Off, Mask off", "HUD - Off"], "ans": 2, "expl": "Doc (Checklist walkthrough): 4. Trim - Zero 5. Obogs Flow Selector - Off, Mask off 6. HUD - Off 7. Pitot Heat - Off"}, {"q": "Base call while pulling off the runway (Ch 1 Aux):", "opts": ["“Base, Blazer 201 full stop”", "“Base, 01 on deck”", "“Base, 01 taxi”", "“Strike, 01 in chocks”"], "ans": 1, "expl": "Doc (Checklist walkthrough): Ch 1 Aux: “Base, 01 on deck” ... “01, welcome back”"}, {"q": "Base response to “on deck”:", "opts": ["“01, taxi to the line”", "“01, roger, hot pits”", "“01, welcome back”", "“01, have a good flight”"], "ans": 2, "expl": "Doc (Checklist walkthrough): “01, welcome back”"}, {"q": "Ground call after landing (Ch 2 Pri):", "opts": ["“Kingsville Ground, Blazer 201, clear of the active on hotel, taxi to my line”", "“Kingsville Ground, Blazer 201, taxi with alpha”", "“Kingsville Ground, Blazer 201, full stop, taxi to the line”", "“Kingsville Ground, Blazer 201, request taxi to pits”"], "ans": 0, "expl": "Doc (Checklist walkthrough): Ch 2 Pri: “Kingsville Ground, Blazer 201, clear of the active on hotel, taxi to my line”"}, {"q": "Ground’s taxi-back instruction:", "opts": ["“taxi via hotel, hold short 35 left”", "“taxi via delta hotel, cross 13 left”", "“taxi via bravo alpha”", "“Blazer 201, taxi via hotel delta, cross 35 left and right”"], "ans": 3, "expl": "Doc (Checklist walkthrough): “Blazer 201, taxi via hotel delta, cross 35 left and right” / “Taxi via hotel delta, cross 35 left and right, Blazer 201”"}, {"q": "Before Engine Shutdown: idle RPM check:", "opts": ["56.5+/-5%", "45%", "52+/-2%", "56.5+/-2%"], "ans": 3, "expl": "Doc (Checklist walkthrough): 6. Idle RPM - Check ... verify RPM is 56.5+/-2%."}, {"q": "Before Engine Shutdown call after MAINT BIT:", "opts": ["“Good tone, Good BIT”", "“Ready to safe in front”", "“No Exceedances, No Overflows”", "“No Exceedances, No Overflows, 4 SATS”"], "ans": 2, "expl": "Doc (Checklist walkthrough): 5. “No Exceedances, No Overflows”"}, {"q": "Standby Attitude Indicator before shutdown:", "opts": ["Uncaged", "Erect", "Cage (Off flag visible)", "Off flag hidden"], "ans": 2, "expl": "Doc (Checklist walkthrough): 7. Standby Attitude Indicator - Cage (Off flag visible)"}, {"q": "Engine must be stabilized at idle for at least ___ prior to shutdown:", "opts": ["15 seconds", "60 seconds", "30 seconds", "45 seconds"], "ans": 2, "expl": "Doc (Checklist walkthrough): Except in an emergency, engine shall be stabilized at idle for at least 30 seconds prior to shutdown."}, {"q": "Shutdown call / response:", "opts": ["“Canopy” R/C: “Rail Clear”", "“Throttle Off, Canopy” R/C: “Clear”", "“Throttle off, GTS” R/C: “Clear”", "“Wipeout” R/C: “Wipeout”"], "ans": 1, "expl": "Doc (Checklist walkthrough): Turn OBOGS/Anti-G off. “Throttle Off, Canopy” R/C: “Clear”"}, {"q": "Physically move throttle off only when:", "opts": ["lineman gives you the cut signal", "Ground approves", "GINA is off", "30 seconds after landing"], "ans": 0, "expl": "Doc (Checklist walkthrough): 3. Throttle - Off (only physically do this once lineman gives you the cut signal)"}, {"q": "GINA - Off no sooner than:", "opts": ["30 sec after setting parking brake", "45 sec after throttle off", "60 sec after parking brake", "immediately"], "ans": 0, "expl": "Doc (Checklist walkthrough): 4. No sooner than 30 sec after setting parking brake: GINA - Off"}, {"q": "Fuel Shutoff Handle - Pull no sooner than:", "opts": ["15 sec after throttle off", "45 sec after moving throttle to off", "60 sec after throttle off", "30 sec after parking brake"], "ans": 1, "expl": "Doc (Checklist walkthrough): 6. No sooner than 45 sec after moving throttle to off: Fuel Shutoff Handle - Pull"}, {"q": "Gouge: RPM decayed to about ___ ≈ 45 seconds:", "opts": ["3%", "7%", "20%", "13%"], "ans": 1, "expl": "Doc (Checklist walkthrough): Good gouge I heard is that when rpm has decayed to about 7% that is about 45 seconds."}, {"q": "Brake Pressure Accumulator minimum at shutdown:", "opts": ["1250 psi", "3000 psi", "2700 psi", "2000 psi"], "ans": 2, "expl": "Doc (Checklist walkthrough): 10. Brake Pressure Accumulator - Should be indicating 2700 psi minimum"}, {"q": "PCU check: cycle the stick laterally:", "opts": ["full deflection until HYD2 reaches 0", "half-deflection about neutral at one cycle every two seconds until HYD1 reaches 0 psi", "fore and aft until HYD1 depleted", "half-deflection until HYD2 is depleted"], "ans": 1, "expl": "Doc (Checklist walkthrough): Cycle half-deflection laterally about neutral at one cycle every two seconds, then let go when hyd1 reaches 0 psi. ... This check is done once HYD1 is depleted NOT HYD2."}, {"q": "If the stick stays to one side after HYD1 is depleted:", "opts": ["center it manually", "HYD2 failure", "there is an actuator failure and the a/c is down (tell maintenance)", "normal, re-cycle"], "ans": 2, "expl": "Doc (Checklist walkthrough): If it remains to one side or the other, there is an actuator failure and the a/c is down (tell maintenance)."}, {"q": "Per the Doc, Engine Shutdown order after Fuel Shutoff Handle - Pull (CNATRA video puts Engine Switch OFF before Fuel Shutoff PULL):", "opts": ["Pinky Switch, Engine Switch, Contr Aug", "Engine Switch - Off, Contr Aug - SBI, Pinky Switch - Off", "Contr Aug - SBI, Engine Switch - Off, Batt - Off", "Batt Switches - Off, Engine Switch - Off"], "ans": 1, "expl": "Doc (Checklist walkthrough): 6. Fuel Shutoff Handle - Pull 7. Engine Switch - Off 8. Contr Aug - SBI 9. Pinky Switch - Off (Middle Position)"}, {"q": "Wipeout before PCU check: you yell / lineman responds:", "opts": ["“clear” / “wipeout”", "“wipeout” / “clear”", "“PCU” / “clear”", "“wipeout” / “wipeout”"], "ans": 3, "expl": "Doc (Checklist walkthrough): 11. Give lineman wipeout signal and yell wipeout. They will respond by yelling wipeout."}, {"q": "Last two shutdown items:", "opts": ["Canopy - Open, Seat - Safe", "Engine Switch - Off, Batt - Off", "Seat/MDC - Pinned, Batt Switches - Off", "Batt Switches - Off, Seat/MDC - Pinned"], "ans": 3, "expl": "Doc (Checklist walkthrough): 13. Batt Switches - Off 14. Seat/MDC - Pinned (Do this before getting out of the jet)"}, {"q": "Last thing you look for before walking away:", "opts": ["batteries off", "map case empty", "that the seat is safed", "fuel shutoff handle up"], "ans": 2, "expl": "Doc (Checklist walkthrough): Last thing you look for before walking away is that the seat is safed."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= queue.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
</html>
