<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CO3201 (1) Normal Turns &amp; Turn Pattern — T-45 Quiz</title>
<script src="auth.js"></script>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt span + span, #q-text { white-space: pre-line; }
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">Home</a> · <a href="section-co3201.html">CO3201</a> · CO3201 Instrument Procedures</div>
    <h1>CO3201 (1) Normal Turns &amp; Turn Pattern</h1>
    <div class="meta">24 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 24</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">CO3201 Instrument Procedures</div>
    <h2 style="margin:0.2rem 0">CO3201 (1) Normal Turns &amp; Turn Pattern</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-co3201.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to CO3201</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="section-co3201.html">← CO3201</a> · <a href="index.html">Home</a></div>
</div>
<script>
const QUESTIONS = [{"q": "For a heading change of less than 30 degrees, what bank angle is used?", "opts": ["30 degrees AOB", "10% of the heading change", "A bank angle that equals the heading change", "Half the heading change"], "ans": 2, "expl": "Correct: A bank angle that equals the heading change · Source: \"For turns of less than 30 degrees of heading change, use a bank angle that equals that change.\""}, {"q": "A heading change from 020 to 045 degrees is required. What bank angle?", "opts": ["45 degrees", "25 degrees", "20 degrees", "30 degrees"], "ans": 1, "expl": "Correct: 25 degrees · Source: \"For example, if a heading change from 020 degrees to 045 degrees were required (a 25-degree change), you would use a bank angle of 25 degrees.\""}, {"q": "If the heading change is 30 degrees or greater, what bank angle is used?", "opts": ["30 degrees", "45 degrees", "Equal to the heading change", "25 degrees"], "ans": 0, "expl": "Correct: 30 degrees · Source: \"If the heading change is 30 degrees or greater, use a bank angle of 30 degrees.\""}, {"q": "Prior to entering a normal turn you should be:", "opts": ["In a slight climb with nose-up trim", "Slightly nose low with power reduced", "In straight-and-level flight with trim properly set", "At MRT with speed brakes in"], "ans": 2, "expl": "Correct: In straight-and-level flight with trim properly set · Source: \"Prior to entering the turn, you should be in straight-and-level flight with trim properly set.\""}, {"q": "As you roll into the turn you lose some vertical component of lift, so you must:", "opts": ["Extend the speed brakes", "Add forward stick and reduce power", "Reduce power and lower the nose", "Add power and aft stick (trim) to compensate"], "ans": 3, "expl": "Correct: Add power and aft stick (trim) to compensate · Source: \"As you roll into the turn, you will lose some of the vertical component of lift, so you'll have to add power and aft stick (trim) to compensate.\""}, {"q": "What lead point is used for initiating the roll-out?", "opts": ["Approximately 10% of the angle of bank", "5 degrees regardless of bank", "Approximately 1% of ground speed", "Approximately 10% of VSI"], "ans": 0, "expl": "Correct: Approximately 10% of the angle of bank · Source: \"Use a lead point of approximately 10% of the angle of bank for initiating your roll-out.\""}, {"q": "As you roll out of the turn the aircraft has a tendency to:", "opts": ["Descend, because vertical lift decreases", "Climb, because the vertical component of lift increases", "Yaw toward the turn", "Slow down"], "ans": 1, "expl": "Correct: Climb, because the vertical component of lift increases · Source: \"As you roll out of the turn, the vertical component of lift will increase and the aircraft will have a tendency to climb.\""}, {"q": "To counteract the climb tendency on roll-out you:", "opts": ["Lower the nose to level flight reference and reduce power to the pre-turn setting", "Extend speed brakes", "Raise the nose and add power", "Hold the turn trim and reduce power to idle"], "ans": 0, "expl": "Correct: Lower the nose to level flight reference and reduce power to the pre-turn setting · Source: \"To counteract this, lower the nose attitude back to level flight reference and reduce power to the pre-turn setting.\""}, {"q": "Any aft stick or trim added during the turn must:", "opts": ["Be left in for level flight", "Come out when the turn is complete", "Be held for the next turn", "Be doubled on roll-out"], "ans": 1, "expl": "Correct: Come out when the turn is complete · Source: \"Any aft stick or trim added during the turn will have to come out when the turn is complete.\""}, {"q": "Normal turns summary — Throttle:", "opts": ["Increase as needed to maintain airspeed", "Reduce as needed to maintain altitude", "Set MRT", "No change"], "ans": 0, "expl": "Correct: Increase as needed to maintain airspeed · Source: \"Throttle: Increase as needed to maintain airspeed\""}, {"q": "Normal turns summary — Pitch:", "opts": ["As required to maintain level flight", "Hold the pre-turn attitude exactly", "Approximately 10 degrees nose down", "2-3 degrees above level flight attitude"], "ans": 0, "expl": "Correct: As required to maintain level flight · Source: \"Pitch: As required to maintain level flight\""}, {"q": "Normal turns summary — Lead point for roll-out:", "opts": ["20% AOB", "1% ground speed", "5 kts", "10% AOB"], "ans": 3, "expl": "Correct: 10% AOB · Source: \"Lead point for roll-out: 10% AOB\""}, {"q": "Using the 10% AOB lead, roll-out from a 30-degree AOB turn begins about how many degrees before the desired heading?", "opts": ["10 degrees", "30 degrees", "3 degrees", "1 degree"], "ans": 2, "expl": "Correct: 3 degrees · Source: \"Use a lead point of approximately 10% of the angle of bank for initiating your roll-out.\""}, {"q": "The turn pattern consists of:", "opts": ["Three turns in the same direction", "Two pairs of left and right turns", "Three pairs of left and right turns", "Four pairs of turns"], "ans": 2, "expl": "Correct: Three pairs of left and right turns · Source: \"Consisting of three pairs of left and right turns, the turn pattern gives you practice in smoothly performing a series of linked turns at a constant altitude and airspeed.\""}, {"q": "Turn pattern, first set: 30-degree AOB turns for how much heading change each?", "opts": ["45 degrees", "60 degrees", "30 degrees", "90 degrees"], "ans": 1, "expl": "Correct: 60 degrees · Source: \"The turn consists of two 30-degree angle of bank turns for 60 degrees of heading change each, two 45-degree AOB turns for 90 degrees of heading change each, and two 60-degree AOB turns for 120 degrees of heading change each.\""}, {"q": "Turn pattern, second set: 45-degree AOB turns for how much heading change each?", "opts": ["60 degrees", "45 degrees", "120 degrees", "90 degrees"], "ans": 3, "expl": "Correct: 90 degrees · Source: \"The turn consists of two 30-degree angle of bank turns for 60 degrees of heading change each, two 45-degree AOB turns for 90 degrees of heading change each, and two 60-degree AOB turns for 120 degrees of heading change each.\""}, {"q": "Turn pattern, third set: 60-degree AOB turns for how much heading change each?", "opts": ["60 degrees", "120 degrees", "180 degrees", "90 degrees"], "ans": 1, "expl": "Correct: 120 degrees · Source: \"The turn consists of two 30-degree angle of bank turns for 60 degrees of heading change each, two 45-degree AOB turns for 90 degrees of heading change each, and two 60-degree AOB turns for 120 degrees of heading change each.\""}, {"q": "Which correctly lists the turn pattern sets (AOB / heading change)?", "opts": ["30/60, 45/90, 60/120", "20/45, 30/90, 45/120", "30/60, 45/120, 60/90", "30/90, 45/60, 60/120"], "ans": 0, "expl": "Correct: 30/60, 45/90, 60/120 · Source: \"The turn consists of two 30-degree angle of bank turns for 60 degrees of heading change each, two 45-degree AOB turns for 90 degrees of heading change each, and two 60-degree AOB turns for 120 degrees of heading change each.\""}, {"q": "How do you set 45 degrees of bank on the ADI?", "opts": ["Place the pointer one third of the way past 30", "Use the HUD pitch ladder only", "Place the bank angle pointer halfway between the 30- and 60-degree scale markers", "Use the 45-degree scale marker"], "ans": 2, "expl": "Correct: Place the bank angle pointer halfway between the 30- and 60-degree scale markers · Source: \"Since there are no 45-degree bank angle scale markers on the ADI display, you must place the bank angle pointer halfway between the 30-degree and 60-degree bank angle scale markers.\""}, {"q": "Turn reversals in the turn pattern are executed:", "opts": ["After a full stop on original heading for 1 minute", "With a 10-second wings-level pause", "Smoothly, with no straight-and-level legs", "With a 5-second straight-and-level leg"], "ans": 2, "expl": "Correct: Smoothly, with no straight-and-level legs · Source: \"Execute the turn reversals smoothly, with no straight-and-level legs.\""}, {"q": "At the end of the turn pattern you:", "opts": ["Recover 120 degrees off original heading", "Recover on the reciprocal heading", "Climb to the next altitude", "Recover wings level on original heading"], "ans": 3, "expl": "Correct: Recover wings level on original heading · Source: \"At the end of the maneuver, recover wings level on original heading.\""}, {"q": "Airspeed maintained throughout the turn pattern:", "opts": ["250 KIAS", "150 KIAS", "200 KIAS", "300 KIAS"], "ans": 0, "expl": "Correct: 250 KIAS · Source: \"Throughout the maneuver, maintain altitude and 250 KIAS, adding more aft stick and more power for each set of turns.\""}, {"q": "For each successive set of turns in the turn pattern you add:", "opts": ["More forward stick", "More aft stick and more power", "Less power and more aft stick", "Speed brakes"], "ans": 1, "expl": "Correct: More aft stick and more power · Source: \"Throughout the maneuver, maintain altitude and 250 KIAS, adding more aft stick and more power for each set of turns.\""}, {"q": "When reversing turns, to avoid gaining altitude you:", "opts": ["Add power as you apply reverse aileron", "Pull more back stick through the reversal", "Extend the speed brakes", "Ease the back stick as you apply reverse aileron"], "ans": 3, "expl": "Correct: Ease the back stick as you apply reverse aileron · Source: \"When reversing turns, ease the back stick as you apply reverse aileron in order to avoid gaining altitude.\""}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= queue.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
</html>
