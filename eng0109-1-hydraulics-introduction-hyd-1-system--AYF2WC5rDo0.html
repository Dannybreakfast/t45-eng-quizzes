<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ENG0109 (1) Hydraulics Introduction &amp; Hyd 1 System — T-45 Quiz</title>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">Home</a> · <a href="section-eng.html">ENG</a> · Hydraulic</div>
    <h1>ENG0109 (1) Hydraulics Introduction &amp; Hyd 1 System</h1>
    <div class="meta">24 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 24</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Hydraulic</div>
    <h2 style="margin:0.2rem 0">ENG0109 (1) Hydraulics Introduction &amp; Hyd 1 System</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-eng.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to ENG</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="section-eng.html">← ENG</a> · <a href="index.html">Home</a></div>
</div>
<script>
const QUESTIONS = [{"q": "HYD 1 EDP normal operating pressure is:", "opts": ["1500 psi", "2000 psi", "3000 psi", "3600 psi"], "ans": 2, "expl": "Constant-pressure variable-displacement pump maintains 3000 psi (9.6 gpm). 3600 is the relief setting."}, {"q": "The priority valve isolates General Services when HYD 1 falls below:", "opts": ["1100 ± 50 psi", "1500 ± 100 psi", "1660 ± 110 psi", "2000 psi"], "ans": 1, "expl": "Below 1500 ± 100 psi the priority valve closes to protect flight controls."}, {"q": "HYD caution light illuminates when system pressure falls below:", "opts": ["1500 ± 100 psi", "1660 ± 110 psi", "2000 psi", "2200 psi"], "ans": 1, "expl": "HYD caution at 1660 ± 110; clears above 2000 psi."}, {"q": "Brake/emergency flap accumulator nitrogen precharge on preflight should be:", "opts": ["1100 ± 50 psi", "1300 ± 50 psi", "1500 ± 100 psi", "3000 psi"], "ans": 1, "expl": "1300 ± 50 prestart; reads ~3000 once HYD 1 is powered."}, {"q": "Which statement about the rudder is correct?", "opts": ["Powered by HYD 1 only", "Powered by HYD 2 only", "Powered by tandem PCUs", "Mechanically controlled"], "ans": 3, "expl": "Lecture notes rudder control is mechanical."}, {"q": "How many independent hydraulic systems does the T-45C have?", "opts": ["Two: HYD 101 and HYD 2.", "Two: HYD 1 and HYD 2.", "Two: HYD 11 and HYD 2.", "Two: HYD 2 and HYD 2."], "ans": 1, "expl": "Two: HYD 1 and HYD 2."}, {"q": "Relative size of HYD 1 vs HYD 2?", "opts": ["HYD 11 is about three times the size of HYD 2.", "HYD 1 is about three times the size of HYD 2.", "HYD 101 is about three times the size of HYD 2.", "HYD 2 is about three times the size of HYD 2."], "ans": 1, "expl": "HYD 1 is about three times the size of HYD 2."}, {"q": "What does HYD 1 power?", "opts": ["Flight controls (forward side of tandem PCUs for ailerons/stabilator) and General Services.", "Backup power for primary flight controls during high demand and dampen pressure fluctuations.", "Up to ~2800 psi to recharge brake/flap accumulator for maintenance/tow without engine or GSE.", "Aft starboard accessory gearbox; 3000 psi, ~9.6 gpm variable displacement; relief at 3600 psi."], "ans": 0, "expl": "Flight controls (forward side of tandem PCUs for ailerons/stabilator) and General Services."}, {"q": "Is the rudder hydraulically powered?", "opts": ["Yes — available in the aft cockpit only.", "Yes — fully available with no limitations.", "No — rudder control is mechanical.", "Yes — after selecting GAIN ORIDE."], "ans": 2, "expl": "No — rudder control is mechanical."}, {"q": "HYD 1 total fluid capacity?", "opts": ["Approximately 13.3 gallons.", "Approximately 6.6 gallons.", "Approximately 1.6 gallons.", "Approximately 3.3 gallons."], "ans": 3, "expl": "Approximately 3.3 gallons."}, {"q": "Where is the HYD 1 reservoir?", "opts": ["Prevent EDP cavitation and keep pressure on seals to reduce leaks when system is not operating.", "How’s Life Been Navy? So Far So Good — Hook, Launch bar, Brakes, NWS, Slats, Flaps, Speedbrakes, Gear.", "In the RAT bay atop the fuselage, forward of the tail; inspected via external gauge on starboard side.", "Aft starboard accessory gearbox; 3000 psi, ~9.6 gpm variable displacement; relief at 3600 psi."], "ans": 2, "expl": "In the RAT bay atop the fuselage, forward of the tail; inspected via external gauge on starboard side."}, {"q": "Purpose of nitrogen precharge in the reservoir?", "opts": ["Aft starboard accessory gearbox; 3000 psi, ~9.6 gpm variable displacement; relief at 3600 psi.", "Prevent EDP cavitation and keep pressure on seals to reduce leaks when system is not operating.", "Up to ~2800 psi to recharge brake/flap accumulator for maintenance/tow without engine or GSE.", "Backup power for primary flight controls during high demand and dampen pressure fluctuations."], "ans": 1, "expl": "Prevent EDP cavitation and keep pressure on seals to reduce leaks when system is not operating."}, {"q": "HYD 1 EDP location and output?", "opts": ["Backup power for primary flight controls during high demand and dampen pressure fluctuations.", "Prevent EDP cavitation and keep pressure on seals to reduce leaks when system is not operating.", "Up to ~2800 psi to recharge brake/flap accumulator for maintenance/tow without engine or GSE.", "Aft starboard accessory gearbox; 3000 psi, ~9.6 gpm variable displacement; relief at 3600 psi."], "ans": 3, "expl": "Aft starboard accessory gearbox; 3000 psi, ~9.6 gpm variable displacement; relief at 3600 psi."}, {"q": "HYD 1 vs HYD 2 pump locations on gearbox?", "opts": ["HYD 1 pump starboard aft; HYD 2 pump port forward.", "HYD 2 pump starboard aft; HYD 2 pump port forward.", "HYD 11 pump starboard aft; HYD 2 pump port forward.", "HYD 101 pump starboard aft; HYD 2 pump port forward."], "ans": 0, "expl": "HYD 1 pump starboard aft; HYD 2 pump port forward."}, {"q": "Flight control accumulator precharge (HYD 1)?", "opts": ["1110 ± 50 psi nitrogen.", "1100 ± 50 psi nitrogen.", "2200 ± 50 psi nitrogen.", "550 ± 50 psi nitrogen."], "ans": 1, "expl": "1100 ± 50 psi nitrogen."}, {"q": "Purpose of the flight control accumulator?", "opts": ["Up to ~2800 psi to recharge brake/flap accumulator for maintenance/tow without engine or GSE.", "Aft starboard accessory gearbox; 3000 psi, ~9.6 gpm variable displacement; relief at 3600 psi.", "Backup power for primary flight controls during high demand and dampen pressure fluctuations.", "Flight controls (forward side of tandem PCUs for ailerons/stabilator) and General Services."], "ans": 2, "expl": "Backup power for primary flight controls during high demand and dampen pressure fluctuations."}, {"q": "Brake/emergency flap accumulator precharge?", "opts": ["1300 ± 50 psi nitrogen (prestart).", "650 ± 50 psi nitrogen (prestart).", "1310 ± 50 psi nitrogen (prestart).", "2600 ± 50 psi nitrogen (prestart)."], "ans": 0, "expl": "1300 ± 50 psi nitrogen (prestart)."}, {"q": "How many brake apps after emergency flap extension (accumulator)?", "opts": ["At least 110 brake applications.", "At least 5 brake applications.", "At least 10 brake applications.", "At least 20 brake applications."], "ans": 2, "expl": "At least 10 brake applications."}, {"q": "Priority valve closes General Services below what pressure?", "opts": ["1510 ± 100 psi.", "1500 ± 100 psi.", "3000 ± 100 psi.", "750 ± 100 psi."], "ans": 1, "expl": "1500 ± 100 psi."}, {"q": "When does the HYD caution illuminate / extinguish?", "opts": ["Illuminates below 830 ± 110 psi; extinguishes above 2000 psi.", "Illuminates below 1660 ± 110 psi; extinguishes above 2000 psi.", "Illuminates below 1670 ± 110 psi; extinguishes above 2000 psi.", "Illuminates below 3320 ± 110 psi; extinguishes above 2000 psi."], "ans": 1, "expl": "Illuminates below 1660 ± 110 psi; extinguishes above 2000 psi."}, {"q": "Emergency flap disabled below what accumulator pressure?", "opts": ["1100 psi in the emergency brake/flap accumulator.", "2210 psi in the emergency brake/flap accumulator.", "4400 psi in the emergency brake/flap accumulator.", "2200 psi in the emergency brake/flap accumulator."], "ans": 3, "expl": "2200 psi in the emergency brake/flap accumulator."}, {"q": "Hand pump max pressure / purpose?", "opts": ["Flight controls (forward side of tandem PCUs for ailerons/stabilator) and General Services.", "Aft starboard accessory gearbox; 3000 psi, ~9.6 gpm variable displacement; relief at 3600 psi.", "Up to ~2800 psi to recharge brake/flap accumulator for maintenance/tow without engine or GSE.", "Backup power for primary flight controls during high demand and dampen pressure fluctuations."], "ans": 2, "expl": "Up to ~2800 psi to recharge brake/flap accumulator for maintenance/tow without engine or GSE."}, {"q": "General Services mnemonic?", "opts": ["Aft starboard accessory gearbox; 3000 psi, ~9.6 gpm variable displacement; relief at 3600 psi.", "In the RAT bay atop the fuselage, forward of the tail; inspected via external gauge on starboard side.", "How’s Life Been Navy? So Far So Good — Hook, Launch bar, Brakes, NWS, Slats, Flaps, Speedbrakes, Gear.", "Prevent EDP cavitation and keep pressure on seals to reduce leaks when system is not operating."], "ans": 2, "expl": "How’s Life Been Navy? So Far So Good — Hook, Launch bar, Brakes, NWS, Slats, Flaps, Speedbrakes, Gear."}, {"q": "Typical HYD 1 reservoir quantity on gauge?", "opts": ["About 260–300 cubic inches.", "About 270–300 cubic inches.", "About 520–300 cubic inches.", "About 130–300 cubic inches."], "ans": 0, "expl": "About 260–300 cubic inches."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= QUESTIONS.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
</html>
