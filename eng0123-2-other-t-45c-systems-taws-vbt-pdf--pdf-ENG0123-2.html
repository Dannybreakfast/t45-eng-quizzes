<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ENG0123 (2) Other T-45C Systems — TAWS VBT (PDF) — T-45 Quiz</title>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">Home</a> · <a href="section-eng.html">ENG</a> · Other Systems</div>
    <h1>ENG0123 (2) Other T-45C Systems — TAWS VBT (PDF)</h1>
    <div class="meta">24 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 24</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Other Systems</div>
    <h2 style="margin:0.2rem 0">ENG0123 (2) Other T-45C Systems — TAWS VBT (PDF)</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-eng.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to ENG</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="section-eng.html">← ENG</a> · <a href="index.html">Home</a></div>
</div>
<script>
const QUESTIONS = [{"q": "TAWS powers up:", "opts": ["Only when MFD TAWS is boxed", "With engine start (“Power, Power”); no aircrew controls", "On weight off wheels only", "When RALT is tested"], "ans": 1, "expl": "Engine start; “Power, Power”; no switches/PBs."}, {"q": "Minimum terrain clearance / warning floor:", "opts": ["Warn below 500 ft; clear 50 ft", "Warn if predicted below 100 ft AGL; trajectories ≥100 ft", "Warn below 200 ft only", "No numeric floor"], "ans": 1, "expl": "Predict \u003c100 ft AGL to warn; keep ≥100 ft."}, {"q": "Hard-landing ROD threshold:", "opts": ["\u003e500 FPM", "\u003e1000 FPM", "\u003e1398 FPM", "\u003e2500 FPM"], "ans": 2, "expl": "\u003e1398 FPM."}, {"q": "Landing-phase time gate since go-around/takeoff:", "opts": ["10 seconds", "30 seconds", "1 minute or more", "5 minutes"], "ans": 2, "expl": "≥1 minute."}, {"q": "Below Glideslope deviation trigger:", "opts": ["Any GS needle displacement", "More than 50% of maximum GS deviation", "Full-scale deflection only", "Localizer half-scale"], "ans": 1, "expl": "\u003e50% of max GS deviation."}, {"q": "TAWS data sources include all except:", "opts": ["SADS", "GINA", "RALT and DTED", "TACAN azimuth"], "ans": 3, "expl": "TACAN not a TAWS input."}, {"q": "What mishap type is TAWS primarily designed to minimize?", "opts": ["Controlled Flight into Terrain (CFIT), via predictive terrain protection plus RALT-based ground proximity warning.", "\u003c500 ft AGL, \u003c200 KIAS, ≥1 minute since go-around or takeoff; hard landing \u003e1398 FPM rate of descent.", "** \u003c500' / \u003c200 KIAS / **≥1 min** since G/A or T/O → hard-landing avoidance at **\u003e1398 FPM** ROD", "ILS approaches (Below Glideslope) and the final phase of a Precautionary Approach (Pull up ± Roll)."], "ans": 0, "expl": "Controlled Flight into Terrain (CFIT), via predictive terrain protection plus RALT-based ground proximity warning."}, {"q": "TAWS controls and power-up indication?", "opts": ["No controls (switches or MFD pushbuttons). Powers with engine start; aural “Power, Power” shortly after start.", "Yes — fully available with no limitations.", "Yes — available in the aft cockpit only.", "Yes — after selecting GAIN ORIDE."], "ans": 0, "expl": "No controls (switches or MFD pushbuttons). Powers with engine start; aural “Power, Power” shortly after start."}, {"q": "TAWS data inputs?", "opts": ["\u003c500 ft AGL, \u003c200 KIAS, ≥1 min since G/A or T/O, and landing gear not down and locked.", "** With engine start; aural **“Power, Power”**; **no** switches / MFD PBs", "SADS, GINA, RALT, and re-gridded Digital Terrain Elevation Data (terrain database).", "** **1.3 s**; warn only if predicted **\u003c100' AGL**; trajectories keep **≥100'** clearance"], "ans": 2, "expl": "SADS, GINA, RALT, and re-gridded Digital Terrain Elevation Data (terrain database)."}, {"q": "Recovery timing and terrain-clearance rules?", "opts": ["1.3-second response assumption; trajectories maintain ≥100 ft clearance; warnings only if predicted to pass below 100 ft AGL.", "An arrow indicating recovery direction (vertical or oblique) with an appropriate aural cue (e.g., Pull up / Roll left/right).", "** ILS **“Below Glideslope”** (halfway between upper GS needle limit and on-GS); PA final **“Pull up, Pull up”** ± **“Roll left/right”**", "Occurs prior to initial ILS GS intercept and if aircraft descends more than 50% of maximum GS deviation; only once unless the pilot corrects the initial cue."], "ans": 0, "expl": "1.3-second response assumption; trajectories maintain ≥100 ft clearance; warnings only if predicted to pass below 100 ft AGL."}, {"q": "Landing-phase entry conditions and hard-landing definition?", "opts": ["** \u003c500' / \u003c200 KIAS / **≥1 min** since G/A or T/O → hard-landing avoidance at **\u003e1398 FPM** ROD", "\u003c500 ft AGL, \u003c200 KIAS, ≥1 minute since go-around or takeoff; hard landing \u003e1398 FPM rate of descent.", "** **1.3 s**; warn only if predicted **\u003c100' AGL**; trajectories keep **≥100'** clearance", "ILS approaches (Below Glideslope) and the final phase of a Precautionary Approach (Pull up ± Roll)."], "ans": 1, "expl": "\u003c500 ft AGL, \u003c200 KIAS, ≥1 minute since go-around or takeoff; hard landing \u003e1398 FPM rate of descent."}, {"q": "“Check Gear” advisory conditions?", "opts": ["** \u003c500' / \u003c200 KIAS / **≥1 min** since G/A or T/O → hard-landing avoidance at **\u003e1398 FPM** ROD", "** **1.3 s**; warn only if predicted **\u003c100' AGL**; trajectories keep **≥100'** clearance", "SADS, GINA, RALT, and re-gridded Digital Terrain Elevation Data (terrain database).", "\u003c500 ft AGL, \u003c200 KIAS, ≥1 min since G/A or T/O, and landing gear not down and locked."], "ans": 3, "expl": "\u003c500 ft AGL, \u003c200 KIAS, ≥1 min since G/A or T/O, and landing gear not down and locked."}, {"q": "“Below Glideslope” advisory rules?", "opts": ["** ILS **“Below Glideslope”** (halfway between upper GS needle limit and on-GS); PA final **“Pull up, Pull up”** ± **“Roll left/right”**", "An arrow indicating recovery direction (vertical or oblique) with an appropriate aural cue (e.g., Pull up / Roll left/right).", "1.3-second response assumption; trajectories maintain ≥100 ft clearance; warnings only if predicted to pass below 100 ft AGL.", "Occurs prior to initial ILS GS intercept and if aircraft descends more than 50% of maximum GS deviation; only once unless the pilot corrects the initial cue."], "ans": 3, "expl": "Occurs prior to initial ILS GS intercept and if aircraft descends more than 50% of maximum GS deviation; only once unless the pilot corrects the initial cue."}, {"q": "What do HUD/ADI recovery cues look like?", "opts": ["Occurs prior to initial ILS GS intercept and if aircraft descends more than 50% of maximum GS deviation; only once unless the pilot corrects the initial cue.", "** ILS **“Below Glideslope”** (halfway between upper GS needle limit and on-GS); PA final **“Pull up, Pull up”** ± **“Roll left/right”**", "An arrow indicating recovery direction (vertical or oblique) with an appropriate aural cue (e.g., Pull up / Roll left/right).", "1.3-second response assumption; trajectories maintain ≥100 ft clearance; warnings only if predicted to pass below 100 ft AGL."], "ans": 2, "expl": "An arrow indicating recovery direction (vertical or oblique) with an appropriate aural cue (e.g., Pull up / Roll left/right)."}, {"q": "During normal ops, when will crews typically hear TAWS?", "opts": ["\u003c500 ft AGL, \u003c200 KIAS, ≥1 minute since go-around or takeoff; hard landing \u003e1398 FPM rate of descent.", "** \u003c500' / \u003c200 KIAS / **≥1 min** since G/A or T/O → hard-landing avoidance at **\u003e1398 FPM** ROD", "ILS approaches (Below Glideslope) and the final phase of a Precautionary Approach (Pull up ± Roll).", "** **1.3 s**; warn only if predicted **\u003c100' AGL**; trajectories keep **≥100'** clearance"], "ans": 2, "expl": "ILS approaches (Below Glideslope) and the final phase of a Precautionary Approach (Pull up ± Roll)."}, {"q": "Does TAWS remove aircrew CFIT responsibility?", "opts": ["No — safety/survival aid only; does not abrogate staying ahead of the aircraft.", "Yes — after selecting GAIN ORIDE.", "Yes — fully available with no limitations.", "Yes — available in the aft cockpit only."], "ans": 0, "expl": "No — safety/survival aid only; does not abrogate staying ahead of the aircraft."}, {"q": "What is correct for: Power-up?", "opts": ["SADS, GINA, RALT, and re-gridded Digital Terrain Elevation Data (terrain database).", "** **1.3 s**; warn only if predicted **\u003c100' AGL**; trajectories keep **≥100'** clearance", "** With engine start; aural **“Power, Power”**; **no** switches / MFD PBs", "\u003c500 ft AGL, \u003c200 KIAS, ≥1 min since G/A or T/O, and landing gear not down and locked."], "ans": 2, "expl": "** With engine start; aural **“Power, Power”**; **no** switches / MFD PBs"}, {"q": "What is correct for: Typical cues?", "opts": ["** ILS **“Below Glideslope”** (halfway between upper GS needle limit and on-GS); PA final **“Pull up, Pull up”** ± **“Roll left/right”**", "1.3-second response assumption; trajectories maintain ≥100 ft clearance; warnings only if predicted to pass below 100 ft AGL.", "Occurs prior to initial ILS GS intercept and if aircraft descends more than 50% of maximum GS deviation; only once unless the pilot corrects the initial cue.", "An arrow indicating recovery direction (vertical or oblique) with an appropriate aural cue (e.g., Pull up / Roll left/right)."], "ans": 0, "expl": "** ILS **“Below Glideslope”** (halfway between upper GS needle limit and on-GS); PA final **“Pull up, Pull up”** ± **“Roll left/right”**"}, {"q": "What is correct for: Inputs?", "opts": ["** SADS, GINA, RALT, re-gridded DTED", "More than 50% of maximum GS deviation", "TACAN azimuth", "** Same gate + gear not down-and-locked"], "ans": 0, "expl": "** SADS, GINA, RALT, re-gridded DTED"}, {"q": "What is correct for: Landing CFIT gate?", "opts": ["** Gear down, **\u003c400 KIAS**, **\u003c500' AGL**", "** Gear down, **\u003c200 KIAS**, **\u003c500' AGL**", "** Gear down, **\u003c210 KIAS**, **\u003c500' AGL**", "** Gear down, **\u003c100 KIAS**, **\u003c500' AGL**"], "ans": 1, "expl": "** Gear down, **\u003c200 KIAS**, **\u003c500' AGL**"}, {"q": "What is correct for: Response assumption?", "opts": ["** **1.3 s**; warn only if predicted **\u003c100' AGL**; trajectories keep **≥100'** clearance", "SADS, GINA, RALT, and re-gridded Digital Terrain Elevation Data (terrain database).", "** \u003c500' / \u003c200 KIAS / **≥1 min** since G/A or T/O → hard-landing avoidance at **\u003e1398 FPM** ROD", "\u003c500 ft AGL, \u003c200 KIAS, ≥1 min since G/A or T/O, and landing gear not down and locked."], "ans": 0, "expl": "** **1.3 s**; warn only if predicted **\u003c100' AGL**; trajectories keep **≥100'** clearance"}, {"q": "What is correct for: Landing-phase mode?", "opts": ["\u003c500 ft AGL, \u003c200 KIAS, ≥1 minute since go-around or takeoff; hard landing \u003e1398 FPM rate of descent.", "** \u003c500' / \u003c200 KIAS / **≥1 min** since G/A or T/O → hard-landing avoidance at **\u003e1398 FPM** ROD", "** **1.3 s**; warn only if predicted **\u003c100' AGL**; trajectories keep **≥100'** clearance", "ILS approaches (Below Glideslope) and the final phase of a Precautionary Approach (Pull up ± Roll)."], "ans": 1, "expl": "** \u003c500' / \u003c200 KIAS / **≥1 min** since G/A or T/O → hard-landing avoidance at **\u003e1398 FPM** ROD"}, {"q": "What is correct for: Check Gear?", "opts": ["** SADS, GINA, RALT, re-gridded DTED", "More than 50% of maximum GS deviation", "TACAN azimuth", "** Same gate + gear not down-and-locked"], "ans": 3, "expl": "** Same gate + gear not down-and-locked"}, {"q": "What is correct for: Below GS?", "opts": ["** Pre-intercept and if **\u003e60%** max GS deviation; once unless corrected", "** Pre-intercept and if **\u003e100%** max GS deviation; once unless corrected", "** Pre-intercept and if **\u003e25%** max GS deviation; once unless corrected", "** Pre-intercept and if **\u003e50%** max GS deviation; once unless corrected"], "ans": 3, "expl": "** Pre-intercept and if **\u003e50%** max GS deviation; once unless corrected"}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= QUESTIONS.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
