<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>BI 1101 (2) Ground Operations — T-45 Quiz</title>
<script src="auth.js"></script>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt span + span, #q-text { white-space: pre-line; }
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">Home</a> · <a href="section-bi.html">BI</a> · Basic Instruments</div>
    <h1>BI 1101 (2) Ground Operations</h1>
    <div class="meta">38 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 38</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Basic Instruments</div>
    <h2 style="margin:0.2rem 0">BI 1101 (2) Ground Operations</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-bi.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to BI</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="section-bi.html">← BI</a> · <a href="index.html">Home</a></div>
</div>
<script>
const QUESTIONS = [{"q": "BI aircraft flight briefs should begin:", "opts": ["15 min prior", "30 min prior", "At least 2 hours prior", "After man-up"], "ans": 2, "expl": "Board required; arrive early."}, {"q": "Instrument hood may be installed:", "opts": ["Before strap-in", "After canopy closed", "Only airborne", "Only in Marshall forever"], "ans": 1, "expl": "Remove before opening canopy."}, {"q": "Instrument checklist is completed:", "opts": ["On the line walking", "In Marshall stopped", "After takeoff", "Only in SIM"], "ans": 1, "expl": "NATOPS/PCL instruments checked/set."}, {"q": "SIM brief timing vs BI flight brief timing?", "opts": ["SIM ~**15 min** prior; BI flight ≥**2 hours** prior (board required).", "SIM ~**60 min** prior; BI flight ≥**2 hours** prior (board required).", "SIM ~**30 min** prior; BI flight ≥**2 hours** prior (board required).", "SIM ~**40 min** prior; BI flight ≥**2 hours** prior (board required)."], "ans": 2, "expl": "SIM ~**30 min** prior; BI flight ≥**2 hours** prior (board required)."}, {"q": "Where get the instrument hood?", "opts": ["**ADI left**, **HSI right**; set LAW/Bingo/HDG/CRS; waypoints; squawk.", "VOR as needed; CDI; LAW/Bingo/HDG/CRS; mobile waypoints; squawk/IFF; pry=ground aux=base.", "Install after canopy **closed**; remove before canopy **opens**.", "**Maintenance Control** — sign out with ADB review; stow in **nav bag**."], "ans": 3, "expl": "**Maintenance Control** — sign out with ADB review; stow in **nav bag**."}, {"q": "Typical MFD setup post-start?", "opts": ["**Maintenance Control** — sign out with ADB review; stow in **nav bag**.", "**ADI left**, **HSI right**; set LAW/Bingo/HDG/CRS; waypoints; squawk.", "sweep MFDs → COM/NAV right console; IP verifies squawk.", "Install after canopy **closed**; remove before canopy **opens**."], "ans": 1, "expl": "**ADI left**, **HSI right**; set LAW/Bingo/HDG/CRS; waypoints; squawk."}, {"q": "Where complete instrument checklist?", "opts": ["VOR as needed; CDI; LAW/Bingo/HDG/CRS; mobile waypoints; squawk/IFF; pry=ground aux=base.", "**Maintenance Control** — sign out with ADB review; stow in **nav bag**.", "Stopped in **Marshall** — standby instruments left → MFDs → COM/NAV right; IP checks squawk.", "Maintenance Control: review ADB, sign out instrument hood, stow in nav bag (not power loft)."], "ans": 2, "expl": "Stopped in **Marshall** — standby instruments left → MFDs → COM/NAV right; IP checks squawk."}, {"q": "PC/final checks — student hand position?", "opts": ["In Marshall stopped", "sweep MFDs → COM/NAV right console; IP verifies squawk.", "After canopy closed", "**Hands up**; avoid controls while checkers walk."], "ans": 3, "expl": "**Hands up**; avoid controls while checkers walk."}, {"q": "How far before takeoff do BI flight briefs start?", "opts": ["At least 1 hour prior", "At least 2 hours prior to takeoff", "3 hours prior", "30 minutes prior"], "ans": 1, "expl": "\"BI flight briefs start at least 2 hours prior to takeoff. A briefing board is required.\""}, {"q": "Why must you arrive early for a BI flight brief?", "opts": ["A briefing board is required", "Weather brief is given only at the start of the day", "The sim must be preflighted", "The ODO requires a check-in 4 hours prior"], "ans": 0, "expl": "Lecture: \"A briefing board is required so you must arrive early.\""}, {"q": "What should you try to get prior to your first BI flight?", "opts": ["A night trunk ride only", "A back-seat hop", "A solo sim", "A formation hop"], "ans": 1, "expl": "Briefing slide: \"Try to get a back seat hop prior to your first flight.\""}, {"q": "Order the first four BI ground operations items:", "opts": ["Maintenance Control → Briefing → Preflight/Man-Up → Paraloft", "Briefing → Paraloft → Maintenance Control → Start Aircraft", "Briefing → Maintenance Control → Paraloft/Flight Gear → Preflight/Man-Up", "Paraloft → Briefing → Maintenance Control → Taxi"], "ans": 2, "expl": "Ground ops outline order: Briefing, Maintenance Control, Paraloft/Flight Gear, Preflight/Man-Up, Start Sim, Start Aircraft, Post Start, Nav/Waypoint Set-up, Taxi, IFR Hood, Instrument Checklist."}, {"q": "Which ground operations item comes immediately after \"Navigation/Waypoint Set-up\"?", "opts": ["IFR Hood Installation", "Taxi", "Instrument Checklist", "Post Start"], "ans": 1, "expl": "Outline: ... Post Start → Navigation/Waypoint Set-up → Taxi → IFR Hood Installation → Instrument Checklist."}, {"q": "What is the last item in the BI ground operations sequence?", "opts": ["Instrument Checklist", "IFR Hood Installation", "Taxi", "Post Start"], "ans": 0, "expl": "Outline ends with IFR Hood Installation then Instrument Checklist."}, {"q": "At maintenance control, what two things do you do?", "opts": ["File the flight plan and get ATIS", "Sign for fuel and get the weather", "Get your helmet and G-suit", "Review the ADB with your instructor and get (sign out) an instrument hood"], "ans": 3, "expl": "Maintenance Control slide."}, {"q": "Where should the instrument hood be carried?", "opts": ["Inside your nav bag", "With the plane captain", "On the canopy rail", "Left in the paraloft"], "ans": 0, "expl": "\"Place the instrument hood inside your nav bag. Don't leave it in the paraloft.\""}, {"q": "For night flights, what should you do with your helmet and flashlight?", "opts": ["Use the tinted visor and a red lens only", "Use a dark visor and leave the flashlight", "Remove the visor", "Use a clear visor and check your flashlight"], "ans": 3, "expl": "Paraloft/flight gear slide."}, {"q": "In the aircraft during man-up for a BI flight, who preflights the aircraft?", "opts": ["The plane captain only", "The IP preflights while you get strapped in", "Maintenance control", "The student preflights while the IP straps in"], "ans": 1, "expl": "Preflight/Man-Up slide."}, {"q": "Who is responsible for your ejection seat during man-up?", "opts": ["The plane captain", "You are", "The final checker", "The IP"], "ans": 1, "expl": "\"You are responsible for your own ejection seat. If you need help, alert the plane captain.\""}, {"q": "Where must your gear be stowed during man-up?", "opts": ["Strapped to the outside of the nav bag only", "In the aft avionics bay", "On the canopy rails for easy reach", "Securely stowed inside and clear of the canopy rails"], "ans": 3, "expl": "Preflight/Man-Up slide."}, {"q": "In the BI simulator, which seat are you in?", "opts": ["The console IP seat", "Either seat, as briefed", "The rear seat", "The front seat"], "ans": 3, "expl": "Start Simulator slide: in the sim you will be in the front seat."}, {"q": "For BI simulators, how are you set up at the start?", "opts": ["In the chocks with engine off", "At the hold short with the engine running", "Airborne at the MOA entry", "On the runway lined up"], "ans": 1, "expl": "\"For BI, you will be set up at the hold short with the engine running.\""}, {"q": "During a BI flight start, who starts the aircraft and what do you do?", "opts": ["You start from the rear cockpit while the IP reads the checklist", "You start it and the IP responds on ICS", "The IP starts from the front; you follow through the start sequence and make R/C voice responses on ICS", "The plane captain starts it"], "ans": 2, "expl": "Start Aircraft slide."}, {"q": "When do you take control of comm and NAV during start?", "opts": ["When the canopy closes", "At final checks", "When the GEN comes on line (as briefed)", "After takeoff"], "ans": 2, "expl": "\"When GEN comes on line, take control of comm and NAV as briefed.\""}, {"q": "Post-start items include all EXCEPT:", "opts": ["Set up navigation", "Install the IFR hood with the canopy open", "Get ATIS and clearance", "Clear the canopy rails, canopy down"], "ans": 1, "expl": "Post Start slide: post-start items complete, ATIS/clearance, set up nav, PC checks hands up, clear rails/canopy down. Hood goes in only after canopy is closed."}, {"q": "Standard BI MFD setup is:", "opts": ["HSI both, HUD off", "ADI left, HSI right, HUD on", "ADI left, HSI right, HUD off", "HSI left, ADI right, HUD on"], "ans": 2, "expl": "Navigation/Waypoint Set-up slide."}, {"q": "Which NAV setup items are listed on the waypoint set-up slide?", "opts": ["TACAN & VOR tuned, CDI selected; LAW, BINGO, HDG, CRS set; MOA waypoints transferred and boxed; squawk set", "Only TACAN tuned and HUD on", "ILS tuned, radar altimeter off", "GPS approach loaded and autopilot coupled"], "ans": 0, "expl": "Navigation/Waypoint Set-up slide."}, {"q": "At Kingsville, what frequencies are set in Primary and Aux for ground ops?", "opts": ["Ground in Primary, Strike in Aux", "Strike in Primary, Ground in Aux", "Ground in Primary, Base in Aux", "Tower in Primary, Ground in Aux"], "ans": 0, "expl": "Slide: \"Ground in Primary; Strike in Aux (Kingsville), Base in Aux (Meridian).\""}, {"q": "At Meridian, what is set in Aux during ground ops?", "opts": ["Departure", "Tower", "Strike", "Base"], "ans": 3, "expl": "Slide: Base in Aux (Meridian)."}, {"q": "At Kingsville, \"Out of chocks\" is reported to:", "opts": ["Strike", "Base", "Tower", "Ground"], "ans": 0, "expl": "Taxi slide: Report \"Out of chocks\" to Strike (Kingsville), Base (Meridian)."}, {"q": "Where does the IP pause so you can finish setting up systems before calling ground for taxi?", "opts": ["Final checks", "The hold short", "Marshall", "The hot pits"], "ans": 2, "expl": "Taxi slide: taxi to Marshall to finish setting up; then call Ground for taxi."}, {"q": "What instruments do you check in turns while taxiing?", "opts": ["Needle/ball and compass", "Altimeter and airspeed", "AOA and VVI", "Fuel flow and RPM"], "ans": 0, "expl": "Taxi slide."}, {"q": "What should you do with your hands while passing final checkers?", "opts": ["Set the parking brake", "Hold the throttle and stick", "Keep hands up and avoid the controls", "Signal thumbs up continuously"], "ans": 2, "expl": "Taxi slide: \"Taxi to final checkers, hands up.\""}, {"q": "When may the instrument (IFR) hood be installed and when must it be removed?", "opts": ["After takeoff; removed on downwind", "Any time after the canopy is closed; removed prior to opening the canopy", "Only airborne above 10,000 ft; removed at the IAF", "Before engine start; removed after landing"], "ans": 1, "expl": "IFR Hood Installation slide."}, {"q": "Where is the instrument checklist completed?", "opts": ["In the chocks before start", "On the runway", "Taxiing to the hold short", "While stopped in Marshall"], "ans": 3, "expl": "Instrument Checklist slide."}, {"q": "The NATOPS PCL requires flight instruments to be:", "opts": ["Checked only by the IP", "\"Checked and set as required\"", "Bypassed for BI flights", "Checked individually against TW standards"], "ans": 1, "expl": "TW-provided checklists are more complete."}, {"q": "The instrument checklist scan flows:", "opts": ["Left with standby instruments → sweep right across MFDs → end with Comm and Nav on the right console", "MFDs → standby → HUD", "Comm/Nav first → standby → MFDs", "Right console → MFDs → standby instruments"], "ans": 0, "expl": "Instrument Checklist slide; have IP verify squawk up front."}, {"q": "Who verifies the squawk at the end of the instrument checklist?", "opts": ["The IP (up front)", "Ground control", "Strike/Base", "The final checker"], "ans": 0, "expl": "\"Have IP verify Squawk up front.\""}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= queue.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
</html>
