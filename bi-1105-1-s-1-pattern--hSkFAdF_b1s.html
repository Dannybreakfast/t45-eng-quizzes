<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>BI 1105 (1) S-1 Pattern — T-45 Quiz</title>
<script src="auth.js"></script>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt span + span, #q-text { white-space: pre-line; }
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">Home</a> · <a href="section-bi.html">BI</a> · Basic Instruments</div>
    <h1>BI 1105 (1) S-1 Pattern</h1>
    <div class="meta">23 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 23</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Basic Instruments</div>
    <h2 style="margin:0.2rem 0">BI 1105 (1) S-1 Pattern</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-bi.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to BI</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="section-bi.html">← BI</a> · <a href="index.html">Home</a></div>
</div>
<script>
const QUESTIONS = [{"q": "S-1 descent/climb rate:", "opts": ["500 fpm", "1000 fpm", "2000 fpm", "250 fpm"], "ans": 1, "expl": "1000' segments."}, {"q": "S-1 altitude checkpoint interval:", "opts": ["100'/10s", "250'/15s", "500'/30s", "1000'/60s only"], "ans": 1, "expl": "Matches 1000 fpm."}, {"q": "S-1 vertical profile?", "opts": ["2000' descent @ 1000 fpm, then 1000' climb @ 1000 fpm; repeat once.", "500' descent @ 1000 fpm, then 1000' climb @ 1000 fpm; repeat once.", "1010' descent @ 1000 fpm, then 1000' climb @ 1000 fpm; repeat once.", "1000' descent @ 1000 fpm, then 1000' climb @ 1000 fpm; repeat once."], "ans": 3, "expl": "1000' descent @ 1000 fpm, then 1000' climb @ 1000 fpm; repeat once."}, {"q": "S-1 timing checkpoint?", "opts": ["**260 feet every 15 seconds**.", "**125 feet every 15 seconds**.", "**250 feet every 15 seconds**.", "**500 feet every 15 seconds**."], "ans": 2, "expl": "**250 feet every 15 seconds**."}, {"q": "Approx descent fuel flow at 200 KT S-1?", "opts": ["~**700 pph** (with slight pitch down).", "~**1400 pph** (with slight pitch down).", "~**350 pph** (with slight pitch down).", "~**710 pph** (with slight pitch down)."], "ans": 0, "expl": "~**700 pph** (with slight pitch down)."}, {"q": "Approx climb fuel flow S-1?", "opts": ["~**1510 pph** with +1–3° above level attitude.", "~**1500 pph** with +1–3° above level attitude.", "~**3000 pph** with +1–3° above level attitude.", "~**750 pph** with +1–3° above level attitude."], "ans": 1, "expl": "~**1500 pph** with +1–3° above level attitude."}, {"q": "The S-1 pattern is flown at what airspeed and heading?", "opts": ["250 KIAS, constant heading", "150 KIAS, constant heading", "200 KIAS in a ½ SRT", "200 KIAS, constant heading"], "ans": 3, "expl": "S-1 slide."}, {"q": "S-1 pattern: altitude change and rate for each leg?", "opts": ["1000 ft at 1000 fpm", "2000 ft at 2000 fpm", "500 ft at 1000 fpm", "1000 ft at 500 fpm"], "ans": 0, "expl": "S-1 slide."}, {"q": "S-1 pattern sequence:", "opts": ["Descend 2000 → climb 2000", "Descend → level 1 min → climb", "Climb → descend → climb → descend", "Descend 1000 → climb 1000 → descend 1000 → climb 1000"], "ans": 3, "expl": "S-1 slide / lecture."}, {"q": "Total time to complete the S-1 pattern:", "opts": ["6 minutes", "2 minutes", "3 minutes", "4 minutes"], "ans": 3, "expl": "Lecture."}, {"q": "Level flight setting for 200 KIAS clean (S-1 table):", "opts": ["5° nose up, 1050–1100 pph", "3° nose up, 1300–1400 pph", "7° nose up, 1500 pph", "3° nose up, 700 pph"], "ans": 0, "expl": "S-1 table."}, {"q": "S-1 descent entry (3 sec prior to 12 o'clock):", "opts": ["Set 1500 pph and raise pitch 2–3°", "Speed brakes out", "Set idle and reduce pitch 3–6°", "Set 700 pph and reduce pitch 1–2°"], "ans": 3, "expl": "S-1 slide."}, {"q": "S-1 climb entry (3 sec or 100 ft prior):", "opts": ["1800 pph and 5° up", "MRT and 8–10° up", "1100 pph and 1° up", "Set 1500 pph and increase pitch 2–3° above level flight"], "ans": 3, "expl": "S-1 slide."}, {"q": "S-1 altitude checkpoint rate:", "opts": ["500 ft every 15 seconds", "250 ft every 10 seconds", "100 ft every 6 seconds", "250 ft every 15 seconds"], "ans": 3, "expl": "S-1 slide."}, {"q": "In the S-1, pitch controls ___ and power controls ___.", "opts": ["Airspeed; rate of climb/descent", "Heading; altitude", "AOA; airspeed", "Rate; airspeed"], "ans": 0, "expl": "S-1 slide."}, {"q": "S-1 transition timing rule:", "opts": ["10 seconds prior or 50 ft prior", "100 ft after", "At 12 o'clock exactly", "3 seconds prior to 12 o'clock or 100 ft prior, whichever occurs first"], "ans": 3, "expl": "S-1 slide."}, {"q": "S-1 demo starting conditions:", "opts": ["12,000 ft, heading 360, 200 knots", "12,000 ft, heading 090, 250 knots", "15,000 ft, heading 270, 200 knots", "10,000 ft, heading 360, 200 knots"], "ans": 0, "expl": "Demo."}, {"q": "S-1 demo, first checkpoint after starting down from 12,000 at the 12 o'clock:", "opts": ["11,500 ft at the 3 o'clock", "11,750 ft at the 6 o'clock", "11,900 ft at the 2 o'clock", "11,750 ft at the 3 o'clock position"], "ans": 3, "expl": "Demo."}, {"q": "S-1 demo: 11,250 ft corresponds to which seconds-hand position (first descent)?", "opts": ["3 o'clock", "9 o'clock (45 sec)", "12 o'clock", "6 o'clock"], "ans": 1, "expl": "Demo."}, {"q": "S-1 demo: with ~1000 pph in the descent, what happened?", "opts": ["Exactly 1000 fpm", "Climb began", "2000 fpm descent, 10 knots fast", "Rate of descent reduced to ~950 fpm and the jet was ~10 knots slow"], "ans": 3, "expl": "Demo; fix by lowering pitch slightly (airspeed) and reducing power slightly (rate)."}, {"q": "Where is the clock normally located in the T-45 cockpit?", "opts": ["Above the ADI", "To the right and below the HSI", "In the HUD", "On the left console"], "ans": 1, "expl": "Lecture."}, {"q": "The S-1 pattern finishes:", "opts": ["At 250 KIAS", "Level on original altitude and heading with the clock at 12 o'clock, 200 KIAS", "2000 ft below start", "On a reciprocal heading"], "ans": 1, "expl": "S-1 slide."}, {"q": "The S-1 descent reference fuel flow is approximately:", "opts": ["700 pph", "1100 pph", "Idle", "1500 pph"], "ans": 0, "expl": "Lecture."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= queue.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
</html>
