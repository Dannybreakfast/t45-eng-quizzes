<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CO3201 (9) PAR &amp; ASR Final Approach — T-45 Quiz</title>
<script src="auth.js"></script>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt span + span, #q-text { white-space: pre-line; }
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">Home</a> · <a href="section-co3201.html">CO3201</a> · CO3201 Instrument Procedures</div>
    <h1>CO3201 (9) PAR &amp; ASR Final Approach</h1>
    <div class="meta">26 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 26</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">CO3201 Instrument Procedures</div>
    <h2 style="margin:0.2rem 0">CO3201 (9) PAR &amp; ASR Final Approach</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-co3201.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to CO3201</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="section-co3201.html">← CO3201</a> · <a href="index.html">Home</a></div>
</div>
<script>
const QUESTIONS = [{"q": "At the beginning of a PAR final you are:", "opts": ["Straight and level, on-speed, normally at approximately 1,500 ft AGL", "Level at 5,000 ft AGL", "Clean at 200 KIAS", "Descending at 1,000 fpm at 200 KIAS"], "ans": 0, "expl": "Correct: Straight and level, on-speed, normally at approximately 1,500 ft AGL · Source: \"At the beginning of a PAR final approach, you will be straight and level, on-speed, and normally at approximately 1,500 ft AGL.\""}, {"q": "Normal altitude at the beginning of a PAR final:", "opts": ["Approximately 5,000 ft AGL", "Approximately 2,500 ft AGL", "Approximately 1,500 ft AGL", "Approximately 1,000 ft AGL"], "ans": 2, "expl": "Correct: Approximately 1,500 ft AGL · Source: \"...normally at approximately 1,500 ft AGL.\""}, {"q": "PAR final — restrict AOB to:", "opts": ["Standard rate", "Approximate degrees to be turned, not to exceed 1/2 SRT (approximately 10 degrees)", "30 degrees", "20 degrees"], "ans": 1, "expl": "Correct: Approximate degrees to be turned, not to exceed 1/2 SRT (approximately 10 degrees) · Source: \"Restrict AOB to the approximate number of degrees to be turned, not to exceed 1/2 SRT (approximately 10 degrees).\""}, {"q": "PAR final — verify:", "opts": ["Gear up, flaps up", "Gear down, flaps at half or full", "Gear down, flaps up only", "Speed brakes in"], "ans": 1, "expl": "Correct: Gear down, flaps at half or full · Source: \"Verify gear down, flaps at half or full.\""}, {"q": "PAR final — trim the aircraft for:", "opts": ["Hands off level flight", "A 1,000 fpm descent", "Slight nose down", "Hands off climb"], "ans": 0, "expl": "Correct: Hands off level flight · Source: \"Trim aircraft for hands off level flight.\""}, {"q": "On a PAR, when told \"ON GLIDEPATH\" you:", "opts": ["Lower the gear", "Reduce to idle", "Report MAP", "Extend the speed brakes and adjust power as required to establish a descent"], "ans": 3, "expl": "Correct: Extend the speed brakes and adjust power as required to establish a descent · Source: \"When the controller informs you that you are \"ON GLIDEPATH,\" extend the speed brakes and adjust power as required to establish a descent.\""}, {"q": "Initially after speed brake extension on the PAR you need:", "opts": ["Nose-down trim only", "Aft stick to counter a pitch down", "Forward stick pressure to counter the pitch up", "No input"], "ans": 2, "expl": "Correct: Forward stick pressure to counter the pitch up · Source: \"Forward stick pressure will initially be required to counter the pitch up caused by speed brake extension.\""}, {"q": "PAR ICS report after establishing the descent:", "opts": ["\"PLATFORM\"", "\"GEAR DOWN\"", "\"SPEED BRAKES FULL, LANDING CHECKLIST COMPLETE\"", "\"LOUD AND CLEAR, THREE DOWN AND LOCKED\""], "ans": 2, "expl": "Correct: \"SPEED BRAKES FULL, LANDING CHECKLIST COMPLETE\" · Source: \"Report, \"SPEED BRAKES FULL, LANDING CHECKLIST COMPLETE,\" on the ICS.\""}, {"q": "PAR rate of descent varies with:", "opts": ["Altitude and weight", "Bank angle", "Glideslope angle and groundspeed", "Temperature only"], "ans": 2, "expl": "Correct: Glideslope angle and groundspeed · Source: \"The rate of descent will vary for different glideslope angles and groundspeeds.\""}, {"q": "Where is the rate of descent chart for a given glideslope and groundspeed?", "opts": ["Front cover of the approach plates", "In the HUD", "Inside back cover of the approach plates", "NATOPS chapter 6"], "ans": 2, "expl": "Correct: Inside back cover of the approach plates · Source: \"The inside back cover of the approach plates contains a chart that will provide you rate of descent for a given glideslope and groundspeed.\""}, {"q": "On PAR final, adjust power to:", "opts": ["Maintain your rate of descent and keep the aircraft on-speed", "Hold 1,000 fpm exactly", "Hold 150 KIAS", "Hold 700 pph"], "ans": 0, "expl": "Correct: Maintain your rate of descent and keep the aircraft on-speed · Source: \"Adjust power to maintain your rate of descent and keep the aircraft on-speed.\""}, {"q": "PAR heading corrections — bank angle:", "opts": ["Small (5-10 degrees)", "30 degrees", "20 degrees", "1-2 degrees"], "ans": 0, "expl": "Correct: Small (5-10 degrees) · Source: \"When making heading corrections, try to keep the amount of bank angle small (5-10 degrees) so that you don't end up chasing the heading.\""}, {"q": "On the PAR, if you get off heading:", "opts": ["Hold the new heading", "Correct back to course aggressively", "Don't try to correct to course; return to your last assigned heading with smooth inputs", "Ask for a new approach"], "ans": 2, "expl": "Correct: Don't try to correct to course; return to your last assigned heading with smooth inputs · Source: \"If you get off heading, don't try to correct to course. Use smooth control inputs and return to your last assigned heading.\""}, {"q": "As you near the decision altitude, begin:", "opts": ["An \"inside/outside\" scan to visually acquire the runway environment", "A 300 pph power addition", "A level off", "The missed approach"], "ans": 0, "expl": "Correct: An \"inside/outside\" scan to visually acquire the runway environment · Source: \"As you near the decision altitude, begin an \"inside/outside\" scan to visually acquire the runway environment.\""}, {"q": "PAR — no runway environment in sight at the DA:", "opts": ["Execute a missed approach (make the mandatory missed approach call)", "Ask for ASR", "Descend 100 ft", "Level off at DA and continue to MAP"], "ans": 0, "expl": "Correct: Execute a missed approach (make the mandatory missed approach call) · Source: \"If you do not have the runway environment in sight when you reach the DA, execute a missed approach (make the mandatory missed approach call).\""}, {"q": "On the ASR final, the controller cannot furnish:", "opts": ["Glideslope information", "Range information", "Course information", "MAP location"], "ans": 0, "expl": "Correct: Glideslope information · Source: \"On the ASR final approach, the controller cannot furnish glideslope information.\""}, {"q": "On an ASR, who establishes and maintains the correct rate of descent?", "opts": ["The pilot", "The controller", "The HUD", "The tower"], "ans": 0, "expl": "Correct: The pilot · Source: \"It will be up to you to establish and maintain the correct rate of descent.\""}, {"q": "ASR — the controller identifies the MAP:", "opts": ["By altitude", "In nautical miles from the end of the runway", "By DME from the TACAN", "By time from the FAF"], "ans": 1, "expl": "Correct: In nautical miles from the end of the runway · Source: \"The controller will identify the missed approach point (MAP) in nautical miles from the end of the runway, and will direct the descent by stating, \"BEGIN DESCENT.\"\""}, {"q": "ASR — the controller directs the descent by stating:", "opts": ["\"DESCEND TO MDA\"", "\"SLOW TO APPROACH SPEED\"", "\"ON GLIDEPATH\"", "\"BEGIN DESCENT\""], "ans": 3, "expl": "Correct: \"BEGIN DESCENT\" · Source: \"...and will direct the descent by stating, \"BEGIN DESCENT.\"\""}, {"q": "ASR recommended altitudes each mile are provided:", "opts": ["On pilot request", "Only by USN/USMC controllers", "Always", "Never"], "ans": 0, "expl": "Correct: On pilot request · Source: \"On pilot request, the controller will provide recommended altitudes each mile on final.\""}, {"q": "ASR recommended altitudes decrease:", "opts": ["200 ft per mile", "500 ft per mile", "300 ft per mile (approximates a 3-degree glideslope)", "300 ft per mile (approximates a 2-degree glideslope)"], "ans": 2, "expl": "Correct: 300 ft per mile (approximates a 3-degree glideslope) · Source: \"Recommended altitudes decrease 300 ft per mile (approximates a 3-degree glideslope).\""}, {"q": "To smoothly level at MDA prior to the MAP, your altitudes should be:", "opts": ["Slightly higher than those recommended", "Slightly lower than those recommended", "Exactly those recommended", "100 ft below MDA"], "ans": 1, "expl": "Correct: Slightly lower than those recommended · Source: \"In order to smoothly level at MDA prior to the MAP, your altitudes should be slightly lower than those recommended.\""}, {"q": "ASR descent rate (depending on groundspeed) to reach MDA prior to MAP:", "opts": ["800-1000 fpm", "4,000-6,000 fpm", "500-700 fpm", "1,000-1,500 fpm"], "ans": 0, "expl": "Correct: 800-1000 fpm · Source: \"Depending on your groundspeed, a descent rate of 800-1000 fpm will allow you to descend to the MDA prior to reaching the MAP.\""}, {"q": "ASR — approximately 100 ft prior to MDA:", "opts": ["Retract speed brakes and add MRT", "Add about 700 pph", "Reduce to idle", "Add about 300 pph fuel flow and apply slight backstick pressure"], "ans": 3, "expl": "Correct: Add about 300 pph fuel flow and apply slight backstick pressure · Source: \"Approximately 100 feet prior to MDA, add about 300 pph fuel flow and apply slight backstick pressure to level off at MDA.\""}, {"q": "ASR — upon reaching the MAP without the runway or unable to land safely:", "opts": ["Descend below MDA", "Execute the missed approach as instructed", "Request recommended altitudes", "Continue to the DA"], "ans": 1, "expl": "Correct: Execute the missed approach as instructed · Source: \"Upon reaching the MAP, if you do not have the runway in sight or are otherwise unable to perform a safe landing, execute the missed approach as instructed.\""}, {"q": "Decision altitude (DA) is used on the ___; MDA/MAP on the ___.", "opts": ["PAR; PAR", "ASR; TACAN only", "PAR; ASR", "ASR; PAR"], "ans": 2, "expl": "Correct: PAR; ASR · Source: \"If you do not have the runway environment in sight when you reach the DA, execute a missed approach … Upon reaching the MAP, if you do not have the runway in sight … execute the missed approach as instructed.\""}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= queue.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
</html>
