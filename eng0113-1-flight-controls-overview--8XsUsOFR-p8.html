<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ENG0113 (1) Flight Controls Overview — T-45 Quiz</title>
<script src="auth.js"></script>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt span + span, #q-text { white-space: pre-line; }
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">Home</a> · <a href="section-eng.html">ENG</a> · Flight Controls</div>
    <h1>ENG0113 (1) Flight Controls Overview</h1>
    <div class="meta">20 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 20</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Flight Controls</div>
    <h2 style="margin:0.2rem 0">ENG0113 (1) Flight Controls Overview</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-eng.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to ENG</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="section-eng.html">← ENG</a> · <a href="index.html">Home</a></div>
</div>
<script>
const QUESTIONS = [{"q": "Main stabilator trim is powered by:", "opts": ["Generator bus only", "28 VDC Essential Services Bus", "HYD1 only", "Battery direct, no bus"], "ans": 1, "expl": "Main stab trim on ESS bus; standby on GEN bus."}, {"q": "If HYD2 EDP fails, ailerons/stabilator can still be powered by:", "opts": ["Gravity only", "The RAT", "Emergency flap accumulator", "Rudder pedals"], "ans": 1, "expl": "RAT powers ailerons/stabilator if HYD2 EDP fails."}, {"q": "Emergency flaps extend:", "opts": ["Flaps half + slats 15°", "Flaps full + slats 15°", "Flaps full only (no slats)", "Slats only"], "ans": 2, "expl": "Emerg flaps = full flaps, slats remain up; need accumulator \u003e2000 psi if HYD1 failed."}, {"q": "Yaw damping requires:", "opts": ["Weight on wheels, any speed", "Weight off wheels and \u003c217 KIAS", "Flaps UP only", "Generator offline"], "ans": 1, "expl": "WOW off and \u003c217 KIAS."}, {"q": "Turn coordination (ARI) additionally requires:", "opts": ["Flaps/slats half or down", "Speed brakes full", "Gear up only", "\u003e217 KIAS"], "ans": 0, "expl": "Also WOW off and \u003c217 KIAS."}, {"q": "Rudder primary actuation requires:", "opts": ["HYD1", "HYD2", "Neither — unpowered / mechanical", "ESS bus electrical actuator only"], "ans": 2, "expl": "Conventional unpowered rudder."}, {"q": "Aileron trim works on:", "opts": ["ESS bus / battery only", "Generator bus", "HYD1 pressure alone with no electrics", "RAT only"], "ans": 1, "expl": "GEN bus; will not work on battery/ESS-only."}, {"q": "Speed brakes are actuated by:", "opts": ["HYD2", "HYD1", "Accumulator only", "Mechanical cables only"], "ans": 1, "expl": "HYD1 actuated, ESS-bus electrically controlled."}, {"q": "How are T-45 ailerons and stabilator powered?", "opts": ["Tandem HYD1 and HYD2 hydraulic actuators; RAT powers them if the HYD2 engine-driven pump fails. Mechanically controlled by the stick in both cockpits.", "Conventional unpowered rudder via pedals in both cockpits — no hydraulics or electricity required to move it; aerodynamically reversible and can “blow out.”", "Main stab trim: 28 VDC Essential Services Bus. Standby stab trim: Generator bus. Main stab trim is the only trim available after generator failure.", "Flaps to FULL only (no slats). Electrically controlled (ESS bus); hydraulically by HYD1 or wheel brake/emergency flap accumulator if \u003e2000 psi."], "ans": 0, "expl": "Tandem HYD1 and HYD2 hydraulic actuators; RAT powers them if the HYD2 engine-driven pump fails. Mechanically controlled by the stick in both cockpits."}, {"q": "What provides directional control and how is the rudder powered?", "opts": ["Conventional unpowered rudder via pedals in both cockpits — no hydraulics or electricity required to move it; aerodynamically reversible and can “blow out.”", "Main stab trim: 28 VDC Essential Services Bus. Standby stab trim: Generator bus. Main stab trim is the only trim available after generator failure.", "Tandem HYD1 and HYD2 hydraulic actuators; RAT powers them if the HYD2 engine-driven pump fails. Mechanically controlled by the stick in both cockpits.", "Flaps to FULL only (no slats). Electrically controlled (ESS bus); hydraulically by HYD1 or wheel brake/emergency flap accumulator if \u003e2000 psi."], "ans": 0, "expl": "Conventional unpowered rudder via pedals in both cockpits — no hydraulics or electricity required to move it; aerodynamically reversible and can “blow out.”"}, {"q": "Aileron trim electrical power source?", "opts": ["Ailerons: spring cartridge. Stabilator: spring cartridge + inertia weight + two viscous dampers.", "Half: flaps 25°, slats full 15°. Full/DN: flaps 50°, slats 15°. Electrically controlled (ESS bus), HYD1 actuated.", "Electrically controlled via the 28 VDC Generator bus (will not work on battery/ESS-only).", "Ailerons, stabilator, rudder, flaps/slats, speed brakes, control augmentation."], "ans": 2, "expl": "Electrically controlled via the 28 VDC Generator bus (will not work on battery/ESS-only)."}, {"q": "Main vs standby stabilator trim power?", "opts": ["Tandem HYD1 and HYD2 hydraulic actuators; RAT powers them if the HYD2 engine-driven pump fails. Mechanically controlled by the stick in both cockpits.", "Main stab trim: 28 VDC Essential Services Bus. Standby stab trim: Generator bus. Main stab trim is the only trim available after generator failure.", "Conventional unpowered rudder via pedals in both cockpits — no hydraulics or electricity required to move it; aerodynamically reversible and can “blow out.”", "Flaps to FULL only (no slats). Electrically controlled (ESS bus); hydraulically by HYD1 or wheel brake/emergency flap accumulator if \u003e2000 psi."], "ans": 1, "expl": "Main stab trim: 28 VDC Essential Services Bus. Standby stab trim: Generator bus. Main stab trim is the only trim available after generator failure."}, {"q": "Flaps/slats normal positions and angles?", "opts": ["Ailerons, stabilator, rudder, flaps/slats, speed brakes, control augmentation.", "Ailerons: spring cartridge. Stabilator: spring cartridge + inertia weight + two viscous dampers.", "Electrically controlled via the 28 VDC Generator bus (will not work on battery/ESS-only).", "Half: flaps 25°, slats full 15°. Full/DN: flaps 50°, slats 15°. Electrically controlled (ESS bus), HYD1 actuated."], "ans": 3, "expl": "Half: flaps 25°, slats full 15°. Full/DN: flaps 50°, slats 15°. Electrically controlled (ESS bus), HYD1 actuated."}, {"q": "Emergency flaps — what extends and what power is needed?", "opts": ["Conventional unpowered rudder via pedals in both cockpits — no hydraulics or electricity required to move it; aerodynamically reversible and can “blow out.”", "Tandem HYD1 and HYD2 hydraulic actuators; RAT powers them if the HYD2 engine-driven pump fails. Mechanically controlled by the stick in both cockpits.", "Main stab trim: 28 VDC Essential Services Bus. Standby stab trim: Generator bus. Main stab trim is the only trim available after generator failure.", "Flaps to FULL only (no slats). Electrically controlled (ESS bus); hydraulically by HYD1 or wheel brake/emergency flap accumulator if \u003e2000 psi."], "ans": 3, "expl": "Flaps to FULL only (no slats). Electrically controlled (ESS bus); hydraulically by HYD1 or wheel brake/emergency flap accumulator if \u003e2000 psi."}, {"q": "Why use speed brakes on approach/landing?", "opts": ["Increase drag → higher required power/RPM → shorter engine spool-up; more thrust immediately available if speed brakes are retracted. HYD1 actuated, ESS-bus controlled; three-position throttle switch.", "Tandem HYD1 and HYD2 hydraulic actuators; RAT powers them if the HYD2 engine-driven pump fails. Mechanically controlled by the stick in both cockpits.", "Main stab trim: 28 VDC Essential Services Bus. Standby stab trim: Generator bus. Main stab trim is the only trim available after generator failure.", "Conventional unpowered rudder via pedals in both cockpits — no hydraulics or electricity required to move it; aerodynamically reversible and can “blow out.”"], "ans": 0, "expl": "Increase drag → higher required power/RPM → shorter engine spool-up; more thrust immediately available if speed brakes are retracted. HYD1 actuated, ESS-bus controlled; three-position throttle switch."}, {"q": "When is yaw damping available?", "opts": ["Weight-off-wheels and less than 108 KIAS.", "Weight-off-wheels and less than 217 KIAS.", "Weight-off-wheels and less than 434 KIAS.", "Weight-off-wheels and less than 227 KIAS."], "ans": 1, "expl": "Weight-off-wheels and less than 217 KIAS."}, {"q": "When is turn coordination (ARI) available?", "opts": ["Weight-off-wheels, \u003c434 KIAS, and FLAPS/SLATS lever at ½ or DOWN.", "Weight-off-wheels, \u003c108 KIAS, and FLAPS/SLATS lever at ½ or DOWN.", "Weight-off-wheels, \u003c217 KIAS, and FLAPS/SLATS lever at ½ or DOWN.", "Weight-off-wheels, \u003c227 KIAS, and FLAPS/SLATS lever at ½ or DOWN."], "ans": 2, "expl": "Weight-off-wheels, \u003c217 KIAS, and FLAPS/SLATS lever at ½ or DOWN."}, {"q": "When are rudder trim and SBI available?", "opts": ["Flaps full only (no slats)", "Neither — unpowered / mechanical", "With weight on or off wheels (lecture overview).", "Flaps/slats half or down"], "ans": 2, "expl": "With weight on or off wheels (lecture overview)."}, {"q": "Major flight control components listed in overview?", "opts": ["Electrically controlled via the 28 VDC Generator bus (will not work on battery/ESS-only).", "Ailerons: spring cartridge. Stabilator: spring cartridge + inertia weight + two viscous dampers.", "Half: flaps 25°, slats full 15°. Full/DN: flaps 50°, slats 15°. Electrically controlled (ESS bus), HYD1 actuated.", "Ailerons, stabilator, rudder, flaps/slats, speed brakes, control augmentation."], "ans": 3, "expl": "Ailerons, stabilator, rudder, flaps/slats, speed brakes, control augmentation."}, {"q": "Artificial feel for ailerons vs stabilator?", "opts": ["Electrically controlled via the 28 VDC Generator bus (will not work on battery/ESS-only).", "Half: flaps 25°, slats full 15°. Full/DN: flaps 50°, slats 15°. Electrically controlled (ESS bus), HYD1 actuated.", "Ailerons, stabilator, rudder, flaps/slats, speed brakes, control augmentation.", "Ailerons: spring cartridge. Stabilator: spring cartridge + inertia weight + two viscous dampers."], "ans": 3, "expl": "Ailerons: spring cartridge. Stabilator: spring cartridge + inertia weight + two viscous dampers."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= queue.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
</html>
