<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt span + span, #q-text { white-space: pre-line; }
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>

). Expected response: (none — IP watches lights/listens for 4 tones)"}, {"q": "What do you say on ICS at Throttle–OFF verify in the Engine Start checklist?", "opts": ["“Throttle off, GTS.”", "“Throttle off, start.”", "“GTS, throttle off, clear?”", "“Throttle idle, GTS.”"], "ans": 0, "expl": "[Google Doc walkthrough; Checklist Gouge (Obsidian); CNATRA Ground Ops video (McCain)] Front cockpit (you) → Rear cockpit (IP), ICS (intercom, no radio). Expected response: “Clear.”"}, {"q": "What do you say on ICS at the no exceedances / overflows step of the Post-Start checklist?", "opts": ["“No warnings, no cautions, 4 sats, quals counting down.”", "“No exceedances, no overflows, 4 sats, quals complete.”", "“No exceedances, 3 sats, quals counting up.”", "“No exceedances, no overflows, 4 sats, quals counting down.”"], "ans": 3, "expl": "[Google Doc walkthrough; Checklist Gouge (Obsidian); CNATRA Ground Ops video (McCain)] Front cockpit (you) → Rear cockpit (IP), ICS (intercom, no radio). Expected response: (IP acknowledges) Variants: Video: “No exceedances, no overflows, four sats, waiting on qual.”"}, {"q": "What do you say on ICS at the OBOGS flow test (mask on) in the Post-Start checklist?", "opts": ["“Flow test. Mask on in the back.”", "“Flow test. Mask on in the front.” (Doc: “Mask on, flow on”)", "“OBOGS off, mask on in the front.”", "“Mask off, flow off in the front.”"], "ans": 1, "expl": "[Checklist Gouge (Obsidian); Google Doc walkthrough; CNATRA Ground Ops video (McCain)] Front cockpit (you) → Rear cockpit (IP), ICS (intercom, no radio). Expected response: “Mask on in the rear.” Variants: Doc: “Mask on, Flow on” | Video: “Mask on, flow on in the front. OBOGS integrity check.” → “Mask on, flow on in back.”"}, {"q": "What do you say on ICS at LAW–TEST (after the BIT check) in the Post-Start checklist?", "opts": ["“Good BIT, LAW set 5,000.”", "“Good tone, BIT degraded.”", "“Good tone, good BIT.”", "“Good tone, no BIT.”"], "ans": 2, "expl": "[Google Doc walkthrough; Checklist Gouge (Obsidian); CNATRA Ground Ops video (McCain)] Front cockpit (you) → Rear cockpit (IP), ICS (intercom, no radio). Expected response: (IP acknowledges)"}, {"q": "What do you say over the radio when you call for your clearance during the CAUG BIT (Post-Start checklist, PRI Radio – obtain clearance)?", "opts": ["“Kingsville Clearance, BLAZR/HAWK 2XX, (Premont 2 on request), ready to copy.”", "“Kingsville Ground, BLAZR/HAWK 2XX, (Premont 2 on request), ready to copy.”", "“Kingsville Clearance, BLAZR/HAWK 2XX, IFR to Premont, request clearance.”", "“Kingsville Clearance, BLAZR/HAWK 2XX, taxi with information Alpha.”"], "ans": 0, "expl": "[Kingsville Comm Script; Checklist Gouge (Obsidian)] Front cockpit (you) → Kingsville Clearance, Ch 29 Pri — Kingsville Clearance Delivery (KNQI plate: 328.4). Expected response: “BLAZR/HAWK 2XX, you are cleared to Kingsville via the KINGS 3 Departure RICTO transition, Premont 2 coded route, on departure climb and maintain 7 thousand, expect 230 in 10, squawk 513X, Departure Local button 4.” Variants: CG: “expect higher in 10, departure local button 4, squawk 513X” (Script: “expect 230 in 10, SQUAWK 513X, Departure Local button 4”)."}, {"q": "…and what channel / frequency is that call on? (What you say when you call for your clearance during the CAUG BIT (Post-Start checklist, PRI Radio – obtain clearance))", "opts": ["Ch 29 Pri — Kingsville Clearance Delivery (KNQI plate: 328.4)", "Guard — 243.0 UHF / 121.5 VHF", "Ch 14 Pri — Kingsville Arrival discrete (Comm Script IFR; Doc says Ch 12)", "Ch 5 Pri — Kings 1A MOA common, 237.85 (Comm Script) / 238.75 (Checklist Gouge)"], "ans": 0, "expl": "[Kingsville Comm Script; Checklist Gouge (Obsidian)] “Kingsville Clearance, BLAZR/HAWK 2XX, (Premont 2 on request), ready to copy.” — Ch 29 Pri — Kingsville Clearance Delivery (KNQI plate: 328.4)."}, {"q": "What do you say over the radio when Clearance has read you the KINGS 3 clearance (readback)?", "opts": ["“BLAZR/HAWK 2XX is cleared to hange approved.”", "“Switching Departure, BLAZR/HAWK 2XX.”"], "ans": 0, "expl": "[Kingsville Comm Script] Front cockpit (you) → Kingsville Clearance, Ch 29 Pri — Kingsville Clearance Delivery (KNQI plate: 328.4). Expected response: (none — switch to Ground Ch 2)"}, {"q": "…and what channel / frequency is that call on? (What you say when Clearance says “read back correct, frequency change approved”)", "opts": ["Ch 2 Pri — Kingsville Ground (KNQI plate: 239.05)", "Ch 29 Pri — Kingsville Clearance Delivery (KNQI plate: 328.4)", "Ch 30 Pri — ATIS (KNQI plate: 282.25)", "Ch 12 Pri — Kingsville Arrival (VFR to initial)"], "ans": 1, "expl": "[Kingsville Comm Script] “BLAZR/HAWK 2XX, switching.” — Ch 29 Pri — Kingsville Clearance Delivery (KNQI plate: 328.4)."}, {"q": "What do you say on ICS at the Plane Captain checks (before signalling the PC)?", "opts": ["“Watch your knees.”", "“Watch your hands.”", "“Controls free, clear?”", "“Knees clear.”"], "ans": 0, "expl": "[Google Doc walkthrough; Checklist Gouge (Obsidian); CNATRA Ground Ops video (McCain)] Front cockpit (you) → Rear cockpit (IP), ICS (intercom, no radio). Expected response: “Clear.”"}, {"q": "What do you say on ICS when closing the canopy?", "opts": ["“Closing canopy, hands up.”", "“Canopy.”", "“Rail clear.”", "“Canopy clear.”"], "ans": 1, "expl": "[Google Doc walkthrough; Checklist Gouge (Obsidian); CNATRA Ground Ops video (McCain)] Front cockpit (you) → Rear cockpit (IP), ICS (intercom, no radio). Expected response: “Rail clear.” (Video: “Clear.”) Variants: Video response is just “Clear.”"}, {"q": "What do you say on ICS at Comm/Nav Equipment – VERIFY (end of Taxi checks)?", "opts": ["“Altimeter set __.__, indicating ___ (on standby, ___ on glass). VOR set ___.__. TACAN set ___. IFF set XXXX in standby. Taxi checks complete.”", "“Altimeter set 29.92, LAW set 5,000. Taxi checks complete.”", "“Altimeter set __.__, VOR set ___.__, TACAN set ___, IFF set XXXX in NORM. Taxi checks complete.”", "“Altimeter set __.__, indicating ___. IFF off. Takeoff checks complete.”"], "ans": 0, "expl": "[Google Doc walkthrough; Checklist Gouge (Obsidian); CNATRA Ground Ops video (McCain)] Front cockpit (you) → Rear cockpit (IP), ICS (intercom, no radio). Expected response: (IP acknowledges) — Video: “Altimeter set 29.92, VOR 110.1, TACAN set 56X in back.” Variants: CG/Doc drop “on standby/on glass” in places; Video: “Taxi and instrument checks. Altimeter set 29.92, VOR set 110.10, TACAN set 56X, squawking 4230, standby.”"}, {"q": "What do you say on ICS at Ejection Seat in the Takeoff checklist (ready to arm)?", "opts": ["“Attached 4 points, pins removed, ready to arm in front.”", "“Attached 8 points, pins removed, armed in front.”", "“Attached 8 points, pins installed, ready to arm in front.”", "“Attached 8 points, pins removed, ready to arm in front.”"], "ans": 3, "expl": "[Google Doc walkthrough; Checklist Gouge (Obsidian); CNATRA Ground Ops video (McCain)] Front cockpit (you) → Rear cockpit (IP), ICS (intercom, no radio). Expected response: “Attached 8 points, pins removed, armed in back.” Variants: CG prefixes the full Takeoff checklist: “CAUG set ALL, light extinguished. Anti-Skid ON, light on. Flaps/Slats set half, indicating half, slats visually confirmed down. Trim set 2 degrees nose up. Canopy is locked light out seal inflated. Harness unlocked, attached eight points, pins removed, ready to arm in the front.”"}, {"q": "What do you say on ICS when the back seat says “armed in back” (Takeoff checklist complete)?", "opts": ["“Armed in front. Taxi checks complete.”", "“Ready to arm in front.”", "“Safe in front. Takeoff checks complete.”", "“Armed in front. Takeoff checks complete.”"], "ans": 3, "expl": "[Google Doc walkthrough; Checklist Gouge (Obsidian); CNATRA Ground Ops video (McCain)] Front cockpit (you) → Rear cockpit (IP), ICS (intercom, no radio)."}, {"q": "What do you say over the radio when you leave the Marshall area and check in with Ground?", "opts": ["“Kingsville Ground, B let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= queue.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
