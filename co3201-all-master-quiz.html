* { box-sizing: border-box; }
html { font-size: 16px; }
body {

}
a { color: var(--accent); text-decoration: none; }

.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {

  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }

}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt span + span, #q-text { white-space: pre-line; }
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}

<script>
const QUESTIONS = [{"q": "For a heading change of less than 30 degrees, what bank angle is used?", "opts": ["30 degrees AOB", "10% of the heading change", "A bank angle that equals the heading change", "Half the heading change"], "ans": 2, "expl": "Correct: A bank angle that equals the heading change · Source: \"For turns of less than 30 degrees of heading change, use a bank angle that equals that change.\""}, {"q": "A heading change from 020 to 045 degrees is required. What bank angle?", "opts": ["45 degrees", "25 degrees", "20 degrees", "30 degrees"], "ans": 1, "expl": "Correct: 25 degrees · Source: \"For example, if a heading change from 020 degrees to 045 degrees were required (a 25-degree change), you would use a bank angle of 25 degrees.\""}, {"q": "If the heading change is 30 degrees or greater, what bank angle is used?", "opts": ["30 degrees", "45 degrees", "Equal to the heading change", "25 degrees"], "ans": 0, "expl": "Correct: 30 degrees · Source: \"If the heading change is 30 degrees or greater, use a bank angle of 30 degrees.\""}, {"q": "Prior to entering a normal turn you should be:", "opts": ["In a slight climb with nose-up trim", "Slightly nose low with power reduced", "In straight-and-level flight with trim properly set", "At MRT with speed brakes in"], "ans": 2, "expl": "Correct: In straight-and-level flight with trim properly set · Source: \"Prior to entering the turn, you should be in straight-and-level flight with trim properly set.\""}, {"q": "As you roll into the turn you lose some vertical component of lift, so you must:", "opts": ["Extend the speed brakes", "Add forward stick and reduce power", "Reduce power and lower the nose", "Add power and aft stick (trim) to compensate"], "ans": 3, "expl": "Correct: Add power and aft stick (trim) to compensate · Source: \"As you roll into the turn, you will lose some of the vertical component of lift, so you'll have to add power and aft stick (trim) to compensate.\""}, {"q": "What lead point is used for initiating the roll-out?", "opts": ["Approximately 10% of the angle of bank", "5 degrees regardless of bank", "Approximately 1% of ground speed", "Approximately 10% of VSI"], "ans": 0, "expl": "Correct: Approximately 10% of the angle of bank · Source: \"Use a lead point of approximately 10% of the angle of bank for initiating your roll-out.\""}, {"q": "As you roll out of the turn the aircraft has a tendency to:", "opts": ["Descend, because vertical lift decreases", "Climb, because the vertical component of lift increases", "Yaw toward the turn", "Slow down"], "ans": 1, "expl": "Correct: Climb, because the vertical component of lift increases · Source: \"As you roll out of the turn, the vertical component of lift will increase and the aircraft will have a tendency to climb.\""}, {"q": "To counteract the climb tendency on roll-out you:", "opts": ["Lower the nose to level flight reference and reduce power to the pre-turn setting", "Extend speed brakes", "Raise the nose and add power", "Hold the turn trim and reduce power to idle"], "ans": 0, "expl": "Correct: Lower the nose to level flight reference and reduce power to the pre-turn setting · Source: \"To counteract this, lower the nose attitude back to level flight reference and reduce power to the pre-turn setting.\""}, {"q": "Any aft stick or trim added during the turn must:", "opts": ["Be left in for level flight", "Come out when the turn is complete", "Be held for the next turn", "Be doubled on roll-out"], "ans": 1, "expl": "Correct: Come out when the turn is complete · Source: \"Any aft stick or trim added during the turn will have to come out when the turn is complete.\""}, {"q": "Normal turns summary — Throttle:", "opts": ["Increase as needed to maintain airspeed", "Reduce as needed to maintain altitude", "Set MRT", "No change"], "ans": 0, "expl": "Correct: Increase as needed to maintain airspeed · Source: \"Throttle: Increase as needed to maintain airspeed\""}, {"q": "Normal turns summary — Pitch:", "opts": ["As required to maintain level flight", "Hold the pre-turn attitude exactly", "Approximately 10 degrees nose down", "2-3 degrees above level flight attitude"], "ans": 0, "expl": "Correct: As required to maintain level flight · Source: \"Pitch: As required to maintain level flight\""}, {"q": "Normal turns summary — Lead point for roll-out:", "opts": ["20% AOB", "1% ground speed", "5 kts", "10% AOB"], "ans": 3, "expl": "Correct: 10% AOB · Source: \"Lead point for roll-out: 10% AOB\""}, {"q": "Using the 10% AOB lead, roll-out from a 30-degree AOB turn begins about how many degrees before the desired heading?", "opts": ["10 degrees", "30 degrees", "3 degrees", "1 degree"], "ans": 2, "expl": "Correct: 3 degrees · Source: \"Use a lead point of approximately 10% of the angle of bank for initiating your roll-out.\""}, {"q": "The turn pattern consists of:", "opts": ["Three turns in the same direction", "Two pairs of left and right turns", "Three pairs of left and right turns", "Four pairs of turns"], "ans": 2, "expl": "Correct: Three pairs of left and right turns · Source: \"Consisting of three pairs of left and right turns, the turn pattern gives you practice in smoothly performing a series of linked turns at a constant altitude and airspeed.\""}, {"q": "Turn pattern, first set: 30-degree AOB turns for how much heading change each?", "opts": ["45 degrees", "60 degrees", "30 degrees", "90 degrees"], "ans": 1, "expl": "Correct: 60 degrees · Source: \"The turn consists of two 30-degree angle of bank turns for 60 degrees of heading change each, two 45-degree AOB turns for 90 degrees of heading change each, and two 60-degree AOB turns for 120 degrees of heading change each.\""}, {"q": "Turn pattern, second set: 45-degree AOB turns for how much heading change each?", "opts": ["60 degrees", "45 degrees", "120 degrees", "90 degrees"], "ans": 3, "expl": "Correct: 90 degrees · Source: \"The turn consists of two 30-degree angle of bank turns for 60 degrees of heading change each, two 45-degree AOB turns for 90 degrees of heading change each, and two 60-degree AOB turns for 120 degrees of heading change each.\""}, {"q": "Turn pattern, third set: 60-degree AOB turns for how much heading change each?", "opts": ["60 degrees", "120 degrees", "180 degrees", "90 degrees"], "ans": 1, "expl": "Correct: 120 degrees · Source: \"The turn consists of two 30-degree angle of bank turns for 60 degrees of heading change each, two 45-degree AOB turns for 90 degrees of heading change each, and two 60-degree AOB turns for 120 degrees of heading change each.\""}, {"q": "Which correctly lists the turn pattern sets (AOB / heading change)?", "opts": ["30/60, 45/90, 60/120", "20/45, 30/90, 45/120", "30/60, 45/120, 60/90", "30/90, 45/60, 60/120"], "ans": 0, "expl": "Correct: 30/60, 45/90, 60/120 · Source: \"The turn consists of two 30-degree angle of bank turns for 60 degrees of heading change each, two 45-degree AOB turns for 90 degrees of heading change each, and two 60-degree AOB turns for 120 degrees of heading change each.\""}, {"q": "How do you set 45 degrees of bank on the ADI?", "opts": ["Place the pointer one third of the way past 30", "Use the HUD pitch ladder only", "Place the bank angle pointer halfway between the 30- and 60-degree scale markers", "Use the 45-degree scale marker"], "ans": 2, "expl": "Correct: Place the bank angle pointer halfway between the 30- and 60-degree scale markers · Source: \"Since there are no 45-degree bank angle scale markers on the ADI display, you must place the bank angle pointer halfway between the 30-degree and 60-degree bank angle scale markers.\""}, {"q": "Turn reversals in the turn pattern are executed:", "opts": ["After a full stop on original heading for 1 minute", "With a 10-second wings-level pause", "Smoothly, with no straight-and-level legs", "With a 5-second straight-and-level leg"], "ans": 2, "expl": "Correct: Smoothly, with no straight-and-level legs · Source: \"Execute the turn reversals smoothly, with no straight-and-level legs.\""}, {"q": "At the end of the turn pattern you:", "opts": ["Recover 120 degrees off original heading", "Recover on the reciprocal heading", "Climb to the next altitude", "Recover wings level on original heading"], "ans": 3, "expl": "Correct: Recover wings level on original heading · Source: \"At the end of the maneuver, recover wings level on original heading.\""}, {"q": "Airspeed maintained throughout the turn pattern:", "opts": ["250 KIAS", "150 KIAS", "200 KIAS", "300 KIAS"], "ans": 0, "expl": "Correct: 250 KIAS · Source: \"Throughout the maneuver, maintain altitude and 250 KIAS, adding more aft stick and more power for each set of turns.\""}, {"q": "For each successive set of turns in the turn pattern you add:", "opts": ["More forward stick", "More aft stick and more power", "Less power and more aft stick", "Speed brakes"], "ans": 1, "expl": "Correct: More aft stick and more power · Source: \"Throughout the maneuver, maintain altitude and 250 KIAS, adding more aft stick and more power for each set of turns.\""}, {"q": "When reversing turns, to avoid gaining altitude you:", "opts": ["Add power as you apply reverse aileron", "Pull more back stick through the reversal", "Extend the speed brakes", "Ease the back stick as you apply reverse aileron"], "ans": 3, "expl": "Correct: Ease the back stick as you apply reverse aileron · Source: \"When reversing turns, ease the back stick as you apply reverse aileron in order to avoid gaining altitude.\""}, {"q": "A 1/2 standard-rate turn is performed at what rate?", "opts": ["3 degrees per second", "1-1/2 degrees per second", "2 degrees per second", "1 degree per second"], "ans": 1, "expl": "Correct: 1-1/2 degrees per second · Source: \"A 1/2 standard-rate turn (1/2 SRT) is performed at 1-1/2 degrees per second.\""}, {"q": "At 1/2 SRT, a 30-degree heading change takes:", "opts": ["10 seconds", "15 seconds", "30 seconds", "20 seconds"], "ans": 3, "expl": "Correct: 20 seconds · Source: \"Therefore, a heading change of 30 degrees will take 20 seconds to complete.\""}, {"q": "To achieve the 1/2 SRT rate at different airspeeds you must:", "opts": ["Hold 30 degrees AOB", "Vary the bank angle", "Vary the altitude", "Vary the power only"], "ans": 1, "expl": "Correct: Vary the bank angle · Source: \"To accomplish this rate at different airspeeds, you will have to vary the bank angle.\""}, {"q": "Rule of thumb for 1/2 SRT bank angle between 15,000 and 20,000 ft:", "opts": ["Approximately 10 percent of ground speed", "Always 30 degrees", "Approximately 10 percent of indicated airspeed", "Approximately 15 percent of indicated airspeed"], "ans": 2, "expl": "Correct: Approximately 10 percent of indicated airspeed · Source: \"A good rule of thumb for determining bank angle between 15,000 and 20,000 ft is to use approximately 10 percent of indicated airspeed.\""}, {"q": "The 10%-of-KIAS rule of thumb applies between which altitudes?", "opts": ["5,000 and 10,000 ft", "20,000 and 25,000 ft", "15,000 and 20,000 ft", "10,000 and 15,000 ft"], "ans": 2, "expl": "Correct: 15,000 and 20,000 ft · Source: \"A good rule of thumb for determining bank angle between 15,000 and 20,000 ft is to use approximately 10 percent of indicated airspeed.\""}, {"q": "At higher altitudes, a 1/2 SRT requires:", "opts": ["Exactly 30 degrees", "More bank than 10 percent of indicated airspeed", "Less bank than 10 percent of indicated airspeed", "Exactly 10 percent of indicated airspeed"], "ans": 1, "expl": "Correct: More bank than 10 percent of indicated airspeed · Source: \"At higher altitudes, you will need more bank than 10 percent of indicated airspeed, while at lower altitudes you will need less bank than 10 percent of indicated airspeed to maintain a 1/2 SRT.\""}, {"q": "At lower altitudes, a 1/2 SRT requires:", "opts": ["More bank than 10 percent of indicated airspeed", "Exactly 10 percent of indicated airspeed", "Twice 10 percent of indicated airspeed", "Less bank than 10 percent of indicated airspeed"], "ans": 3, "expl": "Correct: Less bank than 10 percent of indicated airspeed · Source: \"At higher altitudes, you will need more bank than 10 percent of indicated airspeed, while at lower altitudes you will need less bank than 10 percent of indicated airspeed to maintain a 1/2 SRT.\""}, {"q": "At 250 KIAS and 18,000 ft, 1/2 SRT bank angle is approximately:", "opts": ["20 degrees", "25 degrees", "18 degrees", "30 degrees"], "ans": 1, "expl": "Correct: 25 degrees · Source: \"For example, at 250 KIAS and 18,000 ft, the bank angle would be approximately 25 degrees.\""}, {"q": "To establish and maintain a 1/2 SRT at any altitude, adjust bank to achieve:", "opts": ["Half a needle-width of deflection", "One needle-width of deflection on the turn needle", "Two needle-widths of deflection", "A 1,000 fpm VSI"], "ans": 1, "expl": "Correct: One needle-width of deflection on the turn needle · Source: \"Establishing and maintaining a 1/2 standard-rate turn at any altitude requires that you monitor the turn needle and adjust the bank angle as necessary to achieve one needle-width of deflection.\""}, {"q": "The power setting for increasing airspeed depends on:", "opts": ["The bank angle", "The altitude", "The aircraft gross weight", "The magnitude of the desired change"], "ans": 3, "expl": "Correct: The magnitude of the desired change · Source: \"The power setting you use for increasing airspeed depends on the magnitude of the desired change.\""}, {"q": "For an airspeed increase of less than 20 kts, you:", "opts": ["Lower the nose only", "Advance the throttle beyond the setting for the new airspeed, then reduce to the approximate setting to maintain it", "Advance to MRT, then reduce at a 5-kt lead", "Advance exactly to the new-airspeed setting and wait"], "ans": 1, "expl": "Correct: Advance the throttle beyond the setting for the new airspeed, then reduce to the approximate setting to maintain it · Source: \"For an airspeed increase of less than 20 kts, you should advance the throttle beyond the power setting for the new airspeed, allowing the airspeed to increase, and then reduce the power to the approximate setting to maintain the new airspeed.\""}, {"q": "For airspeed increases greater than 20 kts, advance the power to:", "opts": ["Approximately 1,500 pph", "MRT", "Flight IDLE", "Just beyond the setting for the new airspeed"], "ans": 1, "expl": "Correct: MRT · Source: \"For airspeed increases greater than 20 kts, advance the power to MRT.\""}, {"q": "Speed increase greater than 20 kts: at what lead do you reduce the throttle?", "opts": ["2 kts from the desired airspeed", "20 kts from the desired airspeed", "10 kts from the desired airspeed", "5 kts from the desired airspeed"], "ans": 3, "expl": "Correct: 5 kts from the desired airspeed · Source: \"Then, at a lead of 5 kts from the desired airspeed, reduce the throttle setting to approximately that required for the new speed.\""}, {"q": "The MRT / 5-kt lead method is used when practicing which T-45C speed change?", "opts": ["200 to 220 KIAS", "200 to 250 KIAS", "250 to 200 KIAS", "150 to 200 KIAS"], "ans": 1, "expl": "Correct: 200 to 250 KIAS · Source: \"Use this method when you practice the speed change from 200 to 250 KIAS in the T-45C.\""}, {"q": "For a normal airspeed decrease you:", "opts": ["Reduce power exactly to the new setting", "Reduce power below the requirement for the desired airspeed, then at a 5-kt lead advance power as required", "Reduce to idle and extend speed brakes always", "Raise the nose without changing power"], "ans": 1, "expl": "Correct: Reduce power below the requirement for the desired airspeed, then at a 5-kt lead advance power as required · Source: \"To perform normal airspeed decreases, reduce the power below the power requirement for the desired airspeed, allowing the airspeed to decrease, and then at a lead point of 5 kts, advance power as required for the new airspeed.\""}, {"q": "Lead point for advancing power in a normal airspeed decrease:", "opts": ["5 kts",  to sound and report \"Platform\"?", "opts": ["5000 feet MSL", "1,500 feet AGL", "5000 feet AGL", "10,000 feet AGL"], "ans": 2, "expl": "Correct: 5000 feet AGL · Source: \"Anticipate reaching 5000 feet AGL, allow the LAW to sound, report \"Platform\" and retract the speed brakes, if still extended.\""}, {"q": "HI TACAN — the call made at 5000 feet AGL is:", "opts": ["\"Platform\"", "\"Leaving altitude\"", "\"Gear down\"", "\"Minimums\""], "ans": 0, "expl": "Correct: \"Platform\" · Source: \"Anticipate reaching 5000 feet AGL, allow the LAW to sound, report \"Platform\" and retract the speed brakes, if still extended.\""}, {"q": "HI TACAN — after Platform you:", "opts": ["Shallow the descent IAW the minute to live rule and reset the LAW to the next altitude restriction", "Increase descent to 6,000 fpm", "Extend the speed brakes", "Configure for landing immediately"], "ans": 0, "expl": "Correct: Shallow the descent IAW the minute to live rule and reset the LAW to the next altitude restriction · Source: \"Shallow descent IAW the minute to live rule and reset the LAW to the next altitude restriction as directed in your wing's SOP.\""}, {"q": "Lead turns onto and off of the arc by:", "opts": ["2.0 nm always", "10% of your AOB", "1% of your ground speed", "10% of your ground speed"], "ans": 2, "expl": "Correct: 1% of your ground speed · Source: \"Lead all turns onto and off of the arc by 1% of your ground speed.\""}, {"q": "Published \"Lead Radials\" (LR's) provide what lead?", "opts": ["5 nm", "1% of ground speed", "1.0 nm", "2.0 nm"], "ans": 3, "expl": "Correct: 2.0 nm · Source: \"Published \"Lead Radials\" (LR's) provide 2.0 nm lead to assist in turning to an intermediate or final approach course.\""}, {"q": "The decelerating level speed change in a 1/2 SRT practiced in BI advances the aircraft approximately:", "opts": ["0.5 NM", "1 NM", "5 NM", "2 NM"], "ans": 3, "expl": "Correct: 2 NM · Source: \"The decelerating level speed change in a 1/2 standard rate turn practiced in BI will advance the aircraft approximately 2 NM.\""}, {"q": "If turns are flown at 250 KIAS, lead required is:", "opts": ["Slightly more", "The same", "Slightly less", "Double"], "ans": 0, "expl": "Correct: Slightly more · Source: \"Slightly more lead will be required if turns are flown at 250 KIAS.\""}, {"q": "TACAN — slow to 200 KIAS at:", "opts": ["3-5 nm prior to the FAF", "At the FAF", "5-7 nm prior to the FAF", "10 nm prior to the FAF"], "ans": 2, "expl": "Correct: 5-7 nm prior to the FAF · Source: \"At 5-7 nm prior to the FAF, slow to 200 KIAS.\""}, {"q": "TACAN — configure for landing and perform the landing checklist at:", "opts": ["5-7 nm prior to FAF", "At the IAF", "3-5 nm prior to FAF (speed brakes retracted)", "At the FAF"], "ans": 2, "expl": "Correct: 3-5 nm prior to FAF (speed brakes retracted) · Source: \"Configure the aircraft for landing 3-5 nm prior to FAF and perform landing checklist (Speed brakes retracted).\""}, {"q": "TACAN — to the FAF you maintain:", "opts": ["Speed brakes extended", "Published course and altitude", "1,000 fpm descent", "250 KIAS"], "ans": 1, "expl": "Correct: Published course and altitude · Source: \"Maintain published course and altitude to the FAF.\""}, {"q": "Lead all level offs by:", "opts": ["1% of your ground speed", "10% of your VSI", "10% of AOB", "100 ft always"], "ans": 1, "expl": "Correct: 10% of your VSI · Source: \"Lead all level offs by 10% of your VSI.\""}, {"q": "Using the 10% VSI rule, at 1,000 fpm you begin the level off about:", "opts": ["1,000 ft prior", "300 ft prior", "10 ft prior", "100 ft prior"], "ans": 3, "expl": "Correct: 100 ft prior · Source: \"Lead all level offs by 10% of your VSI.\""}, {"q": "Low altitude TACAN/VOR DME approach procedures are:", "opts": ["Completely different from a penetration", "Flown with no speed brakes ever", "Essentially the same as those used for a high altitude penetration", "Flown only at 250 KIAS"], "ans": 2, "expl": "Correct: Essentially the same as those used for a high altitude penetration · Source: \"When executing a low altitude TACAN/VOR DME approach, the procedures are essentially the same as those used for a high altitude penetration.\""}, {"q": "TERPS speed criteria used when designing low altitude approaches:", "opts": ["250 knot", "180 knot", "150 knot", "200 knot"], "ans": 3, "expl": "Correct: 200 knot · Source: \"When designing low altitude approaches, a 200 knot Terminal Instrument Procedures (TERPS) speed criteria is used.\""}, {"q": "Approaches involving a procedure turn should be flown at a maximum of:", "opts": ["230 KIAS", "150 KIAS", "200 KIAS", "250 KIAS"], "ans": 2, "expl": "Correct: 200 KIAS · Source: \"As discussed earlier, approaches involving a procedure turn should be flown at a maximum airspeed of 200 KIAS.\""}, {"q": "A long No PT track or arc:", "opts": ["May be flown at a higher airspeed if traffic permits", "Must be flown at 150 KIAS", "Must be flown at exactly 200 KIAS", "Must be flown dirty"], "ans": 0, "expl": "Correct: May be flown at a higher airspeed if traffic permits · Source: \"A long No PT track or arc may be flown at a higher airspeed if traffic permits.\""}, {"q": "At the higher speed on a No PT track or arc, consider:", "opts": ["The lower fuel flow", "Reduced lead", "The smaller turn radius", "The larger turn radius required"], "ans": 3, "expl": "Correct: The larger turn radius required · Source: \"Consideration should be given to the larger turn radius required at the higher speed.\""}, {"q": "Speed brakes may be unnecessary prior to the FAF if:", "opts": ["Slowing from 250 KIAS is not required prior to transitioning to the landing configuration", "Winds are calm", "You are above 5000 ft AGL", "The approach has a procedure turn"], "ans": 0, "expl": "Correct: Slowing from 250 KIAS is not required prior to transitioning to the landing configuration · Source: \"Speed brakes may be unnecessary prior to the FAF if slowing from 250 KIAS is not required prior to transitioning to the landing configuration.\""}, {"q": "At the FAF (TACAN) you:", "opts": ["Report leaving altitude and retract speed brakes", "Start the clock, extend speed brakes, report landing checklist complete on the ICS, make gear down call to ATC", "Report Platform and reset the LAW", "Configure for landing and slow to 200 KIAS"], "ans": 1, "expl": "Correct: Start the clock, extend speed brakes, report landing checklist complete on the ICS, make gear down call to ATC · Source: \"At the FAF, start the clock, extend speed brakes, report landing checklist complete on the ICS and make gear down call to ATC.\""}, {"q": "At the FAF, the landing checklist complete report is made on ___ and the gear down call to ___.", "opts": ["ICS; ATC", "ICS; Base", "Tower; ICS", "ATC; ICS"], "ans": 0, "expl": "Correct: ICS; ATC · Source: \"At the FAF, start the clock, extend speed brakes, report landing checklist complete on the ICS and make gear down call to ATC.\""}, {"q": "Speed brake extension at the FAF requires:", "opts": ["Reduced power", "No control input", "Aft stick to counter the pitch down", "Forward stick pressure to counter the pitch up"], "ans": 3, "expl": "Correct: Forward stick pressure to counter the pitch up · Source: \"Forward stick pressure will be required to counter the pitch up due to speed brake extension.\""}, {"q": "After the FAF, descend to the MDA while monitoring ___ for the MAP.", "opts": ["The VSI", "Your DME", "The clock only", "The radar altimeter"], "ans": 1, "expl": "Correct: Your DME · Source: \"Descend to the MDA and start looking for the runway while monitoring your DME for the MAP.\""}, {"q": "Plan your descent to be in level flight at the MDA:", "opts": ["Prior to reaching the MAP", "At the MAP", "After the MAP", "At the FAF"], "ans": 0, "expl": "Correct: Prior to reaching the MAP · Source: \"Plan your descent to be in level flight at the MDA prior to reaching the MAP.\""}, {"q": "Maximum descent rate from the FAF (TACAN):", "opts": ["500 fpm", "2,000 fpm", "1,000 fpm", "1,500 fpm"], "ans": 2, "expl": "Correct: 1,000 fpm · Source: \"Do not exceed 1,000 fpm.\""}, {"q": "Keep heading changes small so you don't chase:", "opts": ["The final approach course on the HSI or the course situation steering arrow on the HUD", "The glidepath", "The DME", "The VSI"], "ans": 0, "expl": "Correct: The final approach course on the HSI or the course situation steering arrow on the HUD · Source: \"Keep heading changes small so you don't chase the final approach course on the HSI display or the course situation steering arrow on the HUD.\""}, {"q": "Approximately 100 feet prior to the MDA you:", "opts": ["Retract speed brakes only", "Add MRT", "Reduce about 300 pph and push forward", "Add about 300 pph fuel flow and apply slight backstick pressure"], "ans": 3, "expl": "Correct: Add about 300 pph fuel flow and apply slight backstick pressure · Source: \"Approximately 100 feet prior to the MDA, add about 300 pph fuel flow and apply slight backstick pressure to level off at MDA.\""}, {"q": "How much fuel flow is added to level off at MDA?", "opts": ["About 100 pph", "About 700 pph", "About 1,500 pph", "About 300 pph"], "ans": 3, "expl": "Correct: About 300 pph · Source: \"Approximately 100 feet prior to the MDA, add about 300 pph fuel flow and apply slight backstick pressure to level off at MDA.\""}, {"q": "At the MAP without the runway environment in sight or unable to land safely:", "opts": ["Descend 100 ft below MDA", "Continue to the DA", "Enter holding", "Execute a missed approach"], "ans": 3, "expl": "Correct: Execute a missed approach · Source: \"When you reach the MAP, if you don't have the runway environment in sight or determine that a safe landing is not possible, execute a missed approach.\""}, {"q": "The two basic types of ground-controlled approaches are:", "opts": ["PAR and ASR", "TACAN and ASR", "PAR and VOR", "ILS and PAR"], "ans": 0, "expl": "Correct: PAR and ASR · Source: \"There are two basic types of ground-controlled approaches—the precision radar approach (PAR) and the surveillance radar approach (ASR).\""}, {"q": "A PAR provides:", "opts": ["Precise course, glidepath, and range information (precision approach)", "Course and range only (non-precision)", "Glidepath only", "Course, range and recommended altitudes only"], "ans": 0, "expl": "Correct: Precise course, glidepath, and range information (precision approach) · Source: \"A PAR provides you with precise course, glidepath, and range information and is classified as a precision approach.\""}, {"q": "An ASR provides:", "opts": ["Glideslope only", "Precise course and glidepath", "Lower resolution course and range information only (no glideslope); non-precision", "Course, glidepath and range; precision"], "ans": 2, "expl": "Correct: Lower resolution course and range information only (no glideslope); non-precision · Source: \"An ASR (commonly referred to as a surveillance approach) provides lower resolution course and range information only (no glideslope) and is classified as a non-precision approach.\""}, {"q": "Glideslope is defined as:", "opts": ["The descent angle assigned to an approach to a given runway for obstacle clearance and/or signal reception", "The 300 ft per mile recommended altitudes", "The VSI on final", "The portion of a precision approach that intercepts the azimuth of an ILS or the FAC of a PAR"], "ans": 0, "expl": "Correct: The descent angle assigned to an approach to a given runway for obstacle clearance and/or signal reception · Source: \"Glideslope is defined as the descent angle assigned to an approach to a given runway for obstacle clearance and/or signal reception.\""}, {"q": "Glidepath is defined as:", "opts": ["The descent angle assigned for obstacle clearance", "The portion of a precision approach that intercepts the azimuth of an ILS approach or the FAC of a PAR approach", "The penetration descent", "The ASR recommended altitudes"], "ans": 1, "expl": "Correct: The portion of a precision approach that intercepts the azimuth of an ILS approach or the FAC of a PAR approach · Source: \"Glidepath is defined as the portion of a precision approach that intercepts the azimuth of an ILS approach or the FAC of a PAR approach.\""}, {"q": "PAR and ASR approaches are divided into which two segments?", "opts": ["Initial pattern and final approach", "Arc and final", "Penetration and final", "Downwind and base"], "ans": 0, "expl": "Correct: Initial pattern and final approach · Source: \"Both the PAR and ASR approaches are divided into two segments, initial pattern and final approach.\""}, {"q": "During the initial pattern of an ASR or PAR you are guided by:", "opts": ["Surveillance radar", "TACAN", "ILS", "Precision radar"], "ans": 0, "expl": "Correct: Surveillance radar · Source: \"During the initial pattern of an ASR or PAR approach, you will be guided by surveillance radar.\""}, {"q": "The initial pattern segment ends when the aircraft is inbound on the FAC at approximately:", "opts": ["5 nm from touchdown", "8 nm from touchdown", "10 nm from touchdown", "3 nm from touchdown"], "ans": 1, "expl": "Correct: 8 nm from touchdown · Source: \"This segment includes all maneuvering up to the point at which your aircraft is inbound on the final approach course and at approximately 8 nm from touchdown.\""}, {"q": "During the transition to final, the GCA controller directs:", "opts": ["Your headings and altitudes", "Only your altimeter setting", "Your fuel flow", "Your airspeed and configuration"], "ans": 0, "expl": "Correct: Your headings and altitudes · Source: \"During the transition to final, the GCA controller will direct your headings and altitudes.\""}, {"q": "Controller instructions to initiate turns and descents should be complied with:", "opts": ["Only after landing checks", "Immediately", "Within 10 seconds", "After readback is acknowledged"], "ans": 1, "expl": "Correct: Immediately · Source: \"All controller instructions to initiate turns and descents should be complied with immediately.\""}, {"q": "In the GCA pattern, turns are:", "opts": ["Not to exceed 45 degrees AOB", "20 degrees AOB maximum", "Half standard rate, not to exceed 10 degrees", "Standard rate, not to exceed 30 degrees AOB"], "ans": 3, "expl": "Correct: Standard rate, not to exceed 30 degrees AOB · Source: \"In the pattern, maintain standard rate turns not to exceed 30 degrees AOB.\""}, {"q": "On final, AOB should approximate the degrees to be turned, not to exceed:", "opts": ["Standard rate (30 degrees AOB)", "Half standard rate (approximately 10 degrees AOB)", "20 degrees AOB", "5 degrees AOB"], "ans": 1, "expl": "Correct: Half standard rate (approximately 10 degrees AOB) · Source: \"On final, your AOB should approximate the number of degrees to be turned not to exceed half standard rate (approximately 10 degrees AOB).\""}, {"q": "Good technique for AOB turning base to final:", "opts": ["20 degrees", "10 degrees", "30 degrees", "45 degrees"], "ans": 0, "expl": "Correct: 20 degrees · Source: \"A good technique is 30 degrees AOB in pattern, 20 degrees AOB turning base to final.\""}, {"q": "Good technique for AOB in the GCA pattern:", "opts": ["45 degrees", "20 degrees", "10 degrees", "30 degrees"], "ans": 3, "expl": "Correct: 30 degrees · Source: \"A good technique is 30 degrees AOB in pattern, 20 degrees AOB turning base to final.\""}, {"q": "Once on final, max AOB for heading corrections to course:", "opts": ["10 degrees", "5 degrees", "20 degrees", "30 degrees"], "ans": 0, "expl": "Correct: 10 degrees · Source: \"Once on final, do not exceed 10 degrees AOB for heading corrections to course.\""}, {"q": "Radar approach minimums can be found:", "opts": ["Only in the NATOPS", "Only from the controller", "Only on the ATIS", "In FLIP instrument approach procedure publications — on the approach plates and in the radar approach minimums section"], "ans": 3, "expl": "Correct: In FLIP instrument approach procedure publications — on the approach plates and in the radar approach minimums section · Source: \"Radar approach minimums can be found in the FLIP instrument approach procedure publications, both on the approach plates and in the radar approach minimums section (Figure 6-29).\""}, {"q": "Absolute minimums when single-piloted:", "opts": ["200-1/2", "100-1/4", "300-1", "400-1"], "ans": 0, "expl": "Correct: 200-1/2 · Source: \"Although some published approach minimums are lower than 200-1/2, you are limited to absolute minimums of 200-1/2 when single-piloted.\""}, {"q": "During a GCA, the controller continuously feeds you:", "opts": ["Only altitude information", "Only position reports", "Glidepath information on both PAR and ASR", "Course and heading information, and on a PAR, glidepath information on final"], "ans": 3, "expl": "Correct: Course and heading information, and on a PAR, glidepath information on final · Source: \"During a GCA, your position in the pattern and on final will be directed by a controller who will continuously feed you course and heading information and, in the case of a PAR approach, glidepath information on final.\""}, {"q": "In the GCA pattern you must acknowledge all radio calls and read back:", "opts": ["Only headings", "Nothing — just acknowledge", "Only altimeter settings", "All headings, altitudes, and altimeter settings"], "ans": 3, "expl": "Correct: All headings, altitudes, and altimeter settings · Source: \"In the pattern, you are required to acknowledge all radio calls and read back all headings, altitudes, and altimeter settings.\""}, {"q": "Per FAR 7110.65 the controller is required to give:", "opts": ["Weather always and fuel state", "Missed approach instructions, weather (if less than VFR), altimeter, and lost comm instructions (if likely to encounter IMC)", "Runway, wind and traffic only", "Only the altimeter"], "ans": 1, "expl": "Correct: Missed approach instructions, weather (if less than VFR), altimeter, and lost comm instructions (if likely to encounter IMC) · Source: \"According to FAR 7110.65, the controller is required to give missed approach instructions, weather conditions (if less than VFR), altimeter, and lost comm instructions (if likely to encounter IMC).\""}, {"q": "Per FAR 7110.65, weather conditions are given when:", "opts": ["Only if IMC on final", "Only on request", "Less than VFR", "Always"], "ans": 2, "expl": "Correct: Less than VFR · Source: \"...weather conditions (if less than VFR)...\""}, {"q": "Per FAR 7110.65, lost comm instructions are given when:", "opts": ["Likely to encounter IMC", "Always", "Only on PAR", "Only if less than VFR at the field"], "ans": 0, "expl": "Correct: Likely to encounter IMC · Source: \"...lost comm instructions (if likely to encounter IMC).\""}, {"q": "In the pattern, the controller must communicate with you at least:", "opts": ["Once a minute", "Every 15 seconds", "Every 30 seconds", "Every 5 seconds"], "ans": 0, "expl": "Correct: Once a minute · Source: \"In the pattern, the controller must communicate with you at least once a minute and you are required to acknowledge the controller's calls.\""}, {"q": "In the pattern, if you hear no transmissions for more than ___ seconds, attempt to contact the controller.", "opts": ["30", "15", "60", "5"], "ans": 2, "expl": "Correct: 60 · Source: \"If you hear no transmissions for more than 60 seconds, attempt to contact the controller.\""}, {"q": "In the pattern, if unable to reestablish contact you:", "opts": ["Continue the last heading indefinitely", "Climb to 10,000 ft", "Squawk and orbit", "Comply with the lost communication instructions"], "ans": 3, "expl": "Correct: Comply with the lost communication instructions · Source: \"If you are unable to reestablish contact, then comply with the lost communication instructions.\""}, {"q": "Controller info furnished in the pattern — item 1:", "opts": ["Type of approach to expect (precision or surveillance)", "Advisory to perform landing check (USN/USMC controllers only)", "Missed approach and lost communication instructions", "Location of the missed approach point (MAP) (surveillance only)"], "ans": 0, "expl": "Correct: Type of approach to expect (precision or surveillance) · Source: \"1. Type of approach to expect (precision or surveillance)\""}, {"q": "Controller info furnished in the pattern — item 2:", "opts": ["Duty runway", "Location of the missed approach point (MAP) (surveillance only)", "Advisory to perform landing check (USN/USMC controllers only)", "Missed approach and lost communication instructions"], "ans": 0, "expl": "Correct: Duty runway · Source: \"2. Duty runway\""}, {"q": "Controller info furnished in the pattern — item 3:", "opts": ["Location of the missed approach point (MAP) (surveillance only)", "Duty runway", "Advisory to perform landing check (USN/USMC controllers only)", "Missed approach and lost communication instructions"], "ans": 0, "expl": "Correct: Location of the missed approach point (MAP) (surveillance only) · Source: \"3. Location of the missed approach point (MAP) (surveillance only)\""}, {"q": "Controller info furnished in the pattern — item 4:", "opts": ["Type of approach to expect (precision or surveillance)", "Location of the missed approach point (MAP) (surveillance only)", "Duty runway", "Advisory to perform landing check (USN/USMC controllers only)"], "ans": 3, "expl": "Correct: Advisory to perform landing check (USN/USMC controllers only) · Source: \"4. Advisory to perform landing check (USN/USMC controllers only)\""}, {"q": "Controller info furnished in the pattern — item 5:", "opts": ["Location of the missed approach point (MAP) (surveillance only)", "Missed approach and lost communication instructions", "Duty runway", "Type of approach to expect (precision or surveillance)"], "ans": 1, "expl": "Correct: Missed approach and lost communication instructions · Source: \"5. Missed approach and lost communication instructions\""}, {"q": "Which is NOT on the list of information the controller furnishes in the pattern?", "opts": ["Recommended altitudes each mile", "Duty runway", "Type of approach to expect", "Missed approach and lost communication instructions"], "ans": 0, "expl": "Correct: Recommended altitudes each mile · Source: \"1. Type of approach to expect (precision or surveillance) 2. Duty runway 3. Location of the missed approach point (MAP) (surveillance only) 4. Advisory to perform landing check (USN/USMC controllers only) 5. Missed approach and lost communication instructions\""}, {"q": "The location of the MAP is furnished in the pattern for:", "opts": ["Surveillance approaches only", "Both PAR and ASR", "Precision approaches only", "Neither"], "ans": 0, "expl": "Correct: Surveillance approaches only · Source: \"3. Location of the missed approach point (MAP) (surveillance only)\""}, {"q": "The advisory to perform landing check is given by:", "opts": ["FAA controllers only", "All controllers", "Tower only", "USN/USMC controllers only"], "ans": 3, "expl": "Correct: USN/USMC controllers only · Source: \"4. Advisory to perform landing check (USN/USMC controllers only)\""}, {"q": "Besides the listed items, the controller also gives:", "opts": ["Recommended power settings", "Position information and heading changes as necessary to keep you on course", "Wind shear reports every minute", "Fuel state checks"], "ans": 1, "expl": "Correct: Position information and heading changes as necessary to keep you on course · Source: \"Additionally, the controller will give you position information and heading changes as necessary to keep you on course.\""}, {"q": "Final controller radio check as you commence final:", "opts": ["\"BEGIN DESCENT\"", "\"PERFORM LANDING CHECKS\"", "\"MCCAIN APPROACH, RADAR CONTACT\"", "\"THIS IS MCCAIN FINAL CONTROLLER. HOW DO YOU HEAR?\""], "ans": 3, "expl": "Correct: \"THIS IS MCCAIN FINAL CONTROLLER. HOW DO YOU HEAR?\" · Source: \"As you commence your final approach, the final controller will perform a radio check; \"THIS IS MCCAIN FINAL CONTROLLER. HOW DO YOU HEAR?\"\""}, {"q": "Your response to the final controller's radio check:", "opts": ["\"LOUD AND CLEAR, LANDING CHECKLIST COMPLETE\"", "\"WILCO, GEAR DOWN\"", "\"LOUD AND CLEAR, THREE DOWN AND LOCKED\" (or position of gear)", "\"SPEED BRAKES FULL, LANDING CHECKLIST COMPLETE\""], "ans": 2, "expl": "Correct: \"LOUD AND CLEAR, THREE DOWN AND LOCKED\" (or position of gear) · Source: \"You should respond with \"LOUD AND CLEAR, THREE DOWN AND LOCKED\" (or position of gear).\""}, {"q": "After the radio check, the controller may also tell you:", "opts": ["That you need not acknowledge further transmissions", "To slow to 150 KIAS", "To report every mile", "To read back every heading on final"], "ans": 0, "expl": "Correct: That you need not acknowledge further transmissions · Source: \"The controller may also tell you that you need not acknowledge further transmissions.\""}, {"q": "On final, the controller must contact you at least every ___ on a PAR.", "opts": ["5 seconds", "60 seconds", "15 seconds", "10 seconds"], "ans": 0, "expl": "Correct: 5 seconds · Source: \"On final approach, the controller is required to make contact with you at least every 5 seconds on a PAR or 15 seconds on an ASR.\""}, {"q": "On final, the controller must contact you at least every ___ on an ASR.", "opts": ["30 seconds", "60 seconds", "15 seconds", "5 seconds"], "ans": 2, "expl": "Correct: 15 seconds · Source: \"On final approach, the controller is required to make contact with you at least every 5 seconds on a PAR or 15 seconds on an ASR.\""}, {"q": "Comm intervals — pattern / PAR final / ASR final:", "opts": ["Once a minute / 10 seconds / 30 seconds", "Once a minute / 15 seconds / 5 seconds", "Once a minute / 5 seconds / 15 seconds", "30 seconds / 5 seconds / 15 seconds"], "ans": 2, "expl": "Correct: Once a minute / 5 seconds / 15 seconds · Source: \"In the pattern, the controller must communicate with you at least once a minute … at least every 5 seconds on a PAR or 15 seconds on an ASR.\""}, {"q": "If you lose contact on final for the respective time for the approach being flown:", "opts": ["Continue to minimums", "Attempt to recontact; if not successful, execute the lost communication instructions", "Execute the missed approach immediately without trying", "Wait 60 seconds"], "ans": 1, "expl": "Correct: Attempt to recontact; if not successful, execute the lost communication instructions · Source: \"If you lose contact with the controller for the respective amount of time for the approach being flown, attempt to recontact and if not successful, execute the lost communication instructions.\""}, {"q": "GCA pattern entry configuration — Airspeed:", "opts": ["On-speed", "150 KIAS", "250 KIAS", "200 KIAS"], "ans": 3, "expl": "Correct: 200 KIAS · Source: \"Airspeed: 200 KIAS\""}, {"q": "GCA pattern entry configuration — Gear:", "opts": ["Down and locked", "Down", "Up", "As required"], "ans": 2, "expl": "Correct: Up · Source: \"Gear: Up\""}, {"q": "GCA pattern entry configuration — Speed brakes:", "opts": ["Out", "In", "Full", "As required"], "ans": 1, "expl": "Correct: In · Source: \"Speed brakes: In\""}, {"q": "GCA pattern entry configuration — Flaps/slats:", "opts": ["Up", "Down", "Half", "Full"], "ans": 0, "expl": "Correct: Up · Source: \"Flaps/slats: Up\""}, {"q": "GCA pattern entry configuration — Available NAVAIDS:", "opts": ["Off", "Tuned", "Tuned after final", "Standby"], "ans": 1, "expl": "Correct: Tuned · Source: \"Available NAVAIDS: Tuned\""}, {"q": "The downwind leg is normally flown:", "opts": ["At 150 KIAS dirty", "Descending at 1,000 fpm", "Straight and level at 200 KIAS and pattern altitude", "At 250 KIAS"], "ans": 2, "expl": "Correct: Straight and level at 200 KIAS and pattern altitude · Source: \"Normally, you fly the first leg of the pattern (the downwind leg) straight and level at 200 KIAS and pattern altitude.\""}, {"q": "At the end of the downwind leg, the controller directs a turn to:", "opts": ["Base leg", "Crosswind", "Dogleg", "Final"], "ans": 0, "expl": "Correct: Base leg · Source: \"At the end of the downwind leg, the controller will direct a turn to base leg.\""}, {"q": "At the end of the base leg, the controller directs a turn to:", "opts": ["Holding", "Downwind", "The missed approach", "Either a dogleg or the final approach course"], "ans": 3, "expl": "Correct: Either a dogleg or the final approach course · Source: \"At the end of the base leg, the controller will direct a turn to either a dogleg or the final approach course.\""}, {"q": "On base or a dogleg, unless directed by ATC, stay clean at 200 KIAS until within:", "opts": ["10 nm and 10 radials", "8 nm and 20 radials", "10 nm of the field and 30 radials of the FAC", "5 nm and 30 radials"], "ans": 2, "expl": "Correct: 10 nm of the field and 30 radials of the FAC · Source: \"Once established on base leg or on a dogleg to the FAC, unless directed by ATC, stay clean and at 200 KIAS until you are within 10 nm of the field and 30 radials of the final approach course.\""}, {"q": "When within those parameters, you transition to landing configuration and slow to:", "opts": ["On-speed immediately", "150 KIAS (speed brakes retracted, complete landing checklist)", "200 KIAS", "130 KIAS"], "ans": 1, "expl": "Correct: 150 KIAS (speed brakes retracted, complete landing checklist) · Source: \"When within those parameters, transition to landing configuration, speed brakes retracted, slow to 150 KIAS, and complete the landing checklist (speed brakes retracted).\""}, {"q": "After configuring in the GCA pattern you will have to:", "opts": ["Retrim the nose to maintain level flight", "Report gear down to ICS", "Extend speed brakes", "Add MRT"], "ans": 0, "expl": "Correct: Retrim the nose to maintain level flight · Source: \"You will have to retrim the nose to maintain level flight.\""}, {"q": "Slow to on-speed when:", "opts": ["On downwind", "Within 10 nm and on an intercept heading within 30 degrees of the FAC", "Passing the FAF", "Within 5 nm of touchdown"], "ans": 1, "expl": "Correct: Within 10 nm and on an intercept heading within 30 degrees of the FAC · Source: \"When within 10 nm and on an intercept heading that is within 30 degrees of the final approach course, slow to on-speed.\""}, {"q": "USN/USMC controllers' \"PERFORM LANDING CHECKS\" on the base leg is:", "opts": ["A lost comm instruction", "A directive to slow to approach speed", "A directive to configure immediately", "Only a reminder; it does not direct the pilot to dirty up"], "ans": 3, "expl": "Correct: Only a reminder; it does not direct the pilot to dirty up · Source: \"USN/USMC controllers will state \"PERFORM LANDING CHECKS\" on the base leg; this is only a reminder and does not direct the pilot to dirty up.\""}, {"q": "If the controller says \"SLOW TO APPROACH SPEED\":", "opts": ["Ignore until 10 nm", "It is only a reminder", "It is directed for sequencing; comply or state that you are unable", "Extend speed brakes"], "ans": 2, "expl": "Correct: It is directed for sequencing; comply or state that you are unable · Source: \"If the controller says, \"SLOW TO APPROACH SPEED,\" the controller is directing this for sequencing and the aircrew must comply or state that they are unable.\""}, {"q": "GCAs can be flown in which flap configurations?", "opts": ["Full and one-half only", "No-flap only", "Full only", "Full, one-half, and no-flap"], "ans": 3, "expl": "Correct: Full, one-half, and no-flap · Source: \"GCAs can be flown at full, one-half, and no-flap configurations.\""}, {"q": "At the beginning of a PAR final you are:", "opts": ["Clean at 200 KIAS", "Straight and level, on-speed, normally at approximately 1,500 ft AGL", "Descending at 1,000 fpm at 200 KIAS", "Level at 5,000 ft AGL"], "ans": 1, "expl": "Correct: Straight and level, on-speed, normally at approximately 1,500 ft AGL · Source: \"At the beginning of a PAR final approach, you will be straight and level, on-speed, and normally at approximately 1,500 ft AGL.\""}, {"q": "Normal altitude at the beginning of a PAR final:", "opts": ["Approximately 1,500 ft AGL", "Approximately 5,000 ft AGL", "Approximately 2,500 ft AGL", "Approximately 1,000 ft AGL"], "ans": 0, "expl": "Correct: Approximately 1,500 ft AGL · Source: \"...normally at approximately 1,500 ft AGL.\""}, {"q": "PAR final — restrict AOB to:", "opts": ["20 degrees", "Approximate degrees to be turned, not to exceed 1/2 SRT (approximately 10 degrees)", "Standard rate", "30 degrees"], "ans": 1, "expl": "Correct: Approximate degrees to be turned, not to exceed 1/2 SRT (approximately 10 degrees) · Source: \"Restrict AOB to the approximate number of degrees to be turned, not to exceed 1/2 SRT (approximately 10 degrees).\""}, {"q": "PAR final — verify:", "opts": ["Gear down, flaps up only", "Speed brakes in", "Gear down, flaps at half or full", "Gear up, flaps up"], "ans": 2, "expl": "Correct: Gear down, flaps at half or full · Source: \"Verify gear down, flaps at half or full.\""}, {"q": "PAR final — trim the aircraft for:", "opts": ["A 1,000 fpm descent", "Hands off level flight", "Hands off climb", "Slight nose down"], "ans": 1, "expl": "Correct: Hands off level flight · Source: \"Trim aircraft for hands off level flight.\""}, {"q": "On a PAR, when told \"ON GLIDEPATH\" you:", "opts": ["Reduce to idle", "Report MAP", "Extend the speed brakes and adjust power as required to establish a descent", "Lower the gear"], "ans": 2, "expl": "Correct: Extend the speed brakes and adjust power as required to establish a descent · Source: \"When the controller informs you that you are \"ON GLIDEPATH,\" extend the speed brakes and adjust power as required to establish a descent.\""}, {"q": "Initially after speed brake extension on the PAR you need:", "opts": ["No input", "Forward stick pressure to counter the pitch up", "Nose-down trim only", "Aft stick to counter a pitch down"], "ans": 1, "expl": "Correct: Forward stick pressure to counter the pitch up · Source: \"Forward stick pressure will initially be required to counter the pitch up caused by speed brake extension.\""}, {"q": "PAR ICS report after establishing the descent:", "opts": ["\"PLATFORM\"", "\"GEAR DOWN\"", "\"SPEED BRAKES FULL, LANDING CHECKLIST COMPLETE\"", "\"LOUD AND CLEAR, THREE DOWN AND LOCKED\""], "ans": 2, "expl": "Correct: \"SPEED BRAKES FULL, LANDING CHECKLIST COMPLETE\" · Source: \"Report, \"SPEED BRAKES FULL, LANDING CHECKLIST COMPLETE,\" on the ICS.\""}, {"q": "PAR rate of descent varies with:", "opts": ["Glideslope angle and groundspeed", "Bank angle", "Temperature only", "Altitude and weight"], "ans": 0, "expl": "Correct: Glideslope angle and groundspeed · Source: \"The rate of descent will vary for different glideslope angles and groundspeeds.\""}, {"q": "Where is the rate of descent chart for a given glideslope and groundspeed?", "opts": ["Inside back cover of the approach plates", "NATOPS chapter 6", "Front cover of the approach plates", "In the HUD"], "ans": 0, "expl": "Correct: Inside back cover of the approach plates · Source: \"The inside back cover of the approach plates contains a chart that will provide you rate of descent for a given glideslope and groundspeed.\""}, {"q": "On PAR final, adjust power to:", "opts": ["Hold 1,000 fpm exactly", "Hold 700 pph", "Maintain your rate of descent and keep the aircraft on-speed", "Hold 150 KIAS"], "ans": 2, "expl": "Correct: Maintain your rate of descent and keep the aircraft on-speed · Source: \"Adjust power to maintain your rate of descent and keep the aircraft on-speed.\""}, {"q": "PAR heading corrections — bank angle:", "opts": ["Small (5-10 degrees)", "20 degrees", "1-2 degrees", "30 degrees"], "ans": 0, "expl": "Correct: Small (5-10 degrees) · Source: \"When making heading corrections, try to keep the amount of bank angle small (5-10 degrees) so that you don't end up chasing the heading.\""}, {"q": "On the PAR, if you get off heading:", "opts": ["Don't try to correct to course; return to your last assigned heading with smooth inputs", "Correct back to course aggressively", "Ask for a new approach", "Hold the new heading"], "ans": 0, "expl": "Correct: Don't try to correct to course; return to your last assigned heading with smooth inputs · Source: \"If you get off heading, don't try to correct to course. Use smooth control inputs and return to your last assigned heading.\""}, {"q": "As you near the decision altitude, begin:", "opts": ["An \"inside/outside\" scan to visually acquire the runway environment", "The missed approach", "A 300 pph power addition", "A level off"], "ans": 0, "expl": "Correct: An \"inside/outside\" scan to visually acquire the runway environment · Source: \"As you near the decision altitude, begin an \"inside/outside\" scan to visually acquire the runway environment.\""}, {"q": "PAR — no runway environment in sight at the DA:", "opts": ["Execute a missed approach (make the mandatory missed approach call)", "Level off at DA and continue to MAP", "Ask for ASR", "Descend 100 ft"], "ans": 0, "expl": "Correct: Execute a missed approach (make the mandatory missed approach call) · Source: \"If you do not have the runway environment in sight when you reach the DA, execute a missed approach (make the mandatory missed approach call).\""}, {"q": "On the ASR final, the controller cannot furnish:", "opts": ["MAP location", "Glideslope information", "Range information", "Course information"], "ans": 1, "expl": "Correct: Glideslope information · Source: \"On the ASR final approach, the controller cannot furnish glideslope information.\""}, {"q": "On an ASR, who establishes and maintains the correct rate of descent?", "opts": ["The tower", "The HUD", "The pilot", "The controller"], "ans": 2, "expl": "Correct: The pilot · Source: \"It will be up to you to establish and maintain the correct rate of descent.\""}, {"q": "ASR — the controller identifies the MAP:", "opts": ["By altitude", "By time from the FAF", "By DME from the TACAN", "In nautical miles from the end of the runway"], "ans": 3, "expl": "Correct: In nautical miles from the end of the runway · Source: \"The controller will identify the missed approach point (MAP) in nautical miles from the end of the runway, and will direct the descent by stating, \"BEGIN DESCENT.\"\""}, {"q": "ASR — the controller directs the descent by stating:", "opts": ["\"BEGIN DESCENT\"", "\"ON GLIDEPATH\"", "\"SLOW TO APPROACH SPEED\"", "\"DESCEND TO MDA\""], "ans": 0, "expl": "Correct: \"BEGIN DESCENT\" · Source: \"...and will direct the descent by stating, \"BEGIN DESCENT.\"\""}, {"q": "ASR recommended altitudes each mile are provided:", "opts": ["Never", "Always", "On pilot request", "Only by USN/USMC controllers"], "ans": 2, "expl": "Correct: On pilot request · Source: \"On pilot request, the controller will provide recommended altitudes each mile on final.\""}, {"q": "ASR recommended altitudes decrease:", "opts": ["300 ft per mile (approximates a 2-degree glideslope)", "200 ft per mile", "500 ft per mile", "300 ft per mile (approximates a 3-degree glideslope)"], "ans": 3, "expl": "Correct: 300 ft per mile (approximates a 3-degree glideslope) · Source: \"Recommended altitudes decrease 300 ft per mile (approximates a 3-degree glideslope).\""}, {"q": "To smoothly level at MDA prior to the MAP, your altitudes should be:", "opts": ["Slightly higher than those recommended", "100 ft below MDA", "Exactly those recommended", "Slightly lower than those recommended"], "ans": 3, "expl": "Correct: Slightly lower than those recommended · Source: \"In order to smoothly level at MDA prior to the MAP, your altitudes should be slightly lower than those recommended.\""}, {"q": "ASR descent rate (depending on groundspeed) to reach MDA prior to MAP:", "opts": ["1,000-1,500 fpm", "500-700 fpm", "4,000-6,000 fpm", "800-1000 fpm"], "ans": 3, "expl": "Correct: 800-1000 fpm · Source: \"Depending on your groundspeed, a descent rate of 800-1000 fpm will allow you to descend to the MDA prior to reaching the MAP.\""}, {"q": "ASR — approximately 100 ft prior to MDA:", "opts": ["Reduce to idle", "Add about 700 pph", "Retract speed brakes and add MRT", "Add about 300 pph fuel flow and apply slight backstick pressure"], "ans": 3, "expl": "Correct: Add about 300 pph fuel flow and apply slight backstick pressure · Source: \"Approximately 100 feet prior to MDA, add about 300 pph fuel flow and apply slight backstick pressure to level off at MDA.\""}, {"q": "ASR — upon reaching the MAP without the runway or unable to land safely:", "opts": ["Execute the missed approach as instructed", "Descend below MDA", "Request recommended altitudes", "Continue to the DA"], "ans": 0, "expl": "Correct: Execute the missed approach as instructed · Source: \"Upon reaching the MAP, if you do not have the runway in sight or are otherwise unable to perform a safe landing, execute the missed approach as instructed.\""}, {"q": "Decision altitude (DA) is used on the ___; MDA/MAP on the ___.", "opts": ["ASR; TACAN only", "ASR; PAR", "PAR; ASR", "PAR; PAR"], "ans": 2, "expl": "Correct: PAR; ASR · Source: \"If you do not have the runway environment in sight when you reach the DA, execute a missed approach … Upon reaching the MAP, if you do not have the runway in sight … execute the missed approach as instructed.\""}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= queue.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
