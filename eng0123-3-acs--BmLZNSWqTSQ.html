<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ENG0123 (3) ACS — T-45 Quiz</title>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">T-45 Local Quizzes</a> · Other Systems</div>
    <h1>ENG0123 (3) ACS</h1>
    <div class="meta">18 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 18</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Other Systems</div>
    <h2 style="margin:0.2rem 0">ENG0123 (3) ACS</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="index.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to Index</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="index.html">← All quizzes</a></div>
</div>
<script>
const QUESTIONS = [{"q": "Armament bus power source:", "opts": ["28 VDC Essential Bus", "28 VDC Generator Bus", "AC inverter 1 only", "Battery direct"], "ans": 1, "expl": "Master Arm feeds armament bus from 28 VDC Generator Bus."}, {"q": "Can you release ordnance after generator failure?", "opts": ["Yes, via Essential Bus", "No", "Only jettison", "Only with Override SAFE"], "ans": 1, "expl": "Cannot release with GEN fail."}, {"q": "Jettison circuit is powered by:", "opts": ["Generator Bus", "28 VDC Essential Bus", "Armament bus only", "Hydraulic system 1"], "ans": 1, "expl": "Jettison on Essential Bus."}, {"q": "BRU-38 typical practice-bomb load:", "opts": ["2× MK-82", "4× MK-76 or BDU-33", "6× live Mk-76", "Empty only"], "ans": 1, "expl": "Four MK-76 or BDU-33 (25 lb smoke)."}, {"q": "SET/DEP default mil depression for bombs:", "opts": ["12", "30", "31", "140"], "ans": 3, "expl": "Bombs 140; rockets 30; guns 12."}, {"q": "Syllabus-primary A/A gunsight mode:", "opts": ["LAC", "RTGS", "CCIP", "Manual bombing"], "ans": 1, "expl": "Default LAC but RTGS is syllabus primary."}, {"q": "What powers the armament bus, and can you release with a generator failure?", "opts": ["28 VDC Generator Bus via Master Arm. No — you cannot release ordnance with a generator failure.", "releases selected practice bombs. Gun trigger = gun tones in A/G or A/A with Master Arm on.", "Defaults to 6; usually set to 4. It is only a counter — does not change release pulses to the BRU-38.", "28 VDC Essential Bus (both cockpits; weight off wheels to jettison bomb racks from pylons)."], "ans": 0, "expl": "28 VDC Generator Bus via Master Arm. No — you cannot release ordnance with a generator failure."}, {"q": "Master Arm Override behavior when forward cockpit selects SAFE?", "opts": ["Override is a solenoid on the armament bus; selecting SAFE aft renders system inoperative. When fwd selects SAFE, power is removed and the override switch returns to FORWARD.", "A/A→A/G). SET/DEP mil defaults: bombs 140, rockets 30, guns 12. A/A: LAC default but syllabus primary is RTGS (pipper + spanner, default 31 mils, 20 mm @ 1000 ft).", "Aircraft defaults to LAC; switch to RTGS (primary in syllabus). RTGS = pipper + target spanner (default 31 mils) simulating 20 mm at 1000 ft.", "Pylons 77 lb with ejection cartridge (jettison BRU-38/A + stores as a unit). BRU-38 101 lb carrying four MK-76 or BDU-33 practice bombs (25 lb each, smoke charge)."], "ans": 0, "expl": "Override is a solenoid on the armament bus; selecting SAFE aft renders system inoperative. When fwd selects SAFE, power is removed and the override switch returns to FORWARD."}, {"q": "Conditions to release practice bombs with the pickle?", "opts": ["During engine start when RPM exceeds 20%. VCR switch no longer functional; data on DDS, downloadable via USB.", "Defaults to Manual; CCIP selectable (then box TGHT for target height). SET/DEP mils: bombs 140, rockets 30, guns 12.", "Master Arm ARM, Override FORWARD, weight off wheels, and Left or Right station selected on the A/G stores page.", "Defaults to 6; usually set to 4. It is only a counter — does not change release pulses to the BRU-38."], "ans": 2, "expl": "Master Arm ARM, Override FORWARD, weight off wheels, and Left or Right station selected on the A/G stores page."}, {"q": "What powers the jettison circuit?", "opts": ["Defaults to 6; usually set to 4. It is only a counter — does not change release pulses to the BRU-38.", "28 VDC Essential Bus (both cockpits; weight off wheels to jettison bomb racks from pylons).", "releases selected practice bombs. Gun trigger = gun tones in A/G or A/A with Master Arm on.", "28 VDC Generator Bus via Master Arm. No — you cannot release ordnance with a generator failure."], "ans": 1, "expl": "28 VDC Essential Bus (both cockpits; weight off wheels to jettison bomb racks from pylons)."}, {"q": "Pylon and BRU-38 weights / loadout?", "opts": ["A/A→A/G). SET/DEP mil defaults: bombs 140, rockets 30, guns 12. A/A: LAC default but syllabus primary is RTGS (pipper + spanner, default 31 mils, 20 mm @ 1000 ft).", "Aircraft defaults to LAC; switch to RTGS (primary in syllabus). RTGS = pipper + target spanner (default 31 mils) simulating 20 mm at 1000 ft.", "Override is a solenoid on the armament bus; selecting SAFE aft renders system inoperative. When fwd selects SAFE, power is removed and the override switch returns to FORWARD.", "Pylons 77 lb with ejection cartridge (jettison BRU-38/A + stores as a unit). BRU-38 101 lb carrying four MK-76 or BDU-33 practice bombs (25 lb each, smoke charge)."], "ans": 3, "expl": "Pylons 77 lb with ejection cartridge (jettison BRU-38/A + stores as a unit). BRU-38 101 lb carrying four MK-76 or BDU-33 practice bombs (25 lb each, smoke charge)."}, {"q": "A/G stores quantity pushbutton meaning?", "opts": ["Defaults to 6; usually set to 4. It is only a counter — does not change release pulses to the BRU-38.", "Master Arm ARM, Override FORWARD, weight off wheels, and Left or Right station selected on the A/G stores page.", "28 VDC Generator Bus via Master Arm. No — you cannot release ordnance with a generator failure.", "During engine start when RPM exceeds 20%. VCR switch no longer functional; data on DDS, downloadable via USB."], "ans": 0, "expl": "Defaults to 6; usually set to 4. It is only a counter — does not change release pulses to the BRU-38."}, {"q": "Manual vs CCIP and SET/DEP defaults?", "opts": ["During engine start when RPM exceeds 20%. VCR switch no longer functional; data on DDS, downloadable via USB.", "Defaults to 6; usually set to 4. It is only a counter — does not change release pulses to the BRU-38.", "Defaults to Manual; CCIP selectable (then box TGHT for target height). SET/DEP mils: bombs 140, rockets 30, guns 12.", "Master Arm ARM, Override FORWARD, weight off wheels, and Left or Right station selected on the A/G stores page."], "ans": 2, "expl": "Defaults to Manual; CCIP selectable (then box TGHT for target height). SET/DEP mils: bombs 140, rockets 30, guns 12."}, {"q": "A/A gunsight modes and syllabus primary?", "opts": ["Aircraft defaults to LAC; switch to RTGS (primary in syllabus). RTGS = pipper + target spanner (default 31 mils) simulating 20 mm at 1000 ft.", "A/A→A/G). SET/DEP mil defaults: bombs 140, rockets 30, guns 12. A/A: LAC default but syllabus primary is RTGS (pipper + spanner, default 31 mils, 20 mm @ 1000 ft).", "Override is a solenoid on the armament bus; selecting SAFE aft renders system inoperative. When fwd selects SAFE, power is removed and the override switch returns to FORWARD.", "Pylons 77 lb with ejection cartridge (jettison BRU-38/A + stores as a unit). BRU-38 101 lb carrying four MK-76 or BDU-33 practice bombs (25 lb each, smoke charge)."], "ans": 0, "expl": "Aircraft defaults to LAC; switch to RTGS (primary in syllabus). RTGS = pipper + target spanner (default 31 mils) simulating 20 mm at 1000 ft."}, {"q": "When does the video camera system activate?", "opts": ["Master Arm ARM, Override FORWARD, weight off wheels, and Left or Right station selected on the A/G stores page.", "Defaults to Manual; CCIP selectable (then box TGHT for target height). SET/DEP mils: bombs 140, rockets 30, guns 12.", "Defaults to 6; usually set to 4. It is only a counter — does not change release pulses to the BRU-38.", "During engine start when RPM exceeds 20%. VCR switch no longer functional; data on DDS, downloadable via USB."], "ans": 3, "expl": "During engine start when RPM exceeds 20%. VCR switch no longer functional; data on DDS, downloadable via USB."}, {"q": "Where is the Weight-on-Wheels Bypass switch and who uses it?", "opts": ["Nose wheel well — used by ordnance technicians to power the armament bus on deck for jettison/release checks while arming.", "Yes — available in the aft cockpit only.", "Yes — fully available with no limitations.", "Yes — after selecting GAIN ORIDE."], "ans": 0, "expl": "Nose wheel well — used by ordnance technicians to power the armament bus on deck for jettison/release checks while arming."}, {"q": "When Release path: Pickle (both sticks) with Master Arm ARM, Override FORWARD, weight off wheels, station selected on A/G stores, what happens?", "opts": ["28 VDC Generator Bus via Master Arm. No — you cannot release ordnance with a generator failure.", "Defaults to 6; usually set to 4. It is only a counter — does not change release pulses to the BRU-38.", "28 VDC Essential Bus (both cockpits; weight off wheels to jettison bomb racks from pylons).", "releases selected practice bombs. Gun trigger = gun tones in A/G or A/A with Master Arm on."], "ans": 3, "expl": "releases selected practice bombs. Gun trigger = gun tones in A/G or A/A with Master Arm on."}, {"q": "When HUD/DEP: A/G or A/A auto with page, or cycle MODE (NAV, what happens?", "opts": ["Override is a solenoid on the armament bus; selecting SAFE aft renders system inoperative. When fwd selects SAFE, power is removed and the override switch returns to FORWARD.", "Pylons 77 lb with ejection cartridge (jettison BRU-38/A + stores as a unit). BRU-38 101 lb carrying four MK-76 or BDU-33 practice bombs (25 lb each, smoke charge).", "Aircraft defaults to LAC; switch to RTGS (primary in syllabus). RTGS = pipper + target spanner (default 31 mils) simulating 20 mm at 1000 ft.", "A/A→A/G). SET/DEP mil defaults: bombs 140, rockets 30, guns 12. A/A: LAC default but syllabus primary is RTGS (pipper + spanner, default 31 mils, 20 mm @ 1000 ft)."], "ans": 3, "expl": "A/A→A/G). SET/DEP mil defaults: bombs 140, rockets 30, guns 12. A/A: LAC default but syllabus primary is RTGS (pipper + spanner, default 31 mils, 20 mm @ 1000 ft)."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= QUESTIONS.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
</html>
