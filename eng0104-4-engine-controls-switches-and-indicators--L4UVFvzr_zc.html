<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ENG0104 (4) Engine Controls, Switches, and Indicators — T-45 Quiz</title>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">Home</a> · <a href="section-eng.html">ENG</a> · Engine</div>
    <h1>ENG0104 (4) Engine Controls, Switches, and Indicators</h1>
    <div class="meta">19 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 19</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Engine</div>
    <h2 style="margin:0.2rem 0">ENG0104 (4) Engine Controls, Switches, and Indicators</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-eng.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to ENG</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="section-eng.html">← ENG</a> · <a href="index.html">Home</a></div>
</div>
<script>
const QUESTIONS = [{"q": "Start control unit is energized when:", "opts": ["Only forward ENGINE ON", "ENGINE switches ON in both cockpits", "Only ignition NORMAL", "Only GTS button pressed"], "ans": 1, "expl": "Both cockpits ENGINE ON (check aft on solos)."}, {"q": "After ENGINE OFF, #2 boost pump goes off after:", "opts": ["Immediately", "10 seconds", "30 seconds", "3 minutes"], "ans": 2, "expl": "Boost pump off after 30 seconds."}, {"q": "Fuel shutoff T-handle is located:", "opts": ["Both cockpits", "Aft only", "Front cockpit only", "On the throttle grip"], "ans": 2, "expl": "Front cockpit only."}, {"q": "Throttle OFF→IDLE during start at about:", "opts": ["7–10% N2", "17–20% N2", "45% N2", "61% N2"], "ans": 1, "expl": "About 17–20% N2."}, {"q": "GTS advisory light should illuminate within:", "opts": ["5 seconds", "15 seconds", "20 seconds", "45 seconds"], "ans": 2, "expl": "Within 20 seconds of pressing GTS button."}, {"q": "After 70-check to idle, bleed closure shows roughly:", "opts": ["−3% N2 and +50 °C EGT", "+3% N2 and −50 °C EGT", "No N2 change", "GTS advisory only"], "ans": 1, "expl": "~+3% N2 (~56.5±2%) and ~−50 °C EGT."}, {"q": "HYD warning extinguishes during start when HYD pressure exceeds about:", "opts": ["10 psi", "35 psi", "1,660 ±110 psi", "3,000 psi"], "ans": 2, "expl": "Greater than ~1660 ±110 psi."}, {"q": "Fuel control TEST position is:", "opts": ["Latched", "Spring-loaded back to NORMAL", "Same as MANUAL", "Aft-cockpit only"], "ans": 1, "expl": "Spring-loaded from TEST back to NORMAL."}, {"q": "Why must aft ENGINE switch be ON for start?", "opts": ["Shuts down GTS, de-energizes start control unit, and turns #2 boost pump off after 30 seconds.", "Front cockpit only — pull T-handle to isolate fuel from engine and GTS (emergency or normal shutdown).", "MANUAL (manual FCU), NORMAL (main FCU), TEST (tests manual system; spring-loaded back to NORMAL).", "ENGINE switches in both cockpits must be ON to energize the start control unit — easy to miss on solo flights."], "ans": 3, "expl": "ENGINE switches in both cockpits must be ON to energize the start control unit — easy to miss on solo flights."}, {"q": "ENGINE switch ON effects?", "opts": ["Energizes start control unit and turns #1 boost pump on.", "Energizes start control unit and turns #4 boost pump on.", "Energizes start control unit and turns #12 boost pump on.", "Energizes start control unit and turns #2 boost pump on."], "ans": 3, "expl": "Energizes start control unit and turns #2 boost pump on."}, {"q": "What does selecting ENGINE START do?", "opts": ["Spins GTS to full power (~100%), opens the start valve, and signals the start control unit.", "MANUAL (manual FCU), NORMAL (main FCU), TEST (tests manual system; spring-loaded back to NORMAL).", "Low-pressure pump caution and HYD warning (HYD 1 \u003e ~1660 ±110 psi from accessory gearbox).", "Shuts down GTS, de-energizes start control unit, and turns #2 boost pump off after 30 seconds."], "ans": 0, "expl": "Spins GTS to full power (~100%), opens the start valve, and signals the start control unit."}, {"q": "GTS button actions?", "opts": ["MANUAL (manual FCU), NORMAL (main FCU), TEST (tests manual system; spring-loaded back to NORMAL).", "Front cockpit only — pull T-handle to isolate fuel from engine and GTS (emergency or normal shutdown).", "Momentary press starts GTS, energizes igniters (ignition NORMAL), starts electrical fuel boost pumps; airborne with wheels down also removes approach idle stop.", "ENGINE switches in both cockpits must be ON to energize the start control unit — easy to miss on solo flights."], "ans": 2, "expl": "Momentary press starts GTS, energizes igniters (ignition NORMAL), starts electrical fuel boost pumps; airborne with wheels down also removes approach idle stop."}, {"q": "Fuel control switch positions?", "opts": ["Front cockpit only — pull T-handle to isolate fuel from engine and GTS (emergency or normal shutdown).", "Shuts down GTS, de-energizes start control unit, and turns #2 boost pump off after 30 seconds.", "Spins GTS to full power (~100%), opens the start valve, and signals the start control unit.", "MANUAL (manual FCU), NORMAL (main FCU), TEST (tests manual system; spring-loaded back to NORMAL)."], "ans": 3, "expl": "MANUAL (manual FCU), NORMAL (main FCU), TEST (tests manual system; spring-loaded back to NORMAL)."}, {"q": "Where is the fuel shutoff handle?", "opts": ["Shuts down GTS, de-energizes start control unit, and turns #2 boost pump off after 30 seconds.", "ENGINE switches in both cockpits must be ON to energize the start control unit — easy to miss on solo flights.", "Front cockpit only — pull T-handle to isolate fuel from engine and GTS (emergency or normal shutdown).", "MANUAL (manual FCU), NORMAL (main FCU), TEST (tests manual system; spring-loaded back to NORMAL)."], "ans": 2, "expl": "Front cockpit only — pull T-handle to isolate fuel from engine and GTS (emergency or normal shutdown)."}, {"q": "At 7–10% N2 during start, which lights typically extinguish?", "opts": ["MANUAL (manual FCU), NORMAL (main FCU), TEST (tests manual system; spring-loaded back to NORMAL).", "Low-pressure pump caution and HYD warning (HYD 1 \u003e ~1660 ±110 psi from accessory gearbox).", "Shuts down GTS, de-energizes start control unit, and turns #2 boost pump off after 30 seconds.", "Spins GTS to full power (~100%), opens the start valve, and signals the start control unit."], "ans": 1, "expl": "Low-pressure pump caution and HYD warning (HYD 1 \u003e ~1660 ±110 psi from accessory gearbox)."}, {"q": "When do you move throttle from OFF to IDLE?", "opts": ["About 17–20% N2 — then expect light-off within ~10 seconds with EGT rise.", "About 27–20% N2 — then expect light-off within ~10 seconds with EGT rise.", "About 34–20% N2 — then expect light-off within ~10 seconds with EGT rise.", "About 8–20% N2 — then expect light-off within ~10 seconds with EGT rise."], "ans": 0, "expl": "About 17–20% N2 — then expect light-off within ~10 seconds with EGT rise."}, {"q": "Idle stabilize and bleed-valve close %?", "opts": ["Engine stabilizes ~62% N2 at idle; bleed valve closes at 61±4% N2.", "Engine stabilizes ~104% N2 at idle; bleed valve closes at 61±4% N2.", "Engine stabilizes ~52% N2 at idle; bleed valve closes at 61±4% N2.", "Engine stabilizes ~26% N2 at idle; bleed valve closes at 61±4% N2."], "ans": 2, "expl": "Engine stabilizes ~52% N2 at idle; bleed valve closes at 61±4% N2."}, {"q": "70-check return-to-idle confirmation of bleed closure?", "opts": ["N12 increases ~3% (stabilizes ~56.5±2%) and EGT drops ~50 °C.", "N2 increases ~3% (stabilizes ~56.5±2%) and EGT drops ~50 °C.", "N4 increases ~3% (stabilizes ~56.5±2%) and EGT drops ~50 °C.", "N1 increases ~3% (stabilizes ~56.5±2%) and EGT drops ~50 °C."], "ans": 1, "expl": "N2 increases ~3% (stabilizes ~56.5±2%) and EGT drops ~50 °C."}, {"q": "When Fuel control: MANUAL / NORMAL / TEST (spring-loaded from TEST, what happens?", "opts": ["Yes — after selecting GAIN ORIDE.", "Yes — fully available with no limitations.", "Yes — available in the aft cockpit only.", "NORMAL); selectable both cockpits."], "ans": 3, "expl": "NORMAL); selectable both cockpits."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= QUESTIONS.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
</html>
