<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<script src="auth.js"></script>
<title>ENG0104 (3) Engine Operating Characteristics II — T-45 Quiz</title>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --text: #e7eef7;
  --muted: #9bb0c7;
  --accent: #3d9cf0;
  --accent2: #2a7fd4;
  --good: #2ecc71;
  --bad: #e74c3c;
  --warn: #f0b429;
  --border: #2e3d52;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header.quiz-head {
  background: linear-gradient(135deg, #1a2a40, #152033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1.25rem;
}
header.quiz-head .crumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
header.quiz-head h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 700; }
header.quiz-head .meta { color: var(--muted); font-size: 0.9rem; }
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.9rem;
}
.bar {
  height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 1rem;
}
.bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.2rem;
  margin-bottom: 1rem;
}
.card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: flex-start;
  background: var(--panel2);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt .letter {
  flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
  background: #31465f; display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.opt.correct { border-color: var(--good); background: rgba(46,204,113,.12); }
.opt.correct .letter { background: var(--good); color: #062; }
.opt.wrong { border-color: var(--bad); background: rgba(231,76,60,.12); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.reveal-correct { border-color: var(--good); }
.expl {
  margin-top: 0.9rem; padding: 0.75rem 0.85rem;
  background: rgba(61,156,240,.1); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: #cfe6fa; font-size: 0.92rem;
  display: none;
}
.expl.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
button.btn {
  appearance: none; border: none; border-radius: 999px;
  padding: 0.65rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
}
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #041018; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.results {
  display: none; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem 1.25rem;
}
.results.show { display: block; }
.results .score {
  font-size: 2.5rem; font-weight: 800; margin: 0.4rem 0;
}
.results .score.good { color: var(--good); }
.results .score.mid { color: var(--warn); }
.results .score.bad { color: var(--bad); }
.review { margin-top: 1.25rem; text-align: left; }
.review details {
  background: var(--panel2); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.45rem;
}
.review summary { cursor: pointer; font-weight: 600; }
.footer-nav { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
@media (max-width: 560px) {
  header.quiz-head h1 { font-size: 1.15rem; }
  .card { padding: 1rem 0.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="quiz-head">
    <div class="crumb"><a href="index.html">Home</a> · <a href="section-eng.html">ENG</a> · Engine</div>
    <h1>ENG0104 (3) Engine Operating Characteristics II</h1>
    <div class="meta">24 multiple-choice questions · offline · tap an answer</div>
  </header>

  <div id="quiz-ui">
    <div class="progress">
      <span id="prog-label">Question 1 of 24</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="bar"><span id="bar-fill"></span></div>
    <div class="card" id="card">
      <h2 id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="expl" id="expl"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" disabled>Next</button>
        <button class="btn btn-ghost" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="crumb">Engine</div>
    <h2 style="margin:0.2rem 0">ENG0104 (3) Engine Operating Characteristics II</h2>
    <div class="score" id="final-score"></div>
    <p id="final-msg"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry Quiz</button>
      <a class="btn btn-ghost" href="section-eng.html" style="display:inline-block;padding:0.65rem 1.2rem;border-radius:999px;border:1px solid var(--border)">Back to ENG</a>
    </div>
    <div class="review" id="review"></div>
  </div>

  <div class="footer-nav"><a href="section-eng.html">← ENG</a> · <a href="index.html">Home</a></div>
</div>
<script>
const QUESTIONS = [{"q": "Engine/GTS fire warning trips at about:", "opts": ["150 °C", "300 °C", "550 °C", "650 °C"], "ans": 1, "expl": "Firewire elements trip around 300 °C."}, {"q": "TP HOT caution illuminates above:", "opts": ["100 °C", "150 °C", "300 °C", "450 °C"], "ans": 1, "expl": "Tailpipe bay \u003e 150 °C."}, {"q": "Shot-of-fuel closes climbing through about:", "opts": ["7,700 ±500 ft", "9,500 ±300 ft", "15,000 ft", "25,000 ft"], "ans": 1, "expl": "Open until ~9,500 ±300 ft."}, {"q": "Approach idle stop holds about what N2?", "opts": ["45%", "52%", "72%", "85%"], "ans": 2, "expl": "Approximately 72%."}, {"q": "Oil warning ΔP / delay?", "opts": ["\u003c 5 psi for 5 s", "\u003c 10 psi for 10 s", "\u003c 35 psi for 10 s", "\u003c 10 psi immediate"], "ans": 1, "expl": "ΔP below 10 psi delayed 10 seconds."}, {"q": "Bleed valve normally closes near:", "opts": ["20% N2", "45% N2", "61±4% N2", "70% N2"], "ans": 2, "expl": "Closes at 61 ± 4% N2."}, {"q": "Selecting manual fuel at MRT is likely to:", "opts": ["Do nothing", "Exceed RPM/EGT limits", "Auto-engage approach idle", "Shut down GTS"], "ans": 1, "expl": "Most likely results in exceeding RPM and EGT limits."}, {"q": "Steam-ingest valve commanded open requires throttle above:", "opts": ["45% N2", "52% N2", "61% N2", "70% N2"], "ans": 3, "expl": "Throttle above 70% N2 (with WOW, launch bar down, switch RETRACT)."}, {"q": "Fire detection trip temperature and power source?", "opts": ["Open on ground until climbing through ~9,500 ±300 ft; reopens when descending through ~7,700 ±500 ft.", "25.2 US pints (11.9 L) total; 9.6 US pints (4.55 L) unusable/trapped; max consumption 0.8 US pints/hour.", "Closes ~61±4% N2; reopens ~45% N2. After 70-check back to idle: ~+3% N2 and ~−50 °C EGT indicate closure.", "Continuous-loop firewires in engine and GTS bays trip at 300 °C; powered by 28 VDC essential services bus."], "ans": 3, "expl": "Continuous-loop firewires in engine and GTS bays trip at 300 °C; powered by 28 VDC essential services bus."}, {"q": "Fire warning reset after bay cools?", "opts": ["Open on ground until climbing through ~9,500 ±300 ft; reopens when descending through ~7,700 ±500 ft.", "When temp falls below 300 °C the light goes out and system auto-resets; may take up to ~45 seconds.", "Closes ~61±4% N2; reopens ~45% N2. After 70-check back to idle: ~+3% N2 and ~−50 °C EGT indicate closure.", "25.2 US pints (11.9 L) total; 9.6 US pints (4.55 L) unusable/trapped; max consumption 0.8 US pints/hour."], "ans": 1, "expl": "When temp falls below 300 °C the light goes out and system auto-resets; may take up to ~45 seconds."}, {"q": "Light-test for fire detection?", "opts": ["GTS advisory (idle) within 20 s of GTS button; GTS ready within 15 s of ENGINE START; GTS auto-shutdown if idle not achieved in 30 s.", "Hold light/tone test in LIGHT TEST — both FIRE and GTS FIRE lights illuminate if circuit OK. Broken wire element will NOT illuminate.", "Immediately on touchdown with anti-skid ON; 2 seconds after WOW with anti-skid OFF; also auto-retracts in flight when GTS start button pressed.", "Gear down & locked, weight off wheels → maintains ~72% N2; also extended with loss of 28 VDC essential bus / total electrical failure."], "ans": 1, "expl": "Hold light/tone test in LIGHT TEST — both FIRE and GTS FIRE lights illuminate if circuit OK. Broken wire element will NOT illuminate."}, {"q": "TP HOT caution threshold?", "opts": ["Tailpipe bay temperature exceeds 160 °C.", "Tailpipe bay temperature exceeds 150 °C.", "Tailpipe bay temperature exceeds 75 °C.", "Tailpipe bay temperature exceeds 300 °C."], "ans": 1, "expl": "Tailpipe bay temperature exceeds 150 °C."}, {"q": "Critical single-point fuel failure?", "opts": ["25.2 US pints (11.9 L) total; 9.6 US pints (4.55 L) unusable/trapped; max consumption 0.8 US pints/hour.", "Open on ground until climbing through ~9,500 ±300 ft; reopens when descending through ~7,700 ±500 ft.", "High-pressure fuel pump failure → loss of the engine.", "When temp falls below 300 °C the light goes out and system auto-resets; may take up to ~45 seconds."], "ans": 2, "expl": "High-pressure fuel pump failure → loss of the engine."}, {"q": "Shot-of-fuel solenoid altitude schedule?", "opts": ["25.2 US pints (11.9 L) total; 9.6 US pints (4.55 L) unusable/trapped; max consumption 0.8 US pints/hour.", "When temp falls below 300 °C the light goes out and system auto-resets; may take up to ~45 seconds.", "Closes ~61±4% N2; reopens ~45% N2. After 70-check back to idle: ~+3% N2 and ~−50 °C EGT indicate closure.", "Open on ground until climbing through ~9,500 ±300 ft; reopens when descending through ~7,700 ±500 ft."], "ans": 3, "expl": "Open on ground until climbing through ~9,500 ±300 ft; reopens when descending through ~7,700 ±500 ft."}, {"q": "ECA lane priority logic?", "opts": ["Continuous-loop firewires in engine and GTS bays trip at 300 °C; powered by 28 VDC essential services bus.", "Two identical lanes; the lane with the lowest fuel setting has higher priority / takes over if the other malfunctions.", "WOW + launch bar down + launch bar switch RETRACT + throttle above 70% N2; position mismatch illuminates EXCEL caution.", "Closes ~61±4% N2; reopens ~45% N2. After 70-check back to idle: ~+3% N2 and ~−50 °C EGT indicate closure."], "ans": 1, "expl": "Two identical lanes; the lane with the lowest fuel setting has higher priority / takes over if the other malfunctions."}, {"q": "Sub-idle FCU role?", "opts": ["Meters fuel to spray nozzles during start only; kicks offline at ~90% N2.", "Meters fuel to spray nozzles during start only; kicks offline at ~55% N2.", "Meters fuel to spray nozzles during start only; kicks offline at ~45% N2.", "Meters fuel to spray nozzles during start only; kicks offline at ~22% N2."], "ans": 2, "expl": "Meters fuel to spray nozzles during start only; kicks offline at ~45% N2."}, {"q": "Manual fuel hazards?", "opts": ["Gear down & locked, weight off wheels → maintains ~72% N2; also extended with loss of 28 VDC essential bus / total electrical failure.", "Differential feed vs scavenge ΔP \u003c 10 psi → oil pressure warning after 10 s delay (neg-G transients); may take up to ~6 s to recover after 0/−G.", "Bypasses automatic N1/N2/EGT control — throttle-only metering; selecting at MRT will likely exceed RPM/EGT limits; only safeguard is pilot–throttle.", "Immediately on touchdown with anti-skid ON; 2 seconds after WOW with anti-skid OFF; also auto-retracts in flight when GTS start button pressed."], "ans": 2, "expl": "Bypasses automatic N1/N2/EGT control — throttle-only metering; selecting at MRT will likely exceed RPM/EGT limits; only safeguard is pilot–throttle."}, {"q": "Approach idle stop — when extended / RPM?", "opts": ["Immediately on touchdown with anti-skid ON; 2 seconds after WOW with anti-skid OFF; also auto-retracts in flight when GTS start button pressed.", "Gear down & locked, weight off wheels → maintains ~72% N2; also extended with loss of 28 VDC essential bus / total electrical failure.", "GTS advisory (idle) within 20 s of GTS button; GTS ready within 15 s of ENGINE START; GTS auto-shutdown if idle not achieved in 30 s.", "Hold light/tone test in LIGHT TEST — both FIRE and GTS FIRE lights illuminate if circuit OK. Broken wire element will NOT illuminate."], "ans": 1, "expl": "Gear down & locked, weight off wheels → maintains ~72% N2; also extended with loss of 28 VDC essential bus / total electrical failure."}, {"q": "Approach idle stop retraction?", "opts": ["Immediately on touchdown with anti-skid ON; 2 seconds after WOW with anti-skid OFF; also auto-retracts in flight when GTS start button pressed.", "Differential feed vs scavenge ΔP \u003c 10 psi → oil pressure warning after 10 s delay (neg-G transients); may take up to ~6 s to recover after 0/−G.", "Gear down & locked, weight off wheels → maintains ~72% N2; also extended with loss of 28 VDC essential bus / total electrical failure.", "Bypasses automatic N1/N2/EGT control — throttle-only metering; selecting at MRT will likely exceed RPM/EGT limits; only safeguard is pilot–throttle."], "ans": 0, "expl": "Immediately on touchdown with anti-skid ON; 2 seconds after WOW with anti-skid OFF; also auto-retracts in flight when GTS start button pressed."}, {"q": "Oil tank capacity / unusable / max consumption?", "opts": ["Continuous-loop firewires in engine and GTS bays trip at 300 °C; powered by 28 VDC essential services bus.", "25.2 US pints (11.9 L) total; 9.6 US pints (4.55 L) unusable/trapped; max consumption 0.8 US pints/hour.", "Closes ~61±4% N2; reopens ~45% N2. After 70-check back to idle: ~+3% N2 and ~−50 °C EGT indicate closure.", "Open on ground until climbing through ~9,500 ±300 ft; reopens when descending through ~7,700 ±500 ft."], "ans": 1, "expl": "25.2 US pints (11.9 L) total; 9.6 US pints (4.55 L) unusable/trapped; max consumption 0.8 US pints/hour."}, {"q": "Oil pressure warning logic?", "opts": ["Immediately on touchdown with anti-skid ON; 2 seconds after WOW with anti-skid OFF; also auto-retracts in flight when GTS start button pressed.", "Differential feed vs scavenge ΔP \u003c 10 psi → oil pressure warning after 10 s delay (neg-G transients); may take up to ~6 s to recover after 0/−G.", "Gear down & locked, weight off wheels → maintains ~72% N2; also extended with loss of 28 VDC essential bus / total electrical failure.", "Bypasses automatic N1/N2/EGT control — throttle-only metering; selecting at MRT will likely exceed RPM/EGT limits; only safeguard is pilot–throttle."], "ans": 1, "expl": "Differential feed vs scavenge ΔP \u003c 10 psi → oil pressure warning after 10 s delay (neg-G transients); may take up to ~6 s to recover after 0/−G."}, {"q": "GTS advisory and ready light timings?", "opts": ["Immediately on touchdown with anti-skid ON; 2 seconds after WOW with anti-skid OFF; also auto-retracts in flight when GTS start button pressed.", "GTS advisory (idle) within 20 s of GTS button; GTS ready within 15 s of ENGINE START; GTS auto-shutdown if idle not achieved in 30 s.", "Gear down & locked, weight off wheels → maintains ~72% N2; also extended with loss of 28 VDC essential bus / total electrical failure.", "Hold light/tone test in LIGHT TEST — both FIRE and GTS FIRE lights illuminate if circuit OK. Broken wire element will NOT illuminate."], "ans": 1, "expl": "GTS advisory (idle) within 20 s of GTS button; GTS ready within 15 s of ENGINE START; GTS auto-shutdown if idle not achieved in 30 s."}, {"q": "Bleed valve close/open schedule and 70-check cue?", "opts": ["Open on ground until climbing through ~9,500 ±300 ft; reopens when descending through ~7,700 ±500 ft.", "Closes ~61±4% N2; reopens ~45% N2. After 70-check back to idle: ~+3% N2 and ~−50 °C EGT indicate closure.", "25.2 US pints (11.9 L) total; 9.6 US pints (4.55 L) unusable/trapped; max consumption 0.8 US pints/hour.", "Continuous-loop firewires in engine and GTS bays trip at 300 °C; powered by 28 VDC essential services bus."], "ans": 1, "expl": "Closes ~61±4% N2; reopens ~45% N2. After 70-check back to idle: ~+3% N2 and ~−50 °C EGT indicate closure."}, {"q": "Steam-ingest bleed valve open conditions?", "opts": ["Two identical lanes; the lane with the lowest fuel setting has higher priority / takes over if the other malfunctions.", "Closes ~61±4% N2; reopens ~45% N2. After 70-check back to idle: ~+3% N2 and ~−50 °C EGT indicate closure.", "WOW + launch bar down + launch bar switch RETRACT + throttle above 70% N2; position mismatch illuminates EXCEL caution.", "Continuous-loop firewires in engine and GTS bays trip at 300 °C; powered by 28 VDC essential services bus."], "ans": 2, "expl": "WOW + launch bar down + launch bar switch RETRACT + throttle above 70% N2; position mismatch illuminates EXCEL caution."}];
let idx = 0, mastered = 0, misses = 0, answered = false, history = [];
let queue = QUESTIONS.map((_, i) => i);

const $ = (id) => document.getElementById(id);
const letters = ["A","B","C","D"];

function render() {
  answered = false;
  const q = QUESTIONS[queue[idx]];
  $("prog-label").textContent = `Mastered ${mastered} of ${QUESTIONS.length} · ${queue.length - idx} in queue`;
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
  $("q-text").textContent = q.q;
  $("expl").className = "expl";
  $("expl").textContent = "";
  $("next-btn").disabled = true;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    box.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function choose(i, btn) {
  if (answered) return;
  answered = true;
  const questionIndex = queue[idx];
  const q = QUESTIONS[questionIndex];
  const buttons = [...$("options").querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  const correct = i === q.ans;
  if (correct) {
    mastered++;
    btn.classList.add("correct");
  } else {
    misses++;
    queue.push(questionIndex);
    btn.classList.add("wrong");
    buttons[q.ans].classList.add("correct");
  }
  history.push({ qi: questionIndex, pick: i, correct });
  if (q.expl) {
    $("expl").textContent = q.expl;
    $("expl").classList.add("show");
  }
  $("score-live").textContent = `Score: ${mastered}/${QUESTIONS.length} · Misses: ${misses}`;
  $("next-btn").textContent = idx >= queue.length - 1 ? "See Results" : "Next";
  $("next-btn").disabled = false;
  $("bar-fill").style.width = `${(mastered/QUESTIONS.length)*100}%`;
}

function next() {
  if (!answered) return;
  if (idx >= QUESTIONS.length - 1) {
    showResults();
    return;
  }
  idx++;
  render();
}

function showResults() {
  $("quiz-ui").style.display = "none";
  $("results").classList.add("show");
  const pct = Math.round((mastered / QUESTIONS.length) * 100);
  const el = $("final-score");
  el.textContent = `${mastered} / ${QUESTIONS.length} mastered (${pct}%)`;
  el.className = "score " + (pct >= 80 ? "good" : pct >= 60 ? "mid" : "bad");
  $("final-msg").textContent = `${misses} misses/retries · ${history.length} total attempts`;
  const rev = $("review");
  rev.innerHTML = "<h3>Review</h3>";
  history.forEach(h => {
    const q = QUESTIONS[h.qi];
    const d = document.createElement("details");
    d.innerHTML = `<summary>${h.correct ? "✅" : "❌"} Q${h.qi+1}: ${escapeHtml(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary>
      <p><strong>Your answer:</strong> ${escapeHtml(q.opts[h.pick])}</p>
      <p><strong>Correct:</strong> ${escapeHtml(q.opts[q.ans])}</p>
      ${q.expl ? `<p><strong>Why:</strong> ${escapeHtml(q.expl)}</p>` : ""}`;
    rev.appendChild(d);
  });
}

function reset() {
  idx = 0; mastered = 0; misses = 0; answered = false; history = [];
  queue = QUESTIONS.map((_, i) => i);
  $("results").classList.remove("show");
  $("quiz-ui").style.display = "block";
  render();
}

$("next-btn").addEventListener("click", next);
$("reset-btn").addEventListener("click", reset);
$("retry-btn").addEventListener("click", reset);
render();
</script>
</body>
